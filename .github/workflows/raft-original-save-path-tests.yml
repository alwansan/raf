name: Raft original save path portability (no LFS)
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-original-save-path-tests.yml'
      - 'scripts/adapt_original_save_paths.py'
      - 'tests/test_adapt_original_save_paths.py'
      - 'tests/test_a10_original_save_selector.py'
      - 'scripts/verify_a8_zip2_local_save_provider.py'
      - 'tests/test_verify_a8_zip2_local_save_provider.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raft-a8-zip2-original-save-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - name: Checkout immutable ZIP2 source, no Git LFS
        uses: actions/checkout@v4
        with:
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: original-zip2
          fetch-depth: 1
          filter: blob:none
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/Managed/Assembly-CSharp.dll
            Raft/Raft_Data/StreamingAssets/Data.rgd
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run source safety tests and inspect pinned original privately
        env:
          DOTNET_PROCESSOR_COUNT: '2'
        run: |
          set -euo pipefail
          test "$(git -C original-zip2 rev-parse HEAD)" = "15964ea8f246b6e076ce26b60931ee2e1a9a2385"
          python3 -m unittest discover -s tests -p test_verify_a8_zip2_local_save_provider.py -v
          python3 -m scripts.verify_a8_zip2_local_save_provider --zip2-checkout original-zip2
          python3 -m unittest discover -s tests -p test_adapt_original_save_paths.py -v
          python3 -m unittest discover -s tests -p test_a10_original_save_selector.py -v
          dotnet tool install ilspycmd --version 11.2.0.10050 --tool-path "$RUNNER_TEMP/ilspy"
          timeout 90s "$RUNNER_TEMP/ilspy/ilspycmd" -lv CSharp9_0 -t SaveAndLoad \
            original-zip2/Raft/Raft_Data/Managed/Assembly-CSharp.dll > "$RUNNER_TEMP/original-save.cs" 2> "$RUNNER_TEMP/private-decompile.log"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.adapt_original_save_paths import adapt, EXPECTED, SUFFIX
          root = Path(os.environ['RUNNER_TEMP'])
          original = (root / 'original-save.cs').read_text(encoding='utf-8-sig')
          adapted = adapt(original)
          assert adapted.replace(SUFFIX, '') == original
          assert adapted.count(SUFFIX) == 16 and adapt(adapted) == adapted
          (root / 'adapted-save-private.cs').write_text(adapted)
          project = root / 'path-expressions'
          project.mkdir()
          (project / 'Paths.csproj').write_text('<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><LangVersion>9.0</LangVersion></PropertyGroup></Project>')
          checks = []
          for value in EXPECTED:
              literal = json.dumps(value)
              expected = json.dumps(value.replace('\\', '/'))
              checks.append('if (' + literal + SUFFIX + ' != ' + expected + ') throw new System.Exception("Unix path portability failed");')
              checks.append('if (' + literal + ".Replace('\\\\', '\\\\') != " + literal + ') throw new System.Exception("Windows path changed");')
          (project / 'Program.cs').write_text('class Program { static void Main() { if (System.IO.Path.DirectorySeparatorChar != \'/\') throw new System.Exception("Linux runner required"); ' + '\n'.join(checks) + ' System.Console.WriteLine("RAFT_SAVE_PATH_EXPRESSIONS sevenOriginalShapes=7 unixAndWindowsChecks=14 sourceExpressions=16 saveSchemaChanged=false unityRuntimeVerified=false"); } }')
          print('RAFT_SAVE_SOURCE_PORTABILITY exactOriginalRevision=true nonPathSourceUnchanged=true idempotent=true pathExpressions=16 identityIntegrated=false')
          PY
          dotnet run --project "$RUNNER_TEMP/path-expressions/Paths.csproj" --configuration Release
