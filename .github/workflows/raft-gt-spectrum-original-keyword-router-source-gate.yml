name: GT Spectrum source-authenticated original index4 keyword seven-pass private router (source only)
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/gt_spectrum_private_keyword_routed_shaderlab.py
      - tests/test_gt_spectrum_private_keyword_routed_shaderlab.py
      - scripts/gt_spectrum_keyword_private_unity_project.py
      - tests/test_gt_spectrum_keyword_private_unity_project.py
      - android-port/Experiments/GT/Editor/OriginalSpectrumKeywordRouterValidation.cs
      - scripts/gt_spectrum_unified_ci_console_gate.py
      - tests/test_gt_spectrum_unified_ci_console_gate.py
      - .github/workflows/raft-gt-spectrum-original-keyword-router-source-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-keyword-router:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
      - name: Test original numerical keyword index4 selector, 7-pass two-stage routing and all negative cases
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/gt_spectrum_private_keyword_routed_shaderlab.py tests/test_gt_spectrum_private_keyword_routed_shaderlab.py
          python3 -m unittest discover -s tests -p test_gt_spectrum_private_keyword_routed_shaderlab.py -v
          python3 -m unittest discover -s tests -p test_gt_spectrum_keyword_private_unity_project.py -v
          python3 -m unittest discover -s tests -p test_gt_spectrum_unified_ci_console_gate.py -v
          python3 -m py_compile scripts/gt_spectrum_keyword_private_unity_project.py scripts/gt_spectrum_unified_ci_console_gate.py
          echo 'GT_SPECTRUM_SOURCE_INDEX4_ROUTER_TESTED syntheticOnly=true originalUnityKeywordScope=false UnityAndroid=false PhonePixels=false'

  private-real-original-keyword-table:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    environment: UNITY_LICENSE
    needs: [source-only-keyword-router]
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: gt-spectrum-zip2
          lfs: false
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/sharedassets0.assets/*
      - name: Restore SHA-original 115978112-byte Shader owner to private flat B09 input
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import ZIP2_SHA,PINS,stage
          repo=Path('gt-spectrum-zip2')
          assert subprocess.check_output(['git','-C',str(repo),'rev-parse','HEAD'],text=True).strip()==ZIP2_SHA
          dest=Path(os.environ['RUNNER_TEMP'])/'gt-spectrum-real-original'
          proof=stage(repo,dest,{'Raft_Data/sharedassets0.assets':PINS['Raft_Data/sharedassets0.assets']})
          assert proof['verified_bytes']==115978112 and proof['lfs_used'] is False
          (dest/'Raft_Data/sharedassets0.assets').rename(dest/'sharedassets0.assets')
          print('GT_SPECTRUM_KEYWORD_SHA_ORIGINAL_SOURCE size=115978112 LFS=false')
          PY
      - name: Install original-only shader reader and translation tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4 -q
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
      - name: Stage 7pass original Spectrum pairs and render states in private temp
        run: |
          set -euo pipefail
          timeout 300s python3 -m scripts.b09_stage_original_spectrum \
            --source "$RUNNER_TEMP/gt-spectrum-real-original" \
            --repo "$GITHUB_WORKSPACE" \
            --private "$RUNNER_TEMP/gt-spectrum-original-packet-private" \
            --out "$RUNNER_TEMP/gt-spectrum-packet-private-manifest.json"
          timeout 180s python3 -m scripts.gt_spectrum_original_pass_states \
            --source "$RUNNER_TEMP/gt-spectrum-real-original" \
            --repo "$GITHUB_WORKSPACE" \
            --private "$RUNNER_TEMP/gt-spectrum-original-states-private" \
            --out "$RUNNER_TEMP/gt-spectrum-states-safe.json"
      - name: Recover both source-authentic seven-pass source ShaderLab envelopes privately
        run: |
          set -euo pipefail
          timeout 480s python3 -m scripts.gt_spectrum_original_private_seven_pass_shaderlab \
            --source "$RUNNER_TEMP/gt-spectrum-real-original" \
            --repo "$GITHUB_WORKSPACE" \
            --packet "$RUNNER_TEMP/gt-spectrum-original-packet-private" \
            --manifest "$RUNNER_TEMP/gt-spectrum-packet-private-manifest.json" \
            --states "$RUNNER_TEMP/gt-spectrum-original-states-private" \
            --private-dest "$RUNNER_TEMP/gt-spectrum-two-variants-private" \
            --out "$RUNNER_TEMP/gt-spectrum-two-variants-safe.json" \
            --source-authentic-resource-names
      - name: Authenticate real original Keyword index4 and all seven source VSFS pair hashes; assemble private single-shader router
        run: |
          set -euo pipefail
          timeout 300s python3 -m scripts.gt_spectrum_private_keyword_routed_shaderlab \
            --source "$RUNNER_TEMP/gt-spectrum-real-original" \
            --packet-dir "$RUNNER_TEMP/gt-spectrum-original-packet-private" \
            --packet-report "$RUNNER_TEMP/gt-spectrum-packet-private-manifest.json" \
            --private-dir "$RUNNER_TEMP/gt-spectrum-two-variants-private" \
            --out "$RUNNER_TEMP/gt-spectrum-provisional-router-safe.json"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          p=Path(os.environ['RUNNER_TEMP'])/'gt-spectrum-provisional-router-safe.json'
          result=json.loads(p.read_text())
          assert result['status']=='PRIVATE_SPECTRUM_ORIGINAL_KEYWORD_INDEX4_SEVEN_PASS_ROUTED_SHADERLAB_CANDIDATE'
          assert result['source_original_keyword_index']==4
          assert result['source_original_pass_count']==7
          assert result['source_original_keyword_variants_per_pass']==2
          assert result['source_program_variant_stage_references']==28
          assert result['source_original_VS_FS_pair_hashes_authenticated'] is True
          assert result['private_seven_program_keyword_pragmas']==7
          for k in ('original_shader_keyword_flags_pragma_scope_proven',
                    'original_material_keyword_runtime_selection_parity_proven',
                    'original_Material_sampler_CB0_RT_GUID_binding_proven',
                    'original_game_ShaderLab_modified',
                    'Unity_Android_2021_import_or_GPU_proven',
                    'original_Adreno_pixel_parity_proven',
                    'original_keyword_names_or_ShaderLab_published'):
              assert result[k] is False
          print('GT_SPECTRUM_PRIVATE_SOURCE_KEYWORD_INDEX4 sevenOriginalPasses=true twoVSFSProgramBranchesPerPass=true originalNameHashAuthenticated=true UnityAndroid=false MaterialGuid=false PhonePixels=false')
          PY
      - name: Stage private Unity 2021 project from the one source-authentic index4 Spectrum ShaderLab
        run: |
          set -euo pipefail
          python3 -m scripts.gt_spectrum_keyword_private_unity_project \
            --shader "$RUNNER_TEMP/gt-spectrum-two-variants-private/spectrum-keyword-index4-router-private.shader" \
            --source-proof "$RUNNER_TEMP/gt-spectrum-provisional-router-safe.json" \
            --editor android-port/Experiments/GT/Editor/OriginalSpectrumKeywordRouterValidation.cs \
            --project "$GITHUB_WORKSPACE/gt-private-spectrum-unified-keyword-unity" \
            --safe-report "$RUNNER_TEMP/gt-spectrum-unified-unity-staged-safe.json"
      - name: Unity 2021.3.45f2 actual Android Vulkan one Spectrum 7pass two-variant ShaderBundle diagnostic
        id: gt_spectrum_unified_original_index4_unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f2
          projectPath: gt-private-spectrum-unified-keyword-unity
          targetPlatform: Android
          buildMethod: RaftGT.OriginalSpectrumKeywordRouterValidation.Validate
          versioning: None
          allowDirtyBuild: true
          dockerMemoryLimit: 12g
          customParameters: -job-worker-count 2
      - name: Strictly require provisional unified 7pass two keyword ShaderVariant bundle (not original parity)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path("gt-private-spectrum-unified-keyword-unity/ProbeResults/gt-spectrum-unified-keyword-unity-safe.json")
          if not p.is_file() or not 0<p.stat().st_size<65536:
              raise SystemExit("GT_SPECTRUM_UNIFIED_UNITY_SAFE_REPORT_MISSING")
          r=json.loads(p.read_text())
          expected={
            "status":"PRIVATE_SPECTRUM_UNIFIED_ORIGINAL_INDEX4_KEYWORD_SEVEN_PASS_PROVISIONAL_UNITY_BUNDLE",
            "unityVersion":"2021.3.45f2",
            "sourceOriginalPasses":7,
            "sourceOriginalKeywordIndex":4,
            "keywordPragmas":7,
            "importedPasses":7,
            "ShaderVariantCollectionCount":2,
            "shaderErrorCount":0,
            "importedPrivateShader":True,
            "registeredBothKeywordVariants":True,
            "privateAndroidVulkanBundleBuilt":True,
            "editorShaderImportAndCompilationProvisional":True,
            "exactOriginalKeywordScopeFlagsProven":False,
            "originalMaterialRuntimeKeywordSelectionProven":False,
            "originalMaterialGUIDSamplerCB0RenderTargetBindingProven":False,
            "originalGameShaderOrAssetsModified":False,
            "phoneAdrenoPixelsVerified":False,
            "originalShaderSourceOrKeywordPublished":False,
          }
          for key,value in expected.items():
              if type(r.get(key)) is not type(value) or r[key]!=value:
                  raise SystemExit("GT_SPECTRUM_UNIFIED_UNITY_SAFE_GATE_"+key)
          if type(r.get("privateAndroidVulkanBundleBytes")) is not int or r["privateAndroidVulkanBundleBytes"]<=0:
              raise SystemExit("GT_SPECTRUM_UNIFIED_ANDROID_BUNDLE_EMPTY")
          print("GT_SPECTRUM_UNIFIED_KEYWORD_PRIVATE_UNITY_PROVISIONAL sevenPasses=true keywordVariants=2 Unity2021=true originalKeywordScopeAndMaterialParity=false AdrenoPixels=false")
          PY
      - name: Retain only provisional numeric Unity and source-stage reports, never original keyword or ShaderLab
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-spectrum-unified-original-keyword-source-safe-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gt-spectrum-unified-unity-staged-safe.json
            gt-private-spectrum-unified-keyword-unity/ProbeResults/gt-spectrum-unified-keyword-unity-safe.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove all original and private shader staging, zero source/artifact output
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/gt-spectrum-real-original" \
            "$RUNNER_TEMP/gt-spectrum-original-packet-private" \
            "$RUNNER_TEMP/gt-spectrum-packet-private-manifest.json" \
            "$RUNNER_TEMP/gt-spectrum-original-states-private" \
            "$RUNNER_TEMP/gt-spectrum-states-safe.json" \
            "$RUNNER_TEMP/gt-spectrum-two-variants-private" \
            "$RUNNER_TEMP/gt-spectrum-two-variants-safe.json" \
            "$RUNNER_TEMP/gt-spectrum-provisional-router-safe.json" \
            "$RUNNER_TEMP/gt-spectrum-unified-unity-staged-safe.json" \
            "$GITHUB_WORKSPACE/gt-spectrum-zip2"
          test "$PWD" = "$GITHUB_WORKSPACE"
          sudo rm -rf -- "$GITHUB_WORKSPACE/gt-private-spectrum-unified-keyword-unity"

  strict-unified-Unity-final-console:
    name: Strict final hidden GLSL/Unity variant errors for the one source-original index4 ShaderLab
    needs: [private-real-original-keyword-table]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
      - name: Re-test no ShaderUtil false green and no echoed code accepted
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_gt_spectrum_unified_ci_console_gate.py -v
      - name: Fetch FINALIZED original unified private Unity job log and reject hidden linker failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"
          job_id="$(printf '%s' "$jobs" | jq -r '.jobs[] | select(.name == "private-real-original-keyword-table") | .id' | head -n 1)"
          if ! [[ "$job_id" =~ ^[0-9]+$ ]]; then
            echo 'GT_SPECTRUM_UNIFIED_PRIVATE_UNITY_LOG_JOB_MISSING'
            exit 2
          fi
          log="$RUNNER_TEMP/gt-spectrum-unified-original-private-final-console.log"
          gh api --allow-escape-sequences -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > "$log"
          python3 -m scripts.gt_spectrum_unified_ci_console_gate --console "$log"
          rm -f -- "$log"
