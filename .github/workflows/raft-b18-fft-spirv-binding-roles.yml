name: B18 WATER-001 authenticated FFT DXBC-to-SPIR-V image role preservation

on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-b18-fft-spirv-binding-roles.yml'
      - 'scripts/b18_fft_spirv_binding_roles.py'
      - 'tests/test_b18_fft_spirv_binding_roles.py'

permissions:
  contents: read

concurrency:
  group: raft-b18-fft-spirv-image-roles
  cancel-in-progress: false

jobs:
  original-fft-spirv-image-classes:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      ZIP2_SOURCE_SHA: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout safe diagnostic sources/tests only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - name: Test independent DXBC-to-SPIR-V image class negative controls
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_b18_fft_spirv_binding_roles.py -v
          python3 -m py_compile scripts/b18_fft_spirv_binding_roles.py
      - name: Authenticate immutable ZIP2 FFT original
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b18s/zip2"
          git -C "$RUNNER_TEMP/b18s/zip2" init -q
          git -C "$RUNNER_TEMP/b18s/zip2" remote add origin https://github.com/alwansan/raf.git
          git -C "$RUNNER_TEMP/b18s/zip2" -c protocol.version=2 fetch -q --depth=1 --filter=blob:none origin zip2
          test "$(git -C "$RUNNER_TEMP/b18s/zip2" rev-parse FETCH_HEAD)" = "$ZIP2_SOURCE_SHA"
          git -C "$RUNNER_TEMP/b18s/zip2" sparse-checkout init --no-cone
          printf '%s\n' '/RAFT_FILE_MANIFEST.tsv' '/Raft/Raft_Data/sharedassets0.assets/' |
            git -C "$RUNNER_TEMP/b18s/zip2" sparse-checkout set --no-cone --stdin
          git -C "$RUNNER_TEMP/b18s/zip2" checkout -q --detach FETCH_HEAD
          python3 -m scripts.stage_zip2_fft_owner \
            --zip2-checkout "$RUNNER_TEMP/b18s/zip2" \
            --destination "$RUNNER_TEMP/b18s/original/Raft_Data/sharedassets0.assets"
      - name: Install bounded source translation tools without Unity or GPU
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4 -q
      - name: Authenticate and check all 20 original compiled FFT image roles
        run: |
          set -euo pipefail
          timeout 210s python3 -m scripts.b18_fft_spirv_binding_roles \
            --source "$RUNNER_TEMP/b18s/original/Raft_Data"
          echo 'RAFT_B18_SPV_BOUNDARY names_and_register_to_descriptor_identity_unverified=true unity_and_android_unverified=true'
          # No original source, bytecode, pixels, converted files or private log upload.
