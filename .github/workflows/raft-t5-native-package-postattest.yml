name: T5 DELIVERY-013 native packager post-archive signed-pair parity (no Unity)

on:
  push:
    branches:
      - feature/android-native-port
    paths:
      - scripts/package_android_delivery.py
      - scripts/t5_verify_xapk_cross_delivery.py
      - tests/test_t5_native_package_postattest.py
      - .github/workflows/raft-t5-native-package-postattest.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t5-native-package-postattest-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  synthetic-post-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test native packaging positive, corruption fail-closed and APK-only compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 -W error -m unittest discover -s tests -p test_t5_native_package_postattest.py -v
      - name: Disclose evidence boundary
        if: always()
        run: echo 'Source-only synthetic ZIP tests. No real signed APK, native OBB, Android device, Unity import, GPU or gameplay proof.'
