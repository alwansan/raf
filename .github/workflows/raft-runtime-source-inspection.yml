            -----END CERTIFICATE-----
        run: |
          set -euo pipefail
          printf '%s\n' "$PUBLIC_INSPECTION_CERT" > "$RUNNER_TEMP/recipient.pem"
          python3 - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          packet = root / "runtime-inspection"
          assembly = Path("Raft/Raft_Data/Managed/Assembly-CSharp.dll")
          manifest = {"source_commit": os.environ["GITHUB_SHA"],
                      "assembly_sha256": hashlib.sha256(assembly.read_bytes()).hexdigest(),
                      "assembly_git_blob": subprocess.check_output(["git", "rev-parse", "HEAD:" + str(assembly)], text=True).strip(),
                      "files": {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in packet.iterdir()}}
          (packet / "manifest.json").write_text(json.dumps(manifest, sort_keys=True))
          with zipfile.ZipFile(root / "inspection-private.zip", "w", zipfile.ZIP_DEFLATED) as out:
              for path in packet.iterdir():
                  out.write(path, path.name)
          PY
          openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/inspection-private.zip" -outform DER -out "$RUNNER_TEMP/runtime-inspection.cms" "$RUNNER_TEMP/recipient.pem"
          sha256sum "$RUNNER_TEMP/runtime-inspection.cms"
          test "$(stat -c %s "$RUNNER_TEMP/runtime-inspection.cms")" -lt 524288
          echo RAFT_PRIVATE_INSPECTION_CMS_BASE64_BEGIN
          base64 -w 76 "$RUNNER_TEMP/runtime-inspection.cms"
          echo RAFT_PRIVATE_INSPECTION_CMS_BASE64_END
      - uses: actions/upload-artifact@v4
        with:
          name: raft-runtime-inspection-encrypted
          path: ${{ runner.temp }}/runtime-inspection.cms
          retention-days: 1
          if-no-files-found: error
