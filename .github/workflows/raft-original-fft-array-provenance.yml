name: Raft original water FFT array and CSharp provenance - no Unity

on:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-original-fft-array-provenance.yml'
      - 'scripts/verify_original_fft_array_provenance.py'
      - 'tests/test_verify_original_fft_array_provenance.py'
      - 'scripts/probe_fft_variant_table.py'
      - 'tests/test_probe_fft_variant_table.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raft-original-fft-array-provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout one original LFS owner as pointer and regular Git sources
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          lfs: false
          sparse-checkout: |
            Raft/Raft_Data/sharedassets0.assets
            Raft/Raft_Data/globalgamemanagers.assets
            Raft/Raft_Data/Managed
            scripts
            tests
      - name: Run strict synthetic array/owner regression before LFS
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_verify_original_fft_array_provenance.py -v
          python3 -m unittest discover -s tests -p test_probe_fft_variant_table.py -v
          python3 -m unittest discover -s tests -p test_probe_fft_monoscript_field.py -v
          python3 -m unittest discover -s tests -p test_probe_original_fft_serialized_refs.py -v
      - name: Authenticate pointer then hydrate only sharedassets0.assets
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
          GIT_ATTR_SOURCE: HEAD
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from scripts.verify_targeted_lfs_compute_sources import EXPECTED,verify_sources
          verify_sources(Path("Raft/Raft_Data"),pointers_only=True,
                         expected={"sharedassets0.assets":EXPECTED["sharedassets0.assets"]})
          PY
          git lfs install --local
          git lfs pull --include='Raft/Raft_Data/sharedassets0.assets' --exclude='' origin
          python3 - <<'PY'
          from pathlib import Path
          from scripts.verify_targeted_lfs_compute_sources import EXPECTED,verify_sources
          verify_sources(Path("Raft/Raft_Data"),
                         expected={"sharedassets0.assets":EXPECTED["sharedassets0.assets"]})
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install CPU serializer and pinned original managed decompiler
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
          dotnet tool install ilspycmd --version 11.2.0.10050 --tool-path "$RUNNER_TEMP/ilspy"
      - name: Recover private CSharp9 source outside checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-csharp"
          timeout 360s "$RUNNER_TEMP/ilspy/ilspycmd" -p -lv CSharp9_0 \
            -o "$RUNNER_TEMP/original-csharp" Raft/Raft_Data/Managed/Assembly-CSharp.dll \
            > "$RUNNER_TEMP/original-private-decompile.log" 2>&1
      - name: Authenticate original Unity component and ComputeShader[] in one immutable run
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s python3 -m scripts.verify_original_fft_array_provenance \
            --source Raft/Raft_Data --managed-source "$RUNNER_TEMP/original-csharp"
          python3 -m scripts.probe_fft_variant_table --source Raft/Raft_Data
          # No shader, game source, Unity project, device data or artifacts exported.
          # No Unity Editor, APK, OBB, XAPK or Release step.
