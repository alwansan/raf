name: B43 RENDER-002 material keyword fidelity (synthetic)
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/b43_material_keyword_fidelity.py
      - tests/test_b43_material_keyword_fidelity.py
      - .github/workflows/raft-b43-material-keyword-fidelity.yml
permissions:
  contents: read
concurrency:
  group: raft-b43-material-keyword-fidelity
  cancel-in-progress: false
jobs:
  keyword-fidelity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test synthetic identity and keyword boundaries only
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts/b43_material_keyword_fidelity.py tests/test_b43_material_keyword_fidelity.py
          python3 -m unittest discover -s tests -p test_b43_material_keyword_fidelity.py -v
