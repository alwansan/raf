name: T4 LOCAL-005 authentic original Save RGD pre-call structural source
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - 'android-port/Experiments/T4/OriginalRgdPrecallSlice/**'
      - 'scripts/t4_validate_original_rgd_precall_slice.py'
      - 'tests/test_t4_validate_original_rgd_precall_slice.py'
      - '.github/workflows/raft-t4-original-rgd-precall-slice.yml'
permissions:
  contents: read
concurrency:
  group: raft-t4-original-rgd-precall-sha-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-original-IL-structural-precursor:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout source-free T4 experiment, tests and verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /android-port/Experiments/T4/OriginalRgdPrecallSlice/
            /scripts/t4_validate_original_rgd_precall_slice.py
            /tests/test_t4_validate_original_rgd_precall_slice.py
      - name: Assert source-free output cannot fabricate phone or save
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t4_validate_original_rgd_precall_slice.py tests/test_t4_validate_original_rgd_precall_slice.py
          python3 -m unittest discover -s tests -p test_t4_validate_original_rgd_precall_slice.py -v
          test ! -e Raft
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile original metadata-only reader
        shell: bash
        run: |
          set -euo pipefail
          timeout 190s dotnet publish android-port/Experiments/T4/OriginalRgdPrecallSlice/OriginalRgdPrecallSlice.csproj \
            -c Release --self-contained false -o "$RUNNER_TEMP/t4-rgd-precursor-reader" \
            >"$RUNNER_TEMP/t4-precursor-private-compile.log" 2>&1 || {
              python3 - <<'PY'
          import os,re,collections,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'t4-precursor-private-compile.log'
          s=p.read_text(errors='replace')
          print('T4_RGD_PRECALL_COMPILER_CODES',
                dict(collections.Counter(re.findall(r'error\s+(CS[0-9]+|NETSDK[0-9]+|NU[0-9]+)',s))))
          PY
              exit 1
            }
          test -s "$RUNNER_TEMP/t4-rgd-precursor-reader/OriginalRgdPrecallSlice.dll"
      - name: Checkout exact owner-supplied original ZIP2 game DLL
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: t4-rgd-precursor-original
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Raft/Raft_Data/Managed/Assembly-CSharp.dll
      - name: Authenticate exact original SHA and bytes before IL access
        shell: bash
        run: |
          set -euo pipefail
          f=t4-rgd-precursor-original/Raft/Raft_Data/Managed/Assembly-CSharp.dll
          test "$(git -C t4-rgd-precursor-original rev-parse HEAD)" = 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          test ! -L "$f"
          test "$(stat -c '%s' "$f")" = 3211776
          echo "0a6f0527856a9ce538d8d4217358b467c58fdcfad95e0ebebf9588c48f24f72e  $f" | sha256sum -c --status
          echo 'T4_PRECALL original_sha_verified=true'
      - name: Inspect bounded original RGD operand predecessor only
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          export DOTNET_DbgEnableMiniDump=0 COMPlus_DbgEnableMiniDump=0 DOTNET_EnableCrashReport=0
          timeout 45s dotnet "$RUNNER_TEMP/t4-rgd-precursor-reader/OriginalRgdPrecallSlice.dll" \
            --assembly t4-rgd-precursor-original/Raft/Raft_Data/Managed/Assembly-CSharp.dll \
            --output "$RUNNER_TEMP/t4-original-precursor-private.json" \
            >"$RUNNER_TEMP/t4-rgd-precursor-private.log" 2>&1 || {
              echo 'T4_PRECALL original_analysis_inconclusive=true private_data_logged=false'
              exit 1
            }
          python3 -m scripts.t4_validate_original_rgd_precall_slice \
            --report "$RUNNER_TEMP/t4-original-precursor-private.json"
      - name: Wrong original source byte must be rejected
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib
          x=pathlib.Path('t4-rgd-precursor-original/Raft/Raft_Data/Managed/Assembly-CSharp.dll')
          y=pathlib.Path(os.environ['RUNNER_TEMP'])/'wrong-original.dll'
          raw=bytearray(x.read_bytes());raw[153] ^= 1;y.write_bytes(raw)
          PY
          if timeout 8s dotnet "$RUNNER_TEMP/t4-rgd-precursor-reader/OriginalRgdPrecallSlice.dll" \
            --assembly "$RUNNER_TEMP/wrong-original.dll" \
            --output "$RUNNER_TEMP/unverified-precursor.json" \
            >"$RUNNER_TEMP/t4-rejected-precursor-private.log" 2>&1; then
            echo 'T4_PRECALL_WRONG_SOURCE_SHA_ACCEPTED'
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/unverified-precursor.json"
          echo 'T4_PRECALL wrong_source_sha_rejected=true'
      - name: Never upload original DLL, private IL, saves or payloads
        if: always()
        run: echo 'only_sourcefree_categories=true original_game_method_uninvoked=true RGD_files_unread=true Unity_phone_unproven=true'
