name: T5 INTEGRATION-001 APK OBB paired-file controls

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-native-port
    paths:
      - scripts/t5_verify_apk_obb_pair.py
      - tests/test_t5_verify_apk_obb_pair.py
      - .github/workflows/raft-t5-apk-obb-pair.yml

permissions:
  contents: read

concurrency:
  group: raft-t5-apk-obb-pair-source-only
  cancel-in-progress: false

jobs:
  synthetic-pair-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - name: Validate APK and OBB pairing mismatch controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t5_verify_apk_obb_pair.py' -v
          python3 -m py_compile scripts/t5_verify_apk_obb_pair.py
          echo 'T5_APK_OBB_PAIR synthetic_only=true real_signed_files=false unity=false phone=false' >> "$GITHUB_STEP_SUMMARY"
