name: B38 RENDER-002 Material YAML duplicate-key integrity (synthetic)
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/b05_verify_material_texenv_bindings.py
      - tests/test_b38_material_yaml_uniqueness.py
      - .github/workflows/raft-b38-material-yaml-uniqueness.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raft-b38-yaml-unique-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  b38-synthetic-anti-duplicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/b05_verify_material_texenv_bindings.py
            scripts/b44_verify_material_colors.py
            tests/test_b05_verify_material_texenv_bindings.py
            tests/test_b38_material_yaml_uniqueness.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Verify existing B05 and new B38 synthetic tests
        run: |
          python -m py_compile scripts/b05_verify_material_texenv_bindings.py tests/test_b38_material_yaml_uniqueness.py
          python -m unittest discover -s tests -p 'test_b05_verify_material_texenv_bindings.py' -v
          python -m unittest discover -s tests -p 'test_b38_material_yaml_uniqueness.py' -v

# Source-free CI, no original assets or proprietary shader/source/artifacts.
# The result is parser integrity, NOT GPU/Unity/Android Material fidelity.
