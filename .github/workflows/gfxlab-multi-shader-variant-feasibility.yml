name: GFX-MULTI-006 original Shader48 program variant feasibility / no APK
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths: ['.github/workflows/gfxlab-multi-shader-variant-feasibility.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfxlab-multi006-source
  cancel-in-progress: false
jobs:
  shader-source-variants:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            gfxlab/tools
            gfxlab/tests
      - name: Pure source tests
        run: |
          set -euo pipefail
          python3 -m py_compile gfxlab/tools/multi_shader_variant_feasibility.py
          python3 -m unittest discover -s gfxlab/tests -p 'test_*.py' -v
      - uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: source-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/resources.assets/*
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/sharedassets6.assets
      - name: Count genuine original shader stage variants privately
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
          python3 -m gfxlab.tools.multi_shader_variant_feasibility --zip2 source-zip2 --stage "$RUNNER_TEMP/gfxlab-multi006-private" --out gfxlab-multi006-safe-summary.json
          python3 - <<'PY'
          import json
          d=json.load(open('gfxlab-multi006-safe-summary.json'))
          assert d['source_models']==6 and d['material_slots']==7
          assert d['distinct_shader48']==1 and len(d['inventory']['pass_programs'])==7
          assert not d['compiled_shader_code_exported']
          assert not d['original_android_shader_restored']
          print('GFX_MULTI006_SOURCE_VARIANT_INVENTORY_ONLY')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gfxlab-multi006-safe-variant-summary
          path: gfxlab-multi006-safe-summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove private original shader source
        if: always()
        run: |
          sudo rm -rf source-zip2 "$RUNNER_TEMP/gfxlab-multi006-private"
          echo GFX_MULTI006_PRIVATE_SOURCE_PURGED=true

# v3 compatibility: also scan original Unity2021 m_PlayerSubPrograms tiered arrays.
