            Raft/Raft_Data/sharedassets39.assets

      - name: Materialize exact SHA-authenticated 82 Unity serialized owners (no LFS or raw upload)
        run: |
          set -euo pipefail
          test "$(git -C .gt-zip2 rev-parse HEAD)" = 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          python3 -m scripts.gt_stage_serialized_owners \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --source .gt-zip2/Raft/Raft_Data \
            --destination "$RUNNER_TEMP/gt-original-82-shader-owners" \
            --report "$RUNNER_TEMP/gt-original-82-source-proof-private.json" > "$RUNNER_TEMP/gt-original-82-source-private.log"
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.23.0

      - name: Restore 58 SHA-original D3D11 stages to private 4-pass 33-route Next7p33 ShaderLab
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
          timeout 2700s python3 -m scripts.gt_translate_next_remaining_7p33_shader48 \
            --original "$RUNNER_TEMP/gt-original-82-shader-owners" \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --quality "$RUNNER_TEMP/gt-next7p33-real-post14-quality.json" \
            --private "$RUNNER_TEMP/gt-next7p33-original-unity-source-private" \
            --out "$RUNNER_TEMP/gt-next7p33-original-unity-source-safe.json"
          python3 - <<'PY_GT_NEXT7P33_SOURCE'
          import json,os
          from pathlib import Path
          temp=Path(os.environ["RUNNER_TEMP"])
          r=json.loads((temp/"gt-next7p33-original-unity-source-safe.json").read_text())
          assert r["status"]=="GT_SHA_ORIGINAL_REMAINING_7P33_MATERIAL_SHADER48_D3D11_PRIVATE_STAGES_TRANSLATED"
          assert r["original_program_stages_roundtrip_Vulkan11_valid"]==58
          assert r["private_original_7p33_material_ShaderLab_4pass_composed"] is True
          assert r["private_original_7p33_material_ShaderLab_66_vertex_fragment_entrypoints_validated"] is True
          assert r["source_original_keyword_permutation_route_counts_per_pass"]==[8,13,8,4]
          assert r["source_original_Range_property_count"]==0
          assert r["source_original_Range_defaults_outside_bounds_preserved_unclamped"]==0
          print("GT_NEXT7P33_SOURCE_SHA_58_D3D11_4PASS_33_VSFS_AND_ORIGINAL_0_RANGES_READY noAPK=true")
          PY_GT_NEXT7P33_SOURCE
          source="$RUNNER_TEMP/gt-next7p33-original-unity-source-private/original-7p33-material-Shader48-private.shader"
          project="$GITHUB_WORKSPACE/gt-next7p33-original-unity"
          mkdir -p "$project/Assets/Editor" "$project/Packages" "$project/ProjectSettings"
          cp "$source" "$project/Assets/GTNext7p33.shader"
          cp android-port/Experiments/GT/Editor/Next7p33ShaderValidation.cs "$project/Assets/Editor/"
          printf '%s\n' '{"dependencies":{}}' > "$project/Packages/manifest.json"
          printf '%s\n' 'm_EditorVersion: 2021.3.45f2' > "$project/ProjectSettings/ProjectVersion.txt"
      - name: Compile genuine Next7p33 4-pass 33 VSFS original keyword routes in Unity 2021 Android Vulkan (NO APK)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f2
          projectPath: gt-next7p33-original-unity
          targetPlatform: Android
          buildMethod: RaftGT.Next7p33ShaderValidation.Validate
          versioning: None
          allowDirtyBuild: true
          dockerMemoryLimit: 12g
          customParameters: -job-worker-count 2
      - name: Independently decode Unity serialized next7p33 Vulkan VS and FS routes and exact ShaderLab candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/gt-next7p33-original-unity"
          smolv="$RUNNER_TEMP/gt-next7p33-smolv"
          mkdir -p "$smolv"
          upstream=https://raw.githubusercontent.com/aras-p/smol-v/6303e979b59153ee7007fd14e06d3fed8687b64c/source
          curl -fsSL "$upstream/smolv.cpp" -o "$smolv/smolv.cpp"
          curl -fsSL "$upstream/smolv.h" -o "$smolv/smolv.h"
          c++ -std=c++11 -O2 -I"$smolv" scripts/gt_decode_smolv.cpp "$smolv/smolv.cpp" -o "$smolv/decode"
          python3 -m scripts.gt_verify_921_shader_bundle \
            --bundle "$project/ProbeResults/Private/gt-next7p33" \
            --source "$project/Assets/GTNext7p33.shader" \
            --receipt "$project/ProbeResults/gt-next7p33-unity-safe.json" \
            --smolv-decoder "$smolv/decode" \
            --out "$RUNNER_TEMP/gt-next7p33-original-vulkan-bundle-safe.json"
          python3 - <<'PY_GT_NEXT7P33_SERIALIZED'
          import hashlib,json,os
          from pathlib import Path
          temp=Path(os.environ["RUNNER_TEMP"])
          shader=Path("gt-next7p33-original-unity/Assets/GTNext7p33.shader")
          unity=json.loads(Path("gt-next7p33-original-unity/ProbeResults/gt-next7p33-unity-safe.json").read_text())
          bundle=json.loads((temp/"gt-next7p33-original-vulkan-bundle-safe.json").read_text())
          assert unity["unityVersion"]=="2021.3.45f2"
          assert unity["androidVulkanOnly"] is True and unity["errors"]==0
          assert unity["privateBundleCompiled"] is True
          assert unity["passCount"]==4 and unity["registeredRoutes"]==33
          assert bundle["vulkan_platform_only"] is True
          assert bundle["compiled_program_table_verified"] is True
          assert bundle["vertex_and_fragment_entrypoints_verified"] is True
          assert bundle["vertex_routes_by_pass"]==bundle["fragment_routes_by_pass"]==[8,13,8,4]
          assert bundle["candidate_sha256"]==hashlib.sha256(shader.read_bytes()).hexdigest()
          print("GT_NEXT7P33_REAL_UNITY_ANDROID_VULKAN_33_VSFS_4PASS_BUNDLE_VERIFIED noAPK=true")
          PY_GT_NEXT7P33_SERIALIZED
      - name: Publish strictly safe next7p33 source, Unity Vulkan and serialized VSFS numeric receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-next7p33-original-unity-33route-safe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gt-next7p33-original-unity-source-safe.json
            gt-next7p33-original-unity/ProbeResults/gt-next7p33-unity-safe.json
            ${{ runner.temp }}/gt-next7p33-original-vulkan-bundle-safe.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Delete all private original ZIP2 owners and recovered DXBC HLSL ShaderLab and bundles
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/gt-original-82-shader-owners" "$RUNNER_TEMP/gt-next7p33-original-unity-source-private" .gt-zip2
          sudo rm -rf -- "$GITHUB_WORKSPACE/gt-next7p33-original-unity"
