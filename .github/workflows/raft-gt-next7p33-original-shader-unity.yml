name: GT validate authentic next7p33 33-route Shader48 Unity Android Vulkan bundle (NO APK)

on:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-gt-next7p33-original-shader-unity.yml
      - android-port/Experiments/GT/Editor/Next7p33ShaderValidation.cs
      - scripts/gt_translate_next_remaining_7p33_shader48.py
      - tests/test_gt_translate_next_remaining_7p33_shader48.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gt-original-next7p33-unity-vulkan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-7p33-android-vulkan-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    environment: UNITY_LICENSE
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
            android-port/Experiments/GT/Editor
      - name: Verify exact 7p33-material SHA-original source selector and numeric range contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/gt_translate_next_remaining_7p33_shader48.py
          python3 -m unittest discover -s tests -p test_gt_translate_next_remaining_7p33_shader48.py -v
      - name: Read trusted actual post14 full export 216-Dummy original Material report
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43773151176
          name: gt-fourteen-next30-source-shader-full-export-audit-43773151176
          path: ${{ runner.temp }}/gt-next7p33-verified-post14
      - name: Verify post14 actual 570/786 custom real and 216 Dummy original Shader GUID population
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_GT_NEXT7P33_QUALITY'
          import json,os,shutil
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"gt-next7p33-verified-post14"
          matches=[p for p in root.rglob("gt-fourteen-shader-postrestore-quality.json")
                   if p.is_file() and not p.is_symlink()]
          if len(matches)!=1:
              raise ValueError("untrusted_real_post14_nested_material_artifact")
          q=json.loads(matches[0].read_text())
          c=q.get("counts",{})
          assert q.get("status")=="NATIVE_MATERIAL_SHADER_PROGRAM_AUDIT_ONLY"
          assert c.get("material_documents")==1536
          assert c.get("material_docs_using_local_custom_Shader")==786
          assert c.get("material_docs_using_non_dummy_Shader")==570
          assert c.get("material_docs_using_dummy_Shader")==216
          assert c.get("distinct_dummy_Shader_targets_referenced")==46
          assert c.get("material_docs_with_unknown_or_broken_Shader")==0
          assert sum(q["dummy_shader_material_counts_by_name_digest"].values())==216
          assert list(q["dummy_shader_material_counts_by_name_digest"].values()).count(7)==2
          shutil.copyfile(matches[0],Path(os.environ["RUNNER_TEMP"])/"gt-next7p33-real-post14-quality.json")
          print("GT_NEXT7P33_ORIGINAL_POST14_ACTUAL_MATERIAL_POPULATION_AUTHENTICATED true")
          PY_GT_NEXT7P33_QUALITY
      - name: Read immutable ZIP2 serialized owner files only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: .gt-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/globalgamemanagers.assets
            Raft/Raft_Data/resources.assets
            Raft/Raft_Data/level0
