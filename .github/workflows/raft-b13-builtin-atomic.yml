name: B13 RENDER-002 atomic builtin shader source transaction
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/restore_builtin_shaders.py
      - scripts/restore_tmp_shaders.py
      - tests/test_restore_builtin_shaders.py
      - .github/workflows/raft-b13-builtin-atomic.yml
permissions:
  contents: read
concurrency:
  group: raft-b13-builtin-atomic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-atomicity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests/test_restore_builtin_shaders.py
      - name: Verify fail-closed, atomic source installation with synthetic failure injection
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_restore_builtin_shaders.py -v
          python3 -m compileall -q scripts/restore_builtin_shaders.py
          echo 'B13_BUILTIN_ATOMIC source_only=true original_shader_programs_restored=false authenticated_engine_mapping_unchanged=true unity_or_device_tested=false'
