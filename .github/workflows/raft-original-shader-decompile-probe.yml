name: Raft original shader decompilation probe (encrypted no Unity APK)
'on':
  push:
    branches:
    - feature/android-native-port
    paths:
    - .github/workflows/raft-original-shader-decompile-probe.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: raft-original-shader-decompile-probe
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Disk safety gate before dependencies / LFS download
      shell: bash
      run: 'set -euo pipefail

        df -h /

        free_kb=$(df -Pk "$RUNNER_TEMP" | awk ''NR==2 {print $4}'')

        test "$free_kb" -gt 36700160

        '
    - uses: actions/checkout@v4
      with:
        lfs: false
        persist-credentials: true
        sparse-checkout: 'scripts

          tests

          Raft/Raft_Data'
    - name: Validate graphics extent/authentication fixtures before LFS
      run: python3 -m unittest discover -s tests -p test_texture_stream_coverage.py -v
    - name: Validate original CLR providers before any LFS transfer
      run: "python3 -m unittest discover -s tests -p test_export_managed_providers.py -v\npython3 -m unittest\
        \ discover -s tests -p test_assetripper_script_import.py -v\npython3 -m pip install --user --disable-pip-version-check\
        \ dnfile==0.18.0\npython3 -m scripts.stage_export_managed_providers \\\n  --source \"$GITHUB_WORKSPACE/Raft/Raft_Data/Managed\"\
        \ \\\n  --destination \"$RUNNER_TEMP/input/Raft_Data/Managed\"\n"
    - name: Restore owner-authorized full original graphics payloads once
      run: python3 -m scripts.hydrate_render_payloads --apply
    - name: Audit every original Texture2D external extent and shader backend table
      run: 'python3 -m pip install --user UnityPy==1.25.4

        python3 -m scripts.audit_texture_stream_coverage --root Raft/Raft_Data'
    - name: Stage selected Unity game files only, never execute Windows binaries
      shell: bash
      run: "set -euo pipefail\nroot=\"$RUNNER_TEMP/input/Raft_Data\"\nmkdir -p \"$root/Managed\"\ntest\
        \ -f \"$root/Managed/Assembly-CSharp.dll\"\ntest ! -e \"$root/Managed/PlayFab_o.dll\"\ncp Raft/Raft_Data/boot.config\
        \ \"$root/\"\nshopt -s nullglob\ncount=0\nfor src in Raft/Raft_Data/globalgamemanagers Raft/Raft_Data/globalgamemanagers.assets*\
        \ Raft/Raft_Data/resources.assets* Raft/Raft_Data/sharedassets*.assets* Raft/Raft_Data/level*;\
        \ do\n  [ -f \"$src\" ] || continue\n  if head -c 48 \"$src\" | grep -q '^version https://git-lfs.github.com/spec/v1';\
        \ then continue; fi\n  cp \"$src\" \"$root/\"\n  count=$((count+1))\ndone\necho \"Source serialized\
        \ files staged: $count\"\ntest \"$count\" -gt 110\ndu -sh \"$root\"\n"
    - name: Obtain SHA256-pinned AssetRipperCLI v1.0.1
      shell: bash
      run: "set -euo pipefail\ncurl -fL --retry 2 --max-time 240 \\\n  'https://github.com/nowl-it/AssetRipperCLI/releases/download/v1.0.1/AssetRipper_linux_x64.zip'\
        \ \\\n  -o \"$RUNNER_TEMP/assetripper.zip\"\necho \"b48292e40948ce2634e9187d4724fb4f45c01fa6f4fea2a5f4775aa611def17b\
        \  $RUNNER_TEMP/assetripper.zip\" | sha256sum -c -\nmkdir -p \"$RUNNER_TEMP/ar\"\nunzip -q \"\
        $RUNNER_TEMP/assetripper.zip\" -d \"$RUNNER_TEMP/ar\"\nchmod +x \"$RUNNER_TEMP/ar/AssetRipper.GUI.Free\"\
        \npython3 -m scripts.configure_assetripper_export --directory \"$RUNNER_TEMP/ar\"\n\n# Diagnostic\
        \ only: upstream ShaderExportMode.Decompile=3 is unstable.\n# Never change the shipping export\
        \ mode based on a successful exporter exit.\npython3 - <<'MODE'\nimport json,os\nfrom pathlib\
        \ import Path\np=Path(os.environ['RUNNER_TEMP'])/'ar/AssetRipper.Settings.json'\ns=json.loads(p.read_text());s['Export']['ShaderExportMode']=3;p.write_text(json.dumps(s))\n\
        MODE\n"
    - name: Export 40 scenes into a Unity Editor project with correct MonoScript metadata
      env:
        DOTNET_PROCESSOR_COUNT: '2'
      shell: bash
      run: "set -euo pipefail\ntimeout 1200s \"$RUNNER_TEMP/ar/AssetRipper.GUI.Free\" \\\n  --cli --input\
        \ \"$RUNNER_TEMP/input\" \\\n  --output \"$RUNNER_TEMP/project\" --mode unity \\\n  --script-content-level\
        \ Level1 --ignore-streaming-assets \\\n  > \"$RUNNER_TEMP/export.log\" 2>&1\npython3 -m scripts.verify_assetripper_script_import\
        \ --log \"$RUNNER_TEMP/export.log\"\ntest -d \"$RUNNER_TEMP/project/ExportedProject/Assets\"\n\
        test -d \"$RUNNER_TEMP/project/ExportedProject/ProjectSettings\"\ndf -h /\n"
    - name: Report complete-input shader contracts without publishing sources
      run: "python3 -m scripts.audit_render_input_contracts --project \"$RUNNER_TEMP/project/ExportedProject\"\
        \npython3 - <<'PY'\nimport os,re\nfrom pathlib import Path\nfrom collections import Counter\n\
        root=Path(os.environ[\"RUNNER_TEMP\"])/\"project/ExportedProject/Assets\"\ncounts=Counter()\n\
        for p in root.rglob(\"*\"):\n if p.is_file() and p.suffix.lower() in (\".png\",\".jpg\",\".tga\"\
        ,\".exr\",\".compute\",\".asset\"):\n  counts[p.suffix.lower()]+=1\nprint(\"RAFT_COMPLETE_INPUT_EXPORT_COUNTS\"\
        ,dict(counts))\nPY\npython3 - <<'PY'\nimport os,re\nfrom pathlib import Path\ntext=(Path(os.environ[\"\
        RUNNER_TEMP\"])/\"export.log\").read_text(errors=\"replace\")\nprint(\"RAFT_EXPORT_SHADER_MODE\"\
        ,sorted(set(re.findall(r\"ShaderExportMode:\\s*(\\w+)\",text))))\nPY\n"
    - name: Collect shader programs and compute metadata into a private packet; log aggregates only
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PACKET'\nimport base64,gc,hashlib,json,os,re,shutil,subprocess,zipfile\n\
        from pathlib import Path\nimport UnityPy\nfrom scripts.mesh_source_files import serialized_sources,owned_objects\n\
        root=Path(os.environ['RUNNER_TEMP']);packet=root/'shader-inspection';packet.mkdir()\nassets=root/'project/ExportedProject/Assets'\n\
        shaders=[]\nfor path in sorted(assets.rglob('*.shader')):\n    meta=Path(str(path)+'.meta')\n\
        \    if path.is_symlink() or not meta.is_file() or meta.is_symlink():raise SystemExit('Unsafe\
        \ shader metadata')\n    relative=path.relative_to(assets);dest=packet/'shaders'/relative;dest.parent.mkdir(parents=True,exist_ok=True)\n\
        \    shutil.copyfile(path,dest);shutil.copyfile(meta,Path(str(dest)+'.meta'))\n    text=path.read_text(errors='replace')\n\
        \    match=re.search(r'\\bShader\\s+\"([^\"\\r\\n]+)\"',text)\n    shaders.append({'file':str(dest.relative_to(packet)),'name':match[1]\
        \ if match else None,'passes':len(re.findall(r'\\bPass\\s*\\{',text)),'program_blocks':len(re.findall(r'CGPROGRAM|HLSLPROGRAM',text)),'empty_subprogram_warning':'No\
        \ subprograms found' in text})\ncomputes=[]\ndef json_default(value):\n    if isinstance(value,(bytes,bytearray)):return\
        \ {'__base64__':base64.b64encode(value).decode()}\n    raise TypeError('Unsupported compute metadata\
        \ value')\nfor path in serialized_sources(Path('Raft/Raft_Data')):\n    env=UnityPy.load(str(path))\n\
        \    for obj in owned_objects(env):\n        if obj.type.name!='ComputeShader':continue\n    \
        \    identity=path.name+':'+str(obj.path_id);name=hashlib.sha256(identity.encode()).hexdigest()[:20]\n\
        \        tree=obj.read_typetree();raw=obj.get_raw_data()\n        (packet/(name+'.compute-object.bin')).write_bytes(raw)\n\
        \        (packet/(name+'.compute-tree.json')).write_text(json.dumps(tree,default=json_default))\n\
        \        computes.append({'owner':path.name,'path_id':obj.path_id,'packet_id':name,'raw_sha256':hashlib.sha256(raw).hexdigest(),'name':tree.get('m_Name')})\n\
        \    del env;gc.collect()\n(packet/'inventory.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'shader_mode':'Decompile=3\
        \ diagnostic only; first variants may be incomplete','shaders':shaders,'computes':computes},sort_keys=True))\n\
        if not shaders or len(computes)!=9:raise SystemExit('Original shader/compute inventory incomplete')\n\
        files=list(packet.rglob('*'));total=sum(p.stat().st_size for p in files if p.is_file())\nif total>64*1024*1024:raise\
        \ SystemExit('Shader inspection scope exceeded')\nmanifest={'source_commit':os.environ['GITHUB_SHA'],'files':{str(p.relative_to(packet)):hashlib.sha256(p.read_bytes()).hexdigest()\
        \ for p in files if p.is_file()}}\n(packet/'manifest.json').write_text(json.dumps(manifest,sort_keys=True))\n\
        with zipfile.ZipFile(root/'shader-inspection-private.zip','w',zipfile.ZIP_DEFLATED) as z:\n  \
        \  for path in sorted(packet.rglob('*')):\n        if path.is_file():z.write(path,str(path.relative_to(packet)))\n\
        print('RAFT_ORIGINAL_SHADER_INSPECTION shaders='+str(len(shaders))+' shadersWithProgram='+str(sum(x['program_blocks']>0\
        \ for x in shaders))+' computeObjects='+str(len(computes))+' packetPlainBytes='+str(total)+' originalDataRetained=true\
        \ unityCompiled=false deviceExecution=false')\nPACKET\n"
      env:
        DOTNET_PROCESSOR_COUNT: '2'
    - name: Encrypt diagnostic packet for current Work session only
      shell: bash
      env:
        PUBLIC_INSPECTION_CERT: '-----BEGIN CERTIFICATE-----

          MIIEKzCCApOgAwIBAgIUJ/YOWJyDnUoThrP8YUtFm1JvEsUwDQYJKoZIhvcNAQEL

          BQAwJTEjMCEGA1UEAwwaUmFmdCBXb3JrIGRldmljZSBkaWFnbm9zaXMwHhcNMjYx

          MTAyMTg0NTQ0WhcNMjYxMTE2MTg0NTQ0WjAlMSMwIQYDVQQDDBpSYWZ0IFdvcmsg

          ZGV2aWNlIGRpYWdub3NpczCCAaIwDQYJKoZIhvcNAQEBBQADggGPADCCAYoCggGB

          AJN3XZkfk/9qAJPt3hGwwT6Kgm3ivEtNkj5GmXKSKFWIJjwtD8d+kV68MIzBK7JJ

          A3tfflXJXNWrk6Rh1zWpkTOna72Hga415jNxT5xkwVucuokz8Abjk0nhyFLtWLWv

          KvUN+a1kEO/N+YKo9zXFB9Mh+UauBKuLE78LPVjT9oxXLNJ1BiQYI/zz+XWK7Hci

          QJXUbdYZreLNkxsNLJcFz17kiW1GxQt7c47TohsnUoO8TkiPsuniJV3iFyHQt6Gr

          9HYXCruzCjOeVgN7dVmljDY24FQt/7s3L+bwXsiE96B8dej8ZtPv1Pevnx8+OMBt

          6zWj6VEvTEyT6i/XGoBK5fBOb/fNdOsMtXx5pVKSLTTZuWmJxeKL6qNb6Sr/PIMo

          IQjrQF1IdSia4HEt0Vrob9c+2OxKMA3vbjtpPblH32ZMHfxrXUMQySMiIbr4Zzzj

          ukE9S7socvw7hE/u77vcCKzbKiz6BVbe+XBZT9+ZZAniJU5blSlJqG24PBs6B7cR

          qQIDAQABo1MwUTAdBgNVHQ4EFgQU/PdZr25++JnsgpNETDzzONsLnfMwHwYDVR0j

          BBgwFoAU/PdZr25++JnsgpNETDzzONsLnfMwDwYDVR0TAQH/BAUwAwEB/zANBgkq

          hkiG9w0BAQsFAAOCAYEAMYBduu8ITD9qxAzHILA5A0rF1Qb08NkY+nkvXWrLmfS8

          jaJOWfzit1jytfAq5zemICI7DLiMmlsAcU+RVk9qr9oezqlkH+QeVIHaw6zzhosi

          J7YB49OmlTgzLfNaHCK/wJlcO1/T2hTQwZRvik/Fz6wDEJtVkJ67ze8JAnflYcXH

          gfpnzcaPGmO8ORlM57NHVVk5aqm7lMcVTbfMZlJSXqwLutnWneXeJIvgTR8VVfGb

          TmykxwE8/tfNH7uE7L3dtlQFGWHmgqzU4xNvvb8ybribjoN4MBpDPR6edAr7oH8v

          zlwJBhHSklafseZ9ZchBT40O3PrPVuh9zyEOgndtrfCkyNrEEyJYoUWLxmRT+ln7

          EL24H+1vQ2UcJZwIA2C35zW2UuDnPqj7lfALqVakspS8Hox4S/0bDkJiHCN5qvQm

          w9CoEU0ePdNTLEIiVAWbkjgrSim3MIJwo0DbsBT/GhssMN4Pu6bFQD++1sXb528D

          qG2dANeINVmhYU+XVNJ5

          -----END CERTIFICATE-----

          '
      run: 'set -euo pipefail

        printf ''%s\n'' "$PUBLIC_INSPECTION_CERT" > "$RUNNER_TEMP/shader-recipient.pem"

        openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/shader-inspection-private.zip" -outform
        DER -out "$RUNNER_TEMP/shader-inspection.cms" "$RUNNER_TEMP/shader-recipient.pem"

        sha256sum "$RUNNER_TEMP/shader-inspection.cms"

        test "$(stat -c %s "$RUNNER_TEMP/shader-inspection.cms")" -lt 67108864

        '
    - uses: actions/upload-artifact@v4
      with:
        name: raft-original-shader-inspection-encrypted
        path: ${{ runner.temp }}/shader-inspection.cms
        retention-days: 1
        if-no-files-found: error
        compression-level: 0
