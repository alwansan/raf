name: B44 RENDER-002 Material color lineage synthetic verification

on:
  push:
    branches:
      - feature/android-native-port
    paths:
      - scripts/b44_verify_material_colors.py
      - tests/test_b44_verify_material_colors.py
      - .github/workflows/raft-b44-material-colors.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b44-render-material-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  color-lineage-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install strictly bounded YAML parser dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate B44 Material color preservation logic and negative controls
        run: |
          python -m compileall -q scripts/b44_verify_material_colors.py tests/test_b44_verify_material_colors.py
          python -m unittest discover -s tests -p 'test_b44_verify_material_colors.py' -v
