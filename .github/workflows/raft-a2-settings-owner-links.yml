name: Raft A2 original Settings owner links (CPU no LFS)
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-a2-settings-owner-links.yml'
      - 'scripts/probe_a2_settings_owner_links.py'
      - 'tests/test_probe_a2_settings_owner_links.py'
permissions:
  contents: read
concurrency:
  group: raft-a2-settings-links-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  authenticated-settings:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
            Raft/Raft_Data/globalgamemanagers.assets
            Raft/Raft_Data/level0
            Raft/Raft_Data/level1
            Raft/Raft_Data/Managed/Assembly-CSharp.dll
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test candidate pointer alignment and fail-closed native ancestry
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_probe_a2_settings_owner_links.py -v
          python3 -m py_compile scripts/probe_a2_settings_owner_links.py
      - name: Private CSharp9 source recovery
        run: |
          set -euo pipefail
          dotnet tool install ilspycmd --version 11.2.0.10050 --tool-path "$RUNNER_TEMP/a2-links-ilspy"
          timeout 360s "$RUNNER_TEMP/a2-links-ilspy/ilspycmd" -p -lv CSharp9_0 \
            -o "$RUNNER_TEMP/a2-original" Raft/Raft_Data/Managed/Assembly-CSharp.dll \
            > "$RUNNER_TEMP/a2-private-ilspy.log" 2>&1
      - name: Verify 2 original scenes and source, enumerate only raw link candidates
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages --disable-pip-version-check 'UnityPy==1.23.0'
          python3 -m scripts.probe_a2_settings_owner_links \
            --source Raft/Raft_Data --decompiled "$RUNNER_TEMP/a2-original"
          echo 'RAFT_A2_SETTINGS_LINKS_ONLY typedCustomFields=false unityRan=false nativeBuildRan=false'
