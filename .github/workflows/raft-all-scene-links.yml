name: Raft all 40 scenes script-link coverage (no LFS)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-native-port
    paths:
      - '.github/workflows/raft-all-scene-links.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check available disk and suppress LFS downloads
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 15728640
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 1
      - name: Assemble limited game layout with full MonoScript registry
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/sample/Raft_Data"
          mkdir -p "$dir/Managed"
          cp Raft/Raft_Data/globalgamemanagers "$dir/"
          cp Raft/Raft_Data/globalgamemanagers.assets "$dir/"
          cp Raft/Raft_Data/globalgamemanagers.assets.resS "$dir/"
          cp Raft/Raft_Data/boot.config "$dir/"
          cp Raft/Raft_Data/Managed/*.dll "$dir/Managed/"
          for n in $(seq 0 39); do
            for f in "level$n"; do
              source="Raft/Raft_Data/$f"
              if [ -f "$source" ]; then
                if head -c 48 "$source" | grep -q 'version https://git-lfs.github.com/spec/v1'; then
                  echo "Skipping unavailable LFS file: $source"; continue
                fi
                cp "$source" "$dir/"
              fi
            done
          done
          du -sh "$dir"
      - name: Download verified CLI tool release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 240 \
            'https://github.com/nowl-it/AssetRipperCLI/releases/download/v1.0.1/AssetRipper_linux_x64.zip' \
            -o "$RUNNER_TEMP/arcli.zip"
          echo "b48292e40948ce2634e9187d4724fb4f45c01fa6f4fea2a5f4775aa611def17b  $RUNNER_TEMP/arcli.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/cli"
          unzip -q "$RUNNER_TEMP/arcli.zip" -d "$RUNNER_TEMP/cli"
          chmod +x "$RUNNER_TEMP/cli/AssetRipper.GUI.Free"
      - name: Export temporary Unity editor project and regenerated script meta
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 1200s "$RUNNER_TEMP/cli/AssetRipper.GUI.Free" \
            --cli --input "$RUNNER_TEMP/sample" \
            --output "$RUNNER_TEMP/linked-project" --mode unity \
            --script-content-level Level1 --ignore-streaming-assets \
            > "$RUNNER_TEMP/linked-export.log" 2>&1
          code=$?
          set -e
          echo "Exporter exit code: $code"
          grep -Ei 'Exporting scripts|Decompiling|Failed|WARNING|Error' "$RUNNER_TEMP/linked-export.log" | tail -20 | cut -c 1-240 || true
          test "$code" -eq 0
      - name: Verify C# files and script GUIDs, no source published
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re,collections
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"linked-project/ExportedProject"
          scenes=list(p.rglob("*.unity"))
          scripts=list(p.rglob("*.cs"))
          metas=list(p.rglob("*.cs.meta"))
          gids=collections.Counter()
          for scene in scenes:
              txt=scene.read_text(encoding="utf8",errors="replace")
              for g in re.findall(r'm_Script:\s*\{[^\n}]*guid:\s*([0-9a-fA-F]{32})',txt):
                  gids[g.lower()]+=1
          metaids=set()
          for f in metas:
              c=f.read_text(encoding="utf8",errors="replace")[:500]
              m=re.search(r'(?m)^guid:\s*([0-9a-fA-F]{32})',c)
              if m:metaids.add(m.group(1).lower())
          matched=sum(n for g,n in gids.items() if g in metaids)
          total=sum(gids.values())
          print("Scene count:",len(scenes))
          print("All 40 stage scene names:",[f.name for f in scenes[:10]])
          print("C# source file count:",len(scripts))
          print("C# meta count:",len(metas))
          print("Unique script GUIDs:",len(gids))
          print("Matched scene script GUID references:",matched,"of",total)
          print("Placeholder GUID uses:",gids.get('0000000deadbeef15deadf00d0000000',0))
          print("No proprietary files uploaded or committed.")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Raft script-link export with globalgamemanagers.assets\n")
              f.write(f"- Scenes: {len(scenes)}, C#: {len(scripts)}, script metas: {len(metas)}\n")
              f.write(f"- Unique script GUIDs: {len(gids)}, matched references: {matched}/{total}\n")
              f.write(f"- Placeholder GUID uses: {gids.get('0000000deadbeef15deadf00d0000000',0)}\n")
              f.write("No original code or assets published. Editor compilation NOT tested.\n")
          if len(scenes)<35: raise SystemExit("Insufficient recovered scenes from all 40 levels")
          if matched!=total: raise SystemExit("Missing Unity serialized script GUID references")
          if not scripts: raise SystemExit("No C# files exported, linkage still unresolved")
          if not metaids: raise SystemExit("No script identity metadata exported")
          PY

      - name: Audit all serialized scene asset GUID links, beyond scripts
        shell: bash
        run: |
          python3 - <<'PY'
          import collections,os,re
          from pathlib import Path
          project=Path(os.environ["RUNNER_TEMP"])/"linked-project/ExportedProject"
          scenes=list(project.rglob("*.unity"))
          meta=list(project.rglob("*.meta"))
          registry=set()
          duplicates=collections.Counter()
          for f in meta:
              content=f.read_text(encoding="utf8",errors="replace")[:512]
              m=re.search(r"(?m)^guid:\s*([a-fA-F0-9]{32})",content)
              if m:
                  guid=m.group(1).lower()
                  duplicates[guid]+=1
                  registry.add(guid)
          refs=collections.Counter()
          for scene in scenes:
              raw=scene.read_text(encoding="utf8",errors="replace")
              refs.update(x.lower() for x in re.findall(r"guid:\s*([a-fA-F0-9]{32})",raw))
          nonnull={guid:n for guid,n in refs.items() if guid!="0"*32}
          missing={guid:n for guid,n in nonnull.items() if guid not in registry}
          dup={g:n for g,n in duplicates.items() if n>1}
          exts=collections.Counter(f.suffix.lower() for f in project.rglob("*") if f.is_file())
          print("Total serialized guid occurrences:",sum(refs.values()))
          print("Nonzero GUID occurrences:",sum(nonnull.values()))
          print("Unique nonzero GUIDs:",len(nonnull))
          print("Asset GUIDs matched to exported .meta:",len(nonnull)-len(missing))
          print("Unique GUIDs without exported .meta:",len(missing))
          print("Missing GUID uses:",sum(missing.values()))
          print("Unmatched nonzero GUID values and use counts:",sorted(missing.items(),key=lambda kv:-kv[1])[:12])
          print("Duplicate exported meta GUIDs:",len(dup))
          print("Exported file count by extension:",dict(exts.most_common(16)))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as file:
              file.write("## All scene serialized asset GUID coverage (not just scripts)\n")
              file.write(f"- Nonzero GUID occurrences: {sum(nonnull.values())}; unique: {len(nonnull)}\n")
              file.write(f"- Unique unmatched GUIDs: {len(missing)}; missing uses: {sum(missing.values())}\n")
              file.write(f"- Duplicate exported .meta GUIDs: {len(dup)}\n")
              file.write(f"- Common file suffixes: {dict(exts.most_common(10))}\n")
              file.write("Missing GUIDs may include Unity built-ins or assets absent from the partial, no-LFS input. Counts alone do not prove broken runtime links.\n")
          if dup: raise SystemExit("Ambiguous duplicate asset .meta GUIDs detected")
          PY
