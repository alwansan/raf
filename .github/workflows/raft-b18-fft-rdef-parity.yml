name: B18 WATER-001 original FFT compiled DXBC RDEF/Unity parity

on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-b18-fft-rdef-parity.yml'
      - 'scripts/b18_fft_compiled_rdef_bindings.py'
      - 'tests/test_b18_fft_compiled_rdef_bindings.py'

permissions:
  contents: read

concurrency:
  group: raft-b18-fft-rdef-parity
  cancel-in-progress: false

jobs:
  authenticate-fft-bindings:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      ZIP2_SOURCE_SHA: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
    steps:
      - name: Checkout safe sources only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - name: Synthetic DXBC reflection controls
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_b18_fft_compiled_rdef_bindings.py -v
          python3 -m py_compile scripts/b18_fft_compiled_rdef_bindings.py
      - name: Authenticate original ComputeShader provider from pinned ZIP2
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          mkdir -p "$RUNNER_TEMP/b18/zip2"
          git -C "$RUNNER_TEMP/b18/zip2" init -q
          git -C "$RUNNER_TEMP/b18/zip2" remote add origin https://github.com/alwansan/raf.git
          git -C "$RUNNER_TEMP/b18/zip2" -c protocol.version=2 fetch -q --depth=1 --filter=blob:none origin zip2
          test "$(git -C "$RUNNER_TEMP/b18/zip2" rev-parse FETCH_HEAD)" = "$ZIP2_SOURCE_SHA"
          git -C "$RUNNER_TEMP/b18/zip2" sparse-checkout init --no-cone
          printf '%s\n' '/RAFT_FILE_MANIFEST.tsv' '/Raft/Raft_Data/sharedassets0.assets/' |
            git -C "$RUNNER_TEMP/b18/zip2" sparse-checkout set --no-cone --stdin
          git -C "$RUNNER_TEMP/b18/zip2" checkout -q --detach FETCH_HEAD
          python3 -m scripts.stage_zip2_fft_owner \
            --zip2-checkout "$RUNNER_TEMP/b18/zip2" \
            --destination "$RUNNER_TEMP/b18/original/Raft_Data/sharedassets0.assets"
      - name: Compare compiled RDEF to same-slot Unity resource metadata
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4 -q
          timeout 180s python3 -m scripts.b18_fft_compiled_rdef_bindings \
            --source "$RUNNER_TEMP/b18/original/Raft_Data"
          echo 'RAFT_B18_BOUNDARY compiled_slot_not_unity_findkernel_id=true android_pixels_unproven=true'
          # No original source, names, shader bytes or private artifacts uploaded.
