name: T2 team canonical evidence summary from inherited ledger
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-t2-team-evidence-refresh.yml
      - prompt/coordination/B_TEAM/events/T2/**
      - prompt/coordination/B_TEAM/resources/T2-foam-member-abi-namebridge.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raft-t-team-summary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-from-current-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/android-native-port
          lfs: false
          persist-credentials: true
          fetch-depth: 1
          sparse-checkout: |
            scripts/refresh_b_team.py
            scripts/refresh_t_team.py
            prompt/coordination/B_TEAM
            prompt/coordination/T_TEAM
      - name: Rebuild T summary from current inherited ledger; fast-forward only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'raft-t2-evidence-checkpoint'
          git config user.email 'raft-t2-evidence-checkpoint@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch -q --no-tags origin feature/android-native-port
            # Checkout is disposable isolated runner; no shared client worktree.
            git reset --hard -q FETCH_HEAD
            python3 scripts/refresh_t_team.py
            git add -- prompt/coordination/T_TEAM/SUMMARY.md prompt/coordination/T_TEAM/snapshot.json
            if git diff --cached --quiet; then
              echo 'T2_TEAM_SUMMARY already_current=true'
              exit 0
            fi
            git commit -q -m 'coord(T2): refresh T team canonical inherited evidence snapshot'
            if git push --quiet origin HEAD:feature/android-native-port; then
              echo 'T2_TEAM_SUMMARY updated=true fast_forward_only=true'
              exit 0
            fi
            echo "T2_TEAM_SUMMARY concurrent change; refetch attempt=$attempt"
            sleep 2
          done
          echo 'T2_TEAM_SUMMARY conflict unresolved; preserved live branch' >&2
          exit 1
