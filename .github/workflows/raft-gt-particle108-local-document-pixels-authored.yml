name: GT Particle108 document-local texture pixels (AUTHORED ONLY)
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-gt-particle108-local-document-pixels-authored.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authored-local-document:
    if: github.ref == 'refs/heads/feature/android-native-port'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/*.py
            /tools/gt_authored_mesh_binary/witness.py
            /tools/gt_authored_mesh_actual_export/witness.py
            /tools/gt_authored_serialized_renderer_route/witness.py
            /tools/gt_authored_external_pptr_route/witness.py
            /tools/gt_authored_external_png_keywords/witness.py
            /tools/gt_authored_external_stream_png_importer/witness.py
            /tools/gt_authored_external_bc3_normal/witness.py
            /tests/test_b05_verify_material_texenv_bindings.py
            /tests/test_gt_particle108_alpha_provenance.py
            /tests/test_gt_particle108_export_alpha_diagnostic.py
            /tests/test_gt_particle108_source_pixel_parity.py
            /tests/test_gt_particle108_local_document_pixels.py
            /.github/workflows/raft-gt-particle108-local-document-pixels-authored.yml
      - name: Run actual authored binary and native document pixel controls
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = alwansan/raf
          test ! -e Raft
          test ! -e .gt-zip2
          mkdir local-document-evidence
          python3 -m venv "$RUNNER_TEMP/gt-local-pixels"
          py="$RUNNER_TEMP/gt-local-pixels/bin/python"
          "$py" -m pip install --disable-pip-version-check UnityPy==1.23.0 PyYAML==6.0.3 Pillow==11.3.0
          "$py" -m pip freeze > local-document-evidence/tools.log
          "$py" -B -m py_compile scripts/gt_particle108_local_texture_document.py scripts/gt_particle108_export_alpha_diagnostic.py
          export GT_LOCAL_DOCUMENT_EVIDENCE="$PWD/local-document-evidence/cases"
          for f in test_b05_verify_material_texenv_bindings.py test_gt_particle108_alpha_provenance.py test_gt_particle108_export_alpha_diagnostic.py test_gt_particle108_source_pixel_parity.py test_gt_particle108_local_document_pixels.py; do
            "$py" -B -m unittest discover -s tests -p "$f" -v 2>&1 | tee "local-document-evidence/$f.log"
          done
          "$py" -B - <<'PY'
          import json,re
          from pathlib import Path
          root=Path("local-document-evidence")
          expected={"test_b05_verify_material_texenv_bindings.py":31,"test_gt_particle108_alpha_provenance.py":16,
                    "test_gt_particle108_export_alpha_diagnostic.py":10,"test_gt_particle108_source_pixel_parity.py":20,
                    "test_gt_particle108_local_document_pixels.py":22}
          for name,count in expected.items():
              log=(root/(name+".log")).read_text()
              assert int(re.search(r"^Ran (\d+) tests? in ",log,re.M)[1])==count and re.search(r"^OK$",log,re.M),name
          (root/"regressions.json").write_text(json.dumps(expected,indent=2)+"\n")
          cases={p.parent.name:json.loads(p.read_text()) for p in (root/"cases").glob("*/report.json")}
          for name in ("rgba32-compiled","rgba32-python","bc3-compiled","bc3-python","bc3-converted","inline","lower-mip-only"):
              r=cases[name]
              assert r["all_three_source_export_RGBA8_samples_equal"] and not r["source_original_all_three_Texture2D_as_exported_images_verified"],name
          print("GT_LOCAL_DOCUMENT_PIXELS_PASS",sum(expected.values()),"reports",len(cases),flush=True)
          PY
      - name: Preserve bounded authored evidence
        if: always()
        run: |
          python3 - <<'PY'
          import base64,hashlib,zipfile
          from pathlib import Path
          root=Path("local-document-evidence");root.mkdir(exist_ok=True)
          files=[p for p in root.rglob("*") if p.is_file()]
          assert len(files)<=220 and sum(p.stat().st_size for p in files)<=2*1024*1024
          dst=root/"permanent-authored-evidence.zip"
          with zipfile.ZipFile(dst,"w",compression=zipfile.ZIP_DEFLATED) as z:
              for p in sorted(files):
                  assert not p.is_symlink()
                  z.write(p,p.relative_to(root).as_posix())
          data=dst.read_bytes()
          assert len(data)<=128*1024
          print("GT_PERMANENT_EVIDENCE_SHA",len(data),hashlib.sha256(data).hexdigest())
          b64=base64.b64encode(data).decode("ascii")
          for i in range(0,len(b64),2048):print("GT_PERMANENT_EVIDENCE_B64",i//2048,b64[i:i+2048])
          PY
      - name: Upload authored evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-particle108-local-document-${{ github.run_id }}
          path: local-document-evidence/
          if-no-files-found: warn
          retention-days: 14
