name: GT original nine Texture2DArray source shape and exact data bounds (no LFS)

on:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-gt-original-array-source.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gt-original-array-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-array-shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - name: Read immutable ZIP2 serialized owner files only
        uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: .gt-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/globalgamemanagers.assets
            Raft/Raft_Data/resources.assets
            Raft/Raft_Data/level0
