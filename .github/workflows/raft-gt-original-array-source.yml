            Raft/Raft_Data/sharedassets39.assets
      - name: Reassemble original 82 ZIP2-only serialized owners in a private scratch directory
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.gt_stage_serialized_owners \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --source .gt-zip2/Raft/Raft_Data \
            --destination "$RUNNER_TEMP/gt-serialized" \
            --report "$RUNNER_TEMP/gt-array-original-owner-stage.json"
      - name: Read actual nine original Texture2DArray width-height-depth without extracting pixels
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check UnityPy==1.23.0
          python3 -m unittest discover -s tests -p test_gt_verify_original_array_export.py -v
          python3 - <<'PY'
          import json,os
          from collections import Counter
          from pathlib import Path
          from scripts.gt_verify_original_array_export import source_arrays
          from scripts.gt_stage_serialized_owners import InventoryError
          root=Path(os.environ["RUNNER_TEMP"])
          report={"schema":"GT_REAL_NINE_SOURCE_ARRAYS_METADATA_V1",
                  "git_lfs_used":False,"original_game_pixels_exported":False,
                  "source_original_files_modified":False,
                  "Unity_Android_Texture2DArray_import_verified":False}
          try:
              src=source_arrays(root/"gt-serialized",
                   Path(".gt-zip2/RAFT_FILE_MANIFEST.tsv"))
              dims=Counter((v["width"],v["height"],v["depth"]) for v in src.values())
              report.update({"status":"PASS",
                  "SHA256_authenticated_original_array_count":len(src),
                  "source_total_original_array_layers":sum(v["depth"] for v in src.values()),
                  "original_array_shapes":[{"width":k[0],"height":k[1],
                    "depth":k[2],"count":count} for k,count in sorted(dims.items())],
                  "original_stream_descriptors_count":sum(v["has_stream_record"] for v in src.values()),
                  "original_inline_image_data_fields_count":sum(v["has_image_data"] for v in src.values())})
          except InventoryError as e:
              report.update({"status":"REJECTED","reason_code":str(e)})
          (root/"gt-original-array-metadata-safe.json").write_text(
              json.dumps(report,sort_keys=True,indent=2)+"\n")
          print("GT_ORIGINAL_TEXTURE2D_ARRAY_METADATA "+json.dumps(report,sort_keys=True))
          if report["status"]!="PASS":
              raise SystemExit(2)
          PY
      - name: Publish safe source shape and SHA aggregate only, never original array images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-original-array-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gt-array-original-owner-stage.json
            ${{ runner.temp }}/gt-original-array-metadata-safe.json
          retention-days: 14
          if-no-files-found: ignore
