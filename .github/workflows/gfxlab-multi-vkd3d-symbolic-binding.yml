name: GFX-MULTI-019 authentic source register to SPIRV symbolic binding evidence / no APK
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths: ['.github/workflows/gfxlab-multi-vkd3d-symbolic-binding.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfxlab-multi019-symbolic-original
  cancel-in-progress: false
jobs:
  original-private-symbolic-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            gfxlab/tools
            gfxlab/tests
      - name: Unit name grammar and negative binding collision guards
        run: |
          set -euo pipefail
          python3 -m py_compile gfxlab/tools/multi_shader_vkd3d_symbolic_register_map.py
          python3 -m unittest discover -s gfxlab/tests -p 'test_*.py' -v
      - uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: source-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/resources.assets/*
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/sharedassets6.assets
      - name: Install CPU-only SPIRV conversion and reflection
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross
      - name: Read source DXBC and vkd3d-generated symbolic resource names privately
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
          python3 -m gfxlab.tools.multi_shader_vkd3d_symbolic_register_map --zip2 source-zip2 --stage "$RUNNER_TEMP/gfxlab-multi019-private" --out gfxlab-multi019-safe-summary.json
          python3 - <<'PY'
          import json
          d=json.load(open("gfxlab-multi019-safe-summary.json"))
          assert d["original_shader_passes"]==7 and d["source_stages"]==14
          assert len(d["per_pass"])==7
          assert not d["independent_original_material_texenv_to_binding_verified"]
          assert not d["original_cb_byte_layout_offsets_verified"]
          assert not d["raw_shaders_or_original_register_names_exported"]
          assert not d["original_shader_restored"] and not d["stage_closed"]
          print("GFX_MULTI019_SYMBOLIC_BINDING_DIAGNOSTIC_NOT_MATERIAL_PARITY")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gfxlab-multi019-safe-symbolic-binding-coverage
          path: gfxlab-multi019-safe-summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Purge private source and reflected SPIRV generated programs
        if: always()
        run: |
          sudo rm -rf source-zip2 "$RUNNER_TEMP/gfxlab-multi019-private"
          echo GFX_MULTI019_PRIVATE_SHADER_SOURCE_PURGED=true

# Re-run after correcting pure synthetic empty-source-slot fixture from list to set.
