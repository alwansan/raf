name: GT selected native reference repair source-free controls
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-gt-native-reference-repair-check.yml
      - tools/gt_top_resource_closure/selected_material_reference.py
      - tools/gt_top_resource_closure/test_selected_array_native.py
      - tools/gt_top_resource_closure/selected_source_abi.py
      - tools/gt_top_resource_closure/test_selected_source_abi.py
permissions:
  contents: read
jobs:
  source-free-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tools/gt_top_resource_closure
            tools/gt_top_original_renderer
            tools/gt_shader_fanout
            config
      - name: Install exact prior authored-test dependencies
        run: python3 -m pip install --user --disable-pip-version-check PyYAML==6.0.3 Pillow==12.3.0 numpy==2.2.6
      - name: Verify source-only narrow reference repair and negative controls
        run: |
          set -euo pipefail
          python3 -B -m unittest tools.gt_top_resource_closure.test_selected_array_native tools.gt_top_resource_closure.test_selected_source_abi -v
