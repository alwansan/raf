name: T1 WATER-001 source-free pass-zero spatial diagnostic

on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-t1-fft-pass0-spatial-diagnostic.yml
      - scripts/t1_fft_pass0_spatial_diagnostic.py
      - tests/test_t1_fft_pass0_spatial_diagnostic.py

permissions:
  contents: read

concurrency:
  group: t1-fft-pass0-spatial-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - name: Test spatial transforms, existing parity and scheduled channel permutations
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_t1_fft_pass0_spatial_diagnostic.py -v
          python3 -m unittest discover -s tests -p test_t1_fft_readback_parity.py -v
          python3 -m unittest discover -s tests -p test_t1_fft_first_pass_channel_diagnostic.py -v
