name: B25 B-team original Foam evidence summary refresh (generated-only)
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-b25-team-evidence-refresh.yml
      - prompt/coordination/B_TEAM/events/B25/**
permissions:
  contents: write
concurrency:
  group: raft-b48-team-summary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/android-native-port
          persist-credentials: true
          lfs: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/refresh_b_team.py
            prompt/coordination/B_TEAM
      - name: Refresh B-team generated indexes from live current-head records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'raft-b25-evidence-checkpoint'
          git config user.email 'raft-b25-evidence-checkpoint@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --quiet --no-tags origin feature/android-native-port
            git reset --hard --quiet FETCH_HEAD
            python3 scripts/refresh_b_team.py
            git add -- prompt/coordination/B_TEAM/SUMMARY.md prompt/coordination/B_TEAM/snapshot.json
            if git diff --cached --quiet; then
              echo 'B25_TEAM_SUMMARY already_current=true'
              exit 0
            fi
            git commit -q -m 'coord(B25): regenerate team evidence summary from current records'
            if git push --quiet origin HEAD:feature/android-native-port; then
              echo 'B25_TEAM_SUMMARY regenerated=true push_fast_forward_only=true'
              exit 0
            fi
            echo "B25_TEAM_SUMMARY branch moved; re-read source and retry attempt=$attempt"
            sleep 1
          done
          echo 'B25_TEAM_SUMMARY no force, concurrent writes prevented publication' >&2
          exit 1
