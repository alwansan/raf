name: GFX158 ZIP2 original water scene links
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths: [gfxlab/tools/water_scene_links.py, .github/workflows/gfxlab-water158-scene-links.yml]
permissions:
  contents: read
concurrency:
  group: gfx158-${{ github.ref }}
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/native-tools
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f59d70969cd55f3d0ed249e0d0b470010889ae6d
          path: native-tools
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/checkout@v4
        with:
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: source-zip2
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /RAFT_FILE_MANIFEST.tsv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit original typed links privately
        run: |
          set -euo pipefail
          python -m pip install UnityPy==1.25.4
          if ! python -m gfxlab.tools.water_scene_links source-zip2 "$RUNNER_TEMP/gfx158-source" "$RUNNER_TEMP/gfx158.json" > "$RUNNER_TEMP/gfx158-private.log" 2>&1; then
            echo 'GFX158 scene census failed before an aggregate was produced'
            exit 1
          fi
          cat "$RUNNER_TEMP/gfx158.json"
      - name: Remove private staged source
        if: always()
        run: rm -rf source-zip2 "$RUNNER_TEMP/gfx158-source" "$RUNNER_TEMP/gfx158-private.log"
      - uses: actions/upload-artifact@v4
        with:
          name: gfx158-water-scene-links
          path: ${{ runner.temp }}/gfx158.json
          if-no-files-found: error
