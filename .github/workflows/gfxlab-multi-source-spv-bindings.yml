name: GFX-MULTI-018 original Shader48 DX11 vs SPIRV resource binding numbers / no APK
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths: ['.github/workflows/gfxlab-multi-source-spv-bindings.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfxlab-multi018-original-vs-spirv-bindings
  cancel-in-progress: false
jobs:
  original-register-vs-spv-private:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            gfxlab/tools
            gfxlab/tests
      - name: Unit checks for count and mapping false positives
        run: |
          set -euo pipefail
          python3 -m py_compile gfxlab/tools/multi_shader_source_spirv_binding_check.py
          python3 -m unittest discover -s gfxlab/tests -p 'test_*.py' -v
      - uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: source-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/resources.assets/*
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/sharedassets6.assets
      - name: Install CPU-only SPIRV reflective tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross
      - name: Compare source original register indices to SPIRV binding sets privately
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
          python3 -m gfxlab.tools.multi_shader_source_spirv_binding_check --zip2 source-zip2 --stage "$RUNNER_TEMP/gfxlab-multi018-private" --out gfxlab-multi018-safe-summary.json
          python3 - <<'PY'
          import json
          d=json.load(open("gfxlab-multi018-safe-summary.json"))
          assert d["source_original_passes"]==7 and d["source_programs_checked"]==14
          assert len(d["per_pass"])==7
          assert not d["register_identity_to_material_texenv_verified"]
          assert not d["actual_android_original_shader_execution_verified"]
          assert not d["original_shader_bytes_or_register_ids_exported"]
          assert not d["stage_closed"]
          print("GFX_MULTI018_NUMERIC_REGISTER_COMPARISON_NOT_SEMANTIC_MAPPING")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gfxlab-multi018-safe-register-vs-spirv
          path: gfxlab-multi018-safe-summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Purge original and converted shader bytes
        if: always()
        run: |
          sudo rm -rf source-zip2 "$RUNNER_TEMP/gfxlab-multi018-private"
          echo GFX_MULTI018_PRIVATE_SHADER_SOURCE_PURGED=true
