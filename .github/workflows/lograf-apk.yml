name: LogRaft Android APK
on:
  push:
    branches: [lograf]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/lograf-apk.yml'
      - 'signing/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lograf-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate and commit a permanent open-source TEST signing key once
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "lograf"
          KEY=signing/lograf-public-test.p12
          CHECKSUM=signing/lograf-public-test.sha256
          if [ ! -e "$KEY" ]; then
            echo "First build: generating one stable public TEST key inside lograf branch."
            mkdir -p signing
            keytool -genkeypair -noprompt \
              -alias lograf-public \
              -keyalg RSA -keysize 3072 -sigalg SHA256withRSA \
              -validity 10000 -storetype PKCS12 \
              -keystore "$KEY" \
              -storepass LogRaftOpenSource2026 \
              -keypass LogRaftOpenSource2026 \
              -dname "CN=LogRaft Public Test, OU=Android Diagnostics, O=LogRaft Open Source, C=IQ"
            sha256sum "$KEY" > "$CHECKSUM"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$KEY" "$CHECKSUM"
            git commit -m "chore(lograf): persist single public test Android signing identity [skip ci]"
            # Fail the run rather than publish an unpersisted key.
            git push origin HEAD:refs/heads/lograf
          fi
          test -s "$KEY"
          test -s "$CHECKSUM"
          sha256sum --check "$CHECKSUM"
          keytool -list -storetype PKCS12 \
            -keystore "$KEY" -storepass LogRaftOpenSource2026 -alias lograf-public
          echo "Using stable signing key committed to lograf."

      - name: Ensure Android SDK platform
        run: |
          test -d "$ANDROID_HOME"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build stable-signed APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature and matching repository keystore
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APK_SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APK_SIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/lograf-signature.txt"
          grep -q "Verified using v2 scheme" "$RUNNER_TEMP/lograf-signature.txt"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/lograf-signature.txt" | head -1 | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(keytool -exportcert -alias lograf-public \
            -keystore signing/lograf-public-test.p12 -storepass LogRaftOpenSource2026 \
            -storetype PKCS12 | sha256sum | awk '{print $1}')"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          cp "$APK" LogRaft-signed.apk
          sha256sum LogRaft-signed.apk > LogRaft-signed.apk.sha256
          echo "Verified persistent APK certificate SHA256: $ACTUAL"

      - uses: actions/upload-artifact@v4
        with:
          name: LogRaft-signed-APK
          path: |
            LogRaft-signed.apk
            LogRaft-signed.apk.sha256

      - name: Publish standalone signed APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "lograf-${GITHUB_RUN_NUMBER}" \
            LogRaft-signed.apk LogRaft-signed.apk.sha256 \
            --title "LogRaft stable signed APK (run ${GITHUB_RUN_NUMBER})" \
            --prerelease --target "$(git rev-parse HEAD)" \
            --notes "Signed with permanent PUBLIC TEST key in lograf/signing. First switch from earlier debug APKs may require a one-time uninstall; future APKs will install as updates. The public signing key is for an open-source experimental logger, not a security boundary."
