name: LogRaft Android APK
on:
  push:
    branches: [lograf]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/lograf-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lograf-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename and checksum
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LogRaft-debug.apk
          sha256sum LogRaft-debug.apk > LogRaft-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LogRaft-APK
          path: |
            LogRaft-debug.apk
            LogRaft-debug.apk.sha256
      - name: Publish standalone test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "lograf-${GITHUB_RUN_NUMBER}" LogRaft-debug.apk LogRaft-debug.apk.sha256 \
            --title "LogRaft diagnostic APK (run ${GITHUB_RUN_NUMBER})" --prerelease --target "${GITHUB_SHA}" \
            --notes "Standalone diagnostic logger; no Raft game assets or source included."
