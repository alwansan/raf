name: GT pinned original 82-owner materials and shaders

on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/gt_stage_serialized_owners.py
      - tests/test_gt_stage_serialized_owners.py
      - scripts/gt_serialized_graphics_counts.py
      - tests/test_gt_serialized_graphics_counts.py
      - scripts/gt_original_material_link_graph.py
      - tests/test_gt_original_material_link_graph.py
      - .github/workflows/raft-gt-serialized-graphics-owners.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gt-serialized-owners-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - name: Stage validation and malicious-input controls
        run: |
          python3 -m py_compile scripts/gt_stage_serialized_owners.py
          python3 -m unittest discover -s tests -p test_gt_stage_serialized_owners.py -v
          python3 -m unittest discover -s tests -p test_gt_serialized_graphics_counts.py -v
          python3 -m unittest discover -s tests -p test_gt_original_material_link_graph.py -v

  original-materials-shaders:
    needs: synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
      - name: Check capacity without downloading original streamed pixel data
        run: |
          df -h /
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 5242880
      - name: Read immutable ZIP2 serialized owner files only
        uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: .gt-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/globalgamemanagers.assets
            Raft/Raft_Data/resources.assets
            Raft/Raft_Data/level0
