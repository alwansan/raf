            Raft/Raft_Data/sharedassets37.assets
            Raft/Raft_Data/sharedassets38.assets
            Raft/Raft_Data/sharedassets39.assets
      - name: Authenticate and reconstruct 82 serialized owners to disposable storage
        run: |
          python3 -m scripts.gt_stage_serialized_owners \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --source .gt-zip2/Raft/Raft_Data \
            --destination "$RUNNER_TEMP/gt-serialized" \
            --report "$RUNNER_TEMP/gt-original-source-proof.json"
      - name: Install original Unity serialized-object reader
        run: python3 -m pip install --disable-pip-version-check UnityPy==1.23.0
      - name: Count all source-owned graphic objects and metadata by original identity
        run: |
          python3 -m scripts.gt_serialized_graphics_counts \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --source "$RUNNER_TEMP/gt-serialized" \
            --report "$RUNNER_TEMP/gt-all-graphics-owners.json"
      - name: Verify every original Renderer Material link against actual Material object identity
        run: |
          python3 -m scripts.gt_original_material_link_graph \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --source "$RUNNER_TEMP/gt-serialized" \
            --report "$RUNNER_TEMP/gt-original-material-links.json"
      - name: Reuse W3 exact Material to Shader object topology audit
        run: |
          python3 -m scripts.probe_w3_full_material_shader_inventory \
            --game-data "$RUNNER_TEMP/gt-serialized" \
            --aggregate-json "$RUNNER_TEMP/gt-material-shader-graph.json" \
            > "$RUNNER_TEMP/gt-material-shader-stdout.txt"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          x = json.loads((Path(os.environ["RUNNER_TEMP"]) / "gt-material-shader-graph.json").read_text())
          s = x["buckets"]
          print("GT_MATERIAL_SHADER_SOURCE " + json.dumps({
              k:s[k] for k in ("total_owners","total_materials","total_shader_objects",
                  "distinct_referenced_shader_targets_all", "distinct_referenced_shader_names",
                  "engine_transport_total_references","nameless_shader_references")
          }, sort_keys=True))
          PY
      - name: Reuse W2 original Texture2D colour and format audit
        run: |
          python3 -m scripts.probe_w2_fullgame_texture_colors \
            --source "$RUNNER_TEMP/gt-serialized" \
            --owner resources.assets --owner sharedassets0.assets \
            --out "$RUNNER_TEMP/gt-texture-colors-2owners.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"]) / "gt-texture-colors-2owners.json").read_text())
          print("GT_TEXTURE_HEADER_SOURCE " + json.dumps({
              n:r["texture_count"] for n,r in d["owners"].items()}, sort_keys=True))
          PY
      - name: Upload aggregate audits only, never copyrighted originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-serialized-graphics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gt-original-source-proof.json
            ${{ runner.temp }}/gt-all-graphics-owners.json
            ${{ runner.temp }}/gt-material-shader-graph.json
            ${{ runner.temp }}/gt-original-material-links.json
            ${{ runner.temp }}/gt-texture-colors-2owners.json
          retention-days: 14
          if-no-files-found: ignore
