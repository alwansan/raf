name: T4 LOCAL-005 genuine world-ready assignment boundary
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - 'scripts/instrument_android_runtime_operations.py'
      - 'scripts/t4_compile_world_completion_fixture.py'
      - 'tests/test_t4_world_completion_trace.py'
      - '.github/workflows/raft-t4-world-completion-trace.yml'
permissions:
  contents: read
concurrency:
  group: raft-t4-completion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  world-completion-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out instrumentation and synthetic tests only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests/test_t4_world_completion_trace.py
            config/runtime-operation-traces.json
      - name: T4 Python syntax and negative controls
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/instrument_android_runtime_operations.py tests/test_t4_world_completion_trace.py scripts/t4_compile_world_completion_fixture.py
          python3 -m unittest discover -s tests -p test_t4_world_completion_trace.py -v
      - name: Check out immutable original game DLL in separate directory
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: t4-original
          lfs: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Raft/Raft_Data/Managed/Assembly-CSharp.dll
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: CLR executes both world-ready branches on synthetic coroutine
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.t4_compile_world_completion_fixture --output "$RUNNER_TEMP/t4-clr"
          timeout 100s dotnet run --project "$RUNNER_TEMP/t4-clr/T4WorldCompletion.csproj" --configuration Release --nologo
      - name: Original ZIP2 managed provenance and Android adapted runtime boundary
        shell: bash
        env:
          DOTNET_PROCESSOR_COUNT: '2'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          set -euo pipefail
          test "$(git -C t4-original rev-parse HEAD)" = 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          test "$(df -Pk . | awk 'NR==2 {print $4}')" -gt 1200000
          mkdir -p "$RUNNER_TEMP/t4-ilspy" "$RUNNER_TEMP/t4-private-source"
          dotnet tool install ilspycmd --version 11.2.0.10050 --tool-path "$RUNNER_TEMP/t4-ilspy" >/dev/null
          timeout 360s "$RUNNER_TEMP/t4-ilspy/ilspycmd" -p -lv CSharp9_0 -o "$RUNNER_TEMP/t4-private-source" t4-original/Raft/Raft_Data/Managed/Assembly-CSharp.dll >"$RUNNER_TEMP/t4-private-decompile.log" 2>&1
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.b07_probe_original_world_callbacks import assert_original_dll, _source, method_body
          from scripts.adapt_android_offline_startup import adapt, fingerprint
          from scripts.b07_world_coroutine_trace import ORIGINAL_NETWORK_SHA256
          from scripts.instrument_android_runtime_operations import instrument
          assert_original_dll(Path('t4-original/Raft/Raft_Data/Managed/Assembly-CSharp.dll'))
          src, digest = _source(Path(os.environ['RUNNER_TEMP'])/'t4-private-source', 'Raft_Network', None)
          original_return, original_body = method_body(src, 'WorldHasBeenLoaded')
          original_body_sha = fingerprint(original_body)
          # Only two independently observed class/body output pairs from the
          # same exact original SHA-verified DLL are admissible here.
          pinned = (ORIGINAL_NETWORK_SHA256,
                    'cbd74c24f1c6a86dd50e8d320f4f4142f5b3f3fc5bf8f64ded04710c30c3a140')
          readonly_variant = ('d16c36336a6aec4e23781c135820692a233130a3f1c1d9ab9052d432d76eedef',
                              '2bf76a189a69d23444c5ede9f00a5444a48f819c64d87ec298ebeedbf5d9088c')
          if (digest, original_body_sha) not in (pinned, readonly_variant):
              raise ValueError('Unknown original decompiler source or coroutine body, fail closed')
          assert original_return == 'IEnumerator'
          if (digest, original_body_sha) == pinned:
              adapted = adapt('Raft_Network', src)
              manifest = json.loads(Path('config/runtime-operation-traces.json').read_text())
              assert fingerprint(adapted) == manifest['sources']['Raft_Network']['sha256'], 'Offline-adapted original SHA drift'
              result = instrument('Raft_Network', adapted, manifest)
              production_adapter_exercised = True
          else:
              # Only read-only original-code observation: do NOT admit an
              # additional SHA into the production adapter or runtime manifest.
              from scripts.b07_world_coroutine_trace import ENTRY
              from scripts.instrument_android_runtime_operations import trace_original_world_completion
              if src.count(original_body) != 1:
                  raise ValueError('Ambiguous authenticated original coroutine')
              entry_only = src.replace(original_body, ENTRY + original_body, 1)
              result = trace_original_world_completion(entry_only)
              production_adapter_exercised = False
          body = method_body(result, 'WorldHasBeenLoaded')[1]
          assert body.count('WorldHasBeenLoaded.firstMoveNext') == 1
          assert body.count('WorldHasBeenLoaded.originalCompletionAssigned') == 1
          from scripts.b07_probe_original_world_callbacks import _executable_positions
          import re
          assignments = r'\bWorldHasBeenRecieved\s*=\s*true\s*;'
          assert len(re.findall(assignments, _executable_positions(original_body))) == 1
          assert len(re.findall(assignments, _executable_positions(body))) == 1
          assert body.count('yield return') == original_body.count('yield return')
          print('T4_WORLD_COMPLETION_SOURCE_AUTHENTIC ' + json.dumps({
              'original_network_sha':digest,
              'coroutine_body_sha':original_body_sha,
              'original_binary_sha_verified':True,
              'entry_and_completion_markers':1,
              'original_completion_write_preserved':True,
              'new_ready_flag_added':False,
              'production_adapter_exercised':production_adapter_exercised,
              'device_result':False,
          },sort_keys=True))
          PY
          # Private game sources, snippets, and binary bytes are NOT uploaded.
