      - name: Materialize exact SHA-authenticated 82 Unity serialized owners (no LFS or raw upload)
        run: |
          set -euo pipefail
          test "$(git -C .gt-zip2 rev-parse HEAD)" = 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          python3 -m scripts.gt_stage_serialized_owners \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --source .gt-zip2/Raft/Raft_Data \
            --destination "$RUNNER_TEMP/gt-original-82-shader-owners" \
            --report "$RUNNER_TEMP/gt-original-82-source-proof-private.json" > "$RUNNER_TEMP/gt-original-82-source-private.log"
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.23.0


      - name: Translate 134 programs and compose all 1156 source routes privately
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
          timeout 6000s python3 -m scripts.gt_next23b_private_stage_translation \
            --original "$RUNNER_TEMP/gt-original-82-shader-owners" \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --quality "$RUNNER_TEMP/gt-next23b-post23-quality.json" \
            --private "$RUNNER_TEMP/gt-next23b-private-stages" \
            --out "$RUNNER_TEMP/gt-next23b-private-stage-safe.json" \
            > "$RUNNER_TEMP/gt-next23b-private-compiler.log" 2>&1

      - name: Publish numeric-only translation and composition proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-next23b-private-stage-safe-${{ github.run_id }}
          path: ${{ runner.temp }}/gt-next23b-private-stage-safe.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove private original source owners, name digests and shader bytes
        if: always()
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/gt-next23b-private-stages" \
                 "$RUNNER_TEMP/gt-next23b-private-compiler.log" \
                 "$RUNNER_TEMP/gt-original-82-shader-owners" \
                 "$RUNNER_TEMP/gt-next23b-real-post23-quality" \
                 "$RUNNER_TEMP/gt-next23b-post23-quality.json" \
                 "$RUNNER_TEMP/gt-original-82-source-proof-private.json" \
                 "$RUNNER_TEMP/gt-original-82-source-private.log"
          rm -rf .gt-zip2
