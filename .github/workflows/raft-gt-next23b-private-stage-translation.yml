name: GT NEXT23b private source composition Vulkan1.1 (NO APK)

on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/gt_next23b_private_stage_translation.py
      - tests/test_gt_next23b_private_stage_translation.py
      - scripts/gt_original_921_shaderlab.py
      - tests/test_gt_original_next23b_source_pass_modes.py
      - .github/workflows/raft-gt-next23b-private-stage-translation.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gt-next23b-private-stage-translation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unique-remaining-23-material-original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
            .github/workflows/raft-gt-next23b-private-stage-translation.yml

      - name: Fail closed on post23 unique source selector and source-free invariants
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/gt_next23b_private_stage_translation.py
          python3 -m unittest discover -s tests -p test_gt_next23b_private_stage_translation.py -v
          python3 -m unittest discover -s tests -p test_gt_original_next23b_source_pass_modes.py -v
          python3 -m unittest discover -s tests -p test_gt_remaining_original_guid_weights.py -v

      - name: Retrieve accepted actual post23 same-export material census
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43929698985
          name: gt-twentythree-next7p33-source-shader-full-export-audit-43929698985
          path: ${{ runner.temp }}/gt-next23b-real-post23-quality

      - name: Validate real 688 Custom non-Dummy / 98 Dummy / 37 original GUID population
        run: |
          set -euo pipefail
          python3 - <<'PY_NEXT23B_REAL_QUALITY'
          import json,os,shutil
          from pathlib import Path
          from scripts.gt_remaining_original_guid_weights import safe_remaining_weights
          root=Path(os.environ["RUNNER_TEMP"])/"gt-next23b-real-post23-quality"
          matches=[p for p in root.rglob("gt-twentythree-shader-postrestore-quality.json")
                   if p.is_file() and not p.is_symlink()]
          if len(matches)!=1:
              raise ValueError("missing_unique_real_next23b_post23_quality")
          safe_remaining_weights(json.loads(matches[0].read_text(encoding="utf-8")))
          shutil.copyfile(matches[0],Path(os.environ["RUNNER_TEMP"])/"gt-next23b-post23-quality.json")
          print("GT_NEXT23B_ACTUAL_POST23_688_NON_DUMMY_98_DUMMY_SOURCE_ACCEPTED noAPK=true")
          PY_NEXT23B_REAL_QUALITY

      - name: Read immutable ZIP2 serialized owner files only
