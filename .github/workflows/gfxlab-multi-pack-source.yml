name: GFX-MULTI-002 five new original models source pack validation (NO APK)
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths:
      - '.github/workflows/gfxlab-multi-pack-source.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfxlab-multi-pack-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  six-original-model-source-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONUNBUFFERED: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            gfxlab/tools
            gfxlab/tests
      - name: Strict sourcefree unit controls
        run: |
          set -euo pipefail
          python3 -m py_compile gfxlab/tools/*.py
          python3 -m unittest discover -s gfxlab/tests -p 'test_*.py' -v
      - name: Checkout exactly three ZIP2 original asset owner containers at immutable SHA
        uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: source-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/resources.assets/*
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/sharedassets6.assets
      - name: Build private original six Mesh/Material/Texture source plan
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
          python3 -m gfxlab.tools.multi_model_transport plan \
            --zip2 source-zip2 --stage "$RUNNER_TEMP/gfxlab-multi-source" \
            --private-plan "$RUNNER_TEMP/gfxlab-multi-private-plan.json" \
            --paths "$RUNNER_TEMP/gfxlab-multi-private-parts.txt"
      - name: Recover sparse authenticated stream chunks and decode all six models
        run: |
          set -euo pipefail
          if [ -s "$RUNNER_TEMP/gfxlab-multi-private-parts.txt" ]; then
            git -C source-zip2 sparse-checkout set --no-cone --stdin < "$RUNNER_TEMP/gfxlab-multi-private-parts.txt"
          fi
          python3 -m gfxlab.tools.multi_model_transport extract \
            --zip2 source-zip2 --stage "$RUNNER_TEMP/gfxlab-multi-source" \
            --private-plan "$RUNNER_TEMP/gfxlab-multi-private-plan.json" \
            --model-dir "$RUNNER_TEMP/gfxlab-multi-generated-assets" \
            --safe-report "$RUNNER_TEMP/gfxlab-multi-safe.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          d=json.loads((root/"gfxlab-multi-safe.json").read_text())
          assert d["model_count"]==6 and d["additional_models"]==5
          assert len(d["model_summaries"])==6
          for i in range(6):
              m=root/"gfxlab-multi-generated-assets"/f"M{i:02d}"
              assert (m/"model.obj").stat().st_size>1000
              assert (m/"config.json").stat().st_size>100
              assert len(list(m.glob("*.png")))>=1
          assert not d["original_shader_equivalence_verified"]
          print("GFX_MULTI002_SOURCE_PACK_AUTHENTIC_ALL_SIX=PASS")
          PY
      - name: Publish public-safe aggregate only, not loose game art
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfxlab-multi002-source-counts-${{ github.run_id }}
          path: ${{ runner.temp }}/gfxlab-multi-safe.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Destroy private model PNG, OBJ, PPtrs and stream contents
        if: always()
        run: |
          sudo rm -rf source-zip2 "$RUNNER_TEMP/gfxlab-multi-source" "$RUNNER_TEMP/gfxlab-multi-generated-assets"
          rm -f "$RUNNER_TEMP/gfxlab-multi-private-plan.json" "$RUNNER_TEMP/gfxlab-multi-private-parts.txt"
          echo GFX_MULTI_PRIVATE_SOURCE_REMOVED=true
