name: T2 WATER-001 SHA-original Foam two-pass paired VS-PS HLSL Vulkan compilation
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/t2_foam_original_pair_compile.py
      - tests/test_t2_foam_original_pair_compile.py
      - .github/workflows/raft-t2-foam-original-pair-compile.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t2-foam-pair-vulkan-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  original-two-pass-paired-stages:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
      - name: Run isolated source-free anti-spoof and tampering tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t2_foam_original_pair_compile.py
          python3 -m unittest discover -s tests -p 'test_t2_foam_original_pair_compile.py' -v
      - name: Guard CI disk headroom
        run: python3 -c 'import shutil; assert shutil.disk_usage(".").free > 3 * 1024**3'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: t2-pair-zip2
          lfs: false
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/sharedassets0.assets/*
      - name: Reassemble exact original source owner with SHA and no LFS
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import ZIP2_SHA,PINS,stage
          repo=Path('t2-pair-zip2')
          assert subprocess.check_output(['git','-C',str(repo),'rev-parse','HEAD'],text=True).strip()==ZIP2_SHA
          out=Path(os.environ['RUNNER_TEMP'])/'t2-pair-source'
          r=stage(repo,out,{'Raft_Data/sharedassets0.assets':PINS['Raft_Data/sharedassets0.assets']})
          assert r['verified_bytes']==115978112 and r['lfs_used'] is False
          print('T2_FOAM_PAIRED_SOURCE owner_sha_verified=true bytes=115978112 lfs=false')
          PY
      - name: Install pinned original reader and stage translator dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4 -q
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
      - name: Stage private SHA-original B20 four programs and two render states
        run: |
          set -euo pipefail
          timeout 480s python3 -m scripts.b20_private_foam_packet \
            --source "$RUNNER_TEMP/t2-pair-source" \
            --repo "$GITHUB_WORKSPACE" \
            --private "$RUNNER_TEMP/t2-pair-private" \
            --out "$RUNNER_TEMP/t2-pair-manifest.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          m=json.loads((Path(os.environ['RUNNER_TEMP'])/'t2-pair-manifest.json').read_text())
          assert m['status']=='private_two_pass_inputs_staged'
          assert m['original_passes']==2 and m['original_stage_programs']==4
          assert m['opaque_cb0_aliases_still_require_authentication']==4
          assert m['shaderlab_constructed'] is False and m['private_original_program_published'] is False
          PY
      - name: Compile paired original pass VS and PS from one HLSL source each
        run: |
          set -euo pipefail
          timeout 420s python3 -m scripts.t2_foam_original_pair_compile \
            --packet "$RUNNER_TEMP/t2-pair-private" \
            --manifest "$RUNNER_TEMP/t2-pair-manifest.json" \
            --scratch "$RUNNER_TEMP" \
            --out "$RUNNER_TEMP/t2-foam-pair-safe.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'t2-foam-pair-safe.json').read_text())
          assert r['status']=='original_foam_two_pairs_compiled_vulkan11'
          assert r['compiled_stage_pairs']==2 and r['compiled_stage_variants']==4
          assert r['stage_order_exact'] is True
          assert r['reused_original_247_byte_render_states'] is True
          assert r['original_cb0_alias_or_data_upload_verified'] is False
          assert r['original_material_and_sampler_upload_verified'] is False
          assert r['shaderlab_constructed_or_installed'] is False
          assert r['unity_2021_import_or_android_pixels_verified'] is False
          assert r['source_program_numeric_pixel_equivalence_verified'] is False
          assert r['private_source_published'] is False
          PY
      - name: Remove all original source and private programs even on failure
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/t2-pair-source" "$RUNNER_TEMP/t2-pair-private" \
            "$RUNNER_TEMP/t2-pair-manifest.json" "$GITHUB_WORKSPACE/t2-pair-zip2"
      - name: Publish aggregate only, never original HLSL ShaderLab SPIR-V or ZIP2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-foam-pair-safe-${{ github.run_id }}
          path: ${{ runner.temp }}/t2-foam-pair-safe.json
          if-no-files-found: ignore
          retention-days: 7
