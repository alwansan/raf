name: GT G4 source indexed FFT slots 6 7 16 17 editor Vulkan paired dispatch (NO PLAYER)
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-gt-fft-indexed-pair-gpu.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raft-gt-fft-indexed-pair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment: UNITY_LICENSE
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      GT_FFT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      GT_FFT_IMAGE: raft-gt-fft-pair:local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tools/gt_fft_indexed_pair
      - name: Source-free receipt controls
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tools/gt_fft_indexed_pair -p test_audit.py -v
          mkdir "$RUNNER_TEMP/gt-fft-pair-safe"
      - name: Check licensed editor activation and prepare private Vulkan image
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        timeout-minutes: 22
        run: |
          set -euo pipefail
          test -n "$UNITY_LICENSE" || { test -n "$UNITY_SERIAL" && test -n "$UNITY_EMAIL" && test -n "$UNITY_PASSWORD"; }
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 20971520
          mkdir "$RUNNER_TEMP/gt-fft-pair-docker"
          cp tools/gt_fft_indexed_pair/private-editor.sh "$RUNNER_TEMP/gt-fft-pair-docker/"
          bash -n "$RUNNER_TEMP/gt-fft-pair-docker/private-editor.sh"
          cat > "$RUNNER_TEMP/gt-fft-pair-docker/Dockerfile" <<'DOCKERFILE'
          FROM unityci/editor:ubuntu-2021.3.45f2-linux-il2cpp-3
          USER root
          RUN apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb xauth && rm -rf /var/lib/apt/lists/*
          RUN command -v unity-editor > /opt/gt-real-unity-editor && test -x "$(cat /opt/gt-real-unity-editor)"
          COPY private-editor.sh /opt/gt-private-bin/unity-editor
          RUN chmod 0755 /opt/gt-private-bin/unity-editor
          ENV PATH=/opt/gt-private-bin:$PATH
          ENV VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          DOCKERFILE
          timeout 900s docker pull unityci/editor:ubuntu-2021.3.45f2-linux-il2cpp-3 > "$RUNNER_TEMP/gt-fft-pair-pull.log" 2>&1
          timeout 360s docker build --pull=false --tag "$GT_FFT_IMAGE" "$RUNNER_TEMP/gt-fft-pair-docker" > "$RUNNER_TEMP/gt-fft-pair-build.log" 2>&1
          timeout 45s docker run --rm --entrypoint /bin/bash "$GT_FFT_IMAGE" -c 'test -f "$VK_ICD_FILENAMES" && test "$(command -v unity-editor)" = /opt/gt-private-bin/unity-editor'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: zip2-fft-pair
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/sharedassets0.assets/
      - name: Authenticate original object and stage exact indexed and standalone programs privately
        id: stage
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
          python3 -m venv "$RUNNER_TEMP/gt-fft-pair-py"
          "$RUNNER_TEMP/gt-fft-pair-py/bin/python" -m pip install --disable-pip-version-check UnityPy==1.25.4
          "$RUNNER_TEMP/gt-fft-pair-py/bin/python" -m scripts.stage_zip2_fft_owner --zip2-checkout zip2-fft-pair --destination "$RUNNER_TEMP/gt-fft-pair-source/Raft_Data/sharedassets0.assets"
          "$RUNNER_TEMP/gt-fft-pair-py/bin/python" -B -m tools.gt_fft_indexed_pair.audit stage --source "$RUNNER_TEMP/gt-fft-pair-source/Raft_Data" --project gt-fft-pair-project --private gt-fft-pair-private --run-id "$GT_FFT_RUN_ID" --out "$RUNNER_TEMP/gt-fft-pair-safe/stage.json"
          rm -rf zip2-fft-pair "$RUNNER_TEMP/gt-fft-pair-source"
      - name: Execute real Unity Vulkan indexed and standalone pairs
        id: unity
        continue-on-error: true
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f2
          customImage: raft-gt-fft-pair:local
          projectPath: gt-fft-pair-project
          targetPlatform: StandaloneLinux64
          buildMethod: GTIndexedPair.Run
          manualExit: true
          enableGpu: true
          versioning: None
          allowDirtyBuild: true
          dockerMemoryLimit: 8g
          dockerCpuLimit: 2
          customParameters: -force-vulkan -force-device-index 0 -job-worker-count 2 -gtFftRunId ${{ env.GT_FFT_RUN_ID }}
      - name: Verify same-run guarded output and two-pass numerical parity
        if: always() && steps.stage.outcome == 'success'
        env:
          EDITOR_OUTCOME: ${{ steps.unity.outcome }}
        run: |
          set -euo pipefail
          test -d gt-fft-pair-private && test ! -L gt-fft-pair-private
          test -d gt-fft-pair-project && test ! -L gt-fft-pair-project
          sudo chown -hR "$(id -u):$(id -g)" -- gt-fft-pair-private gt-fft-pair-project
          test "$(stat -c %a gt-fft-pair-private)" = 700
          "$RUNNER_TEMP/gt-fft-pair-py/bin/python" -B -m tools.gt_fft_indexed_pair.audit verify --project gt-fft-pair-project --private gt-fft-pair-private --stage "$RUNNER_TEMP/gt-fft-pair-safe/stage.json" --run-id "$GT_FFT_RUN_ID" --outcome "$EDITOR_OUTCOME" --out "$RUNNER_TEMP/gt-fft-pair-safe/actual.json"
      - name: Publish bounded aggregate only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-fft-indexed-pair-safe
          path: ${{ runner.temp }}/gt-fft-pair-safe/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only private experiment staging
        if: always()
        run: |
          sudo rm -rf gt-fft-pair-project gt-fft-pair-private
          rm -rf zip2-fft-pair "$RUNNER_TEMP/gt-fft-pair-source" "$RUNNER_TEMP/gt-fft-pair-docker"
          rm -f "$RUNNER_TEMP/gt-fft-pair-pull.log" "$RUNNER_TEMP/gt-fft-pair-build.log"
          docker image rm "$GT_FFT_IMAGE" >/dev/null 2>&1 || true
