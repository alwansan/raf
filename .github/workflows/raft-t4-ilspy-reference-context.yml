name: T4 LOCAL-005 original ILSpy managed reference context
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/t4_probe_ilspy_reference_context.py
      - tests/test_t4_probe_ilspy_reference_context.py
      - .github/workflows/raft-t4-ilspy-reference-context.yml
permissions:
  contents: read
concurrency:
  group: raft-t4-original-reference-context-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-original-reference-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout isolated T4 source tools without LFS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests/test_t4_probe_ilspy_reference_context.py
            config/runtime-operation-traces.json
      - name: Run source-free T4 strict negative controls
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t4_probe_ilspy_reference_context.py tests/test_t4_probe_ilspy_reference_context.py
          python3 -m unittest discover -s tests -p test_t4_probe_ilspy_reference_context.py -v
      - name: Checkout immutable original ZIP2 managed DLL only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: original-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Raft/Raft_Data/Managed/Assembly-CSharp.dll
      - name: Checkout unchanged sibling managed references at pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 02e9fba7fb42b83579595885391be636ee3b56e8
          path: managed-reference-pin
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Raft/Raft_Data/Managed/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Stage only SHA-verified original DLL and its reference context privately
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C original-zip2 rev-parse HEAD)" = "15964ea8f246b6e076ce26b60931ee2e1a9a2385"
          test "$(git -C managed-reference-pin rev-parse HEAD)" = "02e9fba7fb42b83579595885391be636ee3b56e8"
          test "$(df -Pk . | awk 'NR==2 {print $4}')" -gt 1500000
          mkdir -p "$RUNNER_TEMP/t4-context/solo-a" "$RUNNER_TEMP/t4-context/solo-b" "$RUNNER_TEMP/t4-context/with-refs"
          mkdir -p "$RUNNER_TEMP/t4-context/out-a" "$RUNNER_TEMP/t4-context/out-b" "$RUNNER_TEMP/t4-context/out-refs"
          for dir in solo-a solo-b with-refs; do
            cp original-zip2/Raft/Raft_Data/Managed/Assembly-CSharp.dll "$RUNNER_TEMP/t4-context/$dir/Assembly-CSharp.dll"
          done
          for dep in managed-reference-pin/Raft/Raft_Data/Managed/*.dll; do
            if [ "$(basename "$dep")" != "Assembly-CSharp.dll" ]; then
              test -f "$dep" && test ! -L "$dep"
              cp "$dep" "$RUNNER_TEMP/t4-context/with-refs/"
            fi
          done
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.b07_probe_original_world_callbacks import assert_original_dll
          root = Path(os.environ['RUNNER_TEMP']) / 't4-context'
          for name in ('solo-a', 'solo-b', 'with-refs'):
              assert_original_dll(root/name/'Assembly-CSharp.dll')
          count = len(list((root/'with-refs').glob('*.dll'))) - 1
          if count < 100:
              raise ValueError('Incomplete original Managed sibling input')
          print('T4_REFERENCE_CONTEXT_STAGED original_dll_sha_verified=true sibling_dll_count=' + str(count) + ' original_bytes_published=false')
          PY
      - name: Privately decompile three identical original DLLs with/without siblings
        shell: bash
        env:
          DOTNET_PROCESSOR_COUNT: '2'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t4-ilspy"
          dotnet tool install ilspycmd --version 11.2.0.10050 --tool-path "$RUNNER_TEMP/t4-ilspy" >/dev/null
          for pair in solo-a:out-a solo-b:out-b with-refs:out-refs; do
            src="${pair%%:*}"
            dst="${pair#*:}"
            timeout 240s "$RUNNER_TEMP/t4-ilspy/ilspycmd" -p -lv CSharp9_0 \
              -o "$RUNNER_TEMP/t4-context/$dst" \
              "$RUNNER_TEMP/t4-context/$src/Assembly-CSharp.dll" \
              >"$RUNNER_TEMP/t4-$src-private-ilspy.log" 2>&1
          done
          python3 -m scripts.t4_probe_ilspy_reference_context \
            --solo-a-dll "$RUNNER_TEMP/t4-context/solo-a/Assembly-CSharp.dll" \
            --solo-b-dll "$RUNNER_TEMP/t4-context/solo-b/Assembly-CSharp.dll" \
            --refs-dll "$RUNNER_TEMP/t4-context/with-refs/Assembly-CSharp.dll" \
            --solo-a-source "$RUNNER_TEMP/t4-context/out-a" \
            --solo-b-source "$RUNNER_TEMP/t4-context/out-b" \
            --refs-source "$RUNNER_TEMP/t4-context/out-refs" \
            --managed-dir "$RUNNER_TEMP/t4-context/with-refs"
          # No private original code, DLL payload, metadata or decompiler log is uploaded.
      - name: Verify real B07-pinned Android offline and T4 completion instrumentation against full original context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from scripts.b07_probe_original_world_callbacks import (
              _source, assert_original_dll, method_body, fingerprint, _executable_positions
          )
          from scripts.b07_world_coroutine_trace import ORIGINAL_NETWORK_SHA256, ORIGINAL_ITERATOR_BODY_SHA256
          from scripts.adapt_android_offline_startup import adapt
          from scripts.instrument_android_runtime_operations import instrument
          root = Path(os.environ['RUNNER_TEMP']) / 't4-context'
          assert_original_dll(root / 'with-refs' / 'Assembly-CSharp.dll')
          source, original_sha = _source(root / 'out-refs', 'Raft_Network', ORIGINAL_NETWORK_SHA256)
          original_return, original_body = method_body(source, 'WorldHasBeenLoaded')
          if original_return != 'IEnumerator' or fingerprint(original_body) != ORIGINAL_ITERATOR_BODY_SHA256:
              raise ValueError('Managed context did not restore authenticated original coroutine identity')
          adapted = adapt('Raft_Network', source)
          manifest = json.loads(Path('config/runtime-operation-traces.json').read_text())
          expected_adapted = manifest['sources']['Raft_Network']['sha256']
          if fingerprint(adapted) != expected_adapted:
              raise ValueError('Native source staging manifest mismatch; keep original gate')
          staged = instrument('Raft_Network', adapted, manifest)
          staged_ret, staged_body = method_body(staged, 'WorldHasBeenLoaded')
          before = _executable_positions(original_body)
          after = _executable_positions(staged_body)
          ready = r'\bWorldHasBeenRecieved\s*=\s*true\s*;'
          if staged_ret != 'IEnumerator' or len(re.findall(ready, before)) != 1 or len(re.findall(ready, after)) != 1:
              raise ValueError('Original world completion assignment contract changed')
          if after.count('WorldHasBeenLoaded.firstMoveNext') != 1 or after.count('WorldHasBeenLoaded.originalCompletionAssigned') != 1:
              raise ValueError('Expected B07 firstMoveNext and T4 actual assignment markers')
          if len(re.findall(r'\byield\s+return\b', after)) != len(re.findall(r'\byield\s+return\b', before)):
              raise ValueError('Original coroutine yield statements changed')
          print('T4_NATIVE_SOURCE_STAGE_FULL_CONTEXT ' + json.dumps({
              'source_sha256': original_sha,
              'adapted_sha256': fingerprint(adapted),
              'matches_original_runtime_manifest': True,
              'original_world_assignment_preserved': True,
              'first_movenext_and_original_completion_markers': True,
              'original_yield_count_preserved': True,
              'production_adapter_exercised': True,
              'no_production_source_pin_changed': True,
              'unity_or_il2cpp_compiled': False,
              'device_tested': False,
              'raw_original_code_published': False,
          },sort_keys=True))
          PY
          # No original source, managed binaries or private decompiler details are uploaded.
