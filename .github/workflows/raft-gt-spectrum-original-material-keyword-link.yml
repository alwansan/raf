name: GT SHA-original 40-owner Spectrum Material keyword index4 linkage
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/gt_spectrum_original_material_keyword_link.py
      - tests/test_gt_spectrum_original_material_keyword_link.py
      - .github/workflows/raft-gt-spectrum-original-material-keyword-link.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source40-material-spectrum-pptr:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
      - name: Test original PPtr identity and all synthetic negative cases
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/gt_spectrum_original_material_keyword_link.py tests/test_gt_spectrum_original_material_keyword_link.py
          python3 -m unittest discover -s tests -p test_gt_spectrum_original_material_keyword_link.py -v
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: gt-spectrum-material-zip2
          lfs: false
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
      - name: Install pinned original Unity metadata reader, no LFS
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4 -q
      - name: SHA-authenticate all 40 original sharedassets and exact shader index4 PPtrs
        run: |
          set -euo pipefail
          python3 -m scripts.gt_spectrum_original_material_keyword_link \
            --zip2 "$GITHUB_WORKSPACE/gt-spectrum-material-zip2" \
            --scratch "$RUNNER_TEMP/gt-spectrum-material-source-40" \
            --out "$RUNNER_TEMP/gt-spectrum-material-link-safe.json"
          python3 - <<'PY'
          from pathlib import Path
          import os,json
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'gt-spectrum-material-link-safe.json').read_text())
          assert r['status']=='SOURCE_AUTHENTIC_SPECTRUM_40_SHAREDASSETS_MATERIAL_PPTR_CENSUS'
          assert r['original_sharedassets_owners']==40
          assert r['original_sharedassets_owner_bytes']==474065455
          assert r['original_Spectrum_shader_owner_pathid_object_authenticated'] is True
          assert r['original_index4_flag_byte']==0
          assert r['original_keyword_names_published'] is False
          assert r['not_full_82_owner_or_runtime_material_census'] is True
          assert r['original_exported_guid_or_android_runtime_verified'] is False
          assert r['all_materials'] >= r['matched_local']+r['matched_external']
          print('GT_SPECTRUM_SOURCE_40_OWNER_MATERIAL_GATE_PASS 40Owners=true originalSHA=true exactShaderPathID=true RuntimeMaterial=false')
          PY
      - name: Upload only aggregate counts, no material data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gt-spectrum-source40-material-linkage-safe
          path: ${{ runner.temp }}/gt-spectrum-material-link-safe.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove source originals and ZIP2 staging
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/gt-spectrum-material-source-40" "$RUNNER_TEMP/gt-spectrum-material-link-safe.json"
          rm -rf -- "$GITHUB_WORKSPACE/gt-spectrum-material-zip2"
