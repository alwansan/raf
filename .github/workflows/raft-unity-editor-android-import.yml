name: Raft full native APK OBB XAPK build and delivery

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Full native ARM64 build; lightweight tests use separate workflows
        type: choice
        options: [native]
        default: native
      publish_early_test:
        description: Publish complete APK OBB XAPK after all delivery gates pass
        type: boolean
        default: true
  workflow_call:
    inputs:
      build_mode:
        type: string
        default: native
      publish_early_test:
        type: boolean
        default: true
      build_lane:
        type: string
        default: delivery
  push:
    branches:
      - feature/android-native-port
    paths:
      - '.github/raft-native-build-request.json'

# Preserve the existing delivery mutex so current immutable builds stay protected.
# Dedicated request file prevents ordinary source/test pushes entering this queue.
concurrency:
  group: ${{ inputs.build_lane == 'experiment' && 'raft-unity-android-experiment' || 'raft-unity-editor-android' }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  native-request-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 1
      - name: Require an explicit full native request on the owner branch
        env:
          NATIVE_REQUESTED: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_mode == 'native') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[raft-native-build]')) }}
          DELIVERY_REQUESTED: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_early_test) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[raft-device-test]')) }}
          BUILD_LANE: ${{ inputs.build_lane || 'delivery' }}
          REQUEST_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feature/android-native-port"
          test "$NATIVE_REQUESTED" = "true"
          if [ "$BUILD_LANE" = "experiment" ]; then
            test "$REQUEST_EVENT" = "workflow_dispatch" || test "$REQUEST_EVENT" = "push"
            test "$DELIVERY_REQUESTED" != "true"
          else
            test "$BUILD_LANE" = "delivery"
            test "$DELIVERY_REQUESTED" = "true"
          fi
          if [ "$REQUEST_EVENT" = "push" ]; then
            python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          path='.github/raft-native-experiment-request.json' if os.environ['BUILD_LANE']=='experiment' else '.github/raft-native-build-request.json'
          request=json.loads(Path(path).read_text())
          assert isinstance(request.get('request_id'),str) and 1 <= len(request['request_id']) <= 128
          assert isinstance(request.get('reason'),str) and 1 <= len(request['reason']) <= 512
          assert re.fullmatch('[a-f0-9]{40}',request.get('requested_from_sha',''))
          print('RAFT_NATIVE_REQUEST accepted=true event=push')
          PY
          fi

  unity-license-preflight:
    needs: native-request-gate
    environment: UNITY_LICENSE
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check whether Unity activation is available without exposing secrets
        id: check
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ] && { [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; }; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Unity activation secrets found; attempting private project import and Android build."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Unity activation unavailable; will not download LFS or Docker image."
            echo '::error::Unity activation unavailable for this explicit native request; no APK produced.'
            exit 1
          fi

  reconstruct:
    # Both native lanes serialize actual Editor work to avoid license contention.
    concurrency:
      group: raft-native-engine-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    needs: unity-license-preflight
    environment: UNITY_LICENSE
    if: ${{ needs.unity-license-preflight.outputs.ready == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.build_mode == 'native') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[raft-native-build]'))) }}
    runs-on: ubuntu-24.04
    # Restored Mono fields now require a substantially larger first-import budget.
    # Previous 65-minute job expired during active asset import, before Build().
    timeout-minutes: 240
    steps:
      - name: Disk safety gate before dependencies / LFS download
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free_kb=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          test "$free_kb" -gt 36700160
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          persist-credentials: true
      - name: Run synthetic code-overlay tests before touching original data
        run: |
          python3 -m unittest discover -s tests -p test_w1_export_material_shaders.py -v
          # T3 source-free controls: valid Material GUID can still target a
          # default-Dummy ShaderLab program after partial restoration.
          python3 -m unittest discover -s tests -p test_t3_audit_exported_material_programs.py -v
          python3 -m unittest discover -s tests -p test_verify_exported_material_texture_links.py -v
          python3 -m pip install --user --disable-pip-version-check Pillow==11.3.0
          python3 -m unittest discover -s tests -p test_gt_repair_array_flipbook_importers.py -v
          python3 -m unittest discover -s tests -p test_gt_verify_original_array_material_refs.py -v
          python3 -m unittest discover -s tests -p test_android_render_lifetimes.py -v
          python3 -m unittest discover -s tests -p test_t1_stage_original_fft_dispatch_trace.py -v
          python3 -m unittest discover -s tests -p test_gradle_payload_audit.py -v
          python3 -m unittest discover -s tests -p test_android_expansion_audit.py -v
          python3 -m unittest discover -s tests -p test_restore_postfx_shaders.py -v
          python3 -m unittest discover -s tests -p test_restore_postfx_compute.py -v
          python3 -m unittest discover -s tests -p test_restore_volumetric_shaders.py -v
          python3 -m unittest discover -s tests -p test_restore_builtin_shaders.py -v
          python3 -m unittest discover -s tests -p test_restore_tmp_shaders.py -v
          python3 -m unittest discover -s tests -p test_runtime_operation_traces.py -v
          python3 -m unittest discover -s tests -p test_android_offline_startup.py -v
          python3 -m unittest discover -s tests -p test_adapt_original_save_paths.py -v
          python3 -m unittest discover -s tests -p test_reembed_scene_bound_assets.py -v
          python3 -m unittest discover -s tests -p test_fmod_resource_path_policy.py -v
          python3 -m unittest discover -s tests -p test_csharp_overlay.py -v
          python3 -m unittest discover -s tests -p test_supplement_ilspy_gameplay.py -v
          python3 -m unittest discover -s tests -p test_repair_assetripper_stubs.py -v
          python3 -m unittest discover -s tests -p test_stage_raft_managed_dlls.py -v
          python3 -m unittest discover -s tests -p test_resolve_managed_closure.py -v
          python3 -m unittest discover -s tests -p test_build_sdk_script_manifest.py -v
          python3 -m unittest discover -s tests -p test_exported_font_materials.py -v
          python3 -m unittest discover -s tests -p test_isolate_sdk_source_assemblies.py -v
          python3 -m unittest discover -s tests -p test_mesh_range_manifest.py -v
          python3 -m unittest discover -s tests -p test_verified_mesh_ranges.py -v
          python3 -m unittest discover -s tests -p test_inline_mesh_ranges.py -v
          python3 -m unittest discover -s tests -p test_original_mesh_positions.py -v
          python3 -m unittest discover -s tests -p test_scene_stream_restoration.py -v
          python3 -m unittest discover -s tests -p test_exported_font_materials.py -v
          python3 -m unittest discover -s tests -p test_recover_empty_ilspy_sources.py -v
      - name: Validate original CLR providers before any LFS transfer
        run: |
          python3 -m unittest discover -s tests -p test_export_managed_providers.py -v
          python3 -m unittest discover -s tests -p test_assetripper_script_import.py -v
          python3 -m pip install --user --disable-pip-version-check dnfile==0.18.0
          python3 -m scripts.stage_export_managed_providers \
            --source "$GITHUB_WORKSPACE/Raft/Raft_Data/Managed" \
            --destination "$RUNNER_TEMP/input/Raft_Data/Managed"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: T5 compile real Unity2021 Editor and Android mouse ABI before original ZIP2 acquisition
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          set -euo pipefail
          # Reuse the already byte-verified managed provider stage, not a new
          # Unity Editor or LFS checkout. The previous full build reached
          # compiler CS0234 only after expensive reconstruction.
          managed="$RUNNER_TEMP/input/Raft_Data/Managed"
          for module in Assembly-CSharp.dll UnityEngine.CoreModule.dll UnityEngine.InputLegacyModule.dll UnityEngine.AndroidJNIModule.dll Unity.InputSystem.dll; do
            test -s "$managed/$module"
            test ! -L "$managed/$module"
          done
          # A compiler-only ABI check must never silently accept a different
          # original Raft managed assembly than the T4 proven source.
          test "$(stat -c '%s' "$managed/Assembly-CSharp.dll")" = 3211776
          echo '0a6f0527856a9ce538d8d4217358b467c58fdcfad95e0ebebf9588c48f24f72e  '"$managed/Assembly-CSharp.dll" | sha256sum -c --status
          for mode in UnityEditorBridgeCompile UnityBridgeCompile; do
            report="$RUNNER_TEMP/t5-native-early-abi-$mode.private.log"
            if ! timeout 150s dotnet build "android-port/Tests/PhysicalMouse/$mode.csproj" -c Release -p:OriginalManagedDir="$managed" > "$report" 2>&1; then
              # No original DLL path, gameplay CSharp source, Unity compile
              # log or proprietary file names are printed/uploaded.
              python3 - "$report" <<'PY'
          import collections,re,sys
          from pathlib import Path
          raw=Path(sys.argv[1]).read_text(errors='replace')
          codes=collections.Counter(re.findall(r'\berror\s+(CS[0-9]{4}|NETSDK[0-9]{4}|NU[0-9]{4})\b',raw))
          print('T5_NATIVE_EARLY_MOUSE_ABI status=FAIL code_counts='+str(dict(sorted(codes.items()))))
          PY
              exit 1
            fi
          done
          echo 'T5_NATIVE_EARLY_MOUSE_ABI editorAndroidSource=true playerAndroidSource=true originalUnity2021ABI=true fullUnityBuild=false deviceVerified=false'
      - name: Reuse authenticated ZIP2 shader-owner cache before acquisition
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/w1-original
          key: w1-zip2-15964ea8-full-shader-owners-v1
          restore-keys: w1-zip2-15964ea8-four-owners-v1
      - name: Select only missing SHA-pinned ZIP2 owners
        id: w1_zip2_needed
        run: python3 -m scripts.w1_full_engine_sources --plan --destination "$RUNNER_TEMP/w1-original"
      - name: Read pinned ZIP2 provider without LFS
        uses: actions/checkout@v4
        with:
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: zip2-original
          filter: blob:none
          lfs: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ${{ steps.w1_zip2_needed.outputs.paths }}
            /Raft/Raft_Data/**
      - name: Authenticate ZIP2 owners and stage three original scene dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.w1_full_engine_sources --zip2-checkout zip2-original --destination "$RUNNER_TEMP/w1-original"
          python3 - <<'PY'
          import os,re,shutil,subprocess
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import fingerprint
          from scripts.w1_full_engine_sources import pins
          source=Path(os.environ['RUNNER_TEMP'])/'w1-original'
          # Preserve feature-branch pointer identity as an independent check.
          # Only these three working-tree pointers are hydrated here; Git and ZIP2 stay unchanged.
          for name in ('resources.assets','sharedassets0.assets','sharedassets36.assets'):
              relative='Raft_Data/'+name
              target=Path('Raft')/relative
              pointer=subprocess.check_output(['git','show','HEAD:'+target.as_posix()],text=True)
              sha=re.search(r'^oid sha256:([0-9a-f]{64})$',pointer,re.M)
              size=re.search(r'^size (\d+)$',pointer,re.M)
              expected=pins()[relative]
              if not sha or not size or (int(size[1]),sha[1])!=expected:
                  raise SystemExit('Feature pointer and authenticated ZIP2 provider disagree')
              original=source/relative
              if fingerprint(original)!=expected:
                  raise SystemExit('Cached ZIP2 original changed before staging')
              if target.is_symlink():
                  raise SystemExit('Unsafe original scene owner target')
              shutil.copyfile(original,target)
              if fingerprint(target)!=expected:
                  raise SystemExit('Staged original scene owner fingerprint mismatch')
              print('RAFT_NATIVE_ZIP2_SCENE_OWNER size='+str(expected[0])+' sha256Verified=true')
          PY
          df -h /
      - name: GT restore every original mesh and texture stream into AssetRipper input from ZIP2 (no LFS)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_gt_zip2_export_resources.py -v
          python3 -m unittest discover -s tests -p test_texture_stream_coverage.py -v
          python3 -m scripts.gt_zip2_export_resources \
            --zip2-checkout zip2-original \
            --input-root "$RUNNER_TEMP/input/Raft_Data" \
            --profile full \
            --byte-budget 10000000000 \
            --report "$RUNNER_TEMP/gt-native-original-graphics-input.json"
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
          python3 -m scripts.audit_texture_stream_coverage --root "$RUNNER_TEMP/input/Raft_Data"
          df -h /
      - name: Audit original compute kernel containers before any shader reconstruction
        shell: bash
        run: |
          set -euo pipefail
          # Read only the nine original ComputeShader objects already hydrated
          # and SHA-checked above. Do not publish HLSL/DXBC/serialized bytes.
          python3 -m scripts.audit_original_compute_metadata --source "$RUNNER_TEMP/input/Raft_Data" --expected-objects 9
      - name: Audit original mesh stream requirements without downloading additional LFS
        shell: bash
        run: |
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4 dnfile==0.18.0
          python3 scripts/audit_mesh_stream_dependencies.py --root "$RUNNER_TEMP/input/Raft_Data" --max-per-file 50000 --out "$RUNNER_TEMP/mesh-stream-audit.json"
      - name: GT freeze SHA-pinned original Unity input; preserve exact source owner and stream identities
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/input/Raft_Data"
          test -s "$root/Managed/Assembly-CSharp.dll"
          test ! -e "$root/Managed/PlayFab_o.dll"
          python3 -m scripts.gt_zip2_export_resources \
            --zip2-checkout zip2-original \
            --input-root "$root" \
            --profile full \
            --byte-budget 10000000000 \
            --report "$RUNNER_TEMP/gt-native-original-graphics-freeze.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'gt-native-original-graphics-freeze.json').read_text())
          assert r['original_resources_verified']==134 and r['files_verified_and_reused']==134
          assert r['git_lfs_used'] is False and r['original_payload_sha256_and_size_verified']
          print("GT_NATIVE_ORIGINAL_GRAPHICS_FINAL owners_streams_builtins_settings=134 sha256=true lfs=false")
          PY
          du -sh "$root"
      - name: Stage authenticated engine resources into the export input set
        shell: bash
        run: |
          set -euo pipefail
          # The instrumented export must load exactly the engine provider files
          # whose shaders are authenticated in w1-original; otherwise the
          # original source graph and the same-instance trace diverge.
          python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import PINS, fingerprint
          source_root=Path(os.environ['RUNNER_TEMP'])/'w1-original/Raft_Data/Resources'
          target_root=Path(os.environ['RUNNER_TEMP'])/'input/Raft_Data/Resources'
          target_root.mkdir(parents=True, exist_ok=True)
          for name in ('unity default resources','unity_builtin_extra'):
              relative='Raft_Data/Resources/'+name
              source=source_root/name
              if fingerprint(source)!=PINS[relative]:
                  raise SystemExit('Engine resource provider fingerprint mismatch')
              shutil.copyfile(source, target_root/name)
              print('RAFT_ENGINE_RESOURCE_STAGED size=%d sha256Verified=true' % PINS[relative][0])
          PY
      - name: Restore pinned Mesh ranges from full local ZIP2-authenticated streams only
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_mode == 'native') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[raft-native-build]')) }}
        shell: bash
        run: |
          set -euo pipefail
          # The full original streams exist in GT's verified transient input.
          # No GH_TOKEN or Git LFS fallback is available to this restoration.
          python3 -m scripts.fetch_verified_mesh_ranges \
            --manifest config/mesh-stream-ranges.json --source-root "$RUNNER_TEMP/input/Raft_Data" \
            --cache "$RUNNER_TEMP/verified-original-mesh-ranges"
          python3 -m scripts.inline_verified_mesh_ranges \
            --root "$RUNNER_TEMP/input/Raft_Data" --manifest config/mesh-stream-ranges.json \
            --cache "$RUNNER_TEMP/verified-original-mesh-ranges"
          python3 -m scripts.audit_original_mesh_positions --root "$RUNNER_TEMP/input/Raft_Data" --manifest config/mesh-stream-ranges.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/checkout@v4
        with:
          repository: nowl-it/AssetRipperCLI
          ref: 036098ab525a3f9f693dc101edeb21faad4d32d8
          path: ar-host
          persist-credentials: false
          sparse-checkout: Source
      - name: Build read-only instrumentation into the pinned public exporter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.patch_export_lineage --tool-source ar-host --helper android-port/Experiments/ExportLineage/RaftExportLineage.cs
          # Publish the CLI and its matching transitive assemblies together;
          # replacing one DLL cannot instrument an AOT or bundled executable.
          dotnet publish android-port/Experiments/ExportLineage/ExportLineage.csproj -c Release -p:PublishAot=false -p:PublishTrimmed=false -p:EnableTrimAnalyzer=false -p:EnableAotAnalyzer=false --self-contained false -o "$RUNNER_TEMP/ar" > "$RUNNER_TEMP/public-tool-build.log" 2>&1 || { tail -60 "$RUNNER_TEMP/public-tool-build.log"; exit 1; }
          # No original inputs are present in this smoke command; diagnostics
          # therefore contain public tool types/options only.
          dotnet "$RUNNER_TEMP/ar/ExportLineage.dll" --probe-tool > "$RUNNER_TEMP/public-tool-smoke.log" 2>&1 || { cat "$RUNNER_TEMP/public-tool-smoke.log"; exit 1; }
      - name: Export 40 scenes into a Unity Editor project with correct MonoScript metadata
        env:
          DOTNET_PROCESSOR_COUNT: '2'
          RAFT_PRIVATE_EXPORT_LINEAGE: ${{ runner.temp }}/private-export-lineage.json
          # GT needs exact ClassID187 source→export pointers from this SAME
          # run. Private JSON stays on the runner, never in Actions artifacts.
          RAFT_PRIVATE_EXPORT_TEXTURE_LINEAGE: '1'
        shell: bash
        run: |
          set -euo pipefail
          timeout 1200s dotnet "$RUNNER_TEMP/ar/ExportLineage.dll" "$RUNNER_TEMP/input" "$RUNNER_TEMP/project" --full-install > "$RUNNER_TEMP/export.log" 2>&1 || {
            python3 - <<'PYDIAG'
          import os,re,json
          from pathlib import Path
          text=(Path(os.environ['RUNNER_TEMP'])/'export.log').read_text(errors='replace')
          # Keep original filenames/names and all log text private.
          report={'export_completed':False,'exception_types':sorted(set(re.findall(r'\b(?:System|AssetRipper)\.[A-Za-z.]+Exception\b',text))),
                  'has_missing_assembly': 'Could not load file or assembly' in text,
                  'argument_error': bool(re.search(r'unknown argument|unexpected argument|missing value|requires a value', text, re.I)),
                  'loading_started':'Processing loaded assets' in text,'export_started':'Starting export' in text,
                  'log_bytes':len(text.encode()),'trace_created':(Path(os.environ['RUNNER_TEMP'])/'private-export-lineage.json').exists()}
          print('RAFT_EXPORT_FAILURE '+json.dumps(report,sort_keys=True))
          PYDIAG
            exit 1
          }
          test -s "$RUNNER_TEMP/private-export-lineage.json"
          python3 -m scripts.verify_assetripper_script_import --log "$RUNNER_TEMP/export.log"
          test -d "$RUNNER_TEMP/project/ExportedProject/Assets"
          test -d "$RUNNER_TEMP/project/ExportedProject/ProjectSettings"
          df -h /
      - name: GT restore nine original Texture2DArray importer grids before every native Material/Shader link gate
        id: gt_native_original_texture_arrays
        shell: bash
        run: |
          set -euo pipefail
          # Same-instance original ClassID187 source→AssetRipper GUID provenance,
          # exact 1024px source layer atlas grid and full PNG decode. No fake
          # Texture2D fileID, imported pixels, source .meta or original GUIDs.
          # Mesh inlining rewrites serialized owners in the export input.
          # Authenticate ClassID187 against the pristine ZIP2 owners.
          original_owners="$RUNNER_TEMP/gt-native-pristine-serialized-owners"
          python3 -m scripts.gt_stage_serialized_owners \
            --source zip2-original/Raft/Raft_Data \
            --manifest zip2-original/RAFT_FILE_MANIFEST.tsv \
            --destination "$original_owners" \
            --report "$RUNNER_TEMP/gt-native-pristine-serialized-owners.json"
          python3 -m scripts.gt_repair_array_flipbook_importers \
            --original-source "$original_owners" \
            --manifest zip2-original/RAFT_FILE_MANIFEST.tsv \
            --trace "$RUNNER_TEMP/private-export-lineage.json" \
            --project "$RUNNER_TEMP/project/ExportedProject" \
            --backup "$RUNNER_TEMP/gt-native-original-array-meta-backup" \
            --report "$RUNNER_TEMP/gt-native-original-array-importer-repair.json"
          # Reject any output except nine source-proven repaired array grids.
          python3 -m scripts.gt_verify_original_array_material_refs \
            --original-source "$original_owners" \
            --manifest zip2-original/RAFT_FILE_MANIFEST.tsv \
            --trace "$RUNNER_TEMP/private-export-lineage.json" \
            --project "$RUNNER_TEMP/project/ExportedProject" \
            --report "$RUNNER_TEMP/gt-native-original-array-material-links.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          fix=json.loads((root/'gt-native-original-array-importer-repair.json').read_text())
          refs=json.loads((root/'gt-native-original-array-material-links.json').read_text())
          assert fix['status']=='ALL_NINE_ARRAY_IMPORTERS_VALID', 'original_array_importers_not_source_verified'
          assert fix['all_nine_original_array_importers_accepted'] is True
          assert fix['original_exported_asset_guids_preserved'] is True
          assert fix['source_images_or_binaries_edited'] is False
          assert fix['meta_files_outside_the_exactly_verified_array_set_changed']==0
          assert refs['full_array_material_importer_links_verified'] is True
          assert refs['exact_original_class187_array_material_refs']==28
          assert refs['distinct_source_array_guids_referenced_by_materials']==9
          print('GT_NATIVE_ORIGINAL_ARRAY_IMPORT_GRIDS sourceOwners=82 arrays=9 gridVerified=9 exactMaterialRefs=28 guidPreserved=true sourcePixelsUntouched=true LFS=false editorImportNotYetVerified=true')
          PY
          # Private GUID/depth/mip manifest is copied into unity-candidate and
          # consumed by AndroidNativeBuild.ValidateSdkBindings in Unity Editor.
          # This does not run Unity yet or publish a source file/GUID.
          python3 -m scripts.gt_write_unity_array_import_contract \
            --original-source "$original_owners" \
            --manifest zip2-original/RAFT_FILE_MANIFEST.tsv \
            --trace "$RUNNER_TEMP/private-export-lineage.json" \
            --project "$RUNNER_TEMP/project/ExportedProject" \
