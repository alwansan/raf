name: Raft gated Unity 2021 Android import + compile (requires license secrets)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Validate SDK bindings first, or request native ARM64 build
        type: choice
        options: [sdk-bindings, native]
        default: sdk-bindings
  push:
    branches:
      - feature/android-native-port
    paths:
      - '.github/workflows/raft-unity-editor-android-import.yml'
      - 'scripts/overlay_ilspy_gameplay.py'
      - 'scripts/supplement_ilspy_gameplay.py'
      - 'tests/test_supplement_ilspy_gameplay.py'
      - 'tests/test_csharp_overlay.py'
      - 'android-port/Editor/**'
      - 'scripts/build_sdk_script_manifest.py'
      - 'scripts/resolve_managed_closure.py'
      - 'scripts/isolate_sdk_source_assemblies.py'
      - 'tests/test_build_sdk_script_manifest.py'
      - 'tests/test_resolve_managed_closure.py'
      - 'tests/test_isolate_sdk_source_assemblies.py'
      - 'scripts/repair_asset_case_collisions.py'
      - 'tests/test_repair_asset_case_collisions.py'
      - 'scripts/adapt_unity_url_codecs.py'
      - 'tests/test_adapt_unity_url_codecs.py'
      - 'scripts/stage_raft_managed_dlls.py'
      - 'tests/test_stage_raft_managed_dlls.py'
      - 'scripts/rename_conflicting_sdk_asmdefs.py'
      - 'tests/test_sdk_asmdef_rename.py'
      - 'scripts/add_unity_packages.py'
      - 'tests/test_add_unity_packages.py'

concurrency:
  group: raft-unity-editor-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unity-license-preflight:
    environment: UNITY_LICENSE
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check whether Unity activation is available without exposing secrets
        id: check
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ] && { [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; }; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Unity activation secrets found; attempting private project import and Android build."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Unity activation unavailable; will not download LFS or Docker image."
            echo 'Unity Editor license setup is a genuine remaining prerequisite.' >> "$GITHUB_STEP_SUMMARY"
          fi

  reconstruct:
    needs: unity-license-preflight
    environment: UNITY_LICENSE
    if: ${{ needs.unity-license-preflight.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Disk safety gate before dependencies / LFS download
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free_kb=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          test "$free_kb" -gt 26214400
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
          persist-credentials: true
      - name: Run synthetic code-overlay tests before touching original data
        run: |
          python3 -m unittest discover -s tests -p test_csharp_overlay.py -v
          python3 -m unittest discover -s tests -p test_supplement_ilspy_gameplay.py -v
          python3 -m unittest discover -s tests -p test_repair_assetripper_stubs.py -v
          python3 -m unittest discover -s tests -p test_stage_raft_managed_dlls.py -v
          python3 -m unittest discover -s tests -p test_resolve_managed_closure.py -v
          python3 -m unittest discover -s tests -p test_build_sdk_script_manifest.py -v
          python3 -m unittest discover -s tests -p test_exported_font_materials.py -v
          python3 -m unittest discover -s tests -p test_isolate_sdk_source_assemblies.py -v
          python3 -m unittest discover -s tests -p test_mesh_range_manifest.py -v
          python3 -m unittest discover -s tests -p test_verified_mesh_ranges.py -v
          python3 -m unittest discover -s tests -p test_inline_mesh_ranges.py -v
          python3 -m unittest discover -s tests -p test_original_mesh_positions.py -v
          python3 -m unittest discover -s tests -p test_scene_stream_restoration.py -v
          python3 -m unittest discover -s tests -p test_exported_font_materials.py -v
          python3 -m unittest discover -s tests -p test_recover_empty_ilspy_sources.py -v
      - name: Validate original CLR providers before any LFS transfer
        run: |
          python3 -m unittest discover -s tests -p test_export_managed_providers.py -v
          python3 -m unittest discover -s tests -p test_assetripper_script_import.py -v
          python3 -m pip install --user --disable-pip-version-check dnfile==0.18.0
          python3 -m scripts.stage_export_managed_providers \
            --source "$GITHUB_WORKSPACE/Raft/Raft_Data/Managed" \
            --destination "$RUNNER_TEMP/input/Raft_Data/Managed"
      - name: Download exactly 3 selected scene dependency LFS objects
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs fetch origin HEAD \
            --include='Raft/Raft_Data/resources.assets,Raft/Raft_Data/sharedassets0.assets,Raft/Raft_Data/sharedassets36.assets' \
            --exclude=''
          git lfs checkout
          python3 - <<'PY'
          import hashlib,subprocess,re
          from pathlib import Path
          expected={
              'Raft/Raft_Data/resources.assets':111533516,
              'Raft/Raft_Data/sharedassets0.assets':115978112,
              'Raft/Raft_Data/sharedassets36.assets':110149324,
          }
          for name,size in expected.items():
              p=Path(name)
              if p.stat().st_size!=size:raise SystemExit("Unexpected LFS object size: "+name)
              pointer=subprocess.check_output(["git","show","HEAD:"+name],text=True)
              m=re.search(r'^oid sha256:([0-9a-f]{64})$',pointer,re.M)
              if not m:raise SystemExit("Missing LFS pointer SHA256 for "+name)
              with p.open("rb") as f:digest=hashlib.file_digest(f,"sha256").hexdigest()
              if digest!=m.group(1):raise SystemExit("SHA256 mismatch for "+name)
              print("Verified selected LFS asset:",p.name,p.stat().st_size)
          PY
          df -h /
      - name: Restore two verified collider streams only for an intentional native experiment
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_mode == 'native') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[raft-native-build]')) }}
        shell: bash
        run: |
          set -euo pipefail
          git lfs fetch origin HEAD --include='Raft/Raft_Data/sharedassets29.assets.resS,Raft/Raft_Data/sharedassets24.assets.resS' --exclude=''
          git lfs checkout Raft/Raft_Data/sharedassets29.assets.resS Raft/Raft_Data/sharedassets24.assets.resS
          python3 - <<'PY'
          import hashlib, re, subprocess
          from pathlib import Path
          expected={'sharedassets29.assets.resS':295782704, 'sharedassets24.assets.resS':301743760}
          for stream,declared in expected.items():
              name='Raft/Raft_Data/'+stream
              path=Path(name)
              pointer=subprocess.check_output(['git','show','HEAD:'+name], text=True)
              oid=re.search(r'(?m)^oid sha256:([0-9a-f]{64})$', pointer)
              size=re.search(r'(?m)^size (\d+)$', pointer)
              if not oid or not size or int(size.group(1))!=declared:
                  raise SystemExit('Unexpected collider stream pointer identity')
              if path.stat().st_size!=declared:
                  raise SystemExit('Collider stream size mismatch')
              with path.open('rb') as source:
                  digest=hashlib.file_digest(source, 'sha256').hexdigest()
              if digest!=oid.group(1):
                  raise SystemExit('Collider stream SHA256 mismatch')
              print('RAFT_RECOVERED_COLLIDER_SOURCE verifiedBytes='+str(declared)+' source='+stream)
          PY
      - name: Audit original mesh stream requirements without downloading additional LFS
        shell: bash
        run: |
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4 dnfile==0.18.0
          python3 scripts/audit_mesh_stream_dependencies.py --root Raft/Raft_Data --max-per-file 50000 --out "$RUNNER_TEMP/mesh-stream-audit.json"
      - name: Stage selected Unity game files only, never execute Windows binaries
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/input/Raft_Data"
          mkdir -p "$root/Managed"
          test -f "$root/Managed/Assembly-CSharp.dll"
          test ! -e "$root/Managed/PlayFab_o.dll"
          cp Raft/Raft_Data/boot.config "$root/"
          shopt -s nullglob
          count=0
          for src in Raft/Raft_Data/globalgamemanagers Raft/Raft_Data/globalgamemanagers.assets* Raft/Raft_Data/resources.assets* Raft/Raft_Data/sharedassets*.assets* Raft/Raft_Data/level*; do
            [ -f "$src" ] || continue
            if head -c 48 "$src" | grep -q '^version https://git-lfs.github.com/spec/v1'; then continue; fi
            cp "$src" "$root/"
            count=$((count+1))
          done
          echo "Source serialized files staged: $count"
          test "$count" -gt 110
          du -sh "$root"
      - name: Restore every pinned external Mesh buffer while retaining original serialized identities
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_mode == 'native') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[raft-native-build]')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.fetch_verified_mesh_ranges \
            --manifest config/mesh-stream-ranges.json --source-root "$GITHUB_WORKSPACE/Raft/Raft_Data" \
            --cache "$RUNNER_TEMP/verified-original-mesh-ranges"
          python3 -m scripts.inline_verified_mesh_ranges \
            --root "$RUNNER_TEMP/input/Raft_Data" --manifest config/mesh-stream-ranges.json \
            --cache "$RUNNER_TEMP/verified-original-mesh-ranges"
          python3 -m scripts.audit_original_mesh_positions --root "$RUNNER_TEMP/input/Raft_Data" --manifest config/mesh-stream-ranges.json
      - name: Obtain SHA256-pinned AssetRipperCLI v1.0.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 --max-time 240 \
            'https://github.com/nowl-it/AssetRipperCLI/releases/download/v1.0.1/AssetRipper_linux_x64.zip' \
            -o "$RUNNER_TEMP/assetripper.zip"
          echo "b48292e40948ce2634e9187d4724fb4f45c01fa6f4fea2a5f4775aa611def17b  $RUNNER_TEMP/assetripper.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ar"
          unzip -q "$RUNNER_TEMP/assetripper.zip" -d "$RUNNER_TEMP/ar"
          chmod +x "$RUNNER_TEMP/ar/AssetRipper.GUI.Free"
          python3 -m scripts.configure_assetripper_export --directory "$RUNNER_TEMP/ar"
      - name: Export 40 scenes into a Unity Editor project with correct MonoScript metadata
        env:
          DOTNET_PROCESSOR_COUNT: '2'
        shell: bash
        run: |
          set -euo pipefail
          timeout 1200s "$RUNNER_TEMP/ar/AssetRipper.GUI.Free" \
            --cli --input "$RUNNER_TEMP/input" \
            --output "$RUNNER_TEMP/project" --mode unity \
            --script-content-level Level1 --ignore-streaming-assets \
            > "$RUNNER_TEMP/export.log" 2>&1
          python3 -m scripts.verify_assetripper_script_import --log "$RUNNER_TEMP/export.log"
          test -d "$RUNNER_TEMP/project/ExportedProject/Assets"
          test -d "$RUNNER_TEMP/project/ExportedProject/ProjectSettings"
          df -h /
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install ILSpyCmd 11.2.0.10050
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install ilspycmd --version 11.2.0.10050 --tool-path "$RUNNER_TEMP/ilspy"
      - name: Decompile gameplay source to private ephemeral temp directory
        env:
          DOTNET_PROCESSOR_COUNT: '2'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ilspy-src"
          timeout 360s "$RUNNER_TEMP/ilspy/ilspycmd" \
            -p -lv CSharp9_0 -o "$RUNNER_TEMP/ilspy-src" \
            "$GITHUB_WORKSPACE/Raft/Raft_Data/Managed/Assembly-CSharp.dll" \
            > "$RUNNER_TEMP/ilspy.log" 2>&1
          python3 -m scripts.recover_empty_ilspy_sources \
            --root "$RUNNER_TEMP/ilspy-src" \
            --assembly "$GITHUB_WORKSPACE/Raft/Raft_Data/Managed/Assembly-CSharp.dll" \
            --ilspy "$RUNNER_TEMP/ilspy/ilspycmd"
      - name: Record original SDK type identities before template repairs
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p test_build_sdk_script_manifest.py -v
          python3 -m scripts.build_sdk_script_manifest --project "$RUNNER_TEMP/project/ExportedProject" --managed "$GITHUB_WORKSPACE/Raft/Raft_Data/Managed" --out "$RUNNER_TEMP/project/ExportedProject/Assets/Editor/RaftAndroid/sdk-script-manifest.json"
          python3 -m scripts.audit_exported_font_materials \
            --project "$RUNNER_TEMP/project/ExportedProject" \
            --manifest "$RUNNER_TEMP/project/ExportedProject/Assets/Editor/RaftAndroid/sdk-script-manifest.json" --require-valid --expected-fonts 13
      - name: Overlay uniquely identified real CSharp gameplay into Unity project
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/overlay_ilspy_gameplay.py \
            --project "$RUNNER_TEMP/project/ExportedProject" \
            --ilspy "$RUNNER_TEMP/ilspy-src" \
            --report "$RUNNER_TEMP/overlay-report.json" \
            --recover-unqualified-stubs --recover-unlinked-decompiled --apply
      - name: Recover CSharp helper types absent from AssetRipper MonoScript output
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_supplement_ilspy_gameplay.py -v
          python3 scripts/supplement_ilspy_gameplay.py \
            --project "$RUNNER_TEMP/project/ExportedProject" \
            --ilspy "$RUNNER_TEMP/ilspy-src" \
            --report "$RUNNER_TEMP/ilspy-supplement.json" \
            --coverage-mode decompiled --min-original-sources 2393 --apply
      - name: Restore twenty-one original compile-time DLLs without platform-provided UI/TMP/InputSystem assemblies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_stage_raft_managed_dlls.py -v
          python3 -m unittest discover -s tests -p test_resolve_managed_closure.py -v
          python3 -m scripts.resolve_managed_closure --managed "$GITHUB_WORKSPACE/Raft/Raft_Data/Managed" --sdk-manifest "$RUNNER_TEMP/project/ExportedProject/Assets/Editor/RaftAndroid/sdk-script-manifest.json" --out "$RUNNER_TEMP/sdk-dependency-plan.json"
          python3 scripts/stage_raft_managed_dlls.py \
            --managed "$GITHUB_WORKSPACE/Raft/Raft_Data/Managed" \
            --project "$RUNNER_TEMP/project/ExportedProject" \
            --report "$RUNNER_TEMP/managed-refs.json" --plan "$RUNNER_TEMP/sdk-dependency-plan.json" --apply
      - name: Restore Unity 2021 UGUI and TextMeshPro packages in temporary project
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_add_unity_packages.py -v
          python3 scripts/add_unity_packages.py --project "$RUNNER_TEMP/project/ExportedProject" --apply
      - name: Resolve AssetRipper SDK asmdef name collisions without touching GUIDs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_sdk_asmdef_rename.py -v
          python3 scripts/rename_conflicting_sdk_asmdefs.py --project "$RUNNER_TEMP/project/ExportedProject" --apply
      - name: Adapt original URL form codecs to Unity .NET Standard
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p test_adapt_unity_url_codecs.py -v
          python3 scripts/adapt_unity_url_codecs.py --project "$RUNNER_TEMP/project/ExportedProject" --apply
      - name: Keep generated SDK source templates out of the Android player
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p test_isolate_sdk_source_assemblies.py -v
          python3 scripts/isolate_sdk_source_assemblies.py --project "$RUNNER_TEMP/project/ExportedProject" --manifest "$RUNNER_TEMP/project/ExportedProject/Assets/Editor/RaftAndroid/sdk-script-manifest.json" --apply --disable-template-compilation
      - name: Downgrade ILSpy CSharp 10 file-scoped namespaces to Unity 2021 CSharp 9
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p test_csharp_namespace_compat.py -v
          python3 scripts/normalize_csharp_namespaces.py \
            --root "$RUNNER_TEMP/project/ExportedProject/Assets" \
            --apply --require-clean
      - name: Audit real Decompiled SDK scripts; repair only synthetic invalid AssetRipper stubs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_repair_assetripper_stubs.py -v
          python3 scripts/repair_assetripper_stub_classnames.py \
            --assets "$RUNNER_TEMP/project/ExportedProject/Assets" \
            --apply --require-clean --repair-timeline
      - name: Repair exported asset case collisions while preserving GUID metadata
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p test_repair_asset_case_collisions.py -v
          python3 scripts/repair_asset_case_collisions.py --project "$RUNNER_TEMP/project/ExportedProject" --apply
      - name: Stage native ARM64 build entry point without changing original scenes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/project/ExportedProject/Assets/Editor/RaftAndroid"
          cp android-port/Editor/*.cs "$RUNNER_TEMP/project/ExportedProject/Assets/Editor/RaftAndroid/"
      - name: Validate reconstructed editor project structure and GUID references
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re,json,collections
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"project/ExportedProject"
          scenes=list(root.rglob("*.unity"))
          source=list(root.rglob("*.cs"))
          metas=list(root.rglob("*.cs.meta"))
          expected_script_guids=set()
          for f in metas:
              m=re.search(r"(?m)^guid:\s*([0-9a-fA-F]{32})",f.read_text(errors="replace")[:500])
              if m:expected_script_guids.add(m.group(1).lower())
          refs=[]
          unknown_guid=collections.Counter()
          for f in scenes:
              payload=f.read_text(errors="replace")
              refs+=re.findall(r"m_Script:\s*\{[^\n}]*guid:\s*([a-fA-F0-9]{32})",payload)
              unknown_guid.update(x.lower() for x in re.findall(r"guid:\s*([a-fA-F0-9]{32})",payload) if x.lower()=="0000000deadbeef15deadf00d0000000")
          linked=sum(g.lower() in expected_script_guids for g in refs)
          overlay=json.loads((Path(os.environ["RUNNER_TEMP"])/"overlay-report.json").read_text())
          exts=collections.Counter(p.suffix for p in root.rglob("*") if p.is_file())
          manifest=root/"Packages/manifest.json"
          manifest_data=json.loads(manifest.read_text()) if manifest.exists() else {}
          print("Editor project scenes:",len(scenes))
          print("Editor project CSharp files:",len(source))
          print("Editor project CSharp metas:",len(metas))
          print("Scene script GUID matched:",linked,"/",len(refs))
          print("Other deadbeef GUID sentinel uses:",sum(unknown_guid.values()))
          print("ILSpy CSharp gameplay class overlays:",overlay["replacements"])
          print("ILSpy namespace mismatch rejects:",overlay["namespace_mismatches"])
          print("Unity source asset suffix counts:",dict(exts.most_common(14)))
          print("Project package dependency names:",sorted(manifest_data.get("dependencies",{}))[:50])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Integrated Unity project candidate (NO Unity Editor import yet)\n")
              f.write(f"- Unity scenes: {len(scenes)}; CSharp files: {len(source)}; CSharp metas: {len(metas)}\n")
              f.write(f"- Script refs linked: {linked}/{len(refs)}; deadbeef sentinels: {sum(unknown_guid.values())}\n")
              f.write(f"- Gameplay source overlays: {overlay['replacements']}; namespace rejects: {overlay['namespace_mismatches']}\n")
              f.write(f"- Project package dependency names: {sorted(manifest_data.get('dependencies',{}))[:30]}\n")
              f.write("No generated game source, original assets or APK published. Compilation / runtime / stream content remains unverified.\n")
          if len(scenes)!=40 or not refs or linked!=len(refs):raise SystemExit("Unity scene or script linkage regression")
          if sum(unknown_guid.values())!=0:raise SystemExit("Unresolved Unity scene GUID references remain")
          if overlay["replacements"]<1500:raise SystemExit("Insufficient ILSpy source integration")
          if not manifest.exists():raise SystemExit("Missing Unity Packages manifest")
          PY

      - name: Stage private Unity project candidate inside runner workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/unity-candidate"
          cp -a "$RUNNER_TEMP/project/ExportedProject/." "$GITHUB_WORKSPACE/unity-candidate/"
          du -sh "$GITHUB_WORKSPACE/unity-candidate"
          df -h /
      - name: Unity Editor 2021.3.45f2 Android import and compile
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f2
          projectPath: unity-candidate
          targetPlatform: Android
          # Pushes use SDK validation unless an intentional [raft-native-build] commit requests one native run.
          # workflow_dispatch also supports its explicit build_mode=native choice.
          buildMethod: ${{ ((github.event_name == 'workflow_dispatch' && inputs.build_mode == 'native') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[raft-native-build]'))) && 'RaftAndroid.Editor.AndroidNativeBuild.Build' || 'RaftAndroid.Editor.AndroidNativeBuild.ValidateSdkBindings' }}
          androidExportType: androidPackage
          buildName: RaftAndroidExperimental
          buildsPath: builds
          # This workflow reconstructs a Unity project in the workspace after checkout.
          # Those generated files are intentionally not committed, so Semantic versioning
          # rejects the build as a dirty git branch before Unity Editor starts.
          versioning: None
          androidVersionCode: 1
      - name: Audit private native APK payload and ARM64 IL2CPP structure
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_mode == 'native') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[raft-native-build]')) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_android_apk_audit.py -v
          python3 scripts/audit_android_apk.py \
            --apk "$GITHUB_WORKSPACE/builds/Android/RaftAndroidExperimental.apk" \
            --report "$RUNNER_TEMP/private-android-apk-audit.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"private-android-apk-audit.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## Native APK structure (not gameplay verification)\n")
              for name in ("apk_bytes","zip_members","unity_data_files","unity_data_uncompressed_bytes","abis","arm64_il2cpp","fmod_native_library_present","apk_sha256"):
                  out.write(f"- {name}: {d[name]}\n")
              out.write("APK kept private on disposable CI runner; no source/game assets uploaded. Signature/install/gameplay still unverified.\n")
          PY
      - name: If CI reaches here, report without releasing original game APK
        run: |
          echo 'Unity validation completed. Review RAFT_SDK_VALIDATION_COMPLETE versus RAFT_ANDROID_NATIVE_RESULT; SDK-only mode does not build an APK.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No copyrighted game APK or source asset was uploaded or published by this workflow.' >> "$GITHUB_STEP_SUMMARY"
