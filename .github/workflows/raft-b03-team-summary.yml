name: B03 original Renderer evidence summary checkpoint (source only)
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-b03-team-summary.yml'
      - 'prompt/coordination/B_TEAM/events/B03/**'
permissions:
  contents: write
concurrency:
  group: raft-b48-team-summary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regenerate-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/android-native-port
          persist-credentials: true
          lfs: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/refresh_b_team.py
            prompt/coordination/B_TEAM
      - name: Run canonical B-team generator on latest branch without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'raft-b03-evidence-checkpoint'
          git config user.email 'raft-b03-evidence-checkpoint@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch -q --no-tags origin feature/android-native-port
            git reset --hard -q FETCH_HEAD
            python3 scripts/refresh_b_team.py
            git add -- prompt/coordination/B_TEAM/SUMMARY.md prompt/coordination/B_TEAM/snapshot.json
            if git diff --cached --quiet; then
              echo 'B03_TEAM_EVIDENCE current=true'
              exit 0
            fi
            git commit -q -m 'coord(B03): refresh canonical evidence from current issue/resource/event records'
            if git push --quiet origin HEAD:feature/android-native-port; then
              echo 'B03_TEAM_EVIDENCE refreshed=true fast_forward=true'
              exit 0
            fi
            echo 'B03_TEAM_EVIDENCE concurrent_head; retry with current branch'
            sleep 1
          done
          echo 'B03_TEAM_EVIDENCE refused force due concurrent writers' >&2
          exit 1
