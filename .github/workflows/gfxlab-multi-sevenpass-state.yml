name: GFX-MULTI-026S authentic Shader48 seven-pass state metadata audit / no APK
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths: ['.github/workflows/gfxlab-multi-sevenpass-state.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfxlab-multi026s-sevenpass-state
  cancel-in-progress: false
jobs:
  original-render-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            gfxlab/tools
            gfxlab/tests
      # GFX-MULTI-026S retry: sparse source-only suite skips Unity-only asset contract tests.
      - name: Source-free regression tests
        run: |
          set -euo pipefail
          python3 -m py_compile gfxlab/tools/multi_sevenpass_renderstate_audit.py
          python3 -m unittest discover -s gfxlab/tests -p 'test_*.py' -v
      - uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: source-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/resources.assets/*
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/sharedassets6.assets
      - name: Census authentic original Shader48 pass state metadata
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
          python3 -m gfxlab.tools.multi_sevenpass_renderstate_audit \
            --zip2 source-zip2 --stage "$RUNNER_TEMP/gfxlab-multi026s-private" \
            --out "$RUNNER_TEMP/gfxlab-multi026s-safe.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"gfxlab-multi026s-safe.json").read_text())
          assert d["experiment"]=="GFX-MULTI-026S"
          assert d["source_sha"]=="15964ea8f246b6e076ce26b60931ee2e1a9a2385"
          assert d["source_models"]==6 and d["shader_identities"]==1
          assert d["original_subshaders"]==2 and d["original_pass_count"]==7
          assert d["original_material_state_presence"]["material_slots"]==7
          assert not d["render_state_numeric_values_exported"]
          assert not d["material_keywords_or_property_names_exported"]
          assert not d["original_shader48_source_code_exported"]
          assert not d["source_material_to_register_mapping_verified"]
          assert not d["original_android_shader_restored"]
          assert not d["android_gpu_pixels_verified"]
          assert not d["phase_closed"]
          print("GFX_MULTI026S_SOURCE_PASS_COUNTS="+str(d["original_pass_count"]))
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gfxlab-multi026s-source-pass-renderstate-counts
          path: ${{ runner.temp }}/gfxlab-multi026s-safe.json
          retention-days: 7
          if-no-files-found: error
      - name: Purge original private Shader and Material source assets
        if: always()
        run: |
          sudo rm -rf source-zip2 "$RUNNER_TEMP/gfxlab-multi026s-private"
          echo GFX_MULTI026S_PRIVATE_ORIGINAL_SOURCE_PURGED=true
