name: T2 WATER-001 genuine Foam nonproperty texture names to original managed IL literal contexts
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/t2_foam_managed_literal_targets.py
      - tests/test_t2_foam_managed_literal_targets.py
      - android-port/Experiments/T2/FoamRuntimeStringBridge/**
      - .github/workflows/raft-t2-foam-managed-literals.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t2-foam-original-managed-literals-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  source-authentic-original-foam-managed-IL:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
      - name: Source-only negative controls for private original four-name target registry
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t2_foam_managed_literal_targets.py
          python3 -m unittest discover -s tests -p 'test_t2_foam_managed_literal_targets.py' -v
      - name: Establish source-only disk budget
        run: |
          python3 - <<'PY'
          import shutil
          assert shutil.disk_usage('.').free > 3*1024**3
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Compile pinned Mono.Cecil typed IL literal and setter-context oracle
        run: |
          set -euo pipefail
          timeout 240s dotnet publish \
            android-port/Experiments/T2/FoamRuntimeStringBridge/FoamRuntimeStringBridge.csproj \
            -c Release --self-contained false -o "$RUNNER_TEMP/t2-foam-cecil" \
            > "$RUNNER_TEMP/t2-foam-cecil-build.log" 2>&1 || {
              python3 - <<'PY'
          import re,os,json,collections
          from pathlib import Path
          log=(Path(os.environ['RUNNER_TEMP'])/'t2-foam-cecil-build.log').read_text(errors='replace')
          codes=dict(collections.Counter(re.findall(r'error\s+((?:CS|NU|NETSDK)[0-9]+)',log)))
          # Source-only T2 compiler diagnostics; never emit proprietary ZIP2 source.
          locs=re.findall(r'(FoamByrefAllocationFlow\.cs|Program\.cs)\((\d+),(\d+)\):\s+error\s+(CS\d+)',log)
          safe=[{'file':name,'line':int(line),'column':int(col),'code':code}
                for name,line,col,code in locs[:16]]
          print('T2_FOAM_CECIL_BUILD_BLOCKED '+json.dumps({
              'public_diagnostic_codes':codes,
              't2_owned_source_error_locations':safe,
              'private_compiler_text_published':False
          }))
          PY
              exit 1
            }
          test -s "$RUNNER_TEMP/t2-foam-cecil/FoamRuntimeStringBridge.dll"
          dotnet "$RUNNER_TEMP/t2-foam-cecil/FoamRuntimeStringBridge.dll" --selftest
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: t2-foam-managed-zip2
          lfs: false
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/Managed/Assembly-CSharp.dll
      - name: SHA-authenticate immutable original Foam source and managed assembly
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess,hashlib
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import ZIP2_SHA,PINS,stage
          repo=Path('t2-foam-managed-zip2')
          assert subprocess.check_output(['git','-C',str(repo),'rev-parse','HEAD'],text=True).strip()==ZIP2_SHA
          target=Path(os.environ['RUNNER_TEMP'])/'t2-foam-managed-source'
          a=stage(repo,target,{'Raft_Data/sharedassets0.assets':PINS['Raft_Data/sharedassets0.assets']})
          assert a['verified_bytes']==115978112 and a['lfs_used'] is False
          dll=repo/'Raft/Raft_Data/Managed/Assembly-CSharp.dll'
          assert dll.is_file() and not dll.is_symlink() and dll.stat().st_size==3211776
          assert hashlib.sha256(dll.read_bytes()).hexdigest()=='0a6f0527856a9ce538d8d4217358b467c58fdcfad95e0ebebf9588c48f24f72e'
          print('T2_FOAM_ORIGINAL_MANAGED_SOURCE exact_zip2_SHA=true original_Foam_owner_bytes=115978112 original_managed_Dll_bytes=3211776')
          PY
      - name: Prepare private hashed Foam texture-name search targets without source symbols
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4 -q
          timeout 150s python3 -m scripts.t2_foam_managed_literal_targets \
            --source "$RUNNER_TEMP/t2-foam-managed-source" \
            --out "$RUNNER_TEMP/t2-private-source-name-hashes.json"
      - name: Inspect original compiled managed ldstr and typed Texture setter contexts; only numeric safe report
        run: |
          set -euo pipefail
          timeout 150s dotnet "$RUNNER_TEMP/t2-foam-cecil/FoamRuntimeStringBridge.dll" \
            "t2-foam-managed-zip2/Raft/Raft_Data/Managed/Assembly-CSharp.dll" \
            "$RUNNER_TEMP/t2-private-source-name-hashes.json" \
            "$RUNNER_TEMP/t2-foam-managed-literals-safe.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'t2-foam-managed-literals-safe.json').read_text())
          assert r['status']=='original_foam_compiled_managed_literal_contexts_scanned'
          assert r['original_dll_sha256_authenticated'] and r['original_dll_size_bytes']==3211776
          assert r['source_original_non_authored_tex_names']==4 and r['source_original_authored_tex_names']==1
          assert r['distinct_non_authored_source_names_seen_as_ldstr']==4
          assert r['distinct_authored_source_names_seen_as_ldstr']==1
          assert r['distinct_non_authored_source_names_proven_as_exact_typed_settexture_first_argument']==4
          assert r['non_authored_exact_name_arg_literal_occurrences']==4
          assert r['non_authored_exact_settexture_first_args_material']==4
          assert r['non_authored_exact_settexture_first_args_material_property_block']==0
          assert r['non_authored_exact_name_via_propertytoid']==0
          assert r['non_authored_exact_name_via_direct_string']==4
          assert r['original_four_non_authored_names_exact_setter_name_arg_proven'] is True
          assert r['non_authored_exact_second_arg_opcode_origin_histogram']=={'call_return':4}
          assert r['non_authored_exact_second_formal_is_UnityEngine_Texture_count']==4
          assert r['second_argument_origin_label_is_actual_texture_instance_proof'] is False
          assert r['non_authored_second_producer_distinct_compiled_private_method_signatures']==1
          assert r['non_authored_second_producer_compiled_signature_exact_original_method_definition_matches']==4
          assert r['non_authored_second_producer_exact_original_method_definitions_with_body']==4
          assert r['non_authored_second_producer_missing_or_ambiguous_original_definitions']==0
          assert r['non_authored_second_producer_parameter_declared_type_categories']=={'system_int32':4}
          o=r['non_authored_second_Texture_int_actual_index_argument_origin_histogram']
          allowed={'direct_ldc_i4_literal','numeric_not_proven_int32_literal',
                   'argument_load','static_field_load','instance_field_load',
                   'call_return','unknown'}
          assert set(o).issubset(allowed) and sum(o.values())==4
          assert all(type(v) is int and v>=0 for v in o.values())
          assert o=={'direct_ldc_i4_literal':4}
          assert r['non_authored_actual_i4_index_values_decoded_count']==4
          d=r['non_authored_actual_i4_index_values_distinct_count']
          assert type(d) is int and 1 <= d <= 4
          assert type(r['non_authored_actual_i4_index_values_all_nonnegative']) is bool
          assert r['original_RenderTexture_array_runtime_length_or_element_validity_verified'] is False
          assert r['private_original_i4_index_values_or_digests_disclosed'] is False
          # Presence of raw private integer lists or a reversible small-domain
          # digest in safe-report JSON is prohibited.
          forbidden={'original_i4_index_values','private_original_i4_values',
                     'original_i4_index_digest_sha256'}
          assert not forbidden.intersection(r)
          b=r['original_exact_Texture_int_producer_body_op_classes']
          assert r['original_exact_Texture_int_producer_body_accepted_same_SHA_definition']
          assert b['InstructionCount']==10 and b['Branches']==1 and b['ReturnInstructions']==2
          assert b['IndexedReferenceLoads']==1 and b['Calls']==0
          assert b['OriginalInstanceFieldTypeCategories']=={'unity_rendertexture_array':2}
          assert b['ExactNullGuardedOriginalTextureArrayIndexByInt'] is True
          assert b['OriginalFallbackReturnsNull'] is True
          assert b['SafeClassification']=='exact_original_null_guarded_Texture_array_index_by_int'
          w=r['original_exact_Texture_int_backing_field_writer_op_classes']
          assert w is not None and w['ExactOriginalGetterFieldIdentityMatched']
          assert 0 <= w['DistinctDirectWriterMethods'] <= w['ExactBackingFieldStoreInstructions']
          assert 0 <= w['ConstructorMethodsWithDirectWrite'] <= w['DistinctDirectWriterMethods']
          assert w['DirectRenderTextureArrayNewarrSources'] + w['DirectNullSources'] + w['OtherOrUnprovenSources'] == w['ExactBackingFieldStoreInstructions']
          assert not w['OriginalRuntimeWriteExecutedProven']
          assert not w['OriginalArrayElementsPopulatedProven']
          s=r['original_exact_RenderTexture_array_field_serialization_metadata']
          assert s is not None
          assert s['ExactOriginalManagedFieldDefinitionCount']==1
          assert s['ExactBackingFieldTypeIsRenderTextureArray'] is True
          assert type(s['DeclaredPublic']) is bool
          assert type(s['HasExplicitUnitySerializeField']) is bool
          assert type(s['HasNonSerializedMetadata']) is bool
          assert type(s['IsStatic']) is bool
          assert type(s['IsInitOnly']) is bool
          assert type(s['EligibleByFieldModifiersOnly']) is bool
          assert s['OwnerDirectBaseTypeCategory'] in (
              'direct_unity_monobehaviour','direct_unity_scriptableobject',
              'direct_unity_behaviour','not_proven_unity_owner_by_direct_base')
          assert s['EligibleByFieldModifiersOnly'] == (
              (s['DeclaredPublic'] or s['HasExplicitUnitySerializeField']) and
              not s['HasNonSerializedMetadata'] and not s['IsStatic'] and
              not s['IsInitOnly'])
          assert s['OriginalSceneOrPrefabValueVerified'] is False
          assert s['RuntimeArrayLengthOrMembersVerified'] is False
          t=r['original_exact_RenderTexture_array_field_managed_read_topology']
          assert t is not None
          assert t['OriginalGetterFieldLoadInstructions']==2
          assert t['ExactInstanceFieldLoadInstructions'] == (
              t['OriginalGetterFieldLoadInstructions']+
              t['OtherOriginalMethodFieldLoadInstructions'])
          assert t['ExactInstanceFieldAddressInstructions'] >= (
              t['OtherOriginalMethodFieldAddressInstructions'])
          assert 1 <= t['DistinctDirectReaderMethods'] <= (
              t['ExactInstanceFieldLoadInstructions'])
          assert 0 <= t['DistinctDirectAddressMethods'] <= (
              t['ExactInstanceFieldAddressInstructions'])
          assert not t['ActualRuntimeArrayContentsVerified']
          assert not t['ManagedArrayElementsWrittenOrPopulatedProven']
          a=r['original_exact_RenderTexture_array_field_address_consumer']
          assert a is not None
          assert a['ExactFieldAddressSites']==t['ExactInstanceFieldAddressInstructions']
          assert a['DistinctAddressSiteMethods']==t['DistinctDirectAddressMethods']
          assert sum(a['SinkCategories'].values())==a['ExactFieldAddressSites']
          assert sum(a['FirstFollowingOpCategories'].values())==a['ExactFieldAddressSites']
          allowed_sinks={
              'control_flow_or_return_before_proven_sink','address_discarded',
              'array_value_discarded','unsupported_local_alias',
              'typed_indirect_load_mismatch','direct_field_clear_initobj',
              'unproven_initobj_target','typed_indirect_store_mismatch',
              'direct_field_reference_store','address_escape_to_another_store',
              'direct_field_copy_to_address','address_used_as_copy_source',
              'array_length_read_via_address','array_element_address_taken_via_field',
              'array_element_read_via_field','direct_array_element_store_via_field',
              'unknown_call_operand','call_argument_budget',
              'typed_byref_array_call_potential_mutation',
              'address_escaped_to_other_call_argument',
              'array_value_passed_to_call_contents_unknown',
              'address_used_as_call_receiver',
              'address_used_as_instance_field_receiver',
              'address_escaped_via_instance_store',
              'array_value_stored_in_another_field',
              'unsupported_opcode_before_proven_sink',
              'bounded_without_proven_sink'}
          assert set(a['SinkCategories']).issubset(allowed_sinks)
          assert not a['OriginalRuntimeExecutionVerified']
          assert not a['OriginalRuntimeArrayContentsVerified']
          q=r['original_exact_RenderTexture_array_byref_target_body_profile']
          assert q is not None
          assert q['CallFormalContainsExactRefRenderTextureArray'] is True
          assert q['ExactSourceManagedMethodDefinitionMatches'] in (0,1)
          assert type(q['OriginalTargetDefinitionCategory']) is str
          assert q['OriginalTargetDefinitionCategory'] in (
              'same_sha_managed_definition',
              'framework_system_array_resize_signature',
              'not_resolved_in_original_AssemblyCSharp')
          assert q['ExactOriginalMethodBodyAvailable'] is False or (
              q['ExactSourceManagedMethodDefinitionMatches']==1)
          for key in ('BodyDirectIndirectRefStoreOpcodeCount',
                      'BodyDirectArrayNewarrOpcodeCount',
                      'BodyDirectReferenceElementStoreOpcodeCount',
                      'BodyBranchOpcodeCount',
                      'BodyStrictNullStoreThroughRefArrayFormalCount'):
              assert type(q[key]) is int and q[key]>=0
          assert q['BodyStrictNullStoreThroughRefArrayFormalCount'] <= (
              q['BodyDirectIndirectRefStoreOpcodeCount'])
          assert not q['RuntimeCallExecutionProven']
          assert not q['RuntimeArrayInitializationProven']
          f=r['original_exact_RenderTexture_array_byref_target_allocation_flow']
          assert f is not None and f['OriginalMatchingCalleeDefinitions']==1
          assert f['ExactStindRefSites']==q['BodyDirectIndirectRefStoreOpcodeCount']
          assert f['ExactStelemRefSites']==q['BodyDirectReferenceElementStoreOpcodeCount']
          assert f['ProvenNewarrRenderTextureArrayToRefFormalStores'] + (
              f['RefFormalStoresWithUnprovenValue']) + (
              f['StoreSitesWithUnprovenDestinationOrFlow'])==f['ExactStindRefSites']
          assert f['ProvenArrayElementWritesThroughRefFormal'] + (
              f['ArrayElementStoreSitesNotProven']) == f['ExactStelemRefSites']
          assert not f['WholeFunctionBranchJoinVerified']
          assert not f['RuntimeArraySizeOrContentsVerified']
          assert not f['RuntimeExecutionVerified']
          z=r['original_exact_RenderTexture_array_byref_compiled_bounds_vs_callers']
          assert z is not None
          assert z['ExactRecipientDefinitionMatches']==1
          assert z['ProvenNewarrRefArrayStoreSites']==f['ProvenNewarrRenderTextureArrayToRefFormalStores']
          assert z['ExactRenderTextureNewarrSites']==q['BodyDirectArrayNewarrOpcodeCount']
          assert z['NewarrLengthOperandOriginCategory'] in (
              'direct_ldc_i4_literal','length_source_not_direct_i4',
              'length_source_not_proven','exact_allocation_relation_not_unique',
              'recipient_unresolved')
          assert z['FourOriginalIndicesWithinThisCompiledAllocation'] in (True,False,None)
          assert z['OriginalNumericLiteralsOrDigestsDisclosed'] is False
          assert z['RuntimeArrayAllocationOrBoundsVerified'] is False
          if z['NewarrLengthOperandOriginCategory']!='direct_ldc_i4_literal':
              assert z['FourOriginalIndicesWithinThisCompiledAllocation'] is None
          h=r['original_exact_RenderTexture_array_byref_length_origin_same_block']
          assert h is not None
          assert h['ExactRecipientDefinitions']==1
          assert h['ExactOriginalRenderTextureNewarrSites']==1
          assert h['ImmediateLengthProducerCategory'] in (
              'ldc_i4','ldloc','ldarg','ldlen','call','field','arithmetic','other',
              'no_same_block_producer','ambiguous_allocation','unresolved_recipient')
          assert type(h['ResolvedLengthSourceCategory']) is str
          assert len(h['ResolvedLengthSourceCategory'])<=160
          assert all(c in 'abcdefghijklmnopqrstuvwxyz0123456789_'
              for c in h['ResolvedLengthSourceCategory'])
          assert type(h['SameBasicBlockLocalDefinitionFound']) is bool
          assert type(h['CompileTimePositiveArrayLengthProven']) is bool
          assert h['FourPrivateOriginalIndicesInBoundsForCompiledLength'] in (
              True,False,None)
          if not h['CompileTimePositiveArrayLengthProven']:
              assert h['FourPrivateOriginalIndicesInBoundsForCompiledLength'] is None
          assert h['BranchJoinsOrRuntimeExecutionVerified'] is False
          assert h['OriginalNumericValuesOrDigestsExposed'] is False
          caller=r['original_exact_RenderTexture_array_byref_actual_caller_length']
          assert caller is not None
          assert caller['ExactOriginalByrefCallsites']==1
          assert caller['OriginalNewarrLengthInt32FormalIdentified'] is True
          assert isinstance(caller['ExactActualLengthArgumentSourceCategory'],str)
          assert len(caller['ExactActualLengthArgumentSourceCategory'])<=160
          assert all(c in 'abcdefghijklmnopqrstuvwxyz0123456789_'
              for c in caller['ExactActualLengthArgumentSourceCategory'])
          assert type(caller['ActualLengthArgumentDirectPositiveLiteralProven']) is bool
          assert caller['FourPrivateIndicesWithinThisCompiledCallerLength'] in (
              True,False,None)
          if not caller['ActualLengthArgumentDirectPositiveLiteralProven']:
              assert caller['FourPrivateIndicesWithinThisCompiledCallerLength'] is None
          assert caller['ControlFlowOrPreexistingStackJoinedProven'] is False
          assert caller['OriginalRuntimeArrayLengthOrContentsVerified'] is False
          assert caller['OriginalNumericSourceValuesOrDigestsDisclosed'] is False
          v=r['original_exact_RenderTexture_array_byref_element_value_source']
          assert v is not None
          assert v['ExactMatchingOriginalRecipientDefinitions']==1
          assert v['ExactStelemRefSites']==f['ExactStelemRefSites']
          assert v['ImmediateElementValueProducerCategory'] in (
              'newobj','call','ldnull','ldloc','ldarg','field','indirect_load',
              'other','value_not_proven_in_block','unverified_array_element',
              'unresolved_recipient')
          assert isinstance(v['ResolvedElementValueOriginCategory'],str)
          assert 1<=len(v['ResolvedElementValueOriginCategory'])<=160
          assert all(c in 'abcdefghijklmnopqrstuvwxyz0123456789_'
              for c in v['ResolvedElementValueOriginCategory'])
          assert type(v['ExactRenderTextureConstructorValueProven']) is bool
          assert type(v['DeclaredRenderTextureReturnValueProven']) is bool
          assert type(v['LiteralNullElementValueProven']) is bool
          assert type(v['SameBlockLocalValueDefinitionProven']) is bool
          assert v['RuntimeRenderTextureObjectOrPixelsVerified'] is False
          assert v['OriginalPrivateSymbolOrNumericValueDisclosed'] is False
          assert v['MatchingOriginalReturnMethodDefinitions'] in (0,1)
          assert v['ActualReturnTargetDeclarationCategory'] in (
              'matching_sha_managed_signature',
              'unresolved_unityengine_declaration',
              'unresolved_nonunity_declaration',
              'not_an_immediate_rendertexture_call',
              'not_examined')
          assert type(v['MatchingOriginalMethodBodyAvailable']) is bool
          if v['MatchingOriginalMethodBodyAvailable']:
              assert v['MatchingOriginalReturnMethodDefinitions']==1
          for key in ('OriginalReturnInstructionSites','DirectNullReturnSites',
                      'DirectRenderTextureConstructorReturnSites',
                      'DirectRenderTextureCallReturnSites',
                      'ReturnSitesWithUnresolvedProducer',
                      'BodyBranchInstructionCount'):
              assert type(v[key]) is int and v[key]>=0
          assert v['OriginalReturnInstructionSites']==(
              v['DirectNullReturnSites']+
              v['DirectRenderTextureConstructorReturnSites']+
              v['DirectRenderTextureCallReturnSites']+
              v['ReturnSitesWithUnresolvedProducer'])
          if not v['MatchingOriginalMethodBodyAvailable']:
              assert v['OriginalReturnInstructionSites']==0
          allowed_placement=(
              'not_examined','unresolved_method','zero_or_multiple_returns',
              'branch_exception_or_method_entry','sequential_return_site')
          allowed_predecessor=(
              'not_examined','unresolved_method','zero_or_multiple_returns',
              'no_prior_opcode','ldnull','ldloc','ldarg','field_load','call',
              'newobj','dup','indirect_load','branch_opcode','other_opcode')
          assert v['OriginalReturnSitePlacementCategory'] in allowed_placement
          assert v['OriginalReturnImmediatePriorOpcodeCategory'] in allowed_predecessor
          if v['OriginalReturnInstructionSites']==1:
              assert v['OriginalReturnSitePlacementCategory'] in (
                  'branch_exception_or_method_entry','sequential_return_site')
          lw=v['OriginalReturnLocalWriterCensus']
          assert lw is not None
          assert lw['ExactReturnLocalLoadSites'] in (0,1)
          for key in ('ExactLocalAssignmentSites',
                      'DirectNullAssignmentSites',
                      'DirectRenderTextureConstructorAssignmentSites',
                      'DirectRenderTextureTypedCallAssignmentSites',
                      'LocalAliasAssignmentSites',
                      'UnresolvedAssignmentSites'):
              assert type(lw[key]) is int and lw[key]>=0
          assert type(lw['ReturnLocalDeclaredRenderTexture']) is bool
          assert lw['ExactLocalAssignmentSites']==(
              lw['DirectNullAssignmentSites']+
              lw['DirectRenderTextureConstructorAssignmentSites']+
              lw['DirectRenderTextureTypedCallAssignmentSites']+
              lw['LocalAliasAssignmentSites']+
              lw['UnresolvedAssignmentSites'])
          assert lw['BranchJoinOrRuntimeValueVerified'] is False
          if v['OriginalReturnImmediatePriorOpcodeCategory']=='ldloc':
              assert lw['ExactReturnLocalLoadSites']==1
          allowed_prior=(
              'not_examined','no_prior_opcode','multiple_writers','ldnull',
              'newobj','call','ldloc','ldarg','field_load',
              'indirect_reference_load','reference_type_cast','dup',
              'integer_literal','branch_opcode','other_opcode')
          assert lw['SoleWriterImmediatePriorOpcodeCategory'] in allowed_prior
          assert type(lw['SoleWriterIsControlFlowEntry']) is bool
          if lw['ExactLocalAssignmentSites']==1:
              assert lw['SoleWriterImmediatePriorOpcodeCategory'] not in (
                  'not_examined','multiple_writers')
          e=lw['OriginalSoleWriterCallReturnEvidence']
          assert e is not None and lw['ExactLocalAssignmentSites']==1
          assert e['PrecedingInstructionIsCall'] is True
          assert e['DeclaredCallReturnCategory'] in (
              'void_return','byref_or_pointer_return',
              'generic_parameter_return','rendertexture_named_return',
              'texture_named_return','unity_object_named_return',
              'other_value_type_return','other_reference_return')
          for key in ('CallHasDeclaredReturnValue',
                      'AlternateControlFlowEntryBetweenCallAndStore',
                      'ConditionalCallResultIsImmediateStoreStackTop',
                      'DeclaredReturnExactlyRenderTextureByName',
                      'OriginalAssemblyTypeIdentityVerified',
                      'RuntimeCallOrNonNullVerified',
                      'OriginalSymbolsOrIlDisclosed'):
              assert type(e[key]) is bool
          assert e['OriginalAssemblyTypeIdentityVerified'] is False
          assert e['RuntimeCallOrNonNullVerified'] is False
          assert e['OriginalSymbolsOrIlDisclosed'] is False
          if e['DeclaredCallReturnCategory']=='void_return':
              assert e['CallHasDeclaredReturnValue'] is False
              assert e['ConditionalCallResultIsImmediateStoreStackTop'] is False
          if e['AlternateControlFlowEntryBetweenCallAndStore']:
              assert e['ConditionalCallResultIsImmediateStoreStackTop'] is False
          if e['ConditionalCallResultIsImmediateStoreStackTop']:
              assert e['CallHasDeclaredReturnValue'] is True
              assert e['AlternateControlFlowEntryBetweenCallAndStore'] is False
          if e['DeclaredCallReturnCategory']!='rendertexture_named_return':
              assert e['DeclaredReturnExactlyRenderTextureByName'] is False
          assert e['ImmediatePreCallOpcodeCategory'] in (
              'no_prior_instruction','dup','ldnull','ldloc','ldarg',
              'call','newobj','field_load','other')
          assert e['CallConsumedOperandCategory'] in ('none','one','multiple')
          assert type(e['RetainedDuplicateAfterOneInputVoidCall']) is bool
          assert e['OriginalRuntimeStackContentsVerified'] is False
          if e['RetainedDuplicateAfterOneInputVoidCall']:
              assert e['DeclaredCallReturnCategory']=='void_return'
              assert e['ImmediatePreCallOpcodeCategory']=='dup'
              assert e['CallConsumedOperandCategory']=='one'
              assert e['AlternateControlFlowEntryBetweenCallAndStore'] is False
          print('T2_FOAM_VOID_CALL_PRECALL_STACK_SAFE '+json.dumps({
              'precall_opcode_category':e['ImmediatePreCallOpcodeCategory'],
              'void_call_consumes_operand_count_category':
                  e['CallConsumedOperandCategory'],
              'retained_dup_if_void_call_executes':
                  e['RetainedDuplicateAfterOneInputVoidCall'],
              'original_runtime_stack_or_nonnull_verified':False,
              'source_method_names_il_and_literals_disclosed':False,
          },sort_keys=True))
          print('T2_FOAM_WRITER_PRECEDING_CALL_RETURN_SAFE '+json.dumps({
              'preceding_exact_writer_call':e['PrecedingInstructionIsCall'],
              'declared_return_category':e['DeclaredCallReturnCategory'],
