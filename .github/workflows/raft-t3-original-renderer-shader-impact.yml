name: T3 RENDER-002 genuine six-scene Renderer Material Shader48 usage priority
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-t3-original-renderer-shader-impact.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raft-t3-original-scene-renderer-shader-impact-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-six-scene-impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - name: Source-free exact original Renderer and class48 join controls
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/w1_depth_shaderlab.py scripts/t3_original_renderer_shader_impact.py scripts/t3_original_particle_shader_state.py scripts/t3_original_particle108_dxbc_feasibility.py scripts/t3_original_particle108_spirv_translation.py scripts/t3_particle108_reflected_name_bridge.py scripts/t3_original_particle108_dxbc_semantic_join.py scripts/t3_original_particle_material_texenv.py scripts/t3_original_particle_texture_targets.py scripts/t3_original_particle_stream_provider.py
          python3 -m unittest discover -s tests -p 'test_t3_original_renderer_shader_impact.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_original_particle_shader_state.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_original_particle108_dxbc_feasibility.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_original_particle108_spirv_translation.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_stage_io_drift.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_particle108_reflected_name_bridge.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_original_particle108_dxbc_semantic_join.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_original_particle_material_texenv.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_original_particle_texture_targets.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_original_particle_stream_provider.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_stream_extent_guard.py' -v
          python3 -m unittest discover -s tests -p 'test_w1_depth_shaderlab.py' -v
          python3 -m unittest discover -s tests -p 'test_b25_foam_pass_state.py' -v
          python3 -m unittest discover -s tests -p 'test_b03_original_renderer_materials.py' -v
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: zip2-source
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/level0
            Raft/Raft_Data/level1
            Raft/Raft_Data/level2
            Raft/Raft_Data/level3
            Raft/Raft_Data/level4
            Raft/Raft_Data/level5
      - name: Select exact four needed original Material and Shader owner serialized files
        run: |
          set -euo pipefail
          git -C zip2-source sparse-checkout set --no-cone -- \
            '/RAFT_FILE_MANIFEST.tsv' \
            '/Raft/Raft_Data/level0' \
            '/Raft/Raft_Data/level1' \
            '/Raft/Raft_Data/level2' \
            '/Raft/Raft_Data/level3' \
            '/Raft/Raft_Data/level4' \
            '/Raft/Raft_Data/level5' \
            '/Raft/Raft_Data/resources.assets/*' \
            '/Raft/Raft_Data/sharedassets0.assets/*' \
            '/Raft/Raft_Data/sharedassets1.assets' \
            '/Raft/Raft_Data/sharedassets6.assets'
          test "$(git -C zip2-source rev-parse HEAD)" = 15964ea8f246b6e076ce26b60931ee2e1a9a2385
      - name: SHA-verify real ZIP2 six scenes and reassemble exact four pinned owners
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import stage
          from scripts.a12_probe_original_blur_passes import SHADER_OWNERS
          from scripts.b21_scene_lightmap_links import PIN,verify_source
          from scripts.t3_original_renderer_shader_impact import SHADER_OWNERS_SELECTED
          zip2=Path('zip2-source')
          roots=Path(os.environ['RUNNER_TEMP'])/'t3-original-six-scene'
          pins={'Raft_Data/'+n:SHADER_OWNERS[n] for n in SHADER_OWNERS_SELECTED}
          result=stage(zip2,roots,pins)
          assert len(result['owners'])==4 and result['verified_bytes']==269007288 and not result['lfs_used']
          dst=roots/'Raft_Data'
          for scene,pin in PIN.items():
              source=zip2/'Raft/Raft_Data'/scene
              verify_source(source,pin)
              target=dst/scene
              if target.exists() or target.is_symlink():raise ValueError('scene_stage_collision')
              with source.open('rb') as s, target.open('xb') as t:
                  while block:=s.read(1024*1024):t.write(block)
              verify_source(target,pin)
          print('RAFT_T3_ORIGINAL_6_SCENES_SHA_VERIFIED=6 four_owner_SHA=4 assembled_owner_bytes=269007288')
          PY
      - name: Count real original Shader48 used by six scene Renderer Material slots
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.23.0
          python3 -m scripts.t3_original_renderer_shader_impact \
            --original "$RUNNER_TEMP/t3-original-six-scene" \
            --manifest zip2-source/RAFT_FILE_MANIFEST.tsv \
            --out "$RUNNER_TEMP/t3-original-six-scene-shader-usage-aggregate.json"
      - name: Classify exact original 921-use Shader48 by verified Unity Renderer type (no private IDs)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          from scripts.b03_original_renderer_materials import RENDERER_CLASSES
          root=Path(os.environ['RUNNER_TEMP'])
          r=json.loads((root/'t3-original-six-scene-shader-usage-aggregate.json').read_text())
          assert r['status']=='AUTHENTIC_SIX_SCENE_RENDERER_SHADER_USE_FREQUENCY_VERIFIED'
          assert r['six_original_scenes_sha_verified'] is True
          assert r['original_highest_used_typed_Shader48_unique'] is True
          assert r['original_highest_used_typed_Shader48_slot_use']==921
          slots=r['original_renderer_material_slots_by_renderer_class']
          typed=r['original_verified_Shader48_slots_by_renderer_class']
          top=r['original_highest_used_typed_Shader48_slots_by_renderer_class']
          distinct=r['original_highest_used_typed_Shader48_distinct_renderers_by_class']
          assert all(set(d).issubset(RENDERER_CLASSES) for d in (slots,typed,top,distinct))
          assert sum(slots.values())==1639
          assert sum(typed.values())==1633
          assert sum(top.values())==921
          assert set(top)==set(distinct)
          assert all(0 < distinct[k] <= v for k,v in top.items())
          assert r['source_shader_target_names_guids_ids_hashes_disclosed'] is False
          assert r['renderer_class_breakdown_is_original_source_only_not_Android_drawcalls'] is True
          safe={'status':'ZIP2_AUTHENTIC_TOP921_RENDERER_CLASS_COUNTS_VERIFIED',
                'top921_original_material_slots_by_class':top,
                'top921_distinct_renderer_objects_by_class':distinct,
                'all_typed_Shader48_material_slots_by_class':typed,
                'six_source_scenes':6,'source_shader_owner_files':4,
                'android_white_pixels_or_particle_emission_proven':False,
                'native_shader_program_equivalence_proven':False}
          (root/'t3-top921-renderer-class-safe-aggregate.json').write_text(
              json.dumps(safe,indent=2,sort_keys=True)+'\n')
          print('RAFT_T3_AUTHENTIC_ORIGINAL_TOP921_RENDERER_CLASSES '+json.dumps(safe,sort_keys=True))
          PY
      - name: Assert original ParticleSystemRenderer source Sh48 rank and write public-safe evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          src=Path(os.environ['RUNNER_TEMP'])/'t3-original-six-scene-shader-usage-aggregate.json'
          d=json.loads(src.read_text())
          assert d['status']=='AUTHENTIC_SIX_SCENE_RENDERER_SHADER_USE_FREQUENCY_VERIFIED'
          assert d['six_original_scenes_sha_verified'] is True
          counts=d['original_particle_Shader48_ranked_material_slot_use_no_identity']
          assert sum(counts)==215 and counts==sorted(counts,reverse=True)
          assert counts and all(type(x) is int and x>0 for x in counts)
          assert len(counts)==d['original_particle_distinct_typed_Shader48_source_targets']
          top=counts[0]; unique=d['original_particle_highest_Shader48_unique']
          assert d['original_particle_highest_Shader48_particle_class_slots']==top
          if unique:
              total=d['original_particle_highest_Shader48_global_renderer_slots']
              other=d['original_particle_highest_Shader48_nonparticle_renderer_slots']
              distinct=d['original_particle_highest_Shader48_distinct_particle_renderers']
              assert counts.count(top)==1 and total==top+other
              assert 0<distinct<=top
              assert type(d['original_particle_highest_Shader48_original_pass_count']) is int
          else:
              assert counts.count(top)>1
              assert d['original_particle_highest_Shader48_global_renderer_slots'] is None
          safe={'status':'ORIGINAL_SHA_VERIFIED_PARTICLE_SHADER48_RANK',
                'particle_typed_material_slots':215,
                'particle_source_shader_ranked_slots_no_identity':counts,
                'particle_shader_source_targets':len(counts),
                'particle_highest_unique':unique,
                'particle_highest_source_global_slot_use':d['original_particle_highest_Shader48_global_renderer_slots'],
                'particle_highest_original_passes':d['original_particle_highest_Shader48_original_pass_count'],
                'particle_highest_other_renderer_slots':d['original_particle_highest_Shader48_nonparticle_renderer_slots'],
                'particle_highest_distinct_particle_renderers':d['original_particle_highest_Shader48_distinct_particle_renderers'],
                'unity_native_or_Android_pixels_proven':False}
          out=Path(os.environ['RUNNER_TEMP'])/'t3-original-particle-shader48-rank-safe.json'
          out.write_text(json.dumps(safe,indent=2,sort_keys=True)+'\n')
          print('RAFT_T3_ORIGINAL_PARTICLE_SHADER48_RANK '+json.dumps(safe,sort_keys=True))
          PY
      - name: Diagnose real SHA-original one-Pass particle Shader48 fixed-function Blend Alpha Z state
        run: |
          set -euo pipefail
          python3 -m scripts.t3_original_particle_shader_state \
            --original "$RUNNER_TEMP/t3-original-six-scene" \
            --manifest zip2-source/RAFT_FILE_MANIFEST.tsv \
            --out "$RUNNER_TEMP/t3-original-108particle-pass-state-safe.json"
      - name: Install CPU-only genuine original DXBC Vulkan SPIR-V and stage reflection tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
          dpkg-query -W vkd3d-compiler spirv-tools spirv-cross glslang-tools
      - name: Link original SHA-authentic one-Pass Particle108 genuine D3D11 vertex fragment variants
        run: |
          set -euo pipefail
          python3 -m scripts.t3_original_particle108_dxbc_feasibility \
            --original "$RUNNER_TEMP/t3-original-six-scene" \
            --manifest zip2-source/RAFT_FILE_MANIFEST.tsv \
            --out "$RUNNER_TEMP/t3-particle108-actual-dxbc-stage-links-safe.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"t3-particle108-actual-dxbc-stage-links-safe.json").read_text())
          assert d["status"] in (
            "SOURCE_SHA_ORIGINAL_PARTICLE108_D3D11_STAGE_LINKAGE_CLASSIFIED",
            "SOURCE_SHA_ORIGINAL_PARTICLE108_D3D11_PLATFORM_UNAVAILABLE")
          assert d["original_six_source_scenes_SHA_verified"] is True
          assert d["original_four_shader_owner_SHA_verified"] is True
          assert d["original_source_108_particle_Shader48_slots"]==108
          assert d["original_source_one_SubShader_one_Pass"] is True
          assert d["source_original_program_bytes_or_program_hashes_published"] is False
          assert d["original_shader_name_ID_GUID_or_shader_text_disclosed"] is False
          assert d["authored_Android_ShaderLab_or_SPIRV_equivalence_proven"] is False
          assert d["source_is_phone_fire_smoke_emitter_verified"] is False
          assert d["actual_Unity_Android_Adreno_pixels_verified"] is False
          if d["status"].endswith("_CLASSIFIED"):
            assert d["genuine_D3D11_vertex_stage_variant_records"]>0
            assert d["genuine_D3D11_fragment_stage_variant_records"]>0
            assert d["original_D3D11_program_table_records"]>0
          print("RAFT_T3_SHA_ORIGINAL_PARTICLE108_D3D11_STAGE_LINKAGE_CLASSIFIED=true gpu_pixels_proven=false")
          PY
      - name: Authenticate real original Particle108 four exact DXBC VS FS authored semantic and component mask joins
        run: |
          set -euo pipefail
          timeout 140s python3 -m scripts.t3_original_particle108_dxbc_semantic_join \
            --original "$RUNNER_TEMP/t3-original-six-scene" \
            --manifest zip2-source/RAFT_FILE_MANIFEST.tsv \
            --out "$RUNNER_TEMP/t3-original-particle108-DXBC-semantic-aggregate-safe.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"t3-original-particle108-DXBC-semantic-aggregate-safe.json"
          d=json.loads(p.read_text())
          assert d["status"]=="SOURCE_SHA_ORIGINAL_PARTICLE108_FOUR_DXBC_SEMANTIC_MASK_LINKS_CLASSIFIED"
          assert d["six_original_scenes_SHA_authenticated"] is True
          assert d["four_original_shader_owners_SHA_authenticated"] is True
          assert d["original_source_particle108_material_slots"]==108
          assert d["original_exact_VSFS_keyword_pairs"]==4
          assert d["counts"]["original_programs_read"]==8
          assert d["counts"]["source_exact_keyword_pairs_classified"]==4
          assert d["original_semantic_to_SPIRV_Location_or_HLSL_mapping_verified"] is False
          assert d["original_source_private_semantic_names_masks_registers_or_bytes_published"] is False
          assert d["native_Unity_Android_Adreno_pixels_verified"] is False
          print("RAFT_T3_REAL_ORIGINAL_PARTICLE108_DXBC_AUTHORED_SIGNATURE_JOIN_CLASSIFIED=true gpu_pixels=false")
          PY
      # Python concrete PosixPath runner-temp guard fixed at 622c2f40; source stage and translation semantics unchanged.
      - name: Translate all original 4 exact Particle108 VS FS keyword pairs to Vulkan1.1 SPIR-V and HLSL roundtrip
        run: |
          set -euo pipefail
          timeout 520s python3 -m scripts.t3_original_particle108_spirv_translation \
            --original "$RUNNER_TEMP/t3-original-six-scene" \
            --manifest zip2-source/RAFT_FILE_MANIFEST.tsv \
            --out "$RUNNER_TEMP/t3-particle108-fourpair-spirv-aggregate-safe.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"t3-particle108-fourpair-spirv-aggregate-safe.json").read_text())
          assert d["status"]=="SHA_ORIGINAL_PARTICLE108_FOUR_KEYWORD_PAIRS_VULKAN_SPIRV_CPU_CLASSIFIED"
          assert d["six_original_source_scenes_SHA_verified"] is True
          assert d["four_original_Shader_Material_owners_SHA_verified"] is True
          assert d["source_original_particle108_shader_use_slots"]==108
          assert d["original_exact_vertex_fragment_keyword_pairs"]==4
          assert d["original_paired_D3D11_stage_programs"]==8
          assert d["original_D3D11_table_records"]==16
          assert d["all_original_four_keyword_pairs_translation_attempted"] is True
          assert d["counts"]["stage_translation_attempts"]==8
          assert d["counts"]["stage_original_roundtrip_io_drift_classified"]==8
          assert d["counts"]["io_drift_inputs_identical"]<=8
          assert d["counts"]["io_drift_outputs_identical"]<=8
          assert d["counts"]["io_drift_inputs_location_only_remap_candidate"]<=8
          assert d["counts"]["io_drift_outputs_location_only_remap_candidate"]<=8
          assert d["private_game_shader_program_bytes_names_hashes_or_Guids_published"] is False
          assert d["native_Unity_Android_Adreno_pixels_verified"] is False
          assert d["source_shader_is_users_phone_fire_smoke_emitter_verified"] is False
          assert d["source_game_assets_modified"] is False
          print("RAFT_T3_REAL_PARTICLE108_ALL_FOUR_DXBC_KEYWORD_PAIRS_SPIRV_CPU_CLASSIFIED=true android_gpu_pixels=false")
          PY
      - name: Inspect genuine original Particle108 eight-stage compiler-reflected name and location bridge privately
        run: |
          set -euo pipefail
          timeout 500s python3 -m scripts.t3_particle108_reflected_name_bridge \
            --original "$RUNNER_TEMP/t3-original-six-scene" \
            --manifest zip2-source/RAFT_FILE_MANIFEST.tsv \
            --out "$RUNNER_TEMP/t3-original-particle108-reflected-names-safe.json"
          python3 - <<'PY'
          import json,os
