          p=Path(os.environ["RUNNER_TEMP"])/"t3-original-particle108-reflected-names-safe.json"
          d=json.loads(p.read_text())
          assert d["status"]=="T3_SOURCE_PARTICLE108_FOUR_PAIR_REFLECTED_NAME_LOCATION_BRIDGE_CLASSIFIED"
          assert d["source_original_keyword_variant_pairs"]==4
          assert d["original_source_particle108_use_slots"]==108
          assert d["six_source_original_scenes_SHA_verified"] is True
