name: B12 RENDER-002 bounded scene shader snapshot
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - android-port/Runtime/Platform/AndroidTestDiagnostics.cs
      - tests/test_b12_scene_render_snapshot.py
      - scripts/b12_scene_render_harness.py
      - .github/workflows/raft-b12-scene-render-snapshot.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raft-b12-scene-render-snapshot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: B12 execute exact production coroutine against synthetic Unity scene graphs
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          set -euo pipefail
          python3 -m scripts.b12_scene_render_harness --output "${RUNNER_TEMP}/b12-render-bounds"
          dotnet run --project "${RUNNER_TEMP}/b12-render-bounds/B12Harness.csproj" --configuration Release --nologo --verbosity quiet
      - name: B12 bounded source-policy regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_b12_scene_render_snapshot.py -v
          python3 -m unittest discover -s tests -p test_runtime_operation_traces.py -v
