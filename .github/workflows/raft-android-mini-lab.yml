name: Raft unified mini-lab T1-T5 (one APK and one pack)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Advisory only; direct release requires verified stable signer
        type: boolean
        default: false
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/raft-mini-lab-build-request.json'

permissions:
  contents: read

concurrency:
  group: raft-unified-mini-lab-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  shared-team-lab:
    if: ${{ github.ref == 'refs/heads/feature/android-native-port' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          fetch-depth: 2
      - name: Validate T5 shared build request and source
        id: gate
        env:
          EVENT_TYPE: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess
          event=os.environ['EVENT_TYPE']
          pack='apk-for-testing/unified/pack/team-testpack.json'
          actual=hashlib.sha256(open(pack,'rb').read()).hexdigest()
          if event=='push':
              assert '[raft-mini-lab]' in os.environ['COMMIT_MESSAGE'], 'mini build marker required'
              data=json.load(open('.github/raft-mini-lab-build-request.json',encoding='utf-8'))
              assert set(data)=={'request_id','target','requested_from_sha','pack_sha256','reason','publish'}
              assert data['target']=='SHARED', 'not five APK variants'
              assert re.fullmatch('[a-zA-Z0-9._-]{6,96}',data['request_id'])
              assert re.fullmatch('[a-f0-9]{40}',data['requested_from_sha'])
              assert data['pack_sha256']==actual, 'pack changed after request'
              assert isinstance(data['reason'],str) and 15<=len(data['reason'].strip())<=800
              assert type(data['publish']) is bool
              parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
              assert data['requested_from_sha']==parent, 'pin pre-request commit'
          else:
              assert event=='workflow_dispatch'
              parent=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write('pack_sha='+actual+'\n')
              output.write('source_sha='+parent+'\n')
          print('SHARED pack sha256',actual,'source SHA',parent)
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate shared pack and readiness
        run: |
          python3 scripts/validate_unified_testpack.py apk-for-testing/unified/pack/team-testpack.json
          python3 -m unittest discover -s tests -p test_unified_testpack.py -v
          python3 -m unittest discover -s tests -p test_shared_lab_votes.py -v
          python3 -m unittest discover -s tests -p test_android_testpack.py -v
          python3 scripts/check_shared_lab_votes.py --require-need
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Build one shared debug APK, no Unity
        env:
          SOURCE_SHA: ${{ steps.gate.outputs.source_sha }}
        run: |
          gradle -p apk-for-testing/unified --no-daemon :app:assembleDebug -PsourceSha="$SOURCE_SHA" -PversionCode="$GITHUB_RUN_NUMBER"
          test -s apk-for-testing/unified/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p delivery
          cp apk-for-testing/unified/app/build/outputs/apk/debug/app-debug.apk delivery/Raft-Team-Lab-debug.apk
          cp apk-for-testing/unified/pack/team-testpack.json delivery/team-testpack.json
          (cd delivery && sha256sum Raft-Team-Lab-debug.apk team-testpack.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Raft-Team-Lab-${{ github.sha }}
          path: delivery/
          retention-days: 14
          if-no-files-found: error
      - name: Delivery limitation
        run: |
          echo 'Artifact is a ZIP containing APK, not a direct APK URL.'
          echo 'T5 supplies a verified direct Release APK URL only after stable signing and successful publication.'
          echo 'Do not mistake this for a signed full-game XAPK.'
