            qG2dANeINVmhYU+XVNJ5
            -----END CERTIFICATE-----
        run: |
          set -euo pipefail
          printf '%s\n' "$PUBLIC_INSPECTION_CERT" > "$RUNNER_TEMP/recipient.pem"
          python3 - <<'PY'
          import os,zipfile,json,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);packet=root/'quality-private'
          manifest=packet/'quality-manifest.json'
          data=json.loads(manifest.read_text());data['source_commit']=os.environ['GITHUB_SHA'];manifest.write_text(json.dumps(data,sort_keys=True))
          with zipfile.ZipFile(root/'quality-private.zip','w',zipfile.ZIP_DEFLATED) as out:
              for path in sorted(packet.iterdir()):
                  if path.is_symlink() or not path.is_file():raise ValueError('Unsafe private packet')
                  out.write(path,path.name)
          if (root/'quality-private.zip').stat().st_size>2097152:raise ValueError('Private packet exceeds bound')
          PY
          openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/quality-private.zip" -outform DER -out "$RUNNER_TEMP/quality.cms" "$RUNNER_TEMP/recipient.pem"
          sha256sum "$RUNNER_TEMP/quality.cms"
          echo RAFT_PRIVATE_QUALITY_CMS_BASE64_BEGIN
          base64 -w 76 "$RUNNER_TEMP/quality.cms"
          echo RAFT_PRIVATE_QUALITY_CMS_BASE64_END
      - uses: actions/upload-artifact@v4
        with:
          name: raft-original-quality-encrypted
          path: ${{ runner.temp }}/quality.cms
          retention-days: 1
          if-no-files-found: error
