name: Raft private original water quality resource inspection - no Unity
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-original-water-quality-inspection.yml'
      - 'scripts/collect_original_water_quality_packet.py'
      - 'tests/test_collect_original_water_quality_packet.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raft-original-water-quality-inspection-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: true
          sparse-checkout: |
            scripts
            tests
            Raft/Raft_Data/resources.assets
            Raft/Raft_Data/globalgamemanagers.assets
            Raft/Raft_Data/Managed
      - name: Test exact script pointer selection before fetching resources
        run: python3 -m unittest discover -s tests -p test_collect_original_water_quality_packet.py -v
      - name: Authenticate pointer and hydrate only original resources owner
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
          GIT_ATTR_SOURCE: HEAD
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from scripts.verify_targeted_lfs_compute_sources import EXPECTED,verify_sources
          verify_sources(Path('Raft/Raft_Data'),pointers_only=True,expected={'resources.assets':EXPECTED['resources.assets']})
          PY
          git lfs install --local
          git lfs pull --include='Raft/Raft_Data/resources.assets' --exclude='' origin
          python3 - <<'PY'
          from pathlib import Path
          from scripts.verify_targeted_lfs_compute_sources import EXPECTED,verify_sources
          verify_sources(Path('Raft/Raft_Data'),expected={'resources.assets':EXPECTED['resources.assets']})
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned CPU serializer and managed decompiler
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
          dotnet tool install ilspycmd --version 11.2.0.10050 --tool-path "$RUNNER_TEMP/ilspy"
      - name: Inspect original source and serialized quality object privately
        env:
          DOTNET_PROCESSOR_COUNT: '2'
        run: |
          set -euo pipefail
          timeout 360s "$RUNNER_TEMP/ilspy/ilspycmd" -p -lv CSharp9_0 -o "$RUNNER_TEMP/original-csharp" Raft/Raft_Data/Managed/Assembly-CSharp.dll > "$RUNNER_TEMP/private-decompile.log" 2>&1
          timeout 180s python3 -m scripts.collect_original_water_quality_packet --source Raft/Raft_Data --managed-source "$RUNNER_TEMP/original-csharp" --output "$RUNNER_TEMP/quality-private"
      - name: Encrypt bounded packet; publish no plaintext game resources
        env:
          PUBLIC_INSPECTION_CERT: |
            -----BEGIN CERTIFICATE-----
            MIIEKzCCApOgAwIBAgIUJ/YOWJyDnUoThrP8YUtFm1JvEsUwDQYJKoZIhvcNAQEL
