name: Raft W1 Depth Copy targeted Unity Android Vulkan compilation
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - 'scripts/w1_stage_zip2_owners.py'
      - 'scripts/w1_build_depth_wrapper.py'
      - '.github/workflows/raft-w1-depth-unity.yml'
      - 'android-port/Experiments/W1/Editor/DepthShaderValidation.cs'
      - 'android-port/Editor/GTOriginalWaterPassImportProbe.cs'
      - 'scripts/w1_depth_shaderlab.py'
      - 'tests/test_w1_depth_shaderlab.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raft-w1-depth-unity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: UNITY_LICENSE
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            android-port/Experiments/W1
            android-port/Editor
            scripts
            tests
      - name: Credential readiness without exposing values
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_EMAIL" && test -n "$UNITY_PASSWORD"
          test -n "$UNITY_LICENSE$UNITY_SERIAL"
      - name: Validate segment routing before original downloads
        run: |
          python3 -m unittest discover -s tests -p test_w1_depth_shaderlab.py -v
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: zip2-depth
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/resources.assets/*
            /Raft/Raft_Data/sharedassets0.assets/*
      - name: Authenticate original two shader owners from ZIP2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ZIP2'
          import os
          import subprocess
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import ZIP2_SHA, stage
          from scripts.w1_recover_graphics_programs import OWNERS

          root = Path('zip2-depth')
          actual = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
          if actual != ZIP2_SHA:
              raise ValueError('ZIP2 Depth source commit mismatch')
          pins = {'Raft_Data/' + owner: pin for owner, pin in OWNERS.items()}
          result = stage(root, Path(os.environ['RUNNER_TEMP']) / 'w1-depth-original', pins)
          if len(result['owners']) != 2 or result['verified_bytes'] != 227511628:
              raise ValueError('ZIP2 Depth owner scope drift')
          print('RAFT_W1_DEPTH_ZIP2_OWNER_AUTHENTICATION owners=2 bytes=227511628')
          ZIP2
      - name: Install bounded CPU serialization and translation tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
          dpkg-query -W vkd3d-compiler spirv-tools spirv-cross glslang-tools
      - name: Decode original parameters and reconstruct private ShaderLab wrapper
        run: timeout 600s python3 -m scripts.w1_build_depth_wrapper --source "$RUNNER_TEMP/w1-depth-original/Raft_Data" --out "$RUNNER_TEMP/w1-depth-wrapper-summary.json" --private-project "$GITHUB_WORKSPACE/w1-depth-project"
      - name: Stage the W1 validation and production water import check
        run: |
          cp android-port/Experiments/W1/Editor/DepthShaderValidation.cs \
             android-port/Editor/GTOriginalWaterPassImportProbe.cs w1-depth-project/Assets/Editor/
      - name: Compile one private shader bundle in pinned Unity; never build a Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f2
          projectPath: w1-depth-project
          targetPlatform: Android
          buildMethod: RaftW1.DepthShaderValidation.Validate
          versioning: None
          allowDirtyBuild: true
          dockerMemoryLimit: 12g
          customParameters: -job-worker-count 2
      - name: Retain aggregate recovery evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1-depth-unity-aggregate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/w1-depth-wrapper-summary.json
            w1-depth-project/ProbeResults/w1-unity-result.json
          if-no-files-found: ignore
          retention-days: 7


