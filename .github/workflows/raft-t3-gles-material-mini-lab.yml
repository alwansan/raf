name: T3 RENDER-002 independent GLES3 material and particle mini-lab
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - 'apk-for-testing/workers/T3/gles-lab/**'
      - '.github/workflows/raft-t3-gles-material-mini-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raft-t3-gles-mini-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-and-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            apk-for-testing/workers/T3/gles-lab
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use installed Android SDK (avoid obsolete sdkmanager tools package)
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
            test -n "$SDKMANAGER"
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build isolated GLES3 APK, never Unity or Raft game assets
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gradle -p apk-for-testing/workers/T3/gles-lab --no-daemon :app:assembleDebug -PsourceSha="$SOURCE_SHA"
          APK=apk-for-testing/workers/T3/gles-lab/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee t3-gles-apk-sha256.txt
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^package:|^uses-feature:"
          cp "$APK" t3-gles-material-lab-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: t3-gles-material-lab-${{ github.sha }}
          path: |
            t3-gles-material-lab-debug.apk
            t3-gles-apk-sha256.txt
          retention-days: 7
          if-no-files-found: error
