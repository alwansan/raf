name: GFX-MULTI-095 actual saved Material floats colors to original CB member bytes
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths:
      - '.github/workflows/gfxlab-multi095-original-material-CB-bytes.yml'
      - 'gfxlab/tools/multi_shader_material_cb_payload095.py'
      - 'gfxlab/tests/test_multi_shader_material_cb_payload095.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfxlab-multi095-original-Material-CB-byte-payload
  cancel-in-progress: false
jobs:
  original-source-binding-evidence-availability:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            gfxlab/tools
            gfxlab/tests
            gfxlab/unity/Assets/Shaders
            gfxlab/unity/Assets/Scripts
            gfxlab/unity/Assets/Editor
            gfxlab/unity/Assets/Plugins/Android
      - name: All source-free tests including cross-evidence proof rejection guards
        run: |
          set -euo pipefail
          python3 -m py_compile gfxlab/tools/multi_shader_material_cb_payload095.py
          python3 -m unittest discover -s gfxlab/tests -p 'test_*.py' -v
          echo GFX054_SOURCE_FREE_TESTS_PASS=true
      - uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: source-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/resources.assets/*
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/sharedassets6.assets
      - name: Install bounded metadata reader
        run: python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
      - name: Authenticate separate parameters plus common parameter tables against actual DXBC declarations
        run: |
          set -euo pipefail
          python3 -m gfxlab.tools.multi_shader_material_cb_payload095 --zip2 source-zip2 --stage "$RUNNER_TEMP/gfx095-private" --out gfx095-safe.json
          python3 - <<'CHECK'
          import json
          d=json.load(open('gfx095-safe.json'));c=d['safe_counts']
          assert d['source_stage_parameter_rows']==1435
          assert d['source_material_slots']==7 and d['unique_source_materials']==6
          assert c['written_members_bitwise_float32_readback_equal']==23408
          assert c['saved_float_member_writes']==17283 and c['saved_color_member_writes']==6125
          assert c['known_material_byte_count']==167132
          assert c['unknown_runtime_byte_count']==10201380
          assert not d['uploaded_original_material_bytes_to_GPU']
          assert not d['complete_runtime_CB_payloads']
          assert not d['originalShaderRestored'] and not d['phase_closed']
          CHECK
      - uses: actions/upload-artifact@v4
        with:
          name: gfx095-safe-original-parameter-bridge
          path: gfx095-safe.json
          retention-days: 7
          if-no-files-found: error
      - name: Purge all original source and private data
        if: always()
        run: sudo rm -rf source-zip2 "$RUNNER_TEMP/gfx095-private"
