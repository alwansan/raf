name: T3 RENDER-002 source-only SPIRV debug candidates + scheduled DXBC contract validator
on:
  push:
    branches:
      - feature/android-native-port
    paths:
      - scripts/t3_particle108_spirv_opname_candidates.py
      - scripts/t3_particle108_spv_named_original_probe.py
      - scripts/t3_particle108_explicit_map_packet.py
      - scripts/t3_particle108_vkd3d_explicit_graphics.c
      - tests/test_t3_particle108_explicit_map_packet.py
      - scripts/t3_particle108_spirv_explicit_pair.py
      - tests/test_t3_particle108_spirv_explicit_pair.py
      - scripts/t3_dxbc_spirv_contract_join.py
      - tests/test_t3_dxbc_spirv_contract_join.py
      - .github/workflows/raft-t3-particle108-spv-named-original-manual.yml
      - .github/workflows/raft-t3-shader-candidate-source-only.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t3-source-only-spv-candidate-contract-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-free-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
      - name: Parse candidate translator and original adapter code syntax
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t3_particle108_spirv_opname_candidates.py scripts/t3_particle108_spv_named_original_probe.py scripts/t3_particle108_dcl_spv_family_census.py scripts/t3_dxbc_spirv_contract_join.py
      - name: Check original-stage resource candidate/descriptor tests synthetic only
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t3_particle108_dcl_spv_family_census.py' -v
      - name: Validate scheduled T3 exact DXBC SPIRV provenance checker (no edits)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t3_dxbc_spirv_contract_join.py' -v
      - name: Test strict T3 private per-stage graphics mapping packets synthetic only
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t3_particle108_explicit_map_packet.py tests/test_t3_particle108_explicit_map_packet.py
          python3 -m unittest discover -s tests -p 'test_t3_particle108_explicit_map_packet.py' -v
      - name: Verify two independent explicit SPIRV binding layouts preserve source-variable and entire shader graph
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t3_particle108_spirv_explicit_pair.py tests/test_t3_particle108_spirv_explicit_pair.py
          python3 -m unittest discover -s tests -p 'test_t3_particle108_spirv_explicit_pair.py' -v
      - name: Compile real public VKD3D 1.2 graphics CBV SRV sampler compiler API and reject invalid private maps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libvkd3d-dev gcc
          dpkg-query -W libvkd3d-dev libvkd3d-headers libvkd3d-shader1
          HEADER_DIR="$(dirname "$(dpkg -L libvkd3d-headers | grep -m1 '/vkd3d_shader.h$')")"
          test -f "$HEADER_DIR/vkd3d_shader.h"
          gcc -std=c11 -Wall -Wextra -Werror -O2 -I "$HEADER_DIR" -o "$RUNNER_TEMP/t3-private-vkd3d-graphics" scripts/t3_particle108_vkd3d_explicit_graphics.c -lvkd3d-shader
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess,tempfile
          from scripts.t3_particle108_explicit_map_packet import private_packets,private_write_packets
          helper=os.environ["RUNNER_TEMP"]+"/t3-private-vkd3d-graphics"
          layout=(("cbuffer",89,(2,8)),("srv",88,(3,)),("sampler",90,(1,)))
          with tempfile.TemporaryDirectory(prefix="t3-map-synthetic-") as tmp:
              files=private_write_packets(private_packets(layout,1)[0],Path(tmp))
              for name,path in files.items():
                  result=subprocess.run([helper,"--check-map",str(path),name],check=False,capture_output=True,timeout=5)
                  assert result.returncode==0 and b"T3_EXPLICIT_MAP_SYNTAX_ACCEPTED_ONLY" in result.stdout
              bad=Path(tmp)/"invalid.map"
              bad.write_text(files["A"].read_text().replace("T3MAP1 V A","T3MAP1 V B",1))
              assert subprocess.run([helper,"--check-map",str(bad),"A"],check=False,capture_output=True,timeout=5).returncode!=0
              lines=files["A"].read_text().splitlines()
              parts=lines[2].split()
              duplicate=lines[1].split()
              parts[-2:]=duplicate[-2:]
              lines[2]=" ".join(parts)
              bad.write_text("\n".join(lines)+"\n")
              assert subprocess.run([helper,"--check-map",str(bad),"A"],check=False,capture_output=True,timeout=5).returncode!=0
              bad.write_text(files["A"].read_text()+"GARBAGE\n")
              assert subprocess.run([helper,"--check-map",str(bad),"A"],check=False,capture_output=True,timeout=5).returncode!=0
          print("T3_VKD3D_PUBLIC_C_ABI_COMPILES=true SYNTHETIC_MAP_ACCEPT_REJECT=true")
          PY
