name: T3 smoke Pass v2 metadata regression (source only)
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-t3-smoke-pass-v2-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t3-smoke-pass-v2-source-regression-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
      - name: Run all strict metadata-only Pass v2 regression controls
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t3_smoke_pass_state_gate_v2.py tests/test_t3_smoke_pass_state_gate_v2.py
          python3 -m unittest discover -s tests -p 'test_t3_smoke_pass_state_gate_v2.py' -v
          echo 'T3_SMOKE_V2_SYNTHETIC_ONLY=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'No original shader, ZIP2, AssetRipper, Unity, APK, GPU or phone pixels were tested.' >> "$GITHUB_STEP_SUMMARY"
