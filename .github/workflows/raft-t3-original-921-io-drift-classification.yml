name: T3 RENDER-002 genuine original 921 Shader48 SPIRV stage IO drift classification
# The earlier CI42052605123 validated real DXBC-SPV-HLSL-SPV but
# showed source-to-roundtrip stage I/O location/type arrays 0/8 identical.
# New DISTINCT source question: numeric-only source input vs output relocation,
# type changes, slot losses, and type-multiset equality using scheduled T3 helper.
# Original source code/bytes, private HLSL or SPIRV never leave disposable runner.
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-t3-original-921-io-drift-classification.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raft-t3-original-921-SPIRV-stage-IO-drift-classify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  classify-real-source-SPIRV-roundtrip-io:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - name: Source-free exact original Renderer and class48 join controls
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t3_original_renderer_shader_impact.py scripts/t3_original_top_shader_dxbc_feasibility.py scripts/t3_original_top_shader_fourpass_translation.py scripts/t3_stage_io_drift.py tests/test_t3_original_top_shader_fourpass_translation.py tests/test_t3_stage_io_drift.py
          python3 -m unittest discover -s tests -p 'test_t3_stage_io_drift.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_original_top_shader_fourpass_translation.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_original_top_shader_dxbc_feasibility.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_original_renderer_shader_impact.py' -v
          python3 -m unittest discover -s tests -p 'test_b03_original_renderer_materials.py' -v
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: zip2-source
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/level0
            Raft/Raft_Data/level1
            Raft/Raft_Data/level2
            Raft/Raft_Data/level3
            Raft/Raft_Data/level4
            Raft/Raft_Data/level5
      - name: Select exact four needed original Material and Shader owner serialized files
        run: |
          set -euo pipefail
          git -C zip2-source sparse-checkout set --no-cone -- \
            '/RAFT_FILE_MANIFEST.tsv' \
            '/Raft/Raft_Data/level0' \
            '/Raft/Raft_Data/level1' \
            '/Raft/Raft_Data/level2' \
            '/Raft/Raft_Data/level3' \
            '/Raft/Raft_Data/level4' \
            '/Raft/Raft_Data/level5' \
            '/Raft/Raft_Data/resources.assets/*' \
            '/Raft/Raft_Data/sharedassets0.assets/*' \
            '/Raft/Raft_Data/sharedassets1.assets' \
            '/Raft/Raft_Data/sharedassets6.assets'
          test "$(git -C zip2-source rev-parse HEAD)" = 15964ea8f246b6e076ce26b60931ee2e1a9a2385
      - name: SHA-verify real ZIP2 six scenes and reassemble exact four pinned owners
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import stage
          from scripts.a12_probe_original_blur_passes import SHADER_OWNERS
          from scripts.b21_scene_lightmap_links import PIN,verify_source
          from scripts.t3_original_renderer_shader_impact import SHADER_OWNERS_SELECTED
          zip2=Path('zip2-source')
          roots=Path(os.environ['RUNNER_TEMP'])/'t3-original-six-scene'
          pins={'Raft_Data/'+n:SHADER_OWNERS[n] for n in SHADER_OWNERS_SELECTED}
          result=stage(zip2,roots,pins)
          assert len(result['owners'])==4 and result['verified_bytes']==269007288 and not result['lfs_used']
          dst=roots/'Raft_Data'
          for scene,pin in PIN.items():
              source=zip2/'Raft/Raft_Data'/scene
              verify_source(source,pin)
              target=dst/scene
              if target.exists() or target.is_symlink():raise ValueError('scene_stage_collision')
              with source.open('rb') as s, target.open('xb') as t:
                  while block:=s.read(1024*1024):t.write(block)
              verify_source(target,pin)
          print('RAFT_T3_ORIGINAL_6_SCENES_SHA_VERIFIED=6 four_owner_SHA=4 assembled_owner_bytes=269007288')
          PY
      - name: Count real original Shader48 used by six scene Renderer Material slots
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.23.0
          python3 -m scripts.t3_original_renderer_shader_impact \
            --original "$RUNNER_TEMP/t3-original-six-scene" \
            --manifest zip2-source/RAFT_FILE_MANIFEST.tsv \
            --out "$RUNNER_TEMP/t3-original-six-scene-shader-usage-aggregate.json"
      - name: Install CPU-only original DXBC translation and SPIRV reflection tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
          dpkg-query -W vkd3d-compiler spirv-tools spirv-cross glslang-tools
      - name: Verify high-use Shader48 authentic original D3D11 vertex and fragment variant linkage without leaking programs
        run: |
          set -euo pipefail
          timeout 420s python3 -m scripts.t3_original_top_shader_dxbc_feasibility \
            --original "$RUNNER_TEMP/t3-original-six-scene" \
            --manifest zip2-source/RAFT_FILE_MANIFEST.tsv \
            --out "$RUNNER_TEMP/t3-original-921-source-dxbc-feasibility-safe.json"
      - name: Classify actual original D3D11 stage source versus HLSL-roundtrip SPIRV IO location type drift
        run: |
          set -euo pipefail
          timeout 540s python3 -m scripts.t3_original_top_shader_fourpass_translation \
            --original "$RUNNER_TEMP/t3-original-six-scene" \
            --manifest zip2-source/RAFT_FILE_MANIFEST.tsv \
            --out "$RUNNER_TEMP/t3-original-921-fourpass-IO-drift-aggregate-safe.json" \
            --classify-io-drift
      - name: Upload only original high-use compiled program aggregate and source verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-authentic-original-921-stage-IO-drift-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/t3-original-six-scene-shader-usage-aggregate.json
            ${{ runner.temp }}/t3-original-921-source-dxbc-feasibility-safe.json
            ${{ runner.temp }}/t3-original-921-fourpass-IO-drift-aggregate-safe.json
          if-no-files-found: ignore
          retention-days: 7
