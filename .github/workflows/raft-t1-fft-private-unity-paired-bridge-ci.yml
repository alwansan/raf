name: T1 WATER-001 source-only original-SPIRV vs Unity private paired capture controls

on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-t1-fft-private-unity-paired-bridge-ci.yml
      - scripts/t1_fft_private_unity_paired_capture.py
      - tests/test_t1_fft_private_unity_paired_capture.py

permissions:
  contents: read

concurrency:
  group: t1-source-only-original-unity-pair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-only-private-capture-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout source-only FFT pairing controls, not original Raft
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
      - name: Enforce direct original-SPIRV, physical input and GPU CopyInput guards
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_t1_fft_private_unity_paired_capture.py -v
          python3 -m unittest discover -s tests -p test_t1_fft_private_unity_input_join.py -v
          python3 -m py_compile scripts/t1_fft_private_unity_paired_capture.py
          echo 'RAFT_T1_PRIVATE_ORIGINAL_UNITY_BRIDGE sourcefree_guard_passed=true actual_original_zip2_unity_gpu_ran=false'
