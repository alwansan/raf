name: B05 RENDER-002 Material texture binding fidelity (synthetic)
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/b05_verify_material_texenv_bindings.py
      - tests/test_b05_verify_material_texenv_bindings.py
      - .github/workflows/raft-b05-material-texenv-fidelity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raft-b05-material-texenv-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  synthetic-original-export-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/b05_verify_material_texenv_bindings.py
            scripts/b44_verify_material_colors.py
            tests/test_b05_verify_material_texenv_bindings.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Syntax check and 11 source-free fidelity controls
        run: |
          python -m py_compile scripts/b05_verify_material_texenv_bindings.py
          python -m unittest discover -s tests -p 'test_b05_verify_material_texenv_bindings.py' -v

# No original assets or proprietary source in checkout/artifacts.
# A green run does not prove any actual Material, shader/GPU or Android output.
