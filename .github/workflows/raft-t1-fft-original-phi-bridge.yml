name: T1 WATER-001 source-safe original Input vs translated Phi evidence bridge

on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-t1-fft-original-phi-bridge.yml
      - scripts/t1_fft_original_phi_bridge.py
      - tests/test_t1_fft_original_phi_bridge.py
      - scripts/t1_fft_historical_ci_log_verify.py
      - tests/test_t1_fft_historical_ci_log_verify.py
      - tests/data/t1_fft_original_phi_evidence_public.json

permissions:
  contents: read
  actions: read

concurrency:
  group: t1-water001-source-only-original-phi-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  safe-source-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout only public source-free verified evidence tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
      - name: Validate fail-closed SHA-pinned historical FFT evidence schema
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_t1_fft_original_phi_bridge.py -v
          python3 -m unittest discover -s tests -p test_t1_fft_historical_ci_log_verify.py -v
          python3 -m py_compile scripts/t1_fft_original_phi_bridge.py scripts/t1_fft_historical_ci_log_verify.py
      - name: Classify public CI evidence boundaries without claiming original GPU parity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.t1_fft_original_phi_bridge \
            --evidence tests/data/t1_fft_original_phi_evidence_public.json
          echo 'RAFT_T1_FFT_ORIGINAL_PHI_BACKEND original_assets_acquired=false real_unity_original_fft_executed=false full_game_water_fixed=false'

      - name: Verify three immutable historical CI job logs against safe evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          # Do not echo or upload the raw log, original shader, private GPU data,
          # GitHub token, signed redirect, or decoded proprietary identifiers.
          for entry in \
            "original 42220554705 127901229510" \
            "candidate 42228497335 127928005249" \
            "synthetic_unity 42279949574 128106388433"
          do
            read -r name run job <<< "$entry"
            gh api "repos/alwansan/raf/actions/runs/$run" > "$d/$name-run" 2>/dev/null ||
              { echo 'T1 historical run metadata unavailable'; exit 1; }
            gh api "repos/alwansan/raf/actions/jobs/$job" > "$d/$name-job" 2>/dev/null ||
              { echo 'T1 historical job metadata unavailable'; exit 1; }
            # REST job-log endpoint returns an ephemeral signed cross-host redirect.
            # curl -L follows it without forwarding authorization to the other host.
            curl -fsSL --retry 2 --connect-timeout 15 --max-time 70 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/alwansan/raf/actions/jobs/$job/logs" \
              -o "$d/$name-log" 2>/dev/null ||
              { echo 'T1 historical job log unavailable'; exit 1; }
          done
          python3 -m scripts.t1_fft_historical_ci_log_verify \
            --evidence tests/data/t1_fft_original_phi_evidence_public.json \
            --original-run "$d/original-run" \
            --original-job "$d/original-job" \
            --original-log "$d/original-log" \
            --candidate-run "$d/candidate-run" \
            --candidate-job "$d/candidate-job" \
            --candidate-log "$d/candidate-log" \
            --synthetic_unity-run "$d/synthetic_unity-run" \
            --synthetic_unity-job "$d/synthetic_unity-job" \
            --synthetic_unity-log "$d/synthetic_unity-log"
