name: Raft W1 original shader objects and material links (CPU only)
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - 'scripts/w1_probe_original_shader_links.py'
      - 'tests/test_w1_original_shader_links.py'
      - '.github/workflows/raft-w1-original-shader-links.yml'
permissions:
  contents: read
concurrency:
  group: raft-w1-original-shader-links-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-pointer-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
            android-port/Experiments/W1EngineDatabase
      - name: Negative identity and graph controls before acquisition
        run: |
          python3 -m unittest discover -s tests -p test_w1_original_shader_links.py -v
          python3 -c "import shutil; assert shutil.disk_usage('.').free > 3 * 1024**3"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/checkout@v4
        with:
          repository: nowl-it/AssetRipperCLI
          ref: 036098ab525a3f9f693dc101edeb21faad4d32d8
          path: ar-host
          persist-credentials: false
          sparse-checkout: |
            Source/AssetRipper.Assets
            Source/AssetRipper.IO.Files
      - name: Reuse public exact-reader NuGet dependencies across CPU probes
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: w1-exact-reader-nuget-${{ runner.os }}-036098ab-v1-${{ hashFiles('android-port/Experiments/W1EngineDatabase/*.csproj', 'android-port/Experiments/W1EngineDatabase/Program.cs') }}
      - name: Obtain private exact embedded database from pinned generated assembly
        run: dotnet run --project android-port/Experiments/W1EngineDatabase/W1EngineDatabase.csproj -c Release -- "$RUNNER_TEMP/w1-engine-database-private.json" "$RUNNER_TEMP/w1-exact-reader-summary.json"
      - name: Reuse authenticated full original shader-owner cache first
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/w1-original
          key: w1-zip2-15964ea8-shader-and-engine-owners-v1
          restore-keys: |
            w1-zip2-15964ea8-full-shader-owners-v1
            w1-zip2-15964ea8-four-owners-v1
      - name: Plan only missing original providers
        id: needed
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.w1_full_engine_sources import acquisition_plan
          from scripts.w1_stage_zip2_owners import PINS,fingerprint
          root=Path(os.environ['RUNNER_TEMP'])/'w1-original'
          paths,missing=acquisition_plan(root)
          for relative,pin in PINS.items():
              if '/Resources/' not in relative: continue
              cached=root/relative
              if cached.exists():
                  if cached.is_symlink() or fingerprint(cached)!=pin:
                      raise SystemExit('Conflicting cached original engine provider')
              else:
                  paths.append('Raft/'+relative)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('paths<<W1_SOURCE_PATHS\n'+'\n'.join(paths)+'\nW1_SOURCE_PATHS\n')
          print('RAFT_W1_SHADER_ENGINE_PLAN sourceOwners=16 missing='+str(len(paths)-1))
          PY
      - uses: actions/checkout@v4
        with:
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: zip2-original
          filter: blob:none
          lfs: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ steps.needed.outputs.paths }}
      - name: Authenticate all original shader providers without LFS
        run: |
          python3 -m scripts.w1_full_engine_sources --zip2-checkout zip2-original --destination "$RUNNER_TEMP/w1-original"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import PINS,stage
          selected={relative:pin for relative,pin in PINS.items() if '/Resources/' in relative}
          result=stage(Path('zip2-original'),Path(os.environ['RUNNER_TEMP'])/'w1-original',selected)
          print('RAFT_W1_CANONICAL_SHADER_SOURCE '+json.dumps(result,sort_keys=True))
          PY
      - name: Inspect165original Shader objects and original Material Shader PPtrs
        run: |
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
          python3 -m scripts.w1_probe_original_shader_links --source "$RUNNER_TEMP/w1-original" --private-database "$RUNNER_TEMP/w1-engine-database-private.json" --reader-summary "$RUNNER_TEMP/w1-exact-reader-summary.json" --out "$RUNNER_TEMP/w1-original-shader-links.json"
      - name: Retain aggregate proof only; no original or private assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1-original-shader-links-${{ github.sha }}
          path: |
            ${{ runner.temp }}/w1-exact-reader-summary.json
            ${{ runner.temp }}/w1-original-shader-links.json
          if-no-files-found: ignore
          retention-days: 7
