            Raft/Raft_Data/sharedassets37.assets
            Raft/Raft_Data/sharedassets38.assets
            Raft/Raft_Data/sharedassets39.assets

      - name: Materialize exact SHA-authenticated 82 Unity serialized owners (no LFS or raw upload)
        run: |
          set -euo pipefail
          test "$(git -C .gt-zip2 rev-parse HEAD)" = 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          python3 -m scripts.gt_stage_serialized_owners \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --source .gt-zip2/Raft/Raft_Data \
            --destination "$RUNNER_TEMP/gt-original-82-shader-owners" \
            --report "$RUNNER_TEMP/gt-original-82-source-proof-private.json" > "$RUNNER_TEMP/gt-original-82-source-private.log"
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.23.0


      - name: Translate 134 programs and compose all 1156 source routes privately
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
          timeout 6000s python3 -m scripts.gt_next23b_private_stage_translation \
            --original "$RUNNER_TEMP/gt-original-82-shader-owners" \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --quality "$RUNNER_TEMP/gt-next23b-post23-quality.json" \
            --private "$RUNNER_TEMP/gt-next23b-private-stages" \
            --engine-keywords \
            --out "$RUNNER_TEMP/gt-next23b-private-stage-safe.json" \
            > "$RUNNER_TEMP/gt-next23b-private-compiler.log" 2>&1

      - name: Prepare isolated source-only Unity project
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/gt-next23b-full-export-unity"
          work="$RUNNER_TEMP/gt-next23b-private-stages"
          mkdir -p "$project/Assets/Editor" "$project/Packages" "$project/ProjectSettings"
          cp "$work/original-next23b-Shader48-private.shader" "$project/Assets/GTNext23b.shader"
          cp "$work/Next23bEngineRoutes.json" "$project/Next23bEngineRoutes.json"
          cp android-port/Experiments/GT/Editor/Next23bShaderValidation.cs "$project/Assets/Editor/"
          printf '%s\n' '{"dependencies":{}}' > "$project/Packages/manifest.json"
          printf '%s\n' 'm_EditorVersion: 2021.3.45f2' > "$project/ProjectSettings/ProjectVersion.txt"
      - name: Compile exact original next23b Shader48 in isolated Unity 2021 Android Vulkan (NO APK)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f2
          projectPath: gt-next23b-full-export-unity
          targetPlatform: Android
          buildMethod: RaftGT.Next23bShaderValidation.Validate
          versioning: None
          allowDirtyBuild: true
          dockerMemoryLimit: 12g
          customParameters: -job-worker-count 2
      - name: Verify exact source next23b Vulkan 1156-route VS/FS original bundle and candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/gt-next23b-full-export-unity"
          smolv="$RUNNER_TEMP/gt-next23b-full-export-smolv"
          mkdir -p "$smolv"
          upstream=https://raw.githubusercontent.com/aras-p/smol-v/6303e979b59153ee7007fd14e06d3fed8687b64c/source
          curl -fsSL "$upstream/smolv.cpp" -o "$smolv/smolv.cpp"
          curl -fsSL "$upstream/smolv.h" -o "$smolv/smolv.h"
          c++ -std=c++11 -O2 -I"$smolv" scripts/gt_decode_smolv.cpp "$smolv/smolv.cpp" -o "$smolv/decode"
          python3 -m scripts.gt_verify_921_shader_bundle \
            --bundle "$project/ProbeResults/Private/gt-next23b" \
            --source "$project/Assets/GTNext23b.shader" \
            --receipt "$project/ProbeResults/gt-next23b-unity-safe.json" \
            --smolv-decoder "$smolv/decode" --next23b \
            --engine-route-manifest "$project/Next23bEngineRoutes.json" \
            --source-variant-manifest "$RUNNER_TEMP/gt-next23b-private-stages/original-private-variant-manifest.json" \
            --out "$RUNNER_TEMP/gt-next23b-full-export-bundle-safe.json"

      - name: Publish numeric-only translation and composition proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-next23b-private-stage-safe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gt-next23b-private-stage-safe.json
            gt-next23b-full-export-unity/ProbeResults/gt-next23b-unity-safe.json
            ${{ runner.temp }}/gt-next23b-full-export-bundle-safe.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove private original source owners, name digests and shader bytes
        if: always()
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/gt-next23b-private-stages" \
                 "$RUNNER_TEMP/gt-next23b-private-compiler.log" \
                 "$RUNNER_TEMP/gt-original-82-shader-owners" \
                 "$RUNNER_TEMP/gt-next23b-real-post23-quality" \
                 "$RUNNER_TEMP/gt-next23b-post23-quality.json" \
                 "$RUNNER_TEMP/gt-original-82-source-proof-private.json" \
                 "$RUNNER_TEMP/gt-original-82-source-private.log"
          sudo rm -rf "$GITHUB_WORKSPACE/gt-next23b-full-export-unity"
          rm -rf .gt-zip2
