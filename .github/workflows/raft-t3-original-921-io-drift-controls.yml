name: T3 RENDER-002 authentic fourpass source SPIRV IO drift opt-in synthetic controls
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/t3_original_top_shader_fourpass_translation.py
      - tests/test_t3_original_top_shader_fourpass_translation.py
      - scripts/t3_stage_io_drift.py
      - tests/test_t3_stage_io_drift.py
      - .github/workflows/raft-t3-original-921-io-drift-controls.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raft-t3-io-drift-opt-in-synthetic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-free-io-classifier-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
      - name: Stage I/O classifier + original source translator opt-in regression controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t3_original_top_shader_fourpass_translation.py scripts/t3_stage_io_drift.py tests/test_t3_original_top_shader_fourpass_translation.py tests/test_t3_stage_io_drift.py
          python3 -m unittest discover -s tests -p 'test_t3_stage_io_drift.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_original_top_shader_fourpass_translation.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_original_top_shader_dxbc_feasibility.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_original_renderer_shader_impact.py' -v
          python3 -m unittest discover -s tests -p 'test_b03_original_renderer_materials.py' -v
