name: T3 RENDER-002 genuine smoke34 PS readmask vs source/roundtrip SPIR-V lanes (NO APK)
# Independent authentic source question: original DXBC PS ReadWriteMask vs SPIR-V input cardinality.
# Original program bytes/names are held only under disposable RUNNER_TEMP.
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-t3-original-smoke34-ps-readmask-spv.yml
      - scripts/t3_original_smoke34_ps_readmask_spirv.py
      - tests/test_t3_original_smoke34_ps_readmask_spirv.py
permissions:
  contents: read
concurrency:
  group: t3-smoke34-PS-readmask-source-vs-roundtrip-SPV-sha15964-two-pairs
  cancel-in-progress: false

jobs:
  original-smoke34-ps-readmask-spv:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Checkout source-only scripts and regression controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests

      - name: Run source-free read-mask, DXBC parser and shader permutation regressions first
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t3_original_smoke34_ps_readmask_spirv.py tests/test_t3_original_smoke34_ps_readmask_spirv.py
          python3 -m unittest discover -s tests -p 'test_t3_original_smoke34_ps_readmask_spirv.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_original_921_dxbc_semantic_join.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_original_smoke34_dxbc_program_inventory.py' -v

      - name: Checkout SHA-immutable ZIP2 original source without LFS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: zip2-source
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/level0
            Raft/Raft_Data/level1
            Raft/Raft_Data/level2
            Raft/Raft_Data/level3
            Raft/Raft_Data/level4
            Raft/Raft_Data/level5

      - name: Select exact SHA-original four Shader owners and six scenes
        run: |
          set -euo pipefail
          git -C zip2-source sparse-checkout set --no-cone -- \
            '/RAFT_FILE_MANIFEST.tsv' \
            '/Raft/Raft_Data/level0' '/Raft/Raft_Data/level1' \
            '/Raft/Raft_Data/level2' '/Raft/Raft_Data/level3' \
            '/Raft/Raft_Data/level4' '/Raft/Raft_Data/level5' \
            '/Raft/Raft_Data/resources.assets/*' \
            '/Raft/Raft_Data/sharedassets0.assets/*' \
            '/Raft/Raft_Data/sharedassets1.assets' \
            '/Raft/Raft_Data/sharedassets6.assets'
          test "$(git -C zip2-source rev-parse HEAD)" = 15964ea8f246b6e076ce26b60931ee2e1a9a2385

      - name: Reassemble authenticated six original scenes and four serialized owners
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import stage
          from scripts.a12_probe_original_blur_passes import SHADER_OWNERS
          from scripts.b21_scene_lightmap_links import PIN, verify_source
          from scripts.t3_original_renderer_shader_impact import SHADER_OWNERS_SELECTED
          zip2=Path("zip2-source")
          target=Path(os.environ["RUNNER_TEMP"])/"t3-smoke34-private-PS-readmask"
          only={"Raft_Data/"+name:SHADER_OWNERS[name] for name in SHADER_OWNERS_SELECTED}
          report=stage(zip2,target,only)
          assert len(report["owners"]) == 4
          assert report["verified_bytes"] == 269007288
          assert report["lfs_used"] is False
          for scene,pin in PIN.items():
              source=zip2/"Raft"/"Raft_Data"/scene
              verify_source(source,pin)
              destination=target/"Raft_Data"/scene
              if destination.exists() or destination.is_symlink():
                  raise ValueError("private_source_stage_collision")
              with source.open("rb") as src,destination.open("xb") as dst:
                  while chunk := src.read(1024*1024):
                      dst.write(chunk)
              verify_source(destination,pin)
          assert len(PIN)==6
          print("T3_ORIGINAL_SMOKE34_READMASK_SOURCES_SHA_VERIFIED=true")
          PY

      - name: Install original source-only shader translation and reflection dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.23.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
          dpkg-query -W vkd3d-compiler spirv-tools spirv-cross glslang-tools

      - name: Count genuine original compiled PS used lanes against both SPIR-V stages
        run: |
          set -euo pipefail
          timeout 570s python3 -m scripts.t3_original_smoke34_ps_readmask_spirv \
            --original "$RUNNER_TEMP/t3-smoke34-private-PS-readmask" \
            --manifest zip2-source/RAFT_FILE_MANIFEST.tsv \
            --out "$RUNNER_TEMP/t3-smoke34-PS-readmask-SPV-safe.json"

      - name: Verify contract without asserting semantic map or equal lane counts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.t3_original_smoke34_ps_readmask_spirv import FIELDS, STATUS
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"t3-smoke34-PS-readmask-SPV-safe.json").read_text())
          assert report["schema_version"] == 1 and report["status"] == STATUS
          assert report["source_SHA_scene_count"] == 6 and report["source_SHA_owner_count"] == 4
          assert report["original_exact_keyword_matched_pairs"] == 2
          c=report["counts"]
          assert set(c) == set(FIELDS)
          assert all(type(v) is int and 0 <= v <= 4096 for v in c.values())
          assert c["passes_examined"] == 2
          assert c["source_ps_user_semantic_records"] == 7
          assert c["source_ps_declared_component_lanes"] == 28
          assert 0 <= c["source_ps_read_component_lanes"] <= 28
          assert c["source_ps_declared_but_unread_component_lanes"] == 28 - c["source_ps_read_component_lanes"]
          assert c["source_ps_unmatched_vertex_output_semantics"] == 0
          assert c["source_ps_read_component_lanes_not_covered_by_original_vertex_output"] == 0
          assert all(0 <= c[k] <= 2 for k in (
              "passes_readmask_equals_source_spirv_input_lane_count",
              "passes_readmask_equals_roundtrip_spirv_input_lane_count",
              "passes_source_spirv_equals_roundtrip_spirv_input_lane_count"))
          assert report["original_DXBC_VS_FS_semantic_identity_checked"] is True
          for key in ("DXBC_semantic_to_SPIRV_Location_Component_mapping_verified",
                      "original_DXBC_readmask_equals_SPIRV_component_identity_verified",
                      "interpolation_texture_alpha_ShaderLab_or_pixels_verified",
                      "Unity_Android_Adreno_device_smoke_verified",
                      "original_compiled_shaders_names_registers_or_paths_published",
                      "game_assets_modified"):
              assert report[key] is False
          print("T3_GENUINE_SHA_SMOKE34_PS_READMASK_SPIRV_LANES_CLASSIFIED=true")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("## T3 original smoke34 PS DXBC ReadMask vs SPIR-V lanes\\n\\n")
              out.write("Source-only cardinality classified. Matching counts neither imply semantic mapping nor Android pixel parity.\\n")
          PY

      - name: Upload source-safe aggregate PS ReadMask-vs-SPIR-V lane counts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-smoke34-PS-readmask-SPV-safe-${{ github.run_id }}
          path: ${{ runner.temp }}/t3-smoke34-PS-readmask-SPV-safe.json
          if-no-files-found: ignore
          retention-days: 7
