name: GFX-MULTI-009 original Shader48 compiled platform proof / no APK
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths: ['.github/workflows/gfxlab-multi-compiled-platform-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfxlab-multi009-source
  cancel-in-progress: false
jobs:
  original-private-platform-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            gfxlab/tools
            gfxlab/tests
      - name: Unit and fail-closed tests
        run: |
          set -euo pipefail
          python3 -m py_compile gfxlab/tools/multi_shader_compiled_platform.py
          python3 -m unittest discover -s gfxlab/tests -p 'test_*.py' -v
      - uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: source-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/resources.assets/*
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/sharedassets6.assets
      - name: Read private original compressed Shader48 programs and publish counts only
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
          python3 -m gfxlab.tools.multi_shader_compiled_platform --zip2 source-zip2 --stage "$RUNNER_TEMP/gfxlab-multi009-private" --out gfxlab-multi009-safe-summary.json
          python3 - <<'PY'
          import json
          d=json.load(open('gfxlab-multi009-safe-summary.json'))
          assert d['models']==6 and d['materials']==7
          assert d['verified_typed_original_shader48']
          assert not d['original_android_shader_restored'] and not d['stage_closed']
          assert not d['original_shader_binary']['source_native_programs_recovered_to_public_git']
          print('GFX_MULTI009_ORIGINAL_SOURCE_PROGRAM_COUNT_ONLY')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gfxlab-multi009-safe-compiled-source-counts
          path: gfxlab-multi009-safe-summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Purge original source and compiled private programs
        if: always()
        run: |
          sudo rm -rf source-zip2 "$RUNNER_TEMP/gfxlab-multi009-private"
          echo GFX_MULTI009_COMPRESSED_PROGRAM_BYTES_PURGED=true
