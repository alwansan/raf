            Raft/Raft_Data/sharedassets39.assets

      - name: Materialize exact SHA-authenticated 82 Unity serialized owners (no LFS or raw upload)
        run: |
          set -euo pipefail
          test "$(git -C .gt-zip2 rev-parse HEAD)" = 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          python3 -m scripts.gt_stage_serialized_owners \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --source .gt-zip2/Raft/Raft_Data \
            --destination "$RUNNER_TEMP/gt-original-82-shader-owners" \
            --report "$RUNNER_TEMP/gt-original-82-source-proof-private.json" > "$RUNNER_TEMP/gt-original-82-source-private.log"
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.23.0

      - name: Probe 16 highest remaining original Shader48 D3D11 source topologies only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.gt_probe_remaining_original_shader_dxbc_topology \
            --original "$RUNNER_TEMP/gt-original-82-shader-owners" \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --quality "$RUNNER_TEMP/gt-post14-verified-quality.json" \
            --expected-dummy-materials 216 --top 16 \
            --out "$RUNNER_TEMP/gt-post14-original-shader-topology-safe.json"
          python3 - <<'PY_GT_POST14_OUTPUT'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ["RUNNER_TEMP"])/"gt-post14-original-shader-topology-safe.json").read_text())
          assert q["status"]=="GT_TOP_REAL_DUMMY_MATERIAL_SHADER48_ORIGINAL_D3D11_PASS_TOPOLOGY_PROBED"
          assert q["verified_real_export_dummy_material_scope"]==216
          assert q["original_Shader48_distinct_source_objects"]==165
          assert q["original_owners_with_original_Shader48"]==14
          assert q["top_original_dummy_Material_shader_targets_requested"]==16
          assert len(q["top_real_source_D3D11_topology_by_rank"])==16
          assert q["source_exact_export_GUID_inferred_from_name"] is False
          assert q["source_program_translation_or_Vulkan_compilation_performed"] is False
          assert q["APK_OBB_XAPK_created"] is False
          print("GT_ORIGINAL_POST14_82OWNER_SHADERS_PRIORITIZED top16=true noAPK=true")
          PY_GT_POST14_OUTPUT
      - name: Publish anonymous actual original 216-Dummy Shader48 D3D11 topology census only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-post14-original-216-Dummy-shader-topology-${{ github.run_id }}
          path: ${{ runner.temp }}/gt-post14-original-shader-topology-safe.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Delete private original ZIP2 owners and all source metadata
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/gt-original-82-shader-owners" .gt-zip2
