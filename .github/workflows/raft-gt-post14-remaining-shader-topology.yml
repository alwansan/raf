name: GT source-probe next unresolved Shader48 after 14 original restores (NO APK)

on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/gt_probe_remaining_original_shader_dxbc_topology.py
      - tests/test_gt_probe_remaining_original_shader_dxbc_topology.py
      - .github/workflows/raft-gt-post14-remaining-shader-topology.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gt-post14-original-shader-topology-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-82-post14-topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - name: Reject forged 216-material rank and original Shader48 duplicate name equivalence
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/gt_probe_remaining_original_shader_dxbc_topology.py
          python3 -m unittest discover -s tests -p test_gt_probe_remaining_original_shader_dxbc_topology.py -v
      - name: Import the accepted post14 actual 216-Dummy complete export material audit
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43773151176
          name: gt-fourteen-next30-source-shader-full-export-audit-43773151176
          path: ${{ runner.temp }}/gt-original-post14-material-quality
      - name: Verify original complete post14 material population before inspecting Shader48 program sources
        run: |
          set -euo pipefail
          python3 - <<'PY_GT_POST14_BASELINE'
          import json,os,shutil
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"gt-original-post14-material-quality"
          matches=[p for p in root.rglob("gt-fourteen-shader-postrestore-quality.json")
                   if p.is_file() and not p.is_symlink()]
          if len(matches)!=1:
              raise ValueError("ambiguous_or_missing_real_post14_GitHub_artifact_quality_json")
          p=matches[0]
          q=json.loads(p.read_text())
          shutil.copyfile(p,Path(os.environ["RUNNER_TEMP"])/"gt-post14-verified-quality.json")
          c=q["counts"]
          assert q["status"]=="NATIVE_MATERIAL_SHADER_PROGRAM_AUDIT_ONLY"
          assert c["material_documents"]==1536 and c["material_docs_using_Unity_builtin_Shader"]==750
          assert c["material_docs_using_local_custom_Shader"]==786
          assert c["material_docs_using_dummy_Shader"]==216
          assert c["material_docs_using_non_dummy_Shader"]==570
          assert c["distinct_dummy_Shader_targets_referenced"]==46
          assert c["material_docs_with_unknown_or_broken_Shader"]==0
          assert sum(q["dummy_shader_material_counts_by_name_digest"].values())==216
          print("GT_POST14_REAL_EXPORT_216_MATERIAL_46_GUID_BASELINE_ACCEPTED noAPK=true")
          PY_GT_POST14_BASELINE
      - name: Read immutable ZIP2 serialized owner files only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: .gt-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/globalgamemanagers.assets
            Raft/Raft_Data/resources.assets
            Raft/Raft_Data/level0
