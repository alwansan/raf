name: T5 INTEGRATION-001 installed OBB Unity first-byte source probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-native-port
    paths:
      - 'android-port/Runtime/Platform/AndroidExpansionArchiveProbe.cs'
      - 'android-port/Runtime/Platform/AndroidTestDiagnostics.cs'
      - '.github/workflows/raft-unity-editor-android-import.yml'
      - 'android-port/Tests/ExpansionArchiveProbe/**'
      - '.github/workflows/raft-t5-installed-obb-read-probe.yml'

permissions:
  contents: read

concurrency:
  group: t5-installed-obb-read-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            android-port/Runtime/Platform
            android-port/Tests/ExpansionArchiveProbe
            .github/workflows
          sparse-checkout-cone-mode: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Guard actual Unity Android source-copy integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          native=Path('.github/workflows/raft-unity-editor-android-import.yml').read_text()
          lines=[line.strip() for line in native.splitlines()
                 if line.strip().startswith('for name in AndroidStreamingAssets.cs ')]
          assert len(lines)==1, 'unexpected Unity platform copy-loop cardinality'
          names=lines[0].split(';',1)[0].split()[3:]
          assert names.count('AndroidExpansionArchiveProbe.cs')==1, 'probe omitted or duplicated in Unity import'
          diagnostic=Path('android-port/Runtime/Platform/AndroidTestDiagnostics.cs').read_text()
          assert 'AndroidExpansionArchiveProbe.Inspect(' in diagnostic, 'runtime hook missing'
          print('T5_UNITY_IMPORT_COPY_PROBE status=PASS exact_file_once=true')
          PY
      - name: Compile actual pure production probe and run adversarial ZIP fixtures
        run: dotnet run --project android-port/Tests/ExpansionArchiveProbe/ExpansionArchiveProbe.csproj -c Release
      - name: Compile platform managed project (Unity Android-only implementation excluded)
        run: dotnet build android-port/Runtime/Platform/RaftAndroid.Platform.csproj -c Release
      - name: Report source-only boundary
        run: |
          echo 'T5: source-only compile and synthetic ZIP read proof. No phone OBB mount or Unity engine resource acceptance.'
