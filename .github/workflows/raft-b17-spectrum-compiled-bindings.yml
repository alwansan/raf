name: B17 WATER-001 original Spectrum compiled register parity
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - 'scripts/b17_spectrum_compiled_bindings.py'
      - 'tests/test_b17_spectrum_compiled_bindings.py'
      - '.github/workflows/raft-b17-spectrum-compiled-bindings.yml'
permissions:
  contents: read
concurrency:
  group: raft-b17-spectrum-compiled-register-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
      - name: B17 source-free compiled register controls
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/b17_spectrum_compiled_bindings.py tests/test_b17_spectrum_compiled_bindings.py
          python3 -m unittest discover -s tests -p 'test_b17_spectrum_compiled_bindings.py' -v
  original:
    needs: synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
      - name: Require scratch space
        run: |
          python3 - <<'PY'
          import shutil
          if shutil.disk_usage(".").free < 8 * 1024**3:
              raise SystemExit("Insufficient scratch space for authenticated original")
          PY
      - name: Checkout pinned original ZIP2 Git parts
        uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: .source-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/sharedassets0.assets
      - name: Verify original owner exact size and SHA256
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b17-original"
          python3 -m scripts.stage_zip2_fft_owner \
            --zip2-checkout .source-zip2 \
            --destination "$RUNNER_TEMP/b17-original/sharedassets0.assets"
      - name: Pin Unity original parser
        run: python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
      - name: Compare genuine original Spectrum compiled vs serialized registers
        run: |
          set -euo pipefail
          timeout 900s python3 -m scripts.b17_spectrum_compiled_bindings \
            --source "$RUNNER_TEMP/b17-original" \
            --out "$RUNNER_TEMP/b17-spectrum-compiled-numeric.json"
      - name: Delete private game data
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/b17-original" .source-zip2
      - name: Upload safe numeric aggregate only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b17-spectrum-compiled-numeric-${{ github.run_id }}
          path: ${{ runner.temp }}/b17-spectrum-compiled-numeric.json
          retention-days: 7
          if-no-files-found: ignore
