name: T1 WATER-001 Unity OpenGLCore computed-vs-buffered FFT float provenance 16-category GPU

on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-t1-fft-unity-address-provenance.yml
      - android-port/Experiments/T1/T1FftAddressProvenance.compute
      - android-port/Experiments/T1/T1FftAddressProvenanceTests.cs
      - scripts/t1_fft_address_provenance_gate.py
      - tests/test_t1_fft_address_provenance_gate.py

permissions:
  contents: read

concurrency:
  group: t1-fft-address_provenance-texture-load-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sourcefree-openglcore-texture-address_provenance:
    runs-on: ubuntu-24.04
    environment: UNITY_LICENSE
    concurrency:
      group: raft-native-engine-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 25
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CLI_SHA256: 1de550a620ee92e05e920b6db7d431621440b60b2577f04b4a997dc92a58cb0a
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Require real license and small isolated GPU test budget
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [ -z "${UNITY_LICENSE:-}" ] && { [ -z "${UNITY_SERIAL:-}" ] || [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; }; then
            echo 'RAFT_T1_ADDRESS_PROVENANCE_BACKEND missing_license_input=true'
            exit 1
          fi
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2{print $4}')" -gt 12582912
      - name: Sparse checkout sourcefree tests and fixture only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
            android-port/Experiments/T1
      - name: Validate authored sourcefree 16-category computed versus staged address matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_t1_fft_address_provenance_gate.py -v
          python3 -m unittest discover -s tests -p test_t1_sourcefree_unity_fixture.py -v
          echo 'RAFT_T1_ADDRESS_PROVENANCE_BACKEND synthetic_source_controls=true original_raft_acquired=false'
      - name: Authenticate pinned GameCI v0.1.72
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t1-address-provenance-cli"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/game-ci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz" \
            --output "$RUNNER_TEMP/t1-address-provenance-cli.tar.gz"
          echo "$CLI_SHA256  $RUNNER_TEMP/t1-address-provenance-cli.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/t1-address-provenance-cli.tar.gz" -C "$RUNNER_TEMP/t1-address-provenance-cli"
          find "$RUNNER_TEMP/t1-address-provenance-cli" -type f -name game-ci -print -quit > "$RUNNER_TEMP/t1-address-provenance-cli-path.txt"
          test -s "$RUNNER_TEMP/t1-address-provenance-cli-path.txt"
          chmod +x "$(cat "$RUNNER_TEMP/t1-address-provenance-cli-path.txt")"
      - name: Execute actual Unity2021 OpenGLCore one-dispatch 16-category computed and staged float context matrix
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 -m scripts.t1_sourcefree_unity_fixture --project t1-address-provenance-unity
          rm t1-address-provenance-unity/Assets/Tests/Editor/T1SourceFreeEditorTest.cs
          cp android-port/Experiments/T1/T1FftAddressProvenanceTests.cs \
            t1-address-provenance-unity/Assets/Tests/Editor/
          cp android-port/Experiments/T1/T1FftAddressProvenance.compute \
            t1-address-provenance-unity/Assets/T1Synthetic/
          cli="$(cat "$RUNNER_TEMP/t1-address-provenance-cli-path.txt")"
          set +e
          timeout 720s "$cli" test --docker --dockerShmSize=1025m --engine=unity \
            t1-address-provenance-unity --testPlatforms=editmode --engineVersion=2021.3.45f2 \
            --artifactsPath=t1-address-provenance-test-results \
            --containerRegistryRepository=unityci/editor --containerRegistryImageVersion=3 \
            > "$RUNNER_TEMP/t1-address-provenance-unity-private.log" 2>&1
          rc=$?
          set -e
          sudo chown -R "$(id -u):$(id -g)" t1-address-provenance-unity t1-address-provenance-test-results || true
          python3 -m scripts.t1_fft_address_provenance_gate \
            --xml t1-address-provenance-test-results/editmode-results.xml \
            --metrics t1-address-provenance-unity/t1-address-provenance-counts.txt \
            --exit-code "$rc"
          echo 'RAFT_T1_ADDRESS_PROVENANCE_BACKEND synthetic_gpu_test_complete=true original_raft_compared=false adreno_water_proven=false'
      - name: Erase synthetic Unity project, NUnit XML and captured private logs
        if: always()
        shell: bash
        run: |
          sudo rm -rf t1-address-provenance-unity t1-address-provenance-test-results
          rm -rf "$RUNNER_TEMP/t1-address-provenance-cli" "$RUNNER_TEMP/t1-address-provenance-cli.tar.gz"
          rm -f "$RUNNER_TEMP/t1-address-provenance-cli-path.txt" "$RUNNER_TEMP/t1-address-provenance-unity-private.log"
