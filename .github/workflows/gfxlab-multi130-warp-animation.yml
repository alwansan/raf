name: GFX130 animated M02 Forward on Windows D3D11 WARP
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths:
      - '.github/workflows/gfxlab-multi130-warp-animation.yml'
      - 'gfxlab/tools/gfx130_warp_animation.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfx130-warp-animation
  cancel-in-progress: false
jobs:
  windows-original-dxbc:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: source-zip2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/resources.assets/*
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/sharedassets6.assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare private original DXBC and material fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C source-zip2 rev-parse HEAD) -ne '15964ea8f246b6e076ce26b60931ee2e1a9a2385') { throw 'Source pin mismatch' }
          python -m pip install --disable-pip-version-check UnityPy==1.25.4 Pillow==11.3.0 numpy==2.3.5
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $p = Join-Path $env:RUNNER_TEMP 'gfx130-private'
          New-Item -ItemType Directory -Force "$p/captures" | Out-Null
          python -m gfxlab.tools.gfx130_warp_animation --zip2 source-zip2 --private "$p" --reference gfxlab/evidence/20261111_gfx130_mesa_pose_hashes.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m gfxlab.tools.gfx116_m02_bc3_source --zip2 source-zip2 --stage "$p/source" --private "$p/bc3" --safe "$p/texture-safe.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m gfxlab.tools.gfx116_bc3_sampling_pack --private "$p/bc3" --source "$p/texture-safe.json" --assets "$p/textures"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compile and execute Windows WARP
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSROOT=%%i"
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 gfxlab\windows-forward121\warp_forward.cpp /Fe:"%RUNNER_TEMP%\gfx130-private\warp.exe" /link d3d11.lib || exit /b 1
          "%RUNNER_TEMP%\gfx130-private\warp.exe" "%RUNNER_TEMP%\gfx130-private\draw" "%RUNNER_TEMP%\gfx130-private\textures" "%RUNNER_TEMP%\gfx130-private\captures" "%RUNNER_TEMP%\gfx130-private\poses" animation || exit /b 1
          python -m gfxlab.tools.gfx130_warp_animation --private "%RUNNER_TEMP%\gfx130-private" --reference gfxlab/evidence/20261111_gfx130_mesa_pose_hashes.json --safe gfx130-safe.json
      - uses: actions/upload-artifact@v4
        with:
          name: GFX130-Windows-WARP-animation-safe-result
          path: gfx130-safe.json
          if-no-files-found: error
          retention-days: 7
      - name: Purge original assets and Windows readback
        if: always()
        shell: pwsh
        run: Remove-Item -Force -Recurse -ErrorAction SilentlyContinue source-zip2, "$env:RUNNER_TEMP/gfx130-private"
