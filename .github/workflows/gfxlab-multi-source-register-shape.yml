name: GFX-MULTI-017 authentic Shader48 DXBC register operand shape no APK
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths: ['.github/workflows/gfxlab-multi-source-register-shape.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfxlab-multi017-private-registers
  cancel-in-progress: false
jobs:
  source-register-shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            gfxlab/tools
            gfxlab/tests
      - name: Source-free operand guard tests
        run: |
          set -euo pipefail
          python3 -m py_compile gfxlab/tools/multi_shader_register_operand_shape.py
          python3 -m unittest discover -s gfxlab/tests -p 'test_*.py' -v
      - uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: source-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/resources.assets/*
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/sharedassets6.assets
      - name: Analyze original Shader48 declaration register operand shape privately
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
          python3 -m gfxlab.tools.multi_shader_register_operand_shape --zip2 source-zip2 --stage "$RUNNER_TEMP/gfxlab-multi017-private" --out gfxlab-multi017-safe-summary.json
          python3 - <<'PY'
          import json
          d=json.load(open("gfxlab-multi017-safe-summary.json"))
          assert d["source_program_stages"]==14
          assert len(d["per_pass"])==7
          assert d["original_dxbc_register_indexes_extracted_privately"]
          assert not d["original_register_indexes_or_sizes_published"]
          assert not d["original_cb_byte_offsets_matched_to_spirv"]
          assert not d["android_original_shader_tested"] and not d["phase_closed"]
          print("GFX_MULTI017_SOURCE_REGISTER_SHAPE_ONLY_NOT_BINDING_PARITY")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gfxlab-multi017-safe-register-shape
          path: gfxlab-multi017-safe-summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Purge original shader source bytes
        if: always()
        run: |
          sudo rm -rf source-zip2 "$RUNNER_TEMP/gfxlab-multi017-private"
          echo GFX_MULTI017_ORIGINAL_SHADER_SOURCE_PURGED=true
