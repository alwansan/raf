name: T1 WATER-001 actual Unity2021 sourcefree compute keyword GPU variants

on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-t1-fft-unity-keyword-runtime.yml
      - android-port/Experiments/T1/T1FftKeywordVariantRuntime.compute
      - android-port/Experiments/T1/T1FftKeywordVariantRuntimeTests.cs
      - tests/test_t1_fft_keyword_variant_fixture.py

permissions:
  contents: read

concurrency:
  group: t1-fft-unity-keyword-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-keyword-gpu:
    runs-on: ubuntu-24.04
    environment: UNITY_LICENSE
    concurrency:
      group: raft-native-engine-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 25
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CLI_SHA256: 1de550a620ee92e05e920b6db7d431621440b60b2577f04b4a997dc92a58cb0a
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Require previously configured Unity license and bounded scratch
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [ -z "${UNITY_LICENSE:-}" ] && { [ -z "${UNITY_SERIAL:-}" ] || [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; }; then
            echo "RAFT_T1_KEYWORD_RUNTIME missing_existing_unity_license=true"
            exit 1
          fi
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2{print $4}')" -gt 12582912
      - name: Checkout only public synthetic fixture and tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
            android-port/Experiments/T1
      - name: Prove source-only GPU fixture has no original game data
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_t1_fft_keyword_variant_fixture.py -v
          python3 -m unittest discover -s tests -p test_t1_sourcefree_unity_fixture.py -v
          echo "RAFT_T1_KEYWORD_RUNTIME sourcefree_fixture_proven=true original_source_acquired=false"
      - name: Download SHA-pinned GameCI v0.1.72 binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t1-keyword-cli"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/game-ci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz" \
            --output "$RUNNER_TEMP/t1-keyword-cli.tar.gz"
          echo "$CLI_SHA256  $RUNNER_TEMP/t1-keyword-cli.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/t1-keyword-cli.tar.gz" -C "$RUNNER_TEMP/t1-keyword-cli"
          find "$RUNNER_TEMP/t1-keyword-cli" -type f -name game-ci -print -quit > "$RUNNER_TEMP/t1-keyword-exe.txt"
          test -s "$RUNNER_TEMP/t1-keyword-exe.txt"
          chmod +x "$(cat "$RUNNER_TEMP/t1-keyword-exe.txt")"
      - name: Run licensed Unity 2021 EditMode keyword GPU tests with private logs
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 -m scripts.t1_sourcefree_unity_fixture --project t1-keyword-unity
          rm t1-keyword-unity/Assets/Tests/Editor/T1SourceFreeEditorTest.cs
          cp android-port/Experiments/T1/T1FftKeywordVariantRuntimeTests.cs \
            t1-keyword-unity/Assets/Tests/Editor/
          cp android-port/Experiments/T1/T1FftKeywordVariantRuntime.compute \
            t1-keyword-unity/Assets/T1Synthetic/
          cli="$(cat "$RUNNER_TEMP/t1-keyword-exe.txt")"
          set +e
          timeout 720s "$cli" test --docker --dockerShmSize=1025m --engine=unity \
            t1-keyword-unity --testPlatforms=editmode --engineVersion=2021.3.45f2 \
            --artifactsPath=t1-keyword-test-artifacts \
            --containerRegistryRepository=unityci/editor --containerRegistryImageVersion=3 \
            > "$RUNNER_TEMP/t1-keyword-gameci.log" 2>&1
          rc=$?
          set -e
          sudo chown -R "$(id -u):$(id -g)" t1-keyword-unity t1-keyword-test-artifacts || true
          python3 - "$rc" <<'PY'
          from pathlib import Path
          import sys
          from scripts import t1_gameci_private_result_gate as gate
          xml = Path("t1-keyword-test-artifacts/editmode-results.xml")
          if xml.is_symlink() or not xml.is_file() or xml.stat().st_size > gate.MAX_XML:
              raise SystemExit("RAFT_T1_KEYWORD_RUNTIME missing_or_unbounded_nunit=true")
          gate.KNOWN["keyword_runtime"] = frozenset({
              "T1FftKeywordVariantRuntimeTests.UndeclaredComputeKeywordCannotBeEnabled",
              "T1FftKeywordVariantRuntimeTests.DeclaredComputeVariantsProduceDistinctGpuWords",
          })
          result = gate.classify(xml.read_bytes(), int(sys.argv[1]), "keyword_runtime")
          print("RAFT_T1_KEYWORD_RUNTIME " + str({
              "unity2021_synthetic_nunit_passed": result["all_expected_tests_passed"],
              "expected_tests": result["expected_test_case_count"],
              "actual_tests": result["observed_test_case_count"],
              "gpu_compute_two_variants_expected": True,
              "original_source_used": False,
              "author_runtime_kernel_mapping_proven": False,
              "android_adreno_water_proven": False,
          }))
          if not result["all_expected_tests_passed"]:
              raise SystemExit("Synthetic Unity keyword GPU control not verified")
          PY
      - name: Remove all runner projects and private test logs
        if: always()
        shell: bash
        run: |
          sudo rm -rf t1-keyword-unity t1-keyword-test-artifacts
          rm -rf "$RUNNER_TEMP/t1-keyword-cli" "$RUNNER_TEMP/t1-keyword-cli.tar.gz"
          rm -f "$RUNNER_TEMP/t1-keyword-exe.txt" "$RUNNER_TEMP/t1-keyword-gameci.log"
