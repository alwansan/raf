name: T3 RENDER-002 authentic Particle108 HLSL roundtrip VSFS drift
on:
  push:
    branches: [feature/android-native-port]
    paths: ['.github/workflows/raft-t3-particle108-roundtrip-interface.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t3-original-particle108-hlsl-roundtrip-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-location-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
      - name: Validate source-free VSFS roundtrip structural and DXBC used-mask controls
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t3_particle108_roundtrip_interface_diagnostic.py tests/test_t3_particle108_roundtrip_interface_diagnostic.py
          python3 -m unittest discover -s tests -p 'test_t3_particle108_roundtrip_interface_diagnostic.py' -v
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: zip2-source
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/level0
            Raft/Raft_Data/level1
            Raft/Raft_Data/level2
            Raft/Raft_Data/level3
            Raft/Raft_Data/level4
            Raft/Raft_Data/level5
      - name: Restore only four original source shader owners
        run: |
          set -euo pipefail
          git -C zip2-source sparse-checkout set --no-cone -- \
            '/RAFT_FILE_MANIFEST.tsv' '/Raft/Raft_Data/level0' \
            '/Raft/Raft_Data/level1' '/Raft/Raft_Data/level2' \
            '/Raft/Raft_Data/level3' '/Raft/Raft_Data/level4' \
            '/Raft/Raft_Data/level5' '/Raft/Raft_Data/resources.assets/*' \
            '/Raft/Raft_Data/sharedassets0.assets/*' \
            '/Raft/Raft_Data/sharedassets1.assets' \
            '/Raft/Raft_Data/sharedassets6.assets'
          test "$(git -C zip2-source rev-parse HEAD)" = 15964ea8f246b6e076ce26b60931ee2e1a9a2385
      - name: Verify four SHA-authentic owners and six original scenes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import stage
          from scripts.a12_probe_original_blur_passes import SHADER_OWNERS
          from scripts.b21_scene_lightmap_links import PIN,verify_source
          from scripts.t3_original_renderer_shader_impact import SHADER_OWNERS_SELECTED
          source=Path('zip2-source')
          out=Path(os.environ['RUNNER_TEMP'])/'t3-particle108-private-source'
          pins={'Raft_Data/'+n:SHADER_OWNERS[n] for n in SHADER_OWNERS_SELECTED}
          r=stage(source,out,pins)
          assert len(r['owners'])==4 and r['verified_bytes']==269007288 and not r['lfs_used']
          for scene,pin in PIN.items():
              p=source/'Raft/Raft_Data'/scene
              verify_source(p,pin)
              dst=out/'Raft_Data'/scene
              if dst.exists() or dst.is_symlink():raise ValueError('scene_stage_collision')
              with p.open('rb') as src,dst.open('xb') as target:
                  while piece:=src.read(1024*1024):target.write(piece)
              verify_source(dst,pin)
          print('T3_ORIGINAL_SHA_AUTHENTIC=4_owners_6_scenes')
          PY
      - name: Pin reflection and translation dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.23.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
          dpkg-query -W vkd3d-compiler spirv-tools spirv-cross glslang-tools
      - name: Classify exact four original source and HLSL roundtrip VSFS interface drift privately
        run: |
          set -euo pipefail
          timeout 720s python3 -m scripts.t3_particle108_roundtrip_interface_diagnostic \
            --original "$RUNNER_TEMP/t3-particle108-private-source" \
            --manifest zip2-source/RAFT_FILE_MANIFEST.tsv \
            --out "$RUNNER_TEMP/t3-particle108-hlsl-vsfs-safe-aggregate.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"t3-particle108-hlsl-vsfs-safe-aggregate.json"
          d=json.loads(p.read_text())
          assert d["status"]=="T3_AUTHENTIC_PARTICLE108_HLSL_ROUNDTRIP_VSFS_MISMATCH_CLASSIFIED"
          assert d["source_original_six_scenes_SHA_verified"] is True
          assert d["source_original_four_Shader_Material_owner_SHA_verified"] is True
          assert d["original_keyword_pairs"]==4
          assert d["original_DXBC_stage_programs"]==8
          c=d["counts"]
          assert c["original_pairs_valid"]==4
          assert c["roundtrip_pairs_valid"]==2
          assert c["original_fragment_missing_vertex_location_records"]==0
          assert c["original_compiled_active_fragment_inputs_source_numeric_absent"]==0
          assert c["original_compiled_unread_fragment_inputs_source_numeric_absent"]==2
          assert c["vertex_same_location_type_changes"]==4
          assert (c["vertex_changed_output_locations_consumed_by_fragment"] +
                  c["vertex_changed_output_locations_not_consumed_by_fragment"])==4
          assert (c["vertex_changed_output_reflection_type_width_narrowing"] +
                  c["vertex_changed_output_reflection_type_width_widening"] +
                  c["vertex_changed_output_reflection_type_same_width_base_kind_changed"] +
                  c["vertex_changed_output_reflection_type_unsupported"])==4
          assert d["original_semantic_to_SPIRV_location_identity_proven"] is False
          assert d["roundtrip_HLSL_variable_semantic_identity_proven"] is False
          assert d["native_Unity_Android_Adreno_pixels_verified"] is False
          assert d["private_shader_source_names_program_bytes_hashes_and_locations_published"] is False
          print("T3_ORIGINAL_HLSL_ROUNDTRIP_VSFS_COUNTS_SAFE="+json.dumps(c,sort_keys=True))
          PY
