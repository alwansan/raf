name: Raft W1 Depth Copy staging and rollback (CPU only)
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-w1-depth-stage.yml'
      - 'scripts/w1_stage_zip2_owners.py'
      - 'scripts/w1_probe_engine_shader_redirects.py'
      - 'tests/test_w1_zip2_owners.py'
      - 'scripts/w1_install_depth_copy.py'
      - 'tests/test_w1_depth_install.py'
      - 'scripts/w1_build_depth_wrapper.py'
      - 'scripts/w1_depth_shaderlab.py'
      - 'tests/test_w1_depth_shaderlab.py'
permissions:
  contents: read
concurrency:
  group: raft-w1-depth-stage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            scripts
            tests
      - name: Validate segment routing before original downloads
        run: |
          python3 -m unittest discover -s tests -p test_w1_depth_shaderlab.py -v
          python3 -m unittest discover -s tests -p test_w1_depth_install.py -v
          python3 -m unittest discover -s tests -p test_w1_zip2_owners.py -v
      - name: Check disk before acquiring pinned original owners
        run: python3 -c "import shutil; assert shutil.disk_usage('.').free > 2 * 1024**3"
      - uses: actions/checkout@v4
        with:
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: zip2-original
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            Raft/Raft_Data/resources.assets
            Raft/Raft_Data/sharedassets0.assets
            Raft/Raft_Data/Resources
      - name: Reuse reconstructed owners with mandatory per-file reauthentication
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/w1-original
          key: w1-zip2-15964ea8-four-owners-v1
      - name: Reassemble four original owners from ZIP2 without LFS
        run: python3 -m scripts.w1_stage_zip2_owners --zip2-checkout zip2-original --destination "$RUNNER_TEMP/w1-original"
      - name: Install bounded CPU serialization and translation tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
          dpkg-query -W vkd3d-compiler spirv-tools spirv-cross glslang-tools
      - name: Decode original parameters and reconstruct private ShaderLab wrapper
        run: |
          timeout 600s python3 -m scripts.w1_build_depth_wrapper --source "$RUNNER_TEMP/w1-original/Raft_Data" --out "$RUNNER_TEMP/w1-depth-wrapper-summary.json" --private-shader "$RUNNER_TEMP/w1-private.shader"
          python3 - <<'PY'
          import os,tempfile
          from pathlib import Path
          from scripts.w1_install_depth_copy import install,TARGET
          root=Path(os.environ['RUNNER_TEMP'])
          project=root/'w1-synthetic-export'
          assets=project/'Assets'
          assets.mkdir(parents=True)
          target=assets/'fixture.shader'
          target.write_text('Shader "'+TARGET+'" { SubShader {} }')
          Path(str(target)+'.meta').write_text('fileFormatVersion: 2\nguid: 1234567890abcdef1234567890abcdef\n')
          result=install(project,root/'w1-private.shader',root/'w1-private-backup')
          assert result['installed_targets']==1 and result['exported_meta_unchanged']
          print('RAFT_W1_SYNTHETIC_STAGE regeneratedPinnedWrapper=true actualGameExport=false')
          PY
      - name: Compare original game shaders with authenticated engine owner identities
        run: python3 -m scripts.w1_probe_engine_shader_redirects --source "$RUNNER_TEMP/w1-original" --out "$RUNNER_TEMP/w1-engine-redirect-summary.json"
      - name: Retain aggregate recovery evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1-depth-wrapper-aggregate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/w1-depth-wrapper-summary.json
            ${{ runner.temp }}/w1-engine-redirect-summary.json
          if-no-files-found: ignore
          retention-days: 7


