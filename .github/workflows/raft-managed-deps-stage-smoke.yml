name: Raft selected Unity managed dependency staging smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-native-port
    paths:
      - '.github/workflows/raft-managed-deps-stage-smoke.yml'
      - 'scripts/adapt_unity_url_codecs.py'
      - 'tests/test_adapt_unity_url_codecs.py'
      - 'scripts/stage_raft_managed_dlls.py'
      - 'tests/test_stage_raft_managed_dlls.py'
      - 'scripts/rename_conflicting_sdk_asmdefs.py'
      - 'tests/test_sdk_asmdef_rename.py'
      - 'scripts/add_unity_packages.py'
      - 'tests/test_add_unity_packages.py'

concurrency:
  group: raft-managed-dll-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  managed-refs:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 1
      - name: Test URL codec adaptation without changing metadata or other APIs
        run: python3 -m unittest discover -s tests -p test_adapt_unity_url_codecs.py -v
      - name: Test selective third-party managed DLL staging with synthetic fixtures
        run: python3 -m unittest discover -s tests -p test_stage_raft_managed_dlls.py -v
      - name: Verify asmdef collision renaming safety and GUID preservation
        run: python3 -m unittest discover -s tests -p test_sdk_asmdef_rename.py -v
      - name: Test native UI and TextMeshPro package restoration
        run: python3 -m unittest discover -s tests -p test_add_unity_packages.py -v
      - name: Validate that selected original managed DLLs can be staged
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/project/Assets"
          python3 scripts/stage_raft_managed_dlls.py \
            --managed "$GITHUB_WORKSPACE/Raft/Raft_Data/Managed" \
            --project "$RUNNER_TEMP/project" \
            --report "$RUNNER_TEMP/selected-managed-report.json" \
            --apply
          test "$(find "$RUNNER_TEMP/project/Assets/Plugins/RaftManagedReferences" -type f -name '*.dll' | wc -l)" -eq 21
          echo 'Verified selected original managed references exist, with UGUI/TMP engine packages and core DLLs excluded.' >> "$GITHUB_STEP_SUMMARY"
