name: GFX109 original indexed vertex skinning Android probe
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths:
      - '.github/workflows/gfxlab-multi109-indexed-gpu-skin.yml'
      - 'gfxlab/android-gles-skin109/**'
      - 'gfxlab/tools/gfx109_gpu_skin_payload.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfx109-indexed-gpu-skin
  cancel-in-progress: false
jobs:
  signed-indexed-gpu-skin-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify indexed skinning and source extraction regressions
        run: python3 -m unittest discover -s gfxlab/tests -p 'test_gfx108*.py'
      - name: Checkout authentic pinned original ZIP2 only in ephemeral private runner
        uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: source-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/resources.assets/*
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/sharedassets6.assets
      - name: Install pinned private Unity mesh reader
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
      - name: Stage the five source cases for the diagnostic APK
        run: |
          set -euo pipefail
          test "$(git -C source-zip2 rev-parse HEAD)" = 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          mkdir -p gfx109-build
          python3 -m gfxlab.tools.gfx109_gpu_skin_payload \
            --zip2 source-zip2 --stage "$RUNNER_TEMP/gfx109-source" \
            --assets "$RUNNER_TEMP/gfx109-assets" --safe gfx109-build/gfx109-safe-source.json
      - name: Build, sign, verify minimal Android GLES3 vertex probe
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME"
          jar="$(find "$sdk/platforms" -name android.jar | sort -V | tail -1)"
          buildtools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -f "$jar" && test -x "$buildtools/aapt2" && test -x "$buildtools/apksigner"
          mkdir -p gfx109-build/classes gfx109-build/dex gfx109-build/gen
          "$buildtools/aapt2" link -o gfx109-build/resources.apk \
            --manifest gfxlab/android-gles-skin109/AndroidManifest.xml \
            -I "$jar" -A "$RUNNER_TEMP/gfx109-assets" \
            --java gfx109-build/gen
          javac -source 8 -target 8 -bootclasspath "$jar" \
            -d gfx109-build/classes \
            gfxlab/android-gles-skin109/src/com/alwansan/gfx109/MainActivity.java
          mapfile -t classes < <(find gfx109-build/classes -type f -name '*.class')
          test "${#classes[@]}" -gt 0
          "$buildtools/d8" --lib "$jar" --min-api 29 --output gfx109-build/dex "${classes[@]}"
          test -s gfx109-build/dex/classes.dex
          cp gfx109-build/resources.apk gfx109-build/unsigned.apk
          python3 - <<'PY'
          from zipfile import ZipFile,ZIP_DEFLATED
          with ZipFile('gfx109-build/unsigned.apk','a',compression=ZIP_DEFLATED) as z:
              z.write('gfx109-build/dex/classes.dex','classes.dex')
          PY
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/gfx109-debug.jks" -storepass android \
            -keypass android -alias gfx109 -keyalg RSA -keysize 2048 -validity 5000 \
            -dname "CN=GFX102 OpenGL ES GPU Diagnostic" -noprompt
          "$buildtools/zipalign" -f -p 4 gfx109-build/unsigned.apk gfx109-build/aligned.apk
          "$buildtools/apksigner" sign --ks "$RUNNER_TEMP/gfx109-debug.jks" \
            --ks-pass pass:android --key-pass pass:android \
            --out gfx109-build/GFX109-Indexed-GPU-Skinning.apk \
            gfx109-build/aligned.apk
          "$buildtools/apksigner" verify --verbose gfx109-build/GFX109-Indexed-GPU-Skinning.apk
          "$buildtools/aapt2" dump badging gfx109-build/GFX109-Indexed-GPU-Skinning.apk \
            | tee gfx109-build/badging.txt
          grep -F "name='com.alwansan.gfx109'" gfx109-build/badging.txt
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from zipfile import ZipFile
          apk=Path("gfx109-build/GFX109-Indexed-GPU-Skinning.apk")
          assert apk.stat().st_size>100000
          with ZipFile(apk) as z:
              assert z.testzip() is None
              assert {'AndroidManifest.xml','classes.dex','assets/M00.bin','assets/M01.bin','assets/M02.bin','assets/M04.bin','assets/M05.bin'} <= set(z.namelist())
              assert 'Raft_Data' not in ''.join(z.namelist())
              assert 'UnityShaderCache' not in ''.join(z.namelist())
          safe={"experiment":"GFX-MULTI-102",
                "apk_bytes":apk.stat().st_size,
                "apk_sha256":hashlib.sha256(apk.read_bytes()).hexdigest(),
                "package":"com.alwansan.gfx109",
                "apksigner_verified":True,
                "user_device_test_pending":True,
                "expected_source_vertices":14033,
                "original_shader_restored":False,
                "original_indexed_test_inputs_embedded":True,
                "pc_adreno_pixel_parity_verified":False,
                "phase_closed":False,
                "expected_export":"Download/Games/cl/test/g/"}
          Path("gfx109-build/gfx109-safe-delivery.json").write_text(json.dumps(safe,indent=2)+'\n')
          print(json.dumps(safe,sort_keys=True))
          PY
      - name: Upload signed standalone diagnostic APK and safe manifest only
        uses: actions/upload-artifact@v4
        with:
          name: GFX109-Indexed-GPU-Skinning-APK
          path: |
            gfx109-build/GFX109-Indexed-GPU-Skinning.apk
            gfx109-build/gfx109-safe-delivery.json
            gfx109-build/gfx109-safe-source.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Remove extracted source, payload staging and intermediate packages
        if: always()
        run: rm -rf source-zip2 "$RUNNER_TEMP/gfx109-source" "$RUNNER_TEMP/gfx109-assets" "$RUNNER_TEMP/gfx109-debug.jks" gfx109-build
