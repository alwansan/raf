name: Raft W1 same-instance Material Shader export lineage (CPU only)
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - 'scripts/patch_export_lineage.py'
      - 'scripts/verify_export_lineage.py'
      - 'scripts/verify_builtin_export_ownership.py'
      - 'scripts/restore_builtin_shaders.py'
      - 'tests/test_builtin_engine_ownership.py'
      - 'tests/test_export_lineage.py'
      - 'android-port/Experiments/ExportLineage/**'
      - '.github/workflows/raft-w1-export-lineage.yml'
permissions:
  contents: read
concurrency:
  group: raft-w1-export-lineage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-pointer-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
            android-port/Experiments/ExportLineage
            android-port/Experiments/W1EngineDatabase
      - name: Negative identity and graph controls before acquisition
        run: |
          python3 -m unittest discover -s tests -p test_export_lineage.py -v
          python3 -m unittest discover -s tests -p test_builtin_engine_ownership.py -v
          python3 -m unittest discover -s tests -p test_restore_builtin_shaders.py -v
          python3 -c "import shutil; assert shutil.disk_usage('.').free > 8 * 1024**3"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/checkout@v4
        with:
          repository: nowl-it/AssetRipperCLI
          ref: 036098ab525a3f9f693dc101edeb21faad4d32d8
          path: ar-host
          persist-credentials: false
          sparse-checkout: Source
      - name: Build read-only instrumentation into the pinned public exporter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.patch_export_lineage --tool-source ar-host --helper android-port/Experiments/ExportLineage/RaftExportLineage.cs
          # Publish the CLI and its matching transitive assemblies together;
          # replacing one DLL cannot instrument an AOT or bundled executable.
          dotnet publish android-port/Experiments/ExportLineage/ExportLineage.csproj -c Release -p:PublishAot=false -p:PublishTrimmed=false -p:EnableTrimAnalyzer=false -p:EnableAotAnalyzer=false --self-contained false -o "$RUNNER_TEMP/ar" > "$RUNNER_TEMP/public-tool-build.log" 2>&1 || { tail -60 "$RUNNER_TEMP/public-tool-build.log"; exit 1; }
          # No original inputs are present in this smoke command; diagnostics
          # therefore contain public tool types/options only.
          dotnet "$RUNNER_TEMP/ar/ExportLineage.dll" --probe-tool > "$RUNNER_TEMP/public-tool-smoke.log" 2>&1 || { cat "$RUNNER_TEMP/public-tool-smoke.log"; exit 1; }
      - name: Reuse authenticated full original shader-owner cache first
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/w1-original
          key: w1-zip2-15964ea8-shader-and-engine-owners-v1
          restore-keys: |
            w1-zip2-15964ea8-full-shader-owners-v1
            w1-zip2-15964ea8-four-owners-v1
      - name: Plan only missing original providers
        id: needed
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.w1_full_engine_sources import acquisition_plan
          from scripts.w1_stage_zip2_owners import PINS,fingerprint
          root=Path(os.environ['RUNNER_TEMP'])/'w1-original'
          paths,missing=acquisition_plan(root)
          for relative,pin in PINS.items():
              if '/Resources/' not in relative: continue
              cached=root/relative
              if cached.exists():
                  if cached.is_symlink() or fingerprint(cached)!=pin:
                      raise SystemExit('Conflicting cached original engine provider')
              else:
                  paths.append('Raft/'+relative)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('paths<<W1_SOURCE_PATHS\n'+'\n'.join(paths)+'\nW1_SOURCE_PATHS\n')
          print('RAFT_W1_SHADER_ENGINE_PLAN sourceOwners=16 missing='+str(len(paths)-1))
          PY
      - uses: actions/checkout@v4
        with:
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: zip2-original
          filter: blob:none
          lfs: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ steps.needed.outputs.paths }}
      - name: Authenticate all original shader providers without LFS
        run: |
          python3 -m scripts.w1_full_engine_sources --zip2-checkout zip2-original --destination "$RUNNER_TEMP/w1-original"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import PINS,stage
          selected={relative:pin for relative,pin in PINS.items() if '/Resources/' in relative}
          result=stage(Path('zip2-original'),Path(os.environ['RUNNER_TEMP'])/'w1-original',selected)
          print('RAFT_W1_CANONICAL_SHADER_SOURCE '+json.dumps(result,sort_keys=True))
          PY
      - name: Capture actual collection pointers during a bounded original-data export
        env:
          DOTNET_PROCESSOR_COUNT: '2'
          RAFT_PRIVATE_EXPORT_LINEAGE: ${{ runner.temp }}/private-export-lineage.json
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s dotnet "$RUNNER_TEMP/ar/ExportLineage.dll" "$RUNNER_TEMP/w1-original" "$RUNNER_TEMP/lineage-project" > "$RUNNER_TEMP/private-export.log" 2>&1 && test -s "$RUNNER_TEMP/private-export-lineage.json" || {
            python3 - <<'PYDIAG'
          import os,re,json
          from pathlib import Path
          text=(Path(os.environ['RUNNER_TEMP'])/'private-export.log').read_text(errors='replace')
          # Keep original filenames/names and all log text private.
          report={'export_completed':False,'exception_types':sorted(set(re.findall(r'\b(?:System|AssetRipper)\.[A-Za-z.]+Exception\b',text))),
                  'has_missing_assembly': 'Could not load file or assembly' in text,
                  'has_missing_dependency': 'dependency' in text.lower(),
                  'argument_error': bool(re.search(r'unknown argument|missing value|unrecognized|not recognized|requires a value', text, re.I)),
                  'loading_started':'Processing loaded assets' in text,'export_started':'Starting export' in text,
                  'loaded_counts':re.findall(r'RAFT_LINEAGE_LOADED materials=\d+ shaders=\d+',text),
                  'log_bytes':len(text.encode()),'trace_created':(Path(os.environ['RUNNER_TEMP'])/'private-export-lineage.json').exists()}
          print('RAFT_EXPORT_FAILURE '+json.dumps(report,sort_keys=True))
          (Path(os.environ['RUNNER_TEMP'])/'export-lineage-summary.json').write_text(json.dumps(report,indent=2)+'\n')
          PYDIAG
            exit 1
          }
          test -s "$RUNNER_TEMP/private-export-lineage.json"
      - name: Compare source PPtrs and actual YAML GUIDs from this export instance
        run: |
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
          python3 -m scripts.verify_export_lineage --source "$RUNNER_TEMP/w1-original" --private-trace "$RUNNER_TEMP/private-export-lineage.json" --project "$RUNNER_TEMP/lineage-project/ExportedProject" --out "$RUNNER_TEMP/export-lineage-summary.json"
      - name: Re-read exact embedded engine database for production gate trial
        run: dotnet run --project android-port/Experiments/W1EngineDatabase/W1EngineDatabase.csproj -c Release -- "$RUNNER_TEMP/private-engine-database.json" "$RUNNER_TEMP/engine-reader-summary.json"
      - name: Exercise builtin restorer against actual traced original export without a receipt waiver
        run: |
          python3 -m scripts.restore_builtin_shaders --project "$RUNNER_TEMP/lineage-project/ExportedProject" --backup "$RUNNER_TEMP/builtin-backup" --engine-source "$RUNNER_TEMP/w1-original" --private-export-trace "$RUNNER_TEMP/private-export-lineage.json" --private-engine-database "$RUNNER_TEMP/private-engine-database.json" --engine-reader-summary "$RUNNER_TEMP/engine-reader-summary.json"
      - name: Retain aggregate result only; never upload private trace or assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1-export-lineage-${{ github.sha }}
          path: ${{ runner.temp }}/export-lineage-summary.json
          if-no-files-found: ignore
          retention-days: 7
