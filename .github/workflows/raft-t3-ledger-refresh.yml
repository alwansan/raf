name: T3 refresh team source-evidence summary after verified Material parity
# T3 checkpoint: canonical event now has required stable id/type/at after
# CI42027754343 exposed missing event id; do not alter old B/T records.

on:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-t3-ledger-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

# Join the same T-team ledger lease as T1 to avoid concurrent snapshot writes.
concurrency:
  group: raft-t-team-ledger-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout only coordination ledger and approved source refresh scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: true
          sparse-checkout: |
            scripts
            prompt/coordination/B_TEAM
            prompt/coordination/T_TEAM
      - name: Regenerate T TEAM from authoritative source and fast-forward safely
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feature/android-native-port"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --no-tags -q origin feature/android-native-port
            git reset --hard -q FETCH_HEAD
            python3 scripts/refresh_t_team.py
            python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("prompt/coordination/T_TEAM/snapshot.json").read_text())
          assert s["generation"]=="T-2026-11-05"
          issue=[i for i in s["issues"] if i["id"]=="RENDER-002"]
          assert len(issue)==1 and issue[0]["status"]=="OPEN"
          required="https://github.com/alwansan/raf/actions/runs/41940350604"
          assert required in issue[0]["evidence"]
          # Include new authentic 12-owner 731/511 pre-restorer source result
          # without setting native/device readiness or rewriting B-agent credit.
          proof="https://github.com/alwansan/raf/actions/runs/42026630845"
          assert proof in issue[0]["evidence"]
          # Genuine source six-scene 1,633 typed Shader48 Renderer slots:
          # 1,373 map via W1 real export GUID to still-Dummy vendor shader.
          renderer_proof="https://github.com/alwansan/raf/actions/runs/42044249541"
          assert renderer_proof in issue[0]["evidence"]
          # Original 108-slot ParticleShader48 one-Pass Blend/ColorMask source
          # is authenticated; this does not prove any Android pixels.
          original_particle_state_proof="https://github.com/alwansan/raf/actions/runs/42112666211"
          assert original_particle_state_proof in issue[0]["evidence"]
          # T3 exact Unity2021 ABGR-bit ColorMask -> RGB opt-in
          # translator was source-only; it does not imply device readiness.
          color_mask_proof="https://github.com/alwansan/raf/actions/runs/42116530618"
          assert color_mask_proof in issue[0]["evidence"]
          # Original 108-use ParticleShader48 Materials: five source Material21
          # objects, 10/10 bound local TexEnv PPtrs; source-only, not pixels.
          particle_texenv_source="https://github.com/alwansan/raf/actions/runs/42119098398"
          assert particle_texenv_source in issue[0]["evidence"]
          # All three typed original ParticleTexture2D class28 targets source
          # stream from one manifest provider; no actual mobile pixels verified.
          particle_texture28_stream_proof="https://github.com/alwansan/raf/actions/runs/42120918486"
          assert particle_texture28_stream_proof in issue[0]["evidence"]
          # Three exact original Particle Texture2D image byte ranges were
          # read from one immutable ZIP2 provider verified full size/SHA.
          # This remains original source-only; Unity/Android pixels unproven.
          particle_source_payload_proof="https://github.com/alwansan/raf/actions/runs/42125608932"
          assert particle_source_payload_proof in issue[0]["evidence"]
          # Real same-instance AssetRipper source→export original Particle:
          # 5/5 Material, 2/3 exportable Texture2D, 1 source Texture2D
          # confirmed in nonexportable collection (not missing original).
          particle_sameexport="https://github.com/alwansan/raf/actions/runs/42130529677"
          particle_nonexportable="https://github.com/alwansan/raf/actions/runs/42132262184"
          assert particle_sameexport in issue[0]["evidence"]
          assert particle_nonexportable in issue[0]["evidence"]
          # Actual same-instance nonexportable class28 container pointer
          # matches the tenth original Particle Material YAML TexEnv; all
          # ten pointers and all ten UVs match in this bounded export only.
          particle_nonexportable_pointer="https://github.com/alwansan/raf/actions/runs/42134436841"
          assert particle_nonexportable_pointer in issue[0]["evidence"]
          # Exact six-scene source 108-use ParticleShader48 output contains
          # a real same-instance AssetRipper DummyShaderTextExporter marker.
          # Balanced one-pass CGPROGRAM is not genuine original code or
          # Android pixel evidence; remain RENDER-002 OPEN/NOT_READY.
          particle108_dummy_output="https://github.com/alwansan/raf/actions/runs/42136474867"
          assert particle108_dummy_output in issue[0]["evidence"]
          # Genuine immutable original source particle 108-use D3D11 has
          # 4 paired VS/FS keyword variants / 8 distinct stage programs.
          # This is SOURCE ONLY; ShaderLab dummy still not restored on phone.
          particle108_dxbc="https://github.com/alwansan/raf/actions/runs/42139137265"
          assert particle108_dxbc in issue[0]["evidence"]
          # Real pinned original Particle108 all eight DXBC stages can
          # compile Vulkan1.1 SPIR-V, but SPIRV-Cross HLSL roundtrip maps
          # only 2/4 paired interfaces; phone remains explicitly untested.
          particle108_vulkan="https://github.com/alwansan/raf/actions/runs/42141506120"
          assert particle108_vulkan in issue[0]["evidence"]
          assert any(r["id"]=="T3-ORIGINAL-PARTICLE108-AUTHENTIC-D3D11-VARIANTS"
                     and r["counts"]["original_source_DXBC_to_valid_SPIRV_Vulkan11_stage_count"]==8
                     and r["counts"]["roundtrip_SPIRV_vertex_fragment_pair_interfaces_compatible"]==2
                     and r["counts"]["source_SPIRV_vertex_fragment_pair_interfaces_compatible"]==4
                     and r["counts"]["stages_with_same_input_type_multiset"]==8
                     and r["counts"]["stages_with_same_output_type_multiset"]==8
                     and r["stages"]["device"]=="NOT_TESTED"
                     for r in s["resources"])
          assert any(r["id"]=="T3-ORIGINAL-PARTICLE108-AUTHENTIC-D3D11-VARIANTS"
                     and r["counts"]["exact_matched_vertex_fragment_keyword_permutation_pairs"]==4
                     and r["counts"]["distinct_original_linked_D3D11_programs"]==8
                     and r["stages"]["device"]=="NOT_TESTED"
                     for r in s["resources"])
          assert any(r["id"]=="T3-PARTICLE108-SOURCE-SAMEINSTANCE-MATERIAL-TEXTURE-PARITY"
                     and r["counts"]["exact_original_particle_shader_exported_as_marked_dummy"]==1
                     and r["counts"]["matched_source_to_export_texenv_texture_ptrs"]==10
                     and r["stages"]["device"]=="NOT_TESTED"
                     for r in s["resources"])
          assert any(r["id"]=="T3-PARTICLE108-SOURCE-SAMEINSTANCE-MATERIAL-TEXTURE-PARITY"
                     and r["counts"]["matched_source_to_export_texenv_texture_ptrs"]==10
                     and r["counts"]["matched_nonexportable_container_texture_pointer_slots"]==1
                     and r["counts"]["source_uv_transforms_matching"]==10
                     and r["stages"]["device"]=="NOT_TESTED"
                     for r in s["resources"])
          assert any(r["id"]=="T3-PARTICLE108-SOURCE-SAMEINSTANCE-MATERIAL-TEXTURE-PARITY"
                     and r["counts"]["original_texture_source_skipped_due_nonexportable_collection"]==1
                     and r["stages"]["device"]=="NOT_TESTED"
                     for r in s["resources"])
          assert any(r["id"]=="T3-ORIGINAL-PARTICLE108-IMAGE-STREAM-FULLSHA"
                     and r["stages"]["device"]=="NOT_TESTED"
                     for r in s["resources"])
          # T4 historic event was repaired ONLY for stable ledger identity
          # and timestamp; its input/behavior/evidence are unchanged.
          assert any(e["id"]=="20261105T2241Z-T4-chat-immersive-bars-h8q2"
                     and e["owner"]=="T4" and e["at"]==e["timestamp"]
                     for e in s["events"])
          # T3 source-only class/particle rankings are real SHA-pinned evidence,
          # not an Android shader restoration/device acceptance.
          for genuine_source_proof in (
              "https://github.com/alwansan/raf/actions/runs/42109994654",
              "https://github.com/alwansan/raf/actions/runs/42110973101",
          ):
              assert genuine_source_proof in issue[0]["evidence"]
          assert any(r["id"]=="T3-ORIGINAL-SIXSCENE-RENDERER-SHADER-POSTVENDOR-USE" for r in s["resources"])
          assert any(e["id"]=="T3-20261105T1425Z-renderer-source-postvendor-join" and e["owner"]=="T3"
                     for e in s["events"])
          # Top 921 source Shader48 was independently excluded from exact
          # official Unity 2021.3.45f2 SHA-pinned builtin archive identities.
          builtin_proof="https://github.com/alwansan/raf/actions/runs/42046329453"
          assert builtin_proof in issue[0]["evidence"]
          assert any(e["id"]=="T3-20261105T1436Z-highuse-Sh48-not-Unity-builtin" and e["owner"]=="T3"
                     for e in s["events"])
          # Genuine four-Pass 921-use Shader48 original->derived stage I/O
          # classification is a diagnostic: do NOT mark graphics issue READY.
          io_proof="https://github.com/alwansan/raf/actions/runs/42058881426"
          assert io_proof in issue[0]["evidence"]
          assert any(e["id"]=="T3-20261105T1542Z-authentic921-IO-location-remap"
                     and e["owner"]=="T3" for e in s["events"])
          assert any(r.get("resource_key")=="T3-source-top921-Shader48-fourPass-stageIO-lookup"
                     and all(k in r["stages"] for k in
                             ("acquisition", "extraction", "reconstruction",
                              "binding", "integration", "device"))
                     and r["stages"]["device"]=="NOT_TESTED"
                     for r in s["resources"])

          ev=[e for e in s["events"] if e["id"]=="T3-20261105T0023Z-authentic-material-parity-results"]
          assert len(ev)==1 and ev[0]["owner"]=="T3"
          new=[e for e in s["events"] if e["id"]=="T3-20261105T1226Z-native-shader-dummy-audit"]
          assert len(new)==1 and new[0]["owner"]=="T3"
          assert s["readiness"] is not True
          print("RAFT_T3_TEAM_SUMMARY SOURCE_ACTUAL_MATERIAL_RGBA=true ISSUE_OPEN=true")
          PY
            git add -- prompt/coordination/T_TEAM/SUMMARY.md prompt/coordination/T_TEAM/snapshot.json
            if git diff --cached --quiet; then
              echo 'RAFT_T3_TEAM_SUMMARY unchanged=true'
              exit 0
            fi
            git commit -q -m 'docs(T3): regenerate T team ledger with authentic Material source/export evidence'
            if git push origin HEAD:refs/heads/feature/android-native-port; then
              echo 'RAFT_T3_TEAM_SUMMARY committed=true'
              exit 0
            fi
            echo "T3 summary source branch advanced; retry lease attempt $attempt"
          done
          echo "::error::T3 snapshot refresh could not fast-forward after three retries"
          exit 1
