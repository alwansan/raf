name: GFX-MULTI-016 original Shader48 SHDR declaration census / no APK
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths: ['.github/workflows/gfxlab-multi-shdr-declaration-census.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfxlab-multi016-source-decl
  cancel-in-progress: false
jobs:
  original-shader-source-declarations:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            gfxlab/tools
            gfxlab/tests
      - name: Pure D3D11 token format negative tests
        run: |
          set -euo pipefail
          python3 -m py_compile gfxlab/tools/multi_shader_shdr_declaration_census.py
          python3 -m unittest discover -s gfxlab/tests -p 'test_*.py' -v
      - uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: source-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/resources.assets/*
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/sharedassets6.assets
      - name: Count strict original SHDR declarations privately
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
          python3 -m gfxlab.tools.multi_shader_shdr_declaration_census --zip2 source-zip2 --stage "$RUNNER_TEMP/gfxlab-multi016-private" --out gfxlab-multi016-safe-summary.json
          python3 - <<'PY'
          import json
          d=json.load(open('gfxlab-multi016-safe-summary.json'))
          assert d['source_shader_passes']==7 and d['source_stages_examined']==14
          assert len(d['per_pass'])==7
          assert not d['source_cb_register_to_spirv_binding_parity']
          assert not d['original_shader_runtime_android_verified']
          assert not d['stage_closed'] and not d['proprietary_shader_bytes_exported']
          print('GFX_MULTI016_ORIGINAL_DXBC_DECLARATION_COUNTERS_ONLY')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gfxlab-multi016-safe-dxbc-declarations
          path: gfxlab-multi016-safe-summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Purge original shader private data
        if: always()
        run: |
          sudo rm -rf source-zip2 "$RUNNER_TEMP/gfxlab-multi016-private"
          echo GFX_MULTI016_PRIVATE_SHADER_SOURCE_PURGED=true
