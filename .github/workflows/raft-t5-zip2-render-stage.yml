name: T5 ASSET-RESTORE-001 immutable ZIP2 graphics staging
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/t5_stage_zip2_render_owners.py
      - scripts/hydrate_render_payloads.py
      - tests/test_t5_stage_zip2_render_owners.py
      - .github/workflows/raft-t5-zip2-render-stage.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raft-t5-zip2-render-stage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  immutable-original-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out feature source without LFS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
      - name: Run isolated atomic staged-original negative and consumer controls
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_t5_stage_zip2_render_owners
      - name: Check out pinned ZIP2 original graphics provider (sparse, no LFS)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: zip2-original
          lfs: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/resources.assets
            Raft/Raft_Data/sharedassets0.assets
            Raft/Raft_Data/sharedassets36.assets
      - name: Reconstruct one real SHA-pinned graphics owner and consume in feature checkout
        shell: bash
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          python3 -m scripts.t5_stage_zip2_render_owners \
            --zip2-checkout zip2-original \
            --output-root "$RUNNER_TEMP/t5-original-graphics" \
            --owner Raft_Data/resources.assets \
            --owner Raft_Data/sharedassets0.assets \
            --owner Raft_Data/sharedassets36.assets \
            --byte-budget 360000000
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from scripts.hydrate_render_payloads import plan, reuse_verified_staged_sources
          expected = {
              'Raft/Raft_Data/resources.assets': 111533516,
              'Raft/Raft_Data/sharedassets0.assets': 115978112,
              'Raft/Raft_Data/sharedassets36.assets': 110149324,
          }
          rows = [row for row in plan() if row[0] in expected]
          if len(rows) != len(expected) or any(expected[path] != count for path, _, count in rows):
              raise SystemExit("Expected independent feature-LFS graphics pointers absent")
          source = Path(os.environ['RUNNER_TEMP']) / 't5-original-graphics/Raft_Data'
          reused, count = reuse_verified_staged_sources(rows, source, Path.cwd())
          if (reused, count) != (3, 337660952):
              raise SystemExit("Feature-LFS consumer did not accept 3 original ZIP2 owners")
          for pathname, sha, size in rows:
              target = Path(pathname)
              with target.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              if digest != sha or target.stat().st_size != size:
                  raise SystemExit("Staged original graphics bytes failed independent SHA")
          print('T5_REAL_ZIP2_GRAPHICS owner_count=3 original_bytes_verified=337660952 sha256_verified=true feature_pointer_reused=true lfs_used=false unity=false phone=false')
          PY
      - name: Exercise real production graphics hydrator --apply with verified three-owner subset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess
          import sys
          from pathlib import Path
          from unittest import mock
          from scripts import hydrate_render_payloads as hyd

          expected = {
              'Raft/Raft_Data/resources.assets': 111533516,
              'Raft/Raft_Data/sharedassets0.assets': 115978112,
              'Raft/Raft_Data/sharedassets36.assets': 110149324,
          }
          # The production entrypoint normally plans every graphics LFS owner.
          # This isolated test bounds it to the three genuine ZIP2 originals:
          # running full --apply on all assets would trigger large unrelated LFS.
          rows = [row for row in hyd.plan() if row[0] in expected]
          if len(rows) != 3 or any(expected[p] != size for p, _, size in rows):
              raise SystemExit('Missing independently pinned original graphics plan')
          for pathname, digest, size in rows:
              pointer_bytes = subprocess.check_output(['git', 'show', 'HEAD:' + pathname])
              if hyd.pointer(pointer_bytes) != (digest, size):
                  raise SystemExit('Expected immutable feature LFS pointer not found')
              Path(pathname).write_bytes(pointer_bytes)
          staged = Path(os.environ['RUNNER_TEMP']) / 't5-original-graphics/Raft_Data'
          if not staged.is_absolute() or not staged.is_dir():
              raise SystemExit('Verified real ZIP2 source directory absent')

          # Invoke the ACTUAL argument/environment consumer and final SHA
          # verifier; block any accidental Git LFS fallback in this trial.
          with mock.patch.object(hyd, 'plan', return_value=rows), \
               mock.patch.dict(os.environ, {'RAFT_T5_VERIFIED_ZIP2_RENDER_ROOT': str(staged)}), \
               mock.patch.object(sys, 'argv', ['hydrate_render_payloads.py', '--apply']), \
               mock.patch.object(hyd.subprocess, 'run', side_effect=AssertionError('Unexpected LFS fallback')):
              hyd.main()

          for pathname, digest, size in rows:
              target = Path(pathname)
              with target.open('rb') as source:
                  actual = hashlib.file_digest(source, 'sha256').hexdigest()
              if actual != digest or target.stat().st_size != size:
                  raise SystemExit('Real production --apply failed immutable original SHA verification')
          print('T5_REAL_HYDRATOR_MAIN_APPLY original_count=3 original_bytes=337660952 feature_pointers_replaced=true source_sha256=true git_lfs_calls=0 unity=false phone=false')
          PY
      - name: Never upload original game payload
        if: always()
        run: echo "T5 original graphics staging is not Unity, APK, pixel or phone proof; no raw artifacts uploaded."
