            Raft/Raft_Data/sharedassets39.assets

      - name: Materialize exact SHA-authenticated 82 Unity serialized owners (no LFS or raw upload)
        run: |
          set -euo pipefail
          test "$(git -C .gt-zip2 rev-parse HEAD)" = 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          python3 -m scripts.gt_stage_serialized_owners \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --source .gt-zip2/Raft/Raft_Data \
            --destination "$RUNNER_TEMP/gt-original-82-shader-owners" \
            --report "$RUNNER_TEMP/gt-original-82-source-proof-private.json" > "$RUNNER_TEMP/gt-original-82-source-private.log"
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.23.0

      - name: Translate genuine source 7p11-material Shader48 22 D3D11 programs and compose 3-pass 11-route ShaderLab privately
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
          timeout 2700s python3 -m scripts.gt_translate_next_remaining_7p11_shader48 \
            --original "$RUNNER_TEMP/gt-original-82-shader-owners" \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --quality "$RUNNER_TEMP/gt-next7p11-post14-verified-quality.json" \
            --private "$RUNNER_TEMP/gt-next7p11-original-private-source" \
            --out "$RUNNER_TEMP/gt-next7p11-original-source-safe.json"
          python3 - <<'PY_GT_NEXT7P11_SOURCE'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ["RUNNER_TEMP"])/"gt-next7p11-original-source-safe.json").read_text())
          assert q["status"]=="GT_SHA_ORIGINAL_REMAINING_7P11_MATERIAL_SHADER48_D3D11_PRIVATE_STAGES_TRANSLATED"
          assert q["postfourteen_dummy_materials_linked_to_this_original_shader"]==7
          assert q["original_program_stages_roundtrip_Vulkan11_valid"]==22
          assert q["original_exact_vertex_fragment_keyword_permutation_pairs"]==31
          assert q["original_orphan_vertex_stage_variants"]==2
          assert len(q["source_original_keyword_permutation_route_counts_per_pass"])==3 and sum(q["source_original_keyword_permutation_route_counts_per_pass"])==11
          assert q["private_original_7p11_material_ShaderLab_3pass_composed"] is True
          assert q["private_original_7p11_material_ShaderLab_22_vertex_fragment_entrypoints_validated"] is True
          assert q["APK_OBB_XAPK_created"] is False
          print("GT_NEXT7P11_AUTHENTIC_22_D3D11_22_VULKAN_SHADERLAB_ROUTE_SOURCE_PASSED noAPK=true")
          PY_GT_NEXT7P11_SOURCE
      - name: Retain counts-only verified 7p11-material source translation and topology
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-next7p11-original-58-D3D11-source-safe-${{ github.run_id }}
          path: ${{ runner.temp }}/gt-next7p11-original-source-safe.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Remove private original 82 owners, translated DXBC HLSL and all ShaderLab
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/gt-original-82-shader-owners" "$RUNNER_TEMP/gt-next7p11-original-private-source" .gt-zip2
