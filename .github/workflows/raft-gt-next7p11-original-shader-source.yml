name: GT next original 7p11-material Shader48 source 22 D3D11 to Vulkan (NO APK)

on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/gt_translate_next_remaining_7p11_shader48.py
      - tests/test_gt_translate_next_remaining_7p11_shader48.py
      - tests/test_gt_original_7p11_source_pass_modes.py
      - scripts/gt_original_921_shaderlab.py
      - .github/workflows/raft-gt-next7p11-original-shader-source.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gt-next7p11-original-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authenticated-original-7p11-material-shader48:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - name: Reject ambiguous original 7p11-material names, source identities and topology
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/gt_translate_next_remaining_7p11_shader48.py
          python3 -m unittest discover -s tests -p test_gt_translate_next_remaining_7p11_shader48.py -v
          python3 -m unittest discover -s tests -p test_gt_original_7p11_source_pass_modes.py -v
      - name: Load accepted actual post14 216 Dummy material export audit
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43773151176
          name: gt-fourteen-next30-source-shader-full-export-audit-43773151176
          path: ${{ runner.temp }}/gt-next7p11-post14-artifact
      - name: Resolve unique actual accepted post14 material quality report
        run: |
          set -euo pipefail
          python3 - <<'PY_GT_NEXT7P11_POST14'
          import json,os,shutil
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"gt-next7p11-post14-artifact"
          matches=[p for p in root.rglob("gt-fourteen-shader-postrestore-quality.json")
                   if p.is_file() and not p.is_symlink()]
          if len(matches)!=1:
              raise ValueError("missing_or_ambiguous_real_next7p11_post14_material_quality")
          q=json.loads(matches[0].read_text())
          c=q.get("counts",{})
          if (q.get("status")!="NATIVE_MATERIAL_SHADER_PROGRAM_AUDIT_ONLY"
                  or c.get("material_documents")!=1536
                  or c.get("material_docs_using_local_custom_Shader")!=786
                  or c.get("material_docs_using_dummy_Shader")!=216
                  or c.get("distinct_dummy_Shader_targets_referenced")!=46
                  or c.get("material_docs_using_non_dummy_Shader")!=570
                  or sum(q.get("dummy_shader_material_counts_by_name_digest",{}).values())!=216
                  or list(q["dummy_shader_material_counts_by_name_digest"].values()).count(7)!=2):
              raise ValueError("untrusted_next7p11_original_post14_real_export_baseline")
          shutil.copyfile(matches[0],Path(os.environ["RUNNER_TEMP"])/"gt-next7p11-post14-verified-quality.json")
          print("GT_NEXT7P11_ACTUAL_POST14_216_DUMMY_46_SHADER_TARGETS_SOURCE_ACCEPTED noAPK=true")
          PY_GT_NEXT7P11_POST14
      - name: Read immutable ZIP2 serialized owner files only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: .gt-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/globalgamemanagers.assets
            Raft/Raft_Data/resources.assets
            Raft/Raft_Data/level0
