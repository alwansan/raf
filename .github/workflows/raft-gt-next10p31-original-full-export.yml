          # Same-export installer contract below is tied to post17 158/58.
          timeout 2700s python3 -m scripts.gt_translate_next_remaining_10p31_shader48 \
            --original "$RUNNER_TEMP/gt-input/Raft_Data" \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --quality "$RUNNER_TEMP/gt-fourteen-shader-postrestore-quality.json" \
            --private "$work" --out "$RUNNER_TEMP/gt-next10p31-full-export-source-safe.json"
          python3 - <<'PY_GT_NEXT10P31_SOURCE'
          import json,os
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])
          q=json.loads((r/"gt-next10p31-full-export-source-safe.json").read_text())
          assert q["status"]=="GT_SHA_ORIGINAL_REMAINING_10P31_MATERIAL_SHADER48_D3D11_PRIVATE_STAGES_TRANSLATED"
          assert q["original_source_82_owners_authenticated"]==82
          assert q["original_source_Shader48_object_unique_and_82_owner_SHA_verified"] is True
          assert q["original_program_stages_roundtrip_Vulkan11_valid"]==55
          assert q["original_exact_vertex_fragment_keyword_permutation_pairs"]==31
          assert q["original_orphan_vertex_stage_variants"]==8
          assert q["source_original_keyword_permutation_route_counts_per_pass"]==[8,13,8,2]
          assert q["private_original_10p31_material_ShaderLab_4pass_composed"] is True
          assert q["private_original_10p31_material_ShaderLab_62_vertex_fragment_entrypoints_validated"] is True
          assert q["source_original_Range_property_count"]==0
          print("GT_NEXT10P31_GENUINE_55_D3D11_31_VSFS_SOURCE_4PASS_VERIFIED noAPK=true")
          PY_GT_NEXT10P31_SOURCE
          project="$GITHUB_WORKSPACE/gt-next10p31-full-export-unity"
          mkdir -p "$project/Assets/Editor" "$project/Packages" "$project/ProjectSettings"
          cp "$work/original-10p31-material-Shader48-private.shader" "$project/Assets/GTNext10p31.shader"
          cp android-port/Experiments/GT/Editor/Next10p31ShaderValidation.cs "$project/Assets/Editor/Next10p31ShaderValidation.cs"
          printf '%s\n' '{"dependencies":{}}' > "$project/Packages/manifest.json"
          printf '%s\n' 'm_EditorVersion: 2021.3.45f2' > "$project/ProjectSettings/ProjectVersion.txt"
      - name: Compile NEXT10P31 exact 31 original VSFS and 4-pass ShaderLab in isolated Unity 2021 Android Vulkan
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f2
          projectPath: gt-next10p31-full-export-unity
          targetPlatform: Android
          buildMethod: RaftGT.Next10p31ShaderValidation.Validate
          versioning: None
          allowDirtyBuild: true
          dockerMemoryLimit: 12g
          customParameters: -job-worker-count 2
      - name: Verify NEXT10P31 Vulkan serialized 31 VSFS routes and original candidate SHA before GUID install
        shell: bash
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/gt-next10p31-full-export-unity"
          smolv="$RUNNER_TEMP/gt-next10p31-full-export-smolv"
          mkdir -p "$smolv"
          upstream=https://raw.githubusercontent.com/aras-p/smol-v/6303e979b59153ee7007fd14e06d3fed8687b64c/source
          curl -fsSL "$upstream/smolv.cpp" -o "$smolv/smolv.cpp"
          curl -fsSL "$upstream/smolv.h" -o "$smolv/smolv.h"
          c++ -std=c++11 -O2 -I"$smolv" scripts/gt_decode_smolv.cpp "$smolv/smolv.cpp" -o "$smolv/decode"
          python3 -m scripts.gt_verify_921_shader_bundle \
            --bundle "$project/ProbeResults/Private/gt-next10p31" \
            --source "$project/Assets/GTNext10p31.shader" \
            --receipt "$project/ProbeResults/gt-next10p31-unity-safe.json" \
            --smolv-decoder "$smolv/decode" --next30 \
            --out "$RUNNER_TEMP/gt-next10p31-full-export-bundle-safe.json"
          python3 - <<'PY_GT_NEXT10P31_BUNDLE'
          import json,os,hashlib
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])
          candidate=Path("gt-next10p31-full-export-unity/Assets/GTNext10p31.shader")
          unity=json.loads(Path("gt-next10p31-full-export-unity/ProbeResults/gt-next10p31-unity-safe.json").read_text())
          bundle=json.loads((r/"gt-next10p31-full-export-bundle-safe.json").read_text())
          assert unity["unityVersion"]=="2021.3.45f2"
          assert unity["passCount"]==4 and unity["registeredRoutes"]==31
          assert unity["errors"]==0 and unity["privateBundleCompiled"] is True
          assert unity["androidVulkanOnly"] is True
          assert bundle["vulkan_platform_only"] is True
          assert bundle["compiled_program_table_verified"] is True
          assert bundle["vertex_and_fragment_entrypoints_verified"] is True
          assert bundle["vertex_routes_by_pass"]==bundle["fragment_routes_by_pass"]==[8,13,8,2]
          assert bundle["candidate_sha256"]==hashlib.sha256(candidate.read_bytes()).hexdigest()
          print("GT_NEXT10P31_UNITY_VULKAN_31_VSFS_4PASS_SERIALIZED_VERIFIED noAPK=true")
          PY_GT_NEXT10P31_BUNDLE
      - name: Install NEXT10P31 original Shader48 on same-export original GUID using actual post20 audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.gt_install_next10p31_original_shader48 \
            --original "$RUNNER_TEMP/gt-input" \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --quality "$RUNNER_TEMP/gt-twenty-shader-postrestore-quality.json" \
            --project "$RUNNER_TEMP/gt-project/ExportedProject" \
            --trace "$RUNNER_TEMP/gt-private-export-lineage.json" \
            --candidate "$GITHUB_WORKSPACE/gt-next10p31-full-export-unity/Assets/GTNext10p31.shader" \
            --receipt "$RUNNER_TEMP/gt-next10p31-full-export-bundle-safe.json" \
            --backup "$RUNNER_TEMP/gt-next10p31-original-export-backup" \
            --out "$RUNNER_TEMP/gt-next10p31-original-install-safe.json"
      - name: Audit real post21 original custom material programs and all unchanged 29213 Material YAML meta SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.t3_audit_exported_material_programs \
            --project "$RUNNER_TEMP/gt-project/ExportedProject" --rank-dummy-targets \
            --out "$RUNNER_TEMP/gt-twentyone-shader-postrestore-quality.json"
          python3 - <<'PY_GT_REAL_TWENTY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          prior=json.loads((root/"gt-twenty-shader-postrestore-quality.json").read_text())
          q=json.loads((root/"gt-twentyone-shader-postrestore-quality.json").read_text())
          before=json.loads((root/"gt-full-smoke-private-unchanged-material-meta.json").read_text())
          c=q["counts"]
          assert prior["counts"]["material_docs_using_non_dummy_Shader"]==664
          assert prior["counts"]["material_docs_using_dummy_Shader"]==122
          assert q["status"]=="NATIVE_MATERIAL_SHADER_PROGRAM_AUDIT_ONLY"
          assert c["material_documents"]==1536
          assert c["material_docs_using_Unity_builtin_Shader"]==750
          assert c["material_docs_using_local_custom_Shader"]==786
          assert c["material_docs_with_unknown_or_broken_Shader"]==0
          assert c["material_docs_using_dummy_Shader"]==112
          assert c["material_docs_using_non_dummy_Shader"]==674
          assert c["distinct_dummy_Shader_targets_referenced"]==39
          sha={}
          root_assets=root/"gt-project/ExportedProject/Assets"
          for p in root_assets.rglob("*"):
              if p.is_file() and not p.is_symlink() and p.suffix.lower() in {".meta",".mat",".asset",".prefab",".unity"}:
                  h=hashlib.sha256()
                  with p.open("rb") as f:
                      for chunk in iter(lambda:f.read(1048576),b""):
                          h.update(chunk)
                  sha[str(p.relative_to(root_assets))]=h.hexdigest()
          assert sha==before,"next10p31_original_Material_meta_YAML_sha_drift"
          summary={
              "schema_version":1,
              "status":"GT_TWENTYONE_NEXT10P31_ORIGINAL_SHADER48_SAME_EXPORT_GUID_ACCEPTED_NO_APK",
              "post20_dummy_custom_material_documents":122,
              "post21_non_dummy_custom_material_documents":c["material_docs_using_non_dummy_Shader"],
              "post21_dummy_custom_material_documents":c["material_docs_using_dummy_Shader"],
              "post21_original_dummy_Shader_GUID_targets_remaining":c["distinct_dummy_Shader_targets_referenced"],
              "protected_unchanged_original_Material_YAML_and_meta_files":len(sha),
              "all_original_Material_meta_and_YAML_sha256_unchanged":True,
              "source_authentic_original_Shader48_same_export_GUID_verified":True,
              "APK_OBB_XAPK_created":False,
              "Adreno_pixels_or_runtime_keyword_parity_verified":False,
          }
          (root/"gt-twentyone-shader-postrestore-summary-safe.json").write_text(json.dumps(summary,sort_keys=True,indent=2)+"\n")
          print("GT_TWENTYONE_ORIGINAL_SHADER48_SAME_EXPORT_POSTINSTALL "+json.dumps(summary,sort_keys=True))
          PY_GT_REAL_TWENTY
      - name: Retain safe NEXT10P31 source Unity Vulkan GUID and post21 real Material counts only
        if: always()
