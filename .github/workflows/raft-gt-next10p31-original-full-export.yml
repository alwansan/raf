          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          a=root/"gt-project/ExportedProject/Assets"
          previous=json.loads((root/"gt-full-smoke-private-unchanged-material-meta.json").read_text())
          suffixes={".meta",".mat",".asset",".prefab",".unity"}
          actual={}
          for f in a.rglob("*"):
              if f.is_file() and not f.is_symlink() and f.suffix.lower() in suffixes:
                  h=hashlib.sha256()
                  with f.open("rb") as source:
                      for data in iter(lambda: source.read(1024*1024), b""):
                          h.update(data)
                  actual[str(f.relative_to(a))]=h.hexdigest()
          assert actual==previous,"Original_Material_or_Meta_modified"
          raw=json.loads((root/"gt-raw-export-program-quality.json").read_text())
          vendor=json.loads((root/"gt-actual-postrestore-shader-quality.json").read_text())
          after=json.loads((root/"gt-nine-shader-postrestore-quality.json").read_text())
          c=after["counts"]
          assert after["status"]=="NATIVE_MATERIAL_SHADER_PROGRAM_AUDIT_ONLY"
          assert c["material_documents"]==raw["counts"]["material_documents"]==1536
          assert c["material_docs_with_unknown_or_broken_Shader"]==0
          old=vendor["postrestore_material_quality"]["postrestore_custom_dummy_material_documents"]
