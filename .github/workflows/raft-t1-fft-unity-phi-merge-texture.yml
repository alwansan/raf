name: T1 WATER-001 Unity OpenGLCore synthetic FFT Phi/CFG sampled-image addresses

on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-t1-fft-unity-phi-merge-texture.yml
      - android-port/Experiments/T1/T1FftPhiMergeTextureLoad.compute
      - android-port/Experiments/T1/T1FftPhiMergeTextureLoadTests.cs
      - tests/test_t1_fft_phi_merge_texture_fixture.py

permissions:
  contents: read

concurrency:
  group: t1-fft-phi_merge-texture-load-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sourcefree-openglcore-texture-phi_merge:
    runs-on: ubuntu-24.04
    environment: UNITY_LICENSE
    concurrency:
      group: raft-native-engine-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 25
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CLI_SHA256: 1de550a620ee92e05e920b6db7d431621440b60b2577f04b4a997dc92a58cb0a
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Require real license and small isolated GPU test budget
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [ -z "${UNITY_LICENSE:-}" ] && { [ -z "${UNITY_SERIAL:-}" ] || [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; }; then
            echo 'RAFT_T1_PHI_MERGE_BACKEND missing_license_input=true'
            exit 1
          fi
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2{print $4}')" -gt 12582912
      - name: Sparse checkout sourcefree tests and fixture only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
            android-port/Experiments/T1
      - name: Validate public synthetic texture-phi_merge fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_t1_fft_phi_merge_texture_fixture.py -v
          python3 -m unittest discover -s tests -p test_t1_sourcefree_unity_fixture.py -v
          echo 'RAFT_T1_PHI_MERGE_BACKEND synthetic_source_controls=true original_raft_acquired=false'
      - name: Authenticate pinned GameCI v0.1.72
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t1-phi-merge-cli"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/game-ci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz" \
            --output "$RUNNER_TEMP/t1-phi-merge-cli.tar.gz"
          echo "$CLI_SHA256  $RUNNER_TEMP/t1-phi-merge-cli.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/t1-phi-merge-cli.tar.gz" -C "$RUNNER_TEMP/t1-phi-merge-cli"
          find "$RUNNER_TEMP/t1-phi-merge-cli" -type f -name game-ci -print -quit > "$RUNNER_TEMP/t1-phi-merge-cli-path.txt"
          test -s "$RUNNER_TEMP/t1-phi-merge-cli-path.txt"
          chmod +x "$(cat "$RUNNER_TEMP/t1-phi-merge-cli-path.txt")"
      - name: Execute actual Unity2021 OpenGLCore sampled-image direct versus float-phi_merge load
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 -m scripts.t1_sourcefree_unity_fixture --project t1-phi-merge-unity
          rm t1-phi-merge-unity/Assets/Tests/Editor/T1SourceFreeEditorTest.cs
          cp android-port/Experiments/T1/T1FftPhiMergeTextureLoadTests.cs \
            t1-phi-merge-unity/Assets/Tests/Editor/
          cp android-port/Experiments/T1/T1FftPhiMergeTextureLoad.compute \
            t1-phi-merge-unity/Assets/T1Synthetic/
          cli="$(cat "$RUNNER_TEMP/t1-phi-merge-cli-path.txt")"
          set +e
          timeout 720s "$cli" test --docker --dockerShmSize=1025m --engine=unity \
            t1-phi-merge-unity --testPlatforms=editmode --engineVersion=2021.3.45f2 \
            --artifactsPath=t1-phi-merge-test-results \
            --containerRegistryRepository=unityci/editor --containerRegistryImageVersion=3 \
            > "$RUNNER_TEMP/t1-phi-merge-unity-private.log" 2>&1
          rc=$?
          set -e
          sudo chown -R "$(id -u):$(id -g)" t1-phi-merge-unity t1-phi-merge-test-results || true
          python3 - "$rc" <<'PY'
          import json
          from pathlib import Path
          import sys
          from scripts import t1_gameci_private_result_gate as gate
          metrics_path = Path("t1-phi-merge-unity/t1-phi-merge-counts.txt")
          metrics_valid = False
          counts = None
          if metrics_path.is_file() and not metrics_path.is_symlink() and metrics_path.stat().st_size <= 100:
              try:
                  lines = metrics_path.read_text().splitlines()
                  if len(lines) == 5 and all(line.isdecimal() and len(line) <= 2 for line in lines):
                      counts = [int(line) for line in lines]
                      metrics_valid = all(0 <= x <= 64 for x in counts)
              except (OSError, UnicodeError, ValueError):
                  pass
          print("RAFT_T1_PHI_MERGE_TEXTURE_COUNTS " + json.dumps({
              "capture_reached": metrics_valid, "first_direct": counts[0] if metrics_valid else None,
              "second_direct": counts[1] if metrics_valid else None,
              "single_branch_phi": counts[2] if metrics_valid else None,
              "nested_branch_phi": counts[3] if metrics_valid else None,
              "dynamic_loop_phi": counts[4] if metrics_valid else None,
              "synthetic_only": True, "original_shader_compared": False,
              "unity_actual_gpu_executed": metrics_valid, "android_water_proven": False
          }, sort_keys=True))
          xml = Path("t1-phi-merge-test-results/editmode-results.xml")
          if xml.is_symlink() or not xml.is_file() or xml.stat().st_size > gate.MAX_XML:
              raise SystemExit("Sourcefree Unity phi_merge control missing bounded NUnit XML")
          gate.KNOWN["phi_merge"] = frozenset({
              "T1FftPhiMergeTextureLoadTests.BranchNestedAndDynamicLoopFloatCarriersMatchDirectTextureCoordinates"
          })
          result = gate.classify(xml.read_bytes(), int(sys.argv[1]), "phi_merge")
          print("RAFT_T1_PHI_MERGE_NUNIT " + json.dumps({
              "all_expected_tests_passed": result["all_expected_tests_passed"],
              "expected_tests": result["expected_test_case_count"],
              "observed_tests": result["observed_test_case_count"],
              "GPU_word_tests": 320, "original_fft_runtime_proven": False,
              "android_adreno_proven": False
          }, sort_keys=True))
          if not (metrics_valid and counts == [0, 0, 0, 0, 0] and result["all_expected_tests_passed"]):
              raise SystemExit("T1 Unity sampled-image phi_merge path remains unproven")
          PY
      - name: Erase synthetic Unity project, NUnit XML and captured private logs
        if: always()
        shell: bash
        run: |
          sudo rm -rf t1-phi-merge-unity t1-phi-merge-test-results
          rm -rf "$RUNNER_TEMP/t1-phi-merge-cli" "$RUNNER_TEMP/t1-phi-merge-cli.tar.gz"
          rm -f "$RUNNER_TEMP/t1-phi-merge-cli-path.txt" "$RUNNER_TEMP/t1-phi-merge-unity-private.log"
