name: GT SHA-original Spectrum 7pass paired Vulkan stage feasibility (NO APK)
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/gt_spectrum_original_pair_compile.py
      - tests/test_gt_spectrum_original_pair_compile.py
      - scripts/gt_spectrum_original_pass_states.py
      - tests/test_gt_spectrum_original_pass_states.py
      - scripts/gt_spectrum_original_private_seven_pass_shaderlab.py
      - tests/test_gt_spectrum_original_private_seven_pass_shaderlab.py
      - scripts/gt_spectrum_private_unity_project.py
      - tests/test_gt_spectrum_private_unity_project.py
      - scripts/gt_spectrum_private_stage_buffer_isolation.py
      - tests/test_gt_spectrum_private_stage_buffer_isolation.py
      - scripts/gt_spectrum_original_sampler_source_bridge.py
      - tests/test_gt_spectrum_original_sampler_source_bridge.py
      - android-port/Experiments/GT/Editor/OriginalSpectrumSevenPassValidation.cs
      - .github/workflows/raft-gt-original-spectrum-seven-pass-paired-glslang.yml
permissions:
  contents: read

concurrency:
  group: gt-original-spectrum-7pass-private-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-private-spectrum-pairs:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    environment: UNITY_LICENSE
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
      - name: Source-free negative and ordered-pair controls
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_gt_spectrum_original_pair_compile.py -v
          python3 -m unittest discover -s tests -p test_gt_spectrum_original_pass_states.py -v
          python3 -m unittest discover -s tests -p test_gt_spectrum_original_private_seven_pass_shaderlab.py -v
          python3 -m unittest discover -s tests -p test_gt_spectrum_private_unity_project.py -v
          python3 -m unittest discover -s tests -p test_gt_spectrum_private_stage_buffer_isolation.py -v
          python3 -m unittest discover -s tests -p test_gt_spectrum_original_sampler_source_bridge.py -v
          python3 -m py_compile scripts/gt_spectrum_original_pair_compile.py scripts/gt_spectrum_original_pass_states.py scripts/gt_spectrum_original_private_seven_pass_shaderlab.py scripts/gt_spectrum_private_unity_project.py scripts/gt_spectrum_private_stage_buffer_isolation.py scripts/gt_spectrum_original_sampler_source_bridge.py
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: gt-spectrum-zip2
          lfs: false
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/sharedassets0.assets/*
      - name: Reassemble only original SHA-pinned Spectrum owner without Git LFS
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess
          from scripts.w1_stage_zip2_owners import ZIP2_SHA, PINS, stage
          repo = Path("gt-spectrum-zip2")
          assert subprocess.check_output(
              ["git","-C",str(repo),"rev-parse","HEAD"], text=True).strip() == ZIP2_SHA
          destination = Path(os.environ["RUNNER_TEMP"]) / "gt-spectrum-original"
          result = stage(repo, destination, {
              "Raft_Data/sharedassets0.assets": PINS["Raft_Data/sharedassets0.assets"]})
          assert result["verified_bytes"] == 115978112
          assert result["lfs_used"] is False
          # B09's SHA-verified source contract reads a flat ./sharedassets0.assets,
          # while the generic ZIP2 stager restores canonical Raft_Data/.. paths.
          # Move ONLY the runner-private verified copy; ZIP2 is read-only.
          original = destination / "Raft_Data" / "sharedassets0.assets"
          flat = destination / "sharedassets0.assets"
          assert original.is_file() and not original.is_symlink()
          assert not flat.exists() and not flat.is_symlink()
          original.rename(flat)
          assert flat.is_file() and flat.stat().st_size == 115978112
          print("GT_SPECTRUM_ORIGINAL_SHA_PIN_OK owners=1 bytes=115978112 LFS=false B09flat=true")
          PY
      - name: Load original reader and private shader translators
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4 -q
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
      - name: Stage exact original 7passes x2 variants x VS/FS into ephemeral scratch
        run: |
          set -euo pipefail
          timeout 300s python3 -m scripts.b09_stage_original_spectrum \
            --source "$RUNNER_TEMP/gt-spectrum-original" \
            --repo "$GITHUB_WORKSPACE" \
            --private "$RUNNER_TEMP/gt-spectrum-original-private" \
            --out "$RUNNER_TEMP/gt-spectrum-original-private-manifest.json"
      - name: Serialize exactly seven source original Spectrum Pass render states privately
        run: |
          set -euo pipefail
          timeout 180s python3 -m scripts.gt_spectrum_original_pass_states \
            --source "$RUNNER_TEMP/gt-spectrum-original" \
            --repo "$GITHUB_WORKSPACE" \
            --private "$RUNNER_TEMP/gt-spectrum-states-private" \
            --out "$RUNNER_TEMP/gt-spectrum-states-safe.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) /
              "gt-spectrum-states-safe.json").read_text())
          assert result["status"] == "ORIGINAL_SPECTRUM_SEVEN_SOURCE_RENDER_STATES_PRIVATE"
          assert result["original_passes"] == 7
          assert result["state_hashes_privately_verified"] == 7
          assert result["Unity_ShaderLab_installed"] is False
          print("GT_SPECTRUM_ORIGINAL_RENDER_STATES_PRIVATE originalPasses=7 originalStates=7 UnityShaderLabInstalled=false")
          PY
      - name: Assemble two isolated original seven-pass Spectrum private ShaderLab envelopes (not game install)
        run: |
          set -euo pipefail
          timeout 480s python3 -m scripts.gt_spectrum_original_private_seven_pass_shaderlab \
            --source "$RUNNER_TEMP/gt-spectrum-original" \
            --repo "$GITHUB_WORKSPACE" \
            --packet "$RUNNER_TEMP/gt-spectrum-original-private" \
            --manifest "$RUNNER_TEMP/gt-spectrum-original-private-manifest.json" \
            --states "$RUNNER_TEMP/gt-spectrum-states-private" \
            --private-dest "$RUNNER_TEMP/gt-spectrum-seven-pass-shaderlab-private" \
            --out "$RUNNER_TEMP/gt-spectrum-private-shaderlab-safe.json" \
            --source-authentic-resource-names
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) /
              "gt-spectrum-private-shaderlab-safe.json").read_text())
          assert result["status"] == "PRIVATE_ORIGINAL_SPECTRUM_TWO_SEVEN_PASS_SHADERLAB_CANDIDATES"
          assert result["original_exact_pass_count"] == 7
          assert result["original_keyword_permutations"] == 2
          assert result["private_seven_pass_ShaderLab_candidates"] == 2
          assert result["private_shaderlab_structural_passes"] == 14
          assert result["original_stage_variants_included"] == 28
          assert result["original_authored_property_count"] == 6
          assert result["original_authored_texture_property_count"] == 2
          assert result["source_original_resource_name_rebinding_enabled"] is True
          assert result["source_original_resource_stages_bound"] == 28
          assert result["source_original_sampler_symbol_bindings"] > 0
          assert result["original_sampler_filter_wrap_or_exported_Material_binding_proven"] is False
          assert result["original_game_shader_installed"] is False
          assert result["Unity2021_import_or_Adreno_pixels_proven"] is False
          print("GT_SPECTRUM_SEVEN_PASS_PRIVATE_SHADERLAB_SAFE candidateShaders=2 exactPassesEach=7 sourceStages=28 originalProperties=6 originalTextures=2 originalGameInstalled=false")
          PY
      - name: Compile privately paired original Spectrum stages for Vulkan 1.1
        run: |
          set -euo pipefail
          timeout 900s python3 -m scripts.gt_spectrum_original_pair_compile \
            --packet "$RUNNER_TEMP/gt-spectrum-original-private" \
            --stage-report "$RUNNER_TEMP/gt-spectrum-original-private-manifest.json" \
            --scratch "$RUNNER_TEMP" \
            --out "$RUNNER_TEMP/gt-spectrum-pairs-safe.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) /
              "gt-spectrum-pairs-safe.json").read_text())
          assert result["status"] == "PRIVATE_ORIGINAL_SPECTRUM_SEVEN_PASS_PAIR_GLSLANG_VALID"
          assert result["original_SHA_verified_passes"] == 7
          assert result["original_VS_FS_keyword_pairs"] == 14
          assert result["original_combined_compiled_stage_variants"] == 28
          assert result["Adreno_pixels_verified"] is False
          assert result["original_shader_installed_into_Unity"] is False
          print("GT_SPECTRUM_7PASS_PAIR_PRIVATE_SAFE exactOriginalPasses=7 pairedVariants=14 compiledStages=28 originalUnityInstalled=false AndroidPixels=false")
          PY
      - name: Stage isolated Unity 2021 project with only private authentic-derived Spectrum 7pass variant0
        run: |
          set -euo pipefail
          python3 -m scripts.gt_spectrum_private_unity_project \
            --candidate "$RUNNER_TEMP/gt-spectrum-seven-pass-shaderlab-private/original-spectrum-7pass-variant-0.shader" \
            --manifest "$RUNNER_TEMP/gt-spectrum-private-shaderlab-safe.json" \
            --editor android-port/Experiments/GT/Editor/OriginalSpectrumSevenPassValidation.cs \
            --project "$GITHUB_WORKSPACE/gt-private-spectrum-unity" \
            --out "$RUNNER_TEMP/gt-spectrum-private-unity-staging-safe.json" \
            --diagnostic-stage-buffers
      - name: Unity 2021.3.45f2 private stage-disjoint CBuffer diagnosis for authentic 7pass Spectrum Android Vulkan
        id: gt_spectrum_real_unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f2
          projectPath: gt-private-spectrum-unity
          targetPlatform: Android
          buildMethod: RaftGT.OriginalSpectrumSevenPassValidation.Validate
          versioning: None
          allowDirtyBuild: true
          dockerMemoryLimit: 12g
          customParameters: -job-worker-count 2
      - name: Validate real Unity shader import and Android Vulkan bundle without claiming game pixels
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          path=Path("gt-private-spectrum-unity/ProbeResults/gt-spectrum-sevenpass-unity-safe.json")
          if not path.is_file() or not 0 < path.stat().st_size < 65536:
              raise SystemExit("GT_SPECTRUM_REAL_UNITY_SAFE_RECEIPT_MISSING")
          data=json.loads(path.read_text(encoding="utf-8"))
          required={
              "status":"PRIVATE_ORIGINAL_SPECTRUM_VARIANT0_SEVEN_PASS_UNITY_ANDROID_VULKAN_BUNDLE_COMPILED",
              "unityVersion":"2021.3.45f2",
              "originalSourcePasses":7,
              "isolatedVariantIndex":0,
              "shaderPassCount":7,
              "shaderErrorCount":0,
              "importedPrivateShader":True,
              "privateAndroidVulkanBundleBuilt":True,
              "editorShaderImportAndCompilationProven":True,
              "sourceOriginalKeywordRoutingProven":False,
              "originalMaterialGuidOrSamplerBindingProven":False,
              "originalAndroidGameModified":False,
              "gamePlayerBuilt":False,
              "AdrenoPixelsVerified":False,
              "originalShaderBytecodeOrNamesPublished":False,
          }
          for key,value in required.items():
              if type(data.get(key)) is not type(value) or data[key]!=value:
                  raise SystemExit("GT_SPECTRUM_UNITY_ORIGINAL_PRIVATE_GATE_"+key)
          if (type(data.get("privateAndroidVulkanShaderBundleBytes")) is not int
              or data["privateAndroidVulkanShaderBundleBytes"] <= 0):
              raise SystemExit("GT_SPECTRUM_UNITY_PRIVATE_BUNDLE_EMPTY")
          print("GT_SPECTRUM_UNITY_ANDROID_VULKAN_PRIVATE realUnity2021=true originalSevenPasses=true bundleBuilt=true originalGameModified=false originalKeywordAndMaterialParity=false phonePixels=false")
          PY
      - name: Keep only sanitized shader-source and real Unity numeric result; never candidate or bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-spectrum-private-unity-safe-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gt-spectrum-private-unity-staging-safe.json
            gt-private-spectrum-unity/ProbeResults/gt-spectrum-sevenpass-unity-safe.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove SHA-original payloads and all translated private shader programs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/gt-spectrum-original" \
            "$RUNNER_TEMP/gt-spectrum-original-private" \
            "$RUNNER_TEMP/gt-spectrum-original-private-manifest.json" \
            "$RUNNER_TEMP/gt-spectrum-pairs-safe.json" \
            "$RUNNER_TEMP/gt-spectrum-states-private" \
            "$RUNNER_TEMP/gt-spectrum-states-safe.json" \
            "$RUNNER_TEMP/gt-spectrum-seven-pass-shaderlab-private" \
            "$RUNNER_TEMP/gt-spectrum-private-shaderlab-safe.json" \
            "$RUNNER_TEMP/gt-spectrum-private-unity-staging-safe.json" \
            "$GITHUB_WORKSPACE/gt-spectrum-zip2"
          test "$GITHUB_WORKSPACE" = "$PWD"
          sudo rm -rf -- "$GITHUB_WORKSPACE/gt-private-spectrum-unity"
