name: T3 RENDER-002 source-only exact authored Shader48 Property parity
on:
  push:
    branches:
      - feature/android-native-port
    paths:
      - scripts/t3_particle108_shaderlab_property_parity.py
      - tests/test_t3_particle108_shaderlab_property_parity.py
      - .github/workflows/raft-t3-shaderlab-property-parity-source-only.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t3-exact-shader-property-parity-sourceonly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sourcefree:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
      - name: Compare exact private property name and type contracts with synthetic ShaderLab
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t3_particle108_shaderlab_property_parity.py tests/test_t3_particle108_shaderlab_property_parity.py
          python3 -m unittest discover -s tests -p 'test_t3_particle108_shaderlab_property_parity.py' -v
