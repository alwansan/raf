name: Raft Android offline platform adapter - build and test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-native-port
    paths:
      - 'android-port/**'
      - 'tests/test_android_diagnostics_policy.py'
      - 'tests/test_android_touch_gamepad_policy.py'
      - 'scripts/verify_touch_pointer_mouse_mapping.py'
      - 'scripts/verify_touch_binding_lifecycle.py'
      - 'scripts/verify_touch_drag_capture.py'
      - 'scripts/audit_gradle_asset_payload.py'
      - 'tests/test_gradle_payload_audit.py'
      - 'tests/test_early_apk_distribution_policy.py'
      - 'scripts/audit_android_expansion.py'
      - 'scripts/package_android_delivery.py'
      - 'scripts/reassemble_android_delivery.py'
      - 'tests/test_android_delivery_package.py'
      - 'tests/test_android_expansion_audit.py'
      - 'tests/test_standalone_original_data_gate.py'
      - '.github/workflows/raft-unity-editor-android-import.yml'
      - '.github/workflows/raft-android-platform-tests.yml'

permissions:
  contents: read

jobs:
  platform-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Storage safety
        run: |
          df -h /
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 2097152
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Guard bounded Android diagnostic UI source policy
        run: python3 -m unittest discover -s tests -p test_android_diagnostics_policy.py -v
      - name: Guard optional on-screen gamepad source contract
        run: python3 -m unittest discover -s tests -p test_android_touch_gamepad_policy.py -v
      - name: Execute actual touch binding restore method with strict registration lifecycle
        run: |
          python3 -m scripts.verify_touch_binding_lifecycle --output "$RUNNER_TEMP/touch-lifecycle"
          dotnet run --project "$RUNNER_TEMP/touch-lifecycle/Lifecycle.csproj" --configuration Release --nologo
      - name: Execute actual touch editor drag pointer-capture lifecycle
        run: |
          python3 -m scripts.verify_touch_drag_capture --output "$RUNNER_TEMP/touch-drag"
          dotnet run --project "$RUNNER_TEMP/touch-drag/DragCapture.csproj" --configuration Release --nologo
      - name: Verify complete APK OBB XAPK and lossless transport delivery
        run: python3 -m unittest discover -s tests -p test_android_delivery_package.py -v
      - name: Guard early APK redistribution policy
        run: python3 -m unittest discover -s tests -p test_early_apk_distribution_policy.py -v
      - name: Execute original FMOD data gate for standalone and split packages
        run: python3 -m unittest discover -s tests -p test_standalone_original_data_gate.py -v
      - name: Verify synthetic APK plus OBB archive integrity without LFS
        run: python3 -m unittest discover -s tests -p test_android_expansion_audit.py -v
      - name: Verify privacy-safe generated Gradle payload accounting (no LFS)
        run: python3 -m unittest discover -s tests -p test_gradle_payload_audit.py -v
      - name: Guard original 40-scene Android APK integrity
        run: python3 -m unittest discover -s tests -p test_android_native_scene_policy.py -v
      - name: Execute real Android colour texture selection policy without Unity
        run: dotnet run --project android-port/Tests/ColourTextures/ColourTextures.csproj --configuration Release --nologo
      - name: Compile original offline Android compatibility library against netstandard2.1
        run: |
          dotnet build android-port/Runtime/Platform/RaftAndroid.Platform.csproj \
            --configuration Release --nologo -v:q
      - name: Execute actual left-touch tap hold cancel and multitouch ownership policy
        run: dotnet run --project android-port/Tests/TouchPointer/TouchPointer.csproj --configuration Release --nologo
      - name: Verify actual synthetic left-button output and physical legacy mouse preservation
        run: |
          python3 -m scripts.verify_touch_pointer_mouse_mapping --output "$RUNNER_TEMP/touch-mouse-mapping"
          dotnet run --project "$RUNNER_TEMP/touch-mouse-mapping/Mapping.csproj" --configuration Release --nologo
      - name: Run storage, identity and offline-session smoke tests
        run: |
          dotnet run --project android-port/Tests/Smoke/RaftAndroid.Platform.Smoke.csproj \
            --configuration Release --nologo
      - name: Reject local profile symlink redirects in actual managed source (CPU only)
        run: dotnet run --project android-port/Tests/ProfileLinkSafety/ProfileLinkSafety.csproj --configuration Release --nologo
      - name: Summarize
        run: |
          echo '## Raft Android platform skeleton' >> "$GITHUB_STEP_SUMMARY"
          echo '- netstandard2.1 platform library compilation: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Local offline identity, secure save paths, single-player session fixture tests: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- No game C# rewritten or assets included yet; no Android APK from this library alone.' >> "$GITHUB_STEP_SUMMARY"
