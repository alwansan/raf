name: GT rank remaining 333 Dummy materials across all 82 authentic ZIP2 original shader owners (NO APK)
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/gt_rank_all82_original_shader_names_after_nine.py
      - scripts/gt_probe_remaining_original_shader_dxbc_topology.py
      - scripts/gt_translate_next_remaining_30_shader48.py
      - tests/test_gt_translate_next_remaining_30_shader48.py
      - tests/test_gt_probe_remaining_original_shader_dxbc_topology.py
      - tests/test_gt_rank_all82_original_shader_names_after_nine.py
      - .github/workflows/raft-gt-all82-original-shader-name-priority.yml
      - android-port/Experiments/GT/Editor/Next30ShaderValidation.cs
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gt-82-original-shader-to-material-priority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-all82-name-source-priority:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    environment: UNITY_LICENSE
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
            android-port/Experiments/GT/Editor
      - name: Test strict no-private-names rank for source Shader48 and post-nine dummy materials
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/gt_rank_all82_original_shader_names_after_nine.py
          python3 -m unittest discover -s tests -p test_gt_rank_all82_original_shader_names_after_nine.py -v
          python3 -m unittest discover -s tests -p test_gt_probe_remaining_original_shader_dxbc_topology.py -v
          python3 -m unittest discover -s tests -p test_gt_translate_next_remaining_30_shader48.py -v
      - name: Read SHA-original source-free numeric material usage from validated nine-shader run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43759856414
          name: gt-nine-shader-full-export-audit-43759856414
          path: ${{ runner.temp }}/gt-nine-original-quality
      - name: Read exact post13 246-Dummy Material same-export audit from validated ZIP2 Unity run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43764506277
          name: gt-thirteen-source-shader-full-export-audit-43764506277
          path: ${{ runner.temp }}/gt-thirteen-original-quality
      - name: Require runner capacity for 82 original serialized objects only
        run: |
          set -euo pipefail
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 5242880
      - name: Read immutable ZIP2 serialized owner files only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: .gt-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/globalgamemanagers.assets
            Raft/Raft_Data/resources.assets
            Raft/Raft_Data/level0
            Raft/Raft_Data/level1
            Raft/Raft_Data/level2
            Raft/Raft_Data/level3
            Raft/Raft_Data/level4
            Raft/Raft_Data/level5
            Raft/Raft_Data/level6
            Raft/Raft_Data/level7
            Raft/Raft_Data/level8
            Raft/Raft_Data/level9
            Raft/Raft_Data/level10
            Raft/Raft_Data/level11
            Raft/Raft_Data/level12
            Raft/Raft_Data/level13
            Raft/Raft_Data/level14
            Raft/Raft_Data/level15
            Raft/Raft_Data/level16
            Raft/Raft_Data/level17
            Raft/Raft_Data/level18
            Raft/Raft_Data/level19
            Raft/Raft_Data/level20
            Raft/Raft_Data/level21
            Raft/Raft_Data/level22
            Raft/Raft_Data/level23
            Raft/Raft_Data/level24
            Raft/Raft_Data/level25
            Raft/Raft_Data/level26
            Raft/Raft_Data/level27
            Raft/Raft_Data/level28
            Raft/Raft_Data/level29
            Raft/Raft_Data/level30
            Raft/Raft_Data/level31
            Raft/Raft_Data/level32
            Raft/Raft_Data/level33
            Raft/Raft_Data/level34
            Raft/Raft_Data/level35
            Raft/Raft_Data/level36
            Raft/Raft_Data/level37
            Raft/Raft_Data/level38
            Raft/Raft_Data/level39
            Raft/Raft_Data/sharedassets0.assets
            Raft/Raft_Data/sharedassets1.assets
            Raft/Raft_Data/sharedassets2.assets
            Raft/Raft_Data/sharedassets3.assets
            Raft/Raft_Data/sharedassets4.assets
            Raft/Raft_Data/sharedassets5.assets
            Raft/Raft_Data/sharedassets6.assets
            Raft/Raft_Data/sharedassets7.assets
            Raft/Raft_Data/sharedassets8.assets
            Raft/Raft_Data/sharedassets9.assets
            Raft/Raft_Data/sharedassets10.assets
            Raft/Raft_Data/sharedassets11.assets
            Raft/Raft_Data/sharedassets12.assets
            Raft/Raft_Data/sharedassets13.assets
            Raft/Raft_Data/sharedassets14.assets
            Raft/Raft_Data/sharedassets15.assets
            Raft/Raft_Data/sharedassets16.assets
            Raft/Raft_Data/sharedassets17.assets
            Raft/Raft_Data/sharedassets18.assets
            Raft/Raft_Data/sharedassets19.assets
            Raft/Raft_Data/sharedassets20.assets
            Raft/Raft_Data/sharedassets21.assets
            Raft/Raft_Data/sharedassets22.assets
            Raft/Raft_Data/sharedassets23.assets
            Raft/Raft_Data/sharedassets24.assets
            Raft/Raft_Data/sharedassets25.assets
            Raft/Raft_Data/sharedassets26.assets
            Raft/Raft_Data/sharedassets27.assets
            Raft/Raft_Data/sharedassets28.assets
            Raft/Raft_Data/sharedassets29.assets
            Raft/Raft_Data/sharedassets30.assets
            Raft/Raft_Data/sharedassets31.assets
            Raft/Raft_Data/sharedassets32.assets
            Raft/Raft_Data/sharedassets33.assets
            Raft/Raft_Data/sharedassets34.assets
            Raft/Raft_Data/sharedassets35.assets
            Raft/Raft_Data/sharedassets36.assets
            Raft/Raft_Data/sharedassets37.assets
            Raft/Raft_Data/sharedassets38.assets
            Raft/Raft_Data/sharedassets39.assets

      - name: Materialize exact SHA-authenticated 82 Unity serialized owners (no LFS or raw upload)
        run: |
          set -euo pipefail
          test "$(git -C .gt-zip2 rev-parse HEAD)" = 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          python3 -m scripts.gt_stage_serialized_owners \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --source .gt-zip2/Raft/Raft_Data \
            --destination "$RUNNER_TEMP/gt-original-82-shader-owners" \
            --report "$RUNNER_TEMP/gt-original-82-source-proof-private.json" > "$RUNNER_TEMP/gt-original-82-source-private.log"
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.23.0
      - name: Compare all 82 original Shader48 names to 333 residual dummy material usage
        run: |
          set -euo pipefail
          python3 -m scripts.gt_rank_all82_original_shader_names_after_nine \
            --original "$RUNNER_TEMP/gt-original-82-shader-owners" \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --quality "$RUNNER_TEMP/gt-nine-original-quality/gt-nine-shader-postrestore-quality.json" \
            --out "$RUNNER_TEMP/gt-all82-original-333-material-priority-safe.json"
      - name: Re-evaluate exact original 82-owner Shader48 source names against post13 246 remaining real Dummy Materials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.gt_rank_all82_original_shader_names_after_nine \
            --original "$RUNNER_TEMP/gt-original-82-shader-owners" \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --quality "$RUNNER_TEMP/gt-thirteen-original-quality/gt-thirteen-shader-postrestore-quality.json" \
            --expected-dummy-materials 246 --expected-dummy-shaders 47 \
            --out "$RUNNER_TEMP/gt-all82-original-246-material-priority-safe.json"
      - name: Inspect real original D3D11 pass and permutation feasibility for 12 top unresolved material shader targets
        run: |
          set -euo pipefail
          python3 -m scripts.gt_probe_remaining_original_shader_dxbc_topology \
            --original "$RUNNER_TEMP/gt-original-82-shader-owners" \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --quality "$RUNNER_TEMP/gt-nine-original-quality/gt-nine-shader-postrestore-quality.json" \
            --out "$RUNNER_TEMP/gt-top12-original-d3d11-shader-topology-safe.json"
      - name: Recover exact original 30-Material Shader48 55 D3D11 stages and route to Vulkan11 privately (NO XAPK)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
          timeout 2400s python3 -m scripts.gt_translate_next_remaining_30_shader48 \
            --original "$RUNNER_TEMP/gt-original-82-shader-owners" \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --quality "$RUNNER_TEMP/gt-nine-original-quality/gt-nine-shader-postrestore-quality.json" \
            --private "$RUNNER_TEMP/gt-private-recovered-30-material-original-shader" \
            --out "$RUNNER_TEMP/gt-original-30-material-shader-D3D11-private-stage-safe.json"
      - name: Prepare next original 30-Material Shader48 private Unity Android Vulkan project (no game player)
        shell: bash
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/gt-next30-original-unity"
          private="$RUNNER_TEMP/gt-private-recovered-30-material-original-shader"
          python3 - <<'PY_GT_NEXT30'
          import os,json
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])
          source=json.loads((r/"gt-original-30-material-shader-D3D11-private-stage-safe.json").read_text())
          assert source["status"]=="GT_SHA_ORIGINAL_REMAINING_30_MATERIAL_SHADER48_D3D11_PRIVATE_STAGES_TRANSLATED"
          assert source["original_program_stages_roundtrip_Vulkan11_valid"]==55
          assert source["private_original_30_material_ShaderLab_62_vertex_fragment_entrypoints_validated"] is True
          assert source["source_original_keyword_permutation_route_counts_per_pass"]==[8,13,8,2]
          assert source["APK_OBB_XAPK_created"] is False
          print("GT_NEXT30_ORIGINAL_SHADER48_PRIVATE_ANDROID_BUNDLE_INPUT_VERIFIED=true")
          PY_GT_NEXT30
          mkdir -p "$project/Assets/Editor" "$project/Packages" "$project/ProjectSettings"
          test -s "$private/original-30-material-Shader48-private.shader"
          cp "$private/original-30-material-Shader48-private.shader" "$project/Assets/GTNext30.shader"
          cp android-port/Experiments/GT/Editor/Next30ShaderValidation.cs "$project/Assets/Editor/Next30ShaderValidation.cs"
          printf '%s\n' '{"dependencies":{}}' > "$project/Packages/manifest.json"
          printf '%s\n' 'm_EditorVersion: 2021.3.45f2' > "$project/ProjectSettings/ProjectVersion.txt"
      - name: Compile the recovered private 30-Material Shader48 in isolated Unity Android Vulkan (NO APK)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f2
          projectPath: gt-next30-original-unity
          targetPlatform: Android
          buildMethod: RaftGT.Next30ShaderValidation.Validate
          versioning: None
          allowDirtyBuild: true
          dockerMemoryLimit: 12g
          customParameters: -job-worker-count 2
      - name: Require exact original 31 Unity Android Vulkan keyword routes and 4 passes (no player)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_GT_UNITY_NEXT30'
          import json,hashlib
          from pathlib import Path
          project=Path("gt-next30-original-unity")
          shader=project/"Assets/GTNext30.shader"
          report=json.loads((project/"ProbeResults/gt-next30-unity-safe.json").read_text())
          assert report["unityVersion"]=="2021.3.45f2"
          assert report["passCount"]==4
          assert report["registeredRoutes"]==31
          assert report["errors"]==0
          assert report["androidVulkanOnly"] is True
          assert report["privateBundleCompiled"] is True
          assert report["candidateSha256"]==hashlib.sha256(shader.read_bytes()).hexdigest()
          assert (project/"ProbeResults/Private/gt-next30").is_file()
          print("GT_NEXT30_4_PASS_31_ROUTE_UNITY_ANDROID_VULKAN_ISOLATED_SHADER_BUNDLE_VALID noAPK=true noOriginalShaderSourcePublished=true")
          PY_GT_UNITY_NEXT30
      - name: Verify original 30-Material Shader48 Vulkan bundle serializes 31 VS/FS routes, not merely Unity compiler success
        shell: bash
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/gt-next30-original-unity"
          smolv="$RUNNER_TEMP/gt-next30-smolv"
          mkdir -p "$smolv"
          upstream=https://raw.githubusercontent.com/aras-p/smol-v/6303e979b59153ee7007fd14e06d3fed8687b64c/source
          curl -fsSL "$upstream/smolv.cpp" -o "$smolv/smolv.cpp"
          curl -fsSL "$upstream/smolv.h" -o "$smolv/smolv.h"
          c++ -std=c++11 -O2 -I"$smolv" scripts/gt_decode_smolv.cpp "$smolv/smolv.cpp" -o "$smolv/decode"
          python3 -m scripts.gt_verify_921_shader_bundle \
            --bundle "$project/ProbeResults/Private/gt-next30" \
            --source "$project/Assets/GTNext30.shader" \
            --receipt "$project/ProbeResults/gt-next30-unity-safe.json" \
            --smolv-decoder "$smolv/decode" --next30 \
            --out "$RUNNER_TEMP/gt-next30-original-vulkan-bundle-safe.json"
          python3 - <<'PY_GT_NEXT30_BUNDLE'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          r=json.loads((root/"gt-next30-original-vulkan-bundle-safe.json").read_text())
          assert r["vulkan_platform_only"] is True
          assert r["compiled_program_table_verified"] is True
          assert r["vertex_routes_by_pass"]==[8,13,8,2]
          assert r["fragment_routes_by_pass"]==[8,13,8,2]
          assert r["vertex_and_fragment_entrypoints_verified"] is True
          assert r["candidate_sha256"]
          print("GT_NEXT30_SOURCE_4PASS_UNITY_ANDROID_VULKAN_31_VSFS_BUNDLE_ROUTES_VERIFIED noAPK=true")
          PY_GT_NEXT30_BUNDLE
      - name: Retain only next30 numeric Unity compiler proof, never source ShaderLab or shader bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-next30-original-unity-vulkan-safe-${{ github.run_id }}
          path: |
            gt-next30-original-unity/ProbeResults/gt-next30-unity-safe.json
            ${{ runner.temp }}/gt-next30-original-vulkan-bundle-safe.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload anonymous ranking counts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-all82-original-333-shader-priority-safe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gt-all82-original-333-material-priority-safe.json
            ${{ runner.temp }}/gt-all82-original-246-material-priority-safe.json
            ${{ runner.temp }}/gt-top12-original-d3d11-shader-topology-safe.json
            ${{ runner.temp }}/gt-original-30-material-shader-D3D11-private-stage-safe.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Delete runner-private original ZIP2 shader owners and source names
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/gt-original-82-shader-owners" .gt-zip2
          rm -rf -- "$RUNNER_TEMP/gt-private-recovered-30-material-original-shader"
          sudo rm -rf -- "$GITHUB_WORKSPACE/gt-next30-original-unity"
