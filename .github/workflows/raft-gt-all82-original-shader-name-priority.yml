name: GT rank remaining 333 Dummy materials across all 82 authentic ZIP2 original shader owners (NO APK)
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/gt_rank_all82_original_shader_names_after_nine.py
      - tests/test_gt_rank_all82_original_shader_names_after_nine.py
      - .github/workflows/raft-gt-all82-original-shader-name-priority.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gt-82-original-shader-to-material-priority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-all82-name-source-priority:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - name: Test strict no-private-names rank for source Shader48 and post-nine dummy materials
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/gt_rank_all82_original_shader_names_after_nine.py
          python3 -m unittest discover -s tests -p test_gt_rank_all82_original_shader_names_after_nine.py -v
      - name: Read SHA-original source-free numeric material usage from validated nine-shader run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43759856414
          name: gt-nine-shader-full-export-audit-43759856414
          path: ${{ runner.temp }}/gt-nine-original-quality
      - name: Require runner capacity for 82 original serialized objects only
        run: |
          set -euo pipefail
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 5242880
      - name: Read immutable ZIP2 serialized owner files only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: .gt-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/globalgamemanagers.assets
            Raft/Raft_Data/resources.assets
            Raft/Raft_Data/level0
            Raft/Raft_Data/level1
            Raft/Raft_Data/level2
            Raft/Raft_Data/level3
            Raft/Raft_Data/level4
            Raft/Raft_Data/level5
