            Raft/Raft_Data/sharedassets39.assets

      - name: Materialize exact SHA-authenticated 82 Unity serialized owners (no LFS or raw upload)
        run: |
          set -euo pipefail
          test "$(git -C .gt-zip2 rev-parse HEAD)" = 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          python3 -m scripts.gt_stage_serialized_owners \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --source .gt-zip2/Raft/Raft_Data \
            --destination "$RUNNER_TEMP/gt-original-82-shader-owners" \
            --report "$RUNNER_TEMP/gt-original-82-source-proof-private.json" > "$RUNNER_TEMP/gt-original-82-source-private.log"
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.23.0
      - name: Compare all 82 original Shader48 names to 333 residual dummy material usage
        run: |
          set -euo pipefail
          python3 -m scripts.gt_rank_all82_original_shader_names_after_nine \
            --original "$RUNNER_TEMP/gt-original-82-shader-owners" \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --quality "$RUNNER_TEMP/gt-nine-original-quality/gt-nine-shader-postrestore-quality.json" \
            --out "$RUNNER_TEMP/gt-all82-original-333-material-priority-safe.json"
      - name: Upload anonymous ranking counts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-all82-original-333-shader-priority-safe-${{ github.run_id }}
          path: ${{ runner.temp }}/gt-all82-original-333-material-priority-safe.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Delete runner-private original ZIP2 shader owners and source names
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/gt-original-82-shader-owners" .gt-zip2
