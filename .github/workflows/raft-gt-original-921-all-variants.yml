name: GT original 921-slot shader all compiled variants (source only, NO XAPK)
on:
  workflow_dispatch:
    inputs:
      compile_unity:
        description: Also compile the private Android Vulkan shader bundle
        type: boolean
        default: false
  push:
    branches:
      - feature/android-native-port
    paths:
      - tests/test_gt_original_921_cb_layout.py
      - scripts/gt_original_921_all_variants.py
      - scripts/gt_original_921_keyword_routes.py
      - scripts/gt_original_921_cb_layout.py
      - scripts/gt_original_921_cb_hlsl.py
      - scripts/gt_original_921_resource_rebind.py
      - scripts/gt_original_921_semantics.py
      - scripts/gt_original_921_shaderlab.py
      - scripts/gt_verify_921_shader_bundle.py
      - tests/test_gt_original_921_bundle.py
      - android-port/Experiments/GT/Editor/Original921ShaderValidation.cs
      - scripts/t3_original_921_dxbc_semantic_join.py
      - tests/test_gt_original_921_all_variants.py
      - .github/workflows/raft-gt-original-921-all-variants.yml

permissions:
  contents: read
concurrency:
  group: gt-original-921-${{ (inputs.compile_unity || contains(github.event.head_commit.message, '[921 Unity probe]')) && 'unity' || 'source' }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-921-full-stage-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    environment: UNITY_LICENSE
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
      - name: Verify source-only full-variant and privacy negative controls
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/gt_original_921_all_variants.py
          python3 -m unittest discover -s tests -p 'test_gt_original_921_all_variants.py' -v
          python3 -m unittest discover -s tests -p 'test_gt_original_921_cb_layout.py' -v
          python3 -m unittest discover -s tests -p 'test_gt_original_921_bundle.py' -v

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: zip2-original
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/level0
            Raft/Raft_Data/level1
            Raft/Raft_Data/level2
            Raft/Raft_Data/level3
            Raft/Raft_Data/level4
            Raft/Raft_Data/level5
      - name: Select four original Shader48 owners without LFS
        run: |
          set -euo pipefail
          git -C zip2-original sparse-checkout set --no-cone -- \
            '/RAFT_FILE_MANIFEST.tsv' \
            '/Raft/Raft_Data/level0' \
            '/Raft/Raft_Data/level1' \
            '/Raft/Raft_Data/level2' \
            '/Raft/Raft_Data/level3' \
            '/Raft/Raft_Data/level4' \
            '/Raft/Raft_Data/level5' \
            '/Raft/Raft_Data/resources.assets/*' \
            '/Raft/Raft_Data/sharedassets0.assets/*' \
            '/Raft/Raft_Data/sharedassets1.assets' \
            '/Raft/Raft_Data/sharedassets6.assets'
          test "$(git -C zip2-original rev-parse HEAD)" = 15964ea8f246b6e076ce26b60931ee2e1a9a2385

      - name: SHA-authenticate six actual scenes and four original Shader48 owners
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import stage
          from scripts.a12_probe_original_blur_passes import SHADER_OWNERS
          from scripts.b21_scene_lightmap_links import PIN,verify_source
          from scripts.t3_original_renderer_shader_impact import SHADER_OWNERS_SELECTED
          root=Path('zip2-original')
          output=Path(os.environ['RUNNER_TEMP'])/'gt-921-original'
          pins={'Raft_Data/'+owner:SHADER_OWNERS[owner] for owner in SHADER_OWNERS_SELECTED}
          result=stage(root,output,pins)
          assert len(result['owners'])==4 and result['verified_bytes']==269007288
          assert result['lfs_used'] is False
          for name,pin in PIN.items():
              original=root/'Raft/Raft_Data'/name
              verify_source(original,pin)
              target=output/'Raft_Data'/name
              if target.exists() or target.is_symlink():
                  raise ValueError('original_scene_collision')
              with original.open('rb') as src, target.open('xb') as dst:
                  while block:=src.read(1024*1024):
                      dst.write(block)
              verify_source(target,pin)
          print('GT_921_REAL_SOURCE_SHA_VERIFIED scenes=6 owners=4 original_owner_bytes=269007288')
          PY

      - name: Install original Unity reader and source DXBC to SPIR-V HLSL tooling
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check 'UnityPy==1.23.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            vkd3d-compiler spirv-tools spirv-cross glslang-tools

      - name: Recover all 33 genuine paired permutations and eight unmatched VS variants privately
        run: |
          set -euo pipefail
          timeout 1800s python3 -m scripts.gt_original_921_all_variants \
            --original "$RUNNER_TEMP/gt-921-original" \
            --manifest zip2-original/RAFT_FILE_MANIFEST.tsv \
            --private "$RUNNER_TEMP/gt-921-private-recovered" \
            --out gt-921-source-aggregate-safe.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('gt-921-source-aggregate-safe.json')
          r=json.loads(p.read_text())
          assert r['original_passes']==4
          assert r['exact_original_source_VS_FS_permutation_pairs']==33
          assert r['unmatched_original_vertex_variants_retained']==8
          assert r['original_unique_D3D11_stage_programs']==58
          assert r['all_distinct_original_D3D11_programs_translated']
          routes = r['source_keyword_route_coverage']
          assert r['source_shaderlab_layout']['original_render_states_serialized'] == 4
          assert r['source_shaderlab_layout']['original_authored_property_count'] == 35
          assert r['source_variant_parameter_records']['original_variant_stages_with_parameter_records'] == 74
          assert r['source_variant_parameter_records']['translated_constant_buffer_declarations_mapped'] == 467
          assert r['source_variant_parameter_records']['resource_rebound_stages_verified_spirv_identical_excluding_debug'] == 74
          assert r['source_variant_parameter_records']['constant_buffer_named_32bit_lanes'] == 9615
          assert r['source_variant_parameter_records']['named_constant_buffer_candidate_stages_vulkan11_valid'] == 74
          assert r['source_variant_parameter_records']['named_constant_buffer_reflected_offsets_verified'] == 2029
          assert r['source_variant_parameter_records']['vertex_variants_with_verified_mesh_inputs'] == 41
          assert r['source_variant_parameter_records']['original_vertex_input_semantics_restored'] == 205
          assert r['source_variant_parameter_records']['original_vertex_fragment_varying_records_matched'] == 211
          assert r['source_variant_parameter_records']['vulkan_vertex_fragment_locations_matched'] == 155
          assert routes['validated_exact_routed_stage_compilations'] == 66
          assert len(routes['source_exact_keyword_routes_by_pass']) == 4
          assert sum(routes['source_exact_keyword_routes_by_pass']) == 33
          assert sum(routes['source_unmatched_vertex_keyword_sets_by_pass']) == 8
          assert not r['original_project_Shader_GUID_replaced']
          print('GT_SOURCE_ONLY_921_ALL_VARIANTS_GATE_PASSED originalPairs=33 orphanVS=8 sourcePrograms=58 noXAPK=true')
          PY

      - name: Assemble the private four-pass ShaderLab from all 33 paired programs
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/gt-original-921-unity"
          mkdir -p "$project/Assets/Editor" "$project/Packages" "$project/ProjectSettings"
          python3 -m scripts.gt_original_921_shaderlab \
            --private "$RUNNER_TEMP/gt-921-private-recovered" \
            --shader "$project/Assets/GTOriginal921.shader"
          cp android-port/Experiments/GT/Editor/Original921ShaderValidation.cs "$project/Assets/Editor/"
          printf '%s\n' '{"dependencies":{}}' > "$project/Packages/manifest.json"
          printf '%s\n' 'm_EditorVersion: 2021.3.45f2' > "$project/ProjectSettings/ProjectVersion.txt"

      - name: Compile all 33 recovered routes in an isolated Unity Android Vulkan bundle
        if: inputs.compile_unity || contains(github.event.head_commit.message, '[921 Unity probe]')
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f2
          projectPath: gt-original-921-unity
          targetPlatform: Android
          buildMethod: RaftGT.Original921ShaderValidation.Validate
          versioning: None
          allowDirtyBuild: true
          dockerMemoryLimit: 12g
          customParameters: -job-worker-count 2

      - name: Verify every recovered route is retained in the actual Vulkan shader bundle
        if: inputs.compile_unity || contains(github.event.head_commit.message, '[921 Unity probe]')
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/gt-original-921-unity"
          python3 -m scripts.gt_verify_921_shader_bundle \
            --bundle "$project/ProbeResults/Private/gt-original-921" \
            --source "$project/Assets/GTOriginal921.shader" \
            --receipt "$project/ProbeResults/gt-original-921-unity-safe.json" \
            --out "$project/ProbeResults/gt-original-921-bundle-safe.json"

      - name: Retain aggregate Unity compiler result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-original-921-unity-safe
          path: |
            gt-original-921-unity/ProbeResults/gt-original-921-unity-safe.json
            gt-original-921-unity/ProbeResults/gt-original-921-bundle-safe.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete all ZIP2 original files and recovered private HLSL and DXBC
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/gt-921-original" \
                   "$RUNNER_TEMP/gt-921-private-recovered" \
                   zip2-original
          sudo rm -rf -- "$GITHUB_WORKSPACE/gt-original-921-unity"

      - name: Publish numeric-only proof without shader source or private metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-original-921-safe-source-aggregate
          path: gt-921-source-aggregate-safe.json
          if-no-files-found: ignore
          retention-days: 7
