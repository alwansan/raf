name: GT NEXT23b exact authored translation replay
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-gt-next23b-translation-replay.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  author-dxbc:
    if: github.repository == 'alwansan/raf' && github.ref == 'refs/heads/feature/android-native-port'
    runs-on: windows-2022
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/gt_next23b_translation_replay/author_windows.py
      - name: Compile newly authored HLSL with actual system D3DCompiler
        shell: pwsh
        run: |
          if (Test-Path Raft) { throw 'Unexpected game tree' }
          if ((git hash-object tools/gt_next23b_translation_replay/author_windows.py) -ne '1e48b87bc52281f306c57cebac5713c40ec92517') { throw 'Source pin mismatch' }
          python tools/gt_next23b_translation_replay/author_windows.py authored-dxbc
          if ($LASTEXITCODE -ne 0) { throw 'Authored compiler failed' }
          (Get-Item "$env:SystemRoot/System32/d3dcompiler_47.dll").VersionInfo.FileVersion | Set-Content authored-dxbc/dll-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gt-next23b-newly-authored-dxbc
          path: authored-dxbc/
          retention-days: 14
          if-no-files-found: error
  translation-replay:
    needs: author-dxbc
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/*.py
            /tools/gt_next23b_translation_replay/
      - uses: actions/download-artifact@v4
        with:
          name: gt-next23b-newly-authored-dxbc
          path: authored-dxbc
      - name: Verify pinned source and install public translation tools
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = alwansan/raf
          test ! -e Raft
          test ! -e .gt-zip2
          test "$(git hash-object tools/gt_next23b_translation_replay/audit.py)" = c790f11ff1c822c2859e72fe7c6919db358757cf
          test "$(git hash-object tools/gt_next23b_translation_replay/author_windows.py)" = 1e48b87bc52281f306c57cebac5713c40ec92517
          test "$(git hash-object tools/gt_next23b_translation_replay/witness.py)" = 4608a6ecd5294f193d9cbee72a95dcca10fdc285
          test "$(git hash-object scripts/w1_recover_graphics_programs.py)" = fce7fe2ac6635f9e67e03ea4aa8ec7b462603352
          test "$(git hash-object scripts/gt_original_921_keyword_routes.py)" = 1672c7e9ad6698c2703d57dc30c760f4bd4a41af
          test "$(git hash-object scripts/probe_directx_shader_bridge.py)" = 558e3316ebcb0f80ac2151c0ff76cafdc3ab0d69
          test "$(git hash-object scripts/run_original_dxbc_translation_probe.py)" = 8640f32ab2835b542f70fc7e583096db499ec127
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
          mkdir -p evidence
          git rev-parse HEAD > evidence/tested-head.txt
          dpkg-query -W vkd3d-compiler libvkd3d-shader1 spirv-tools spirv-cross glslang-tools > evidence/package-versions.txt
          for name in vkd3d-compiler spirv-val spirv-cross glslangValidator; do
            ldd "$(command -v "$name")"
          done > evidence/linked-libraries.txt
      - name: Actual independent replay and unmodified legacy gate counterfactual
        run: |
          set -euo pipefail
          python3 -B -m tools.gt_next23b_translation_replay.witness --fixture authored-dxbc --out evidence | tee evidence/actual.log
          cp -r authored-dxbc evidence/authored-dxbc
      - name: Preserve bounded authored evidence
        if: success()
        run: |
          python3 - <<'PY'
          import base64,hashlib,zipfile
          from pathlib import Path
          root=Path("evidence")
          files=[p for p in sorted(root.rglob("*")) if p.is_file()]
          assert len(files)<=32 and sum(p.stat().st_size for p in files)<=2*1024*1024
          with zipfile.ZipFile(root/"permanent-authored-evidence.zip","w",compression=zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  assert not p.is_symlink()
                  z.write(p,p.relative_to(root))
          data=(root/"permanent-authored-evidence.zip").read_bytes()
          assert len(data)<=128*1024
          print("GT_PERMANENT_EVIDENCE_SHA",len(data),hashlib.sha256(data).hexdigest())
          enc=base64.b64encode(data).decode("ascii")
          for i in range(0,len(enc),2048): print("GT_PERMANENT_EVIDENCE_B64",i//2048,enc[i:i+2048])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gt-next23b-translation-replay
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
