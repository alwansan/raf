name: GFX-MULTI-094 original Shader48 GLES driver compile-link Android APK
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths:
      - '.github/workflows/gfxlab-multi094-original-stage-android-apk.yml'
      - 'gfxlab/android-stage-probe/**'
      - 'gfxlab/tools/multi_shader_android_stage_pack094.py'
      - 'gfxlab/tests/test_multi_shader_android_stage_pack094.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfxlab-multi094-original-stage-android-probe
  cancel-in-progress: false
jobs:
  original-stage-driver-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - name: Source-free tests and original phase truth checks
        run: |
          set -euo pipefail
          python3 -m unittest discover -s gfxlab/tests -p 'test_*.py' -q
          test -f gfxlab/android-stage-probe/AndroidManifest.xml
      - uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: source-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/resources.assets/*
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/sharedassets6.assets
      - name: Install private translator and offline linker
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
      - name: Authenticate and translate 157 actual original pairs; offline link GLES programs
        run: |
          set -euo pipefail
          test "$(git -C source-zip2 rev-parse HEAD)" = 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          python3 -m gfxlab.tools.multi_shader_android_stage_pack094 \
            --zip2 source-zip2 --stage "$RUNNER_TEMP/gfx094-private" \
            --assets gfxlab/android-stage-probe/assets/probe --safe gfx094-safe-pack.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build minimal offline Android driver APK with system SDK (no Unity or game build)
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms"
          GFX_ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)
          GFX_BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -f "$GFX_ANDROID_JAR"
          test -x "$GFX_BUILD_TOOLS/aapt2"
          mkdir -p gfx094-build/classes gfx094-build/dex gfx094-build/gen
          "$GFX_BUILD_TOOLS/aapt2" link -o gfx094-build/resources.apk \
            --manifest gfxlab/android-stage-probe/AndroidManifest.xml -I "$GFX_ANDROID_JAR" \
            -A gfxlab/android-stage-probe/assets --java gfx094-build/gen
          javac -source 8 -target 8 -bootclasspath "$GFX_ANDROID_JAR" \
            -d gfx094-build/classes gfxlab/android-stage-probe/src/com/alwansan/gfx094/MainActivity.java
          mapfile -t GFX_CLASSES < <(find gfx094-build/classes -name '*.class')
          "$GFX_BUILD_TOOLS/d8" --lib "$GFX_ANDROID_JAR" --min-api 29 --output gfx094-build/dex "${GFX_CLASSES[@]}"
          cp gfx094-build/resources.apk gfx094-build/unsigned.apk
          python3 - <<'PY'
          from zipfile import ZipFile,ZIP_DEFLATED
          with ZipFile('gfx094-build/unsigned.apk','a',compression=ZIP_DEFLATED) as z:
              z.write('gfx094-build/dex/classes.dex','classes.dex')
          PY
          keytool -genkeypair -keystore "$RUNNER_TEMP/gfx094-debug.jks" -storepass android \
            -keypass android -alias gfx094 -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=GFX094 Original Stage Diagnostic' -noprompt
          "$GFX_BUILD_TOOLS/zipalign" -f -p 4 gfx094-build/unsigned.apk gfx094-build/aligned.apk
          "$GFX_BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/gfx094-debug.jks" \
            --ks-pass pass:android --key-pass pass:android \
            --out gfx094-build/GFX094-Original-Shader48-Driver-Probe.apk gfx094-build/aligned.apk
          "$GFX_BUILD_TOOLS/apksigner" verify --verbose gfx094-build/GFX094-Original-Shader48-Driver-Probe.apk
          "$GFX_BUILD_TOOLS/aapt2" dump badging gfx094-build/GFX094-Original-Shader48-Driver-Probe.apk > gfx094-build/badging.txt
          rg '^package:' gfx094-build/badging.txt
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          from zipfile import ZipFile
          p=Path('gfx094-build/GFX094-Original-Shader48-Driver-Probe.apk')
          with ZipFile(p) as z:
              assert z.testzip() is None
              m=json.loads(z.read('assets/probe/manifest.json'))
              assert len(m['pairs'])==157 and m['offline_linked_pairs']==157
              assert 'classes.dex' in z.namelist()
              for pair in m['pairs']:
                  for ext,key in (('vert','VS_sha256'),('frag','FS_sha256')):
                      assert hashlib.sha256(z.read('assets/probe/'+pair['id']+'.'+ext)).hexdigest()==pair[key]
          safe=json.load(open('gfx094-safe-pack.json'));safe.update(apk_bytes=p.stat().st_size,
              apk_sha256=hashlib.sha256(p.read_bytes()).hexdigest(),package='com.alwansan.gfx094',signature_verified=True)
          Path('gfx094-build/gfx094-safe-delivery.json').write_text(json.dumps(safe,indent=2)+'\n')
          print(json.dumps(safe))
          PY
      - name: Upload signed APK and safe delivery metadata only
        uses: actions/upload-artifact@v4
        with:
          name: GFX094-Original-Shader48-Driver-Probe-APK
          path: |
            gfx094-build/GFX094-Original-Shader48-Driver-Probe.apk
            gfx094-build/gfx094-safe-delivery.json
          retention-days: 7
          if-no-files-found: error
      - name: Purge original data, translated shaders and temporary signing key
        if: always()
        run: |
          sudo rm -rf source-zip2 "$RUNNER_TEMP/gfx094-private" gfxlab/android-stage-probe/assets
          rm -f "$RUNNER_TEMP/gfx094-debug.jks"
