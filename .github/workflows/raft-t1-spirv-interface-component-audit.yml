name: T1 RENDER-002 SPIR-V stage interface component audit

on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-t1-spirv-interface-component-audit.yml
      - scripts/t1_spirv_interface_component_audit.py
      - tests/test_t1_spirv_interface_component_audit.py
      - scripts/t1_spirv_interface_roundtrip_drift.py
      - tests/test_t1_spirv_interface_roundtrip_drift.py

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - run: python3 -m unittest discover -s tests -p test_t1_spirv_interface_component_audit.py -v

      - run: python3 -m unittest discover -s tests -p test_t1_spirv_interface_roundtrip_drift.py -v
      - name: Compile and validate a synthetic vertex and fragment pair
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools spirv-tools
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cat > "$scratch/test.vert" <<'GLSL'
          #version 450
          layout(location=3, component=1) out vec2 varyingValue;
          void main() {
            gl_Position = vec4(0, 0, 0, 1);
            varyingValue = vec2(1, 2);
          }
          GLSL
          cat > "$scratch/test.frag" <<'GLSL'
          #version 450
          layout(location=3, component=1) in vec2 varyingValue;
          layout(location=0) out vec4 color;
          void main() { color = vec4(varyingValue, 0, 1); }
          GLSL
          glslangValidator -V "$scratch/test.vert" -o "$scratch/vertex.spv"
          glslangValidator -V "$scratch/test.frag" -o "$scratch/fragment.spv"
          spirv-val "$scratch/vertex.spv"
          spirv-val "$scratch/fragment.spv"
          python3 -m scripts.t1_spirv_interface_component_audit "$scratch/vertex.spv" "$scratch/fragment.spv"
          python3 -m scripts.t1_spirv_interface_roundtrip_drift \
            "$scratch/vertex.spv" "$scratch/fragment.spv" "$scratch/vertex.spv" "$scratch/fragment.spv"
