name: GFX112 M02 sampled animation skinning Android probe
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths:
      - '.github/workflows/gfxlab-multi109-indexed-gpu-skin.yml'
      - 'gfxlab/android-gles-skin109/**'
      - 'gfxlab/tools/gfx112_animated_payload.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfx112-indexed-gpu-skin
  cancel-in-progress: false
jobs:
  signed-indexed-gpu-skin-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify indexed skinning and source extraction regressions
        run: python3 -m unittest discover -s gfxlab/tests -p 'test_gfx108*.py'
      - name: Checkout authentic pinned original ZIP2 only in ephemeral private runner
        uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: source-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/resources.assets/*
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/sharedassets6.assets
      - name: Install pinned private Unity mesh reader
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
      - name: Stage the 15 source-derived poses for the diagnostic APK
        run: |
          set -euo pipefail
          test "$(git -C source-zip2 rev-parse HEAD)" = 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          mkdir -p gfx112-build
          python3 -m gfxlab.tools.gfx112_animated_payload \
            --zip2 source-zip2 --stage "$RUNNER_TEMP/gfx112-source" \
            --assets "$RUNNER_TEMP/gfx112-assets" --safe gfx112-build/gfx112-safe-source.json
      - name: Build, sign, verify minimal Android GLES3 vertex probe
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME"
          jar="$(find "$sdk/platforms" -name android.jar | sort -V | tail -1)"
          buildtools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -f "$jar" && test -x "$buildtools/aapt2" && test -x "$buildtools/apksigner"
          mkdir -p gfx112-build/classes gfx112-build/dex gfx112-build/gen
          "$buildtools/aapt2" link -o gfx112-build/resources.apk \
            --manifest gfxlab/android-gles-skin109/AndroidManifest.xml \
            -I "$jar" -A "$RUNNER_TEMP/gfx112-assets" \
            --java gfx112-build/gen
          javac -source 8 -target 8 -bootclasspath "$jar" \
            -d gfx112-build/classes \
            gfxlab/android-gles-skin109/src/com/alwansan/gfx112/MainActivity.java
          mapfile -t classes < <(find gfx112-build/classes -type f -name '*.class')
          test "${#classes[@]}" -gt 0
          "$buildtools/d8" --lib "$jar" --min-api 29 --output gfx112-build/dex "${classes[@]}"
          test -s gfx112-build/dex/classes.dex
          cp gfx112-build/resources.apk gfx112-build/unsigned.apk
          python3 - <<'PY'
          from zipfile import ZipFile,ZIP_DEFLATED
          with ZipFile('gfx112-build/unsigned.apk','a',compression=ZIP_DEFLATED) as z:
              z.write('gfx112-build/dex/classes.dex','classes.dex')
          PY
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/gfx112-debug.jks" -storepass android \
            -keypass android -alias gfx112 -keyalg RSA -keysize 2048 -validity 5000 \
            -dname "CN=GFX112 OpenGL ES GPU Diagnostic" -noprompt
          "$buildtools/zipalign" -f -p 4 gfx112-build/unsigned.apk gfx112-build/aligned.apk
          "$buildtools/apksigner" sign --ks "$RUNNER_TEMP/gfx112-debug.jks" \
            --ks-pass pass:android --key-pass pass:android \
            --out gfx112-build/GFX112-M02-Animated-GPU-Skinning.apk \
            gfx112-build/aligned.apk
          "$buildtools/apksigner" verify --verbose gfx112-build/GFX112-M02-Animated-GPU-Skinning.apk
          "$buildtools/aapt2" dump badging gfx112-build/GFX112-M02-Animated-GPU-Skinning.apk \
            | tee gfx112-build/badging.txt
          grep -F "name='com.alwansan.gfx112'" gfx112-build/badging.txt
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from zipfile import ZipFile
          apk=Path("gfx112-build/GFX112-M02-Animated-GPU-Skinning.apk")
          assert apk.stat().st_size>100000
          with ZipFile(apk) as z:
              assert z.testzip() is None
              assert {'AndroidManifest.xml','classes.dex'} <= set(z.namelist())
              source=json.loads(Path('gfx112-build/gfx112-safe-source.json').read_text())
              assert len(source['sample_payloads']) == 15
              for name, row in source['sample_payloads'].items():
                  assert hashlib.sha256(z.read('assets/'+name+'.bin')).hexdigest() == row['sha256']
              assert 'Raft_Data' not in ''.join(z.namelist())
              assert 'UnityShaderCache' not in ''.join(z.namelist())
          safe={"experiment":"GFX112",
                "apk_bytes":apk.stat().st_size,
                "apk_sha256":hashlib.sha256(apk.read_bytes()).hexdigest(),
                "package":"com.alwansan.gfx112",
                "apksigner_verified":True,
                "user_device_test_pending":True,
                "expected_gpu_positions":24990,
                "original_shader_restored":False,
                "original_indexed_test_inputs_embedded":True,
                "pc_adreno_pixel_parity_verified":False,
                "phase_closed":False,
                "expected_export":"Download/Games/cl/test/g/"}
          Path("gfx112-build/gfx112-safe-delivery.json").write_text(json.dumps(safe,indent=2)+'\n')
          print(json.dumps(safe,sort_keys=True))
          PY
      - name: Upload signed standalone diagnostic APK and safe manifest only
        uses: actions/upload-artifact@v4
        with:
          name: GFX112-M02-Animated-GPU-Skinning-APK
          path: |
            gfx112-build/GFX112-M02-Animated-GPU-Skinning.apk
            gfx112-build/gfx112-safe-delivery.json
            gfx112-build/gfx112-safe-source.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Remove extracted source, payload staging and intermediate packages
        if: always()
        run: rm -rf source-zip2 "$RUNNER_TEMP/gfx112-source" "$RUNNER_TEMP/gfx112-assets" "$RUNNER_TEMP/gfx112-debug.jks" gfx112-build
