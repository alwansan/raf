name: Raft A2 ZIP2 exact Settings managed metadata (CPU only)
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-a2-zip2-settings-metadata.yml'
      - 'tools/a2-settings-metadata/**'
      - 'scripts/probe_a2_settings_metadata_contract.py'
      - 'tests/test_probe_a2_settings_metadata_contract.py'
permissions:
  contents: read
concurrency:
  group: raft-a2-zip2-settings-metadata
  cancel-in-progress: false
jobs:
  exact-fielddefs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            tools/a2-settings-metadata
            scripts
            tests
      - name: Sparse original ZIP2 immutable source, no Git LFS
        uses: actions/checkout@v4
        with:
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: original-zip2
          filter: blob:none
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            Raft/Raft_Data/Managed/Assembly-CSharp.dll
            Raft/Raft_Data/level0
            Raft/Raft_Data/level1
            Raft/Raft_Data/globalgamemanagers.assets
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Synthetic metadata and owner-identity negative controls
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_probe_a2_settings_metadata_contract.py' -v
          python3 -m py_compile scripts/probe_a2_settings_metadata_contract.py
      - name: Private CSharp9 source recovery
        run: |
          set -euo pipefail
          dotnet tool install ilspycmd --version 11.2.0.10050 --tool-path "$RUNNER_TEMP/a2-ilspy"
          timeout 360s "$RUNNER_TEMP/a2-ilspy/ilspycmd" -p -lv CSharp9_0 \
            -o "$RUNNER_TEMP/a2-original" original-zip2/Raft/Raft_Data/Managed/Assembly-CSharp.dll \
            > "$RUNNER_TEMP/a2-private-ilspy.log" 2>&1
      - name: Compare real managed FieldDef tokens to source and MonoScript
        run: |
          set -euo pipefail
          timeout 180s dotnet run --configuration Release \
            --project tools/a2-settings-metadata/SettingsMetadata.csproj -- \
            original-zip2/Raft/Raft_Data/Managed/Assembly-CSharp.dll \
            "$RUNNER_TEMP/a2-private-fields.json"
          test -s "$RUNNER_TEMP/a2-private-fields.json"
          python3 -m pip install --break-system-packages --disable-pip-version-check 'UnityPy==1.23.0'
          python3 -m scripts.probe_a2_settings_metadata_contract \
            --source original-zip2/Raft/Raft_Data \
            --metadata "$RUNNER_TEMP/a2-private-fields.json" \
            --decompiled "$RUNNER_TEMP/a2-original"
          echo 'A2_ZIP2_EXACT_METADATA nativeBuildRan=false originalLfsHydrated=false'
