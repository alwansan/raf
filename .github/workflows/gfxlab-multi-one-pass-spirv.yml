name: GFX-MULTI-011 one original Shader48 DXBC pair to SPIRV CPU / no APK
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths: ['.github/workflows/gfxlab-multi-one-pass-spirv.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfxlab-multi011-private-original-pair
  cancel-in-progress: false
jobs:
  exact-original-stage-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            gfxlab/tools
            gfxlab/tests
      - name: Pure safety tests
        run: |
          set -euo pipefail
          python3 -m py_compile gfxlab/tools/multi_shader_one_pass_spirv.py
          python3 -m unittest discover -s gfxlab/tests -p 'test_*.py' -v
      - uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: source-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/resources.assets/*
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/sharedassets6.assets
      - name: Install CPU-only SPIRV feasibility tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools
          command -v vkd3d-compiler && command -v spirv-val
      - name: Extract one exact original pair and test Vulkan11 translation privately
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
          python3 -m gfxlab.tools.multi_shader_one_pass_spirv --zip2 source-zip2 --stage "$RUNNER_TEMP/gfxlab-multi011-private" --out gfxlab-multi011-safe-summary.json
          python3 - <<'PY'
          import json
          d=json.load(open('gfxlab-multi011-safe-summary.json'))
          assert len(d['pass_variant_pair_counts'])==7
          assert d['passes_with_exact_variant_pair']>=1
          assert d['selected_pair']=='exact_keyword_and_tier_bucket'
          assert d['translation_stages']['vertex']['authentic_source_dxbc_container']
          assert d['translation_stages']['fragment']['authentic_source_dxbc_container']
          assert not d['original_shaderlab_restored'] and not d['stage_closed']
          print('GFX_MULTI011_CPU_ORIGINAL_PAIR_TRANSLATION_REPORTED_NO_ANDROID_CLAIM')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gfxlab-multi011-safe-one-pass-cpu
          path: gfxlab-multi011-safe-summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Purge private source GPU bytecode
        if: always()
        run: |
          sudo rm -rf source-zip2 "$RUNNER_TEMP/gfxlab-multi011-private"
          echo GFX_MULTI011_ALL_PRIVATE_SHADER_BYTES_PURGED=true
