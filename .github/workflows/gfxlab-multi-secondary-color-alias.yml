name: GFX-MULTI-025 original secondary Color and asset alias census / no APK
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths: ['.github/workflows/gfxlab-multi-secondary-color-alias.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfxlab-multi025-color-alias-private-source
  cancel-in-progress: false
jobs:
  original-source-color-alias:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            gfxlab/tools
            gfxlab/tests
      - name: Validate source-free private-identity boundary tests
        run: |
          set -euo pipefail
          python3 -m py_compile gfxlab/tools/multi_secondary_color_alias.py
          python3 -m unittest discover -s gfxlab/tests -p 'test_*.py' -v
      - uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: source-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/resources.assets/*
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/sharedassets6.assets
      - name: Inspect exact original source Color slots and anonymous alias groups
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
          python3 -m gfxlab.tools.multi_secondary_color_alias \
            --zip2 source-zip2 --stage "$RUNNER_TEMP/gfxlab-multi025-private" \
            --out "$RUNNER_TEMP/gfxlab-multi025-safe.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"gfxlab-multi025-safe.json").read_text())
          assert d["experiment"]=="GFX-MULTI-025"
          assert d["source_sha"]=="15964ea8f246b6e076ce26b60931ee2e1a9a2385"
          assert d["models"]==6 and d["source_shader48_property_names"]==27
          assert d["material_alias_census"]["slots"]==7
          assert d["material_alias_census"]["unique_original_objects"]==6
          assert d["texture_alias_census"]["slots"]==21
          assert d["texture_alias_census"]["unique_original_objects"]==18
          assert d["saved_color_slots"]==14
          assert d["colors_with_name_in_original_shader48"]==14
          assert sum(d["color_name_semantic_candidate_counts"].values())==14
          assert d["color_value_shape_counts"]["rgba_white"]==7
          assert d["color_value_shape_counts"]["rgba_nonwhite"]==7
          assert not d["color_names_or_values_published"]
          assert not d["source_material_or_texture_identities_published"]
          assert not d["original_shader_pass_bindings_recovered"]
          assert not d["android_original_shader_restored"]
          assert not d["android_gpu_pixels_verified"]
          assert not d["phase_closed"]
          print("GFX_MULTI025_SAFE_COUNTS "+json.dumps({
            "materials":d["material_alias_census"],
            "textures":d["texture_alias_census"],
            "color_signatures":d["color_value_shape_counts"],
            "color_name_categories":d["color_name_semantic_candidate_counts"],
            "nonwhite_by_category":d["nonwhite_color_role_candidates"],
            "nonzero_rgb_by_category":d["nonzero_rgb_color_role_candidates"]
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gfxlab-multi025-safe-secondary-color-alias
          path: ${{ runner.temp }}/gfxlab-multi025-safe.json
          retention-days: 7
          if-no-files-found: error
      - name: Securely discard private staged original owners
        if: always()
        run: |
          sudo rm -rf source-zip2 "$RUNNER_TEMP/gfxlab-multi025-private"
          echo GFX_MULTI025_ALL_PRIVATE_SOURCE_PURGED=true
