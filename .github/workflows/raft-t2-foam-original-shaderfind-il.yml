name: T2 WATER-001 original Foam Shader.Find name-to-typed-IL proof
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/t2_original_foam_shaderfind_name.py
      - tests/test_t2_original_foam_shaderfind_name.py
      - android-port/Experiments/T2/FoamShaderFindOriginal/**
      - .github/workflows/raft-t2-foam-original-shaderfind-il.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t2-foam-original-shaderfind-typed-il-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  source-original-foam-shaderfind:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - name: Source-free Foam shader name negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t2_original_foam_shaderfind_name.py
          python3 -m unittest discover -s tests -p 'test_t2_original_foam_shaderfind_name.py' -v
          python3 - <<'PY'
          import shutil
          assert shutil.disk_usage('.').free > 3*1024**3
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Compile typed Mono.Cecil scanner and run synthetic negative controls
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s dotnet publish android-port/Experiments/T2/FoamShaderFindOriginal/FoamShaderFindOriginal.csproj \
            -c Release --self-contained false -o "$RUNNER_TEMP/t2-foam-shaderfind-cecil" \
            > "$RUNNER_TEMP/t2-foam-shaderfind-compile.log" 2>&1 || {
              python3 - <<'PY'
          import collections,os,re
          from pathlib import Path
          log=(Path(os.environ['RUNNER_TEMP'])/'t2-foam-shaderfind-compile.log').read_text(errors='replace')
          codes=collections.Counter(re.findall(r'error\s+((?:CS|NU|NETSDK)[0-9]+)',log))
          print('T2_FOAM_SHADERFIND_COMPILER_SAFE',dict(codes))
          PY
              exit 1
            }
          dotnet "$RUNNER_TEMP/t2-foam-shaderfind-cecil/FoamShaderFindOriginal.dll" --selftest
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: t2-shaderfind-original-zip2
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/Managed/Assembly-CSharp.dll
      - name: SHA authenticate original Foam owner and managed assembly independently
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,os
          from pathlib import Path
          from scripts.t2_foam_original_manifest_pptr import parse_original_manifest
          from scripts.w1_stage_zip2_owners import ZIP2_SHA,PINS,stage,fingerprint
          repo=Path('t2-shaderfind-original-zip2')
          assert subprocess.check_output(['git','-C',str(repo),'rev-parse','HEAD'],text=True).strip()==ZIP2_SHA
          manifest=parse_original_manifest(repo/'RAFT_FILE_MANIFEST.tsv')
          dlls=[m for m in manifest if m['path']=='Raft_Data/Managed/Assembly-CSharp.dll']
          assert len(dlls)==1 and dlls[0]['bytes']==3211776 and dlls[0]['kind']=='plain'
          dll=repo/'Raft'/dlls[0]['path']
          assert fingerprint(dll)==(dlls[0]['bytes'],dlls[0]['sha256'])
          original=Path(os.environ['RUNNER_TEMP'])/'t2-original-foam-shaderfind-stage'
          a=stage(repo,original,{'Raft_Data/sharedassets0.assets':PINS['Raft_Data/sharedassets0.assets']})
          assert a['provider_sha']==ZIP2_SHA and a['verified_bytes']==115978112 and a['lfs_used'] is False
          print('T2_FOAM_SHADERFIND_ORIGINAL_SOURCE_PASS SHA_owners=true original_name_private=true')
          PY
      - name: Stage SHA-original Foam Shader name privately
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4 -q
          timeout 160s python3 -m scripts.t2_original_foam_shaderfind_name \
            --source "$RUNNER_TEMP/t2-original-foam-shaderfind-stage" \
            --private-out "$RUNNER_TEMP/t2-private-foam-original-name.txt"
      - name: Inspect exact original managed typed Shader.Find call sites
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s dotnet "$RUNNER_TEMP/t2-foam-shaderfind-cecil/FoamShaderFindOriginal.dll" \
            t2-shaderfind-original-zip2/Raft/Raft_Data/Managed/Assembly-CSharp.dll \
            "$RUNNER_TEMP/t2-private-foam-original-name.txt" \
            "$RUNNER_TEMP/t2-foam-shaderfind-safe.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'t2-foam-shaderfind-safe.json'
          assert p.is_file() and p.stat().st_size <= 8192
          r=json.loads(p.read_text())
          counts=('total_compiled_methods_with_body','total_compiled_IL_instructions',
            'total_ldstr_instructions','exact_original_Foam_name_ldstr_occurrences',
            'methods_with_exact_original_Foam_name_literal',
            'total_typed_UnityEngine_Shader_Find_calls','methods_with_typed_Shader_Find_calls',
            'methods_with_source_literal_and_typed_Shader_Find',
            'exact_source_ldstr_direct_typed_Shader_Find_calls',
            'methods_with_direct_original_literal_Shader_Find',
            'methods_with_direct_literal_Shader_Find_and_Material_Shader_ctor')
          false_flags=('actual_Unity_Shader_Find_execution_verified',
            'original_Foam_Material_render_binding_verified',
            'original_Foam_CB0_upload_verified','Android_water_pixels_verified',
            'private_shader_class_method_name_or_literal_exported')
          assert set(r)==set(counts)|set(false_flags)|{
            'status','original_Foam_Shader_mName_SHA_authenticated',
            'original_Assembly_CSharp_DLL_SHA_authenticated'}
          assert r['status']=='source_original_foam_shader_name_managed_ShaderFind_scan'
          assert r['original_Foam_Shader_mName_SHA_authenticated'] is True
          assert r['original_Assembly_CSharp_DLL_SHA_authenticated'] is True
          assert all(r[k] is False for k in false_flags)
          assert all(type(r[k]) is int and 0<=r[k]<=20000000 for k in counts)
          assert r['total_compiled_methods_with_body']>1000
          assert r['total_compiled_IL_instructions']>10000
          assert r['total_ldstr_instructions']>1000
          assert r['exact_source_ldstr_direct_typed_Shader_Find_calls']<=r['exact_original_Foam_name_ldstr_occurrences']
          assert r['exact_source_ldstr_direct_typed_Shader_Find_calls']<=r['total_typed_UnityEngine_Shader_Find_calls']
          assert r['methods_with_direct_literal_Shader_Find_and_Material_Shader_ctor']<=r['methods_with_direct_original_literal_Shader_Find']
          print('T2_FOAM_SHADERFIND_SAFE_ASSERTIONS_PASS')
          PY
      - name: Purge original source and private shader name
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/t2-original-foam-shaderfind-stage" \
            "$GITHUB_WORKSPACE/t2-shaderfind-original-zip2" \
            "$RUNNER_TEMP/t2-private-foam-original-name.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: t2-foam-shaderfind-original-typed-safe-${{ github.run_id }}
          path: ${{ runner.temp }}/t2-foam-shaderfind-safe.json
          if-no-files-found: error
          retention-days: 7
