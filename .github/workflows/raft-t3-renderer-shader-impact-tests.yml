name: T3 RENDER-002 exported Renderer Material Shader impact synthetic controls
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/t3_exported_renderer_shader_impact.py
      - tests/test_t3_exported_renderer_shader_impact.py
      - .github/workflows/raft-t3-renderer-shader-impact-tests.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raft-t3-renderer-shader-join-synthetic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  renderer-shader-join-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
      - name: Run T3 renderer impact and inherited B03/T3 source-free controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t3_exported_renderer_shader_impact.py' -v
          python3 -m unittest discover -s tests -p 'test_b03_verify_renderer_material_links.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_audit_exported_material_programs.py' -v
          python3 -m py_compile scripts/t3_exported_renderer_shader_impact.py tests/test_t3_exported_renderer_shader_impact.py
