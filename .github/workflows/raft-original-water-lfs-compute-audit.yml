name: Raft verified three-LFS-owner compute audit - CPU only no Unity

on:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-original-water-lfs-compute-audit.yml'
      - 'scripts/verify_targeted_lfs_compute_sources.py'
      - 'scripts/probe_authenticated_water_compute_inventory.py'
      - 'tests/test_verify_targeted_lfs_compute_sources.py'
      - 'tests/test_probe_authenticated_water_compute_inventory.py'
      - 'scripts/inspect_fft_candidate_identity.py'
      - 'tests/test_inspect_fft_candidate_identity.py'
      - 'scripts/probe_original_fft_serialized_refs.py'
      - 'tests/test_probe_original_fft_serialized_refs.py'
      - 'scripts/probe_authentic_fft_dxbc_translation.py'
      - 'tests/test_probe_authentic_fft_dxbc_translation.py'
      - 'scripts/probe_fft_spirv_images.py'
      - 'tests/test_probe_fft_spirv_images.py'
      - 'scripts/probe_fft_spirv_operation_profile.py'
      - 'tests/test_probe_fft_spirv_operation_profile.py'
      - 'scripts/probe_fft_spirv_formatless_repair.py'
      - 'tests/test_probe_fft_spirv_formatless_repair.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raft-original-water-lfs-compute-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-inspect-original-compute:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout source and LFS pointer files only - no smudge
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: true
          sparse-checkout: |
            Raft/Raft_Data
            scripts
            tests
      - name: Synthetic proof-of-identity and reconciliation regression tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_verify_targeted_lfs_compute_sources.py' -v
          python3 -m unittest discover -s tests -p 'test_probe_authenticated_water_compute_inventory.py' -v
          python3 -m unittest discover -s tests -p 'test_inspect_fft_candidate_identity.py' -v
          python3 -m unittest discover -s tests -p 'test_probe_original_fft_serialized_refs.py' -v
          python3 -m unittest discover -s tests -p 'test_probe_authentic_fft_dxbc_translation.py' -v
          python3 -m unittest discover -s tests -p 'test_probe_fft_spirv_images.py' -v
          python3 -m unittest discover -s tests -p 'test_probe_fft_spirv_operation_profile.py' -v
          python3 -m unittest discover -s tests -p 'test_probe_fft_spirv_formatless_repair.py' -v
          python3 -m unittest discover -s tests -p 'test_probe_original_compute_containers.py' -v
          python3 -m unittest discover -s tests -p 'test_audit_original_compute_metadata.py' -v
      - name: Verify original committed LFS pointers before download
        run: |
          set -euo pipefail
          python3 -m scripts.verify_targeted_lfs_compute_sources --source Raft/Raft_Data --pointers-only
      - name: Download exactly three original LFS owners never external streams
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
          GIT_ATTR_SOURCE: HEAD
        run: |
          set -euo pipefail
          git lfs install --local
          # Exactly 337660952 bytes in three original serialized .assets.
          # This explicit include excludes .resS banks and other LFS objects.
          git lfs pull --include='Raft/Raft_Data/resources.assets,Raft/Raft_Data/sharedassets0.assets,Raft/Raft_Data/sharedassets36.assets' --exclude='' origin
          python3 -m scripts.verify_targeted_lfs_compute_sources --source Raft/Raft_Data
      - name: Install original Unity serialization parser without Unity
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
      - name: Correlate all nine original ComputeShader objects and DXBC signatures
        run: |
          set -euo pipefail
          timeout 600s python3 -m scripts.probe_authenticated_water_compute_inventory --source Raft/Raft_Data
          python3 -m scripts.inspect_fft_candidate_identity --source Raft/Raft_Data
          timeout 240s python3 -m scripts.probe_original_fft_serialized_refs --source Raft/Raft_Data
          # No original shader bytes or translated binaries uploaded.
          # No Unity Editor, Android build or device execution.
      - name: Install CPU-only DXBC and SPIR-V validators
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
      - name: Translate original 20 FFT-name DXBC programs privately and check Vulkan 1.1
        run: |
          set -euo pipefail
          timeout 240s python3 -m scripts.probe_authentic_fft_dxbc_translation --source Raft/Raft_Data
          # No Unity, Android build, APK, Release or GPU execution.
          # Shader binaries stay only in a bounded temporary directory.
