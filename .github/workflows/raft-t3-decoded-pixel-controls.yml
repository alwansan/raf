name: T3 RENDER-002 decoded texture parity controls
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/t3_decoded_texture_pixel_parity.py
      - tests/test_t3_decoded_texture_pixel_parity.py
      - .github/workflows/raft-t3-decoded-pixel-controls.yml
permissions:
  contents: read
concurrency:
  group: raft-t3-decoded-pixel-controls-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts/t3_decoded_texture_pixel_parity.py
            tests/test_t3_decoded_texture_pixel_parity.py
      - name: Install Pillow and execute adversarial pixel tests
        run: |
          python3 -m pip install --user --disable-pip-version-check Pillow==11.3.0
          python3 -m unittest discover -s tests -p 'test_t3_decoded_texture_pixel_parity.py' -v
