name: B21 B-team evidence snapshot refresh (source only)
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-b21-evidence-refresh.yml'
      - 'prompt/coordination/B_TEAM/events/B21/**'
permissions:
  contents: write
concurrency:
  # Respect existing B10/B22/B48 summary writer mutex.
  group: raft-b48-team-summary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh-b-team-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/android-native-port
          persist-credentials: true
          lfs: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/refresh_b_team.py
            prompt/coordination/B_TEAM
      - name: Generate canonical evidence summary from newest team records (fast-forward only)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'raft-b21-evidence-checkpoint'
          git config user.email 'raft-b21-evidence-checkpoint@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch -q --no-tags origin feature/android-native-port
            git reset --hard -q FETCH_HEAD
            python3 scripts/refresh_b_team.py
            git add -- prompt/coordination/B_TEAM/SUMMARY.md prompt/coordination/B_TEAM/snapshot.json
            if git diff --cached --quiet; then
              echo 'B21_TEAM_EVIDENCE already_current=true'
              exit 0
            fi
            git commit -q -m 'coord(B21): regenerate team evidence summary'
            if git push --quiet origin HEAD:feature/android-native-port; then
              echo 'B21_TEAM_EVIDENCE regenerated=true fast_forward_only=true'
              exit 0
            fi
            echo "B21_TEAM_EVIDENCE concurrent_head attempt=$attempt; refresh current HEAD"
            sleep 1
          done
          echo 'B21_TEAM_EVIDENCE unresolved concurrent writers; no force' >&2
          exit 1
