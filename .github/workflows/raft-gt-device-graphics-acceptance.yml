name: GT device graphics log acceptance (source-free)
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/gt_device_graphics_acceptance.py
      - tests/test_gt_device_graphics_acceptance.py
      - .github/workflows/raft-gt-device-graphics-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gt-device-known-failure-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Run offline synthetic and malformed owner-summary negative controls
        run: python3 -m unittest discover -s tests -p 'test_gt_device_graphics_acceptance.py' -v
      - name: Fetch exact pinned owner CL summary only (no LFS or raw logs)
        env:
          OWNER_LOG_SNAPSHOT: cffd3f7be2d0c47649da9b28eae17c36d031f0e8
        run: |
          curl --fail --location --silent --show-error --retry 2 \
            "https://raw.githubusercontent.com/alwansan/CL/${OWNER_LOG_SNAPSHOT}/raft%20log/lf/LogRaft-20261112-183147-926/session-summary.json" \
            --output "$RUNNER_TEMP/gt-owner-session-summary.json"
      - name: Reproduce owner-device water and cursor errors without source or screenshots
        run: |
          python3 -m scripts.gt_device_graphics_acceptance \
            --session-summary "$RUNNER_TEMP/gt-owner-session-summary.json" \
            --out "$RUNNER_TEMP/gt-owner-safe-render-receipt.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"gt-owner-safe-render-receipt.json"
          data=json.loads(p.read_text())
          assert data["status"]=="KNOWN_DEVICE_LOG_GATE_REJECTED"
          assert data["error_counts"]["ultimate_water_invalid_pass"]==42229
          assert data["error_counts"]["water_fft_invalid_compute_kernel"]==7263
          assert data["water_invalid_pass_by_family"]["spectrum"]==19191
          assert data["water_invalid_pass_by_family"]["foam_global"]==23038
          assert data["compute_invalid_kernel_index"]["six"]==7263
          assert data["error_counts"]["unity_cursor_rgba32_required"]==4668
          assert data["error_counts"]["obb_guid_load_failed"]==2
          assert data["strict_known_log_gate_passed"] is False
          print("GT_REAL_CL_DEVICE_REPRODUCED waterPass=42229 kernel6=7263 cursorRGBA32=4668 guidLoad=2 pixelProof=false")
          PY
      - name: Fetch exact pinned 23:53 owner CL summary (four screenshot session)
        env:
          OWNER_LOG_NIGHT_SNAPSHOT: a320d5e23962568b62bffec95399cf3e0cb1f579
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            "https://raw.githubusercontent.com/alwansan/CL/${OWNER_LOG_NIGHT_SNAPSHOT}/raft%20log/lf/LogRaft-20261112-235351-196/session-summary.json" \
            --output "$RUNNER_TEMP/gt-owner-night-session-summary.json"
      - name: Verify night session source counts and reject missing original water
        run: |
          set -euo pipefail
          python3 -m scripts.gt_device_graphics_acceptance \
            --session-summary "$RUNNER_TEMP/gt-owner-night-session-summary.json" \
            --out "$RUNNER_TEMP/gt-owner-night-safe-receipt.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'gt-owner-night-safe-receipt.json').read_text())
          assert d['status']=='KNOWN_DEVICE_LOG_GATE_REJECTED'
          assert d['strict_known_log_gate_passed'] is False
          assert d['error_counts']['ultimate_water_invalid_pass']==36828
          assert d['water_invalid_pass_by_family']['spectrum']==15054
          assert d['water_invalid_pass_by_family']['foam_global']==21774
          assert d['error_counts']['water_fft_invalid_compute_kernel']==6106
          assert d['compute_invalid_kernel_index']['six']==6106
          assert d['error_counts']['unity_cursor_rgba32_required']==2844
          assert d['error_counts']['obb_guid_load_failed']==2
          assert d['collector_writer_accounting_verified'] is True
          assert d['collector_writer_failed_batches']==0
          assert d['collector_writer_pending_bytes_at_stop']==0
          assert d['all_pixels_correct_verified'] is False
          print('GT_REAL_CL_NIGHT_DEVICE_REPRODUCED water=36828 spectrum=15054 foam=21774 kernel6=6106 cursor=2844 captureWriter=3390/3390 pixelProof=false')
          PY
      - name: Fetch pinned 04:02 CL phone session with Android memory exit evidence
        env:
          OWNER_LOG_LATEST_SNAPSHOT: 3c26bb5d0f
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            "https://raw.githubusercontent.com/alwansan/CL/${OWNER_LOG_LATEST_SNAPSHOT}/raft%20log/lf/LogRaft-20261113-040212-998/session-summary.json" \
            --output "$RUNNER_TEMP/gt-owner-0402-session-summary.json"
      - name: Verify new water failure, collector fidelity and system LOW_MEMORY exit separately
        run: |
          set -euo pipefail
          python3 -m scripts.gt_device_graphics_acceptance \
            --session-summary "$RUNNER_TEMP/gt-owner-0402-session-summary.json" \
            --out "$RUNNER_TEMP/gt-owner-0402-safe-receipt.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'gt-owner-0402-safe-receipt.json').read_text())
          assert d['status']=='KNOWN_DEVICE_LOG_GATE_REJECTED'
          assert d['strict_known_log_gate_passed'] is False
          assert d['error_counts']['ultimate_water_invalid_pass']==28592
          assert d['water_invalid_pass_by_family']['spectrum']==11512
          assert d['water_invalid_pass_by_family']['foam_global']==17080
          assert d['error_counts']['water_fft_invalid_compute_kernel']==4576
          assert d['compute_invalid_kernel_index']['six']==4576
          assert d['error_counts']['unity_cursor_rgba32_required']==2895
          assert d['error_counts']['obb_guid_load_failed']==4
          assert d['collector_writer_accounting_verified'] is True
          assert d['collector_writer_failed_batches']==0
          assert d['collector_writer_pending_bytes_at_stop']==0
          assert d['android_matched_low_memory_exit_observed'] is True
          assert d['android_process_exit_cause_other_than_reported_reason_proven'] is False
          print('GT_REAL_CL_0402_DEVICE_REPRODUCED water=28592 spectrum=11512 foam=17080 kernel6=4576 cursor=2895 guid=4 LOW_MEMORY=true GPUcause=unverified')
          PY
      - name: Remove private owner summary; do not publish raw logs or source
        if: always()
        run: rm -f "$RUNNER_TEMP/gt-owner-session-summary.json" "$RUNNER_TEMP/gt-owner-safe-render-receipt.json" "$RUNNER_TEMP/gt-owner-night-session-summary.json" "$RUNNER_TEMP/gt-owner-night-safe-receipt.json" "$RUNNER_TEMP/gt-owner-0402-session-summary.json" "$RUNNER_TEMP/gt-owner-0402-safe-receipt.json"
