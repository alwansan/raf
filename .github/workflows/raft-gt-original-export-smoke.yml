        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.t3_audit_exported_material_programs \
            --project "$RUNNER_TEMP/gt-project/ExportedProject" --rank-dummy-targets \
            --out "$RUNNER_TEMP/gt-nine-shader-postrestore-quality.json"
          python3 - <<'PY_GT_AFTER'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          a=root/"gt-project/ExportedProject/Assets"
          previous=json.loads((root/"gt-full-smoke-private-unchanged-material-meta.json").read_text())
          suffixes={".meta",".mat",".asset",".prefab",".unity"}
          actual={}
          for f in a.rglob("*"):
              if f.is_file() and not f.is_symlink() and f.suffix.lower() in suffixes:
                  h=hashlib.sha256()
                  with f.open("rb") as source:
                      for data in iter(lambda: source.read(1024*1024), b""):
                          h.update(data)
                  actual[str(f.relative_to(a))]=h.hexdigest()
          assert actual==previous,"Original_Material_or_Meta_modified"
          raw=json.loads((root/"gt-raw-export-program-quality.json").read_text())
          vendor=json.loads((root/"gt-actual-postrestore-shader-quality.json").read_text())
          after=json.loads((root/"gt-nine-shader-postrestore-quality.json").read_text())
          c=after["counts"]
          assert after["status"]=="NATIVE_MATERIAL_SHADER_PROGRAM_AUDIT_ONLY"
          assert c["material_documents"]==raw["counts"]["material_documents"]==1536
          assert c["material_docs_with_unknown_or_broken_Shader"]==0
          old=vendor["postrestore_material_quality"]["postrestore_custom_dummy_material_documents"]
          assert c["material_docs_using_dummy_Shader"] < old
          report={"schema_version":1,"status":"GT_NINE_ORIGINAL_SHADERS_SAME_FULL_EXPORT_ACCEPTED_NO_APK",
            "raw_export_dummy_materials":raw["counts"]["material_docs_using_dummy_Shader"],
            "vendor_only_dummy_materials":old,
            "all_nine_shaders_installed_dummy_materials":c["material_docs_using_dummy_Shader"],
            "all_nine_shaders_installed_non_dummy_materials":c["material_docs_using_non_dummy_Shader"],
            "postrestoration_remaining_dummy_by_name_digest":after.get("dummy_shader_material_counts_by_name_digest",{}),
            "protected_material_and_meta_files":len(actual),
            "all_original_material_meta_bytes_unchanged":True,
            "original_source_zip2_sha":"15964ea8f246b6e076ce26b60931ee2e1a9a2385",
            "APK_OBB_XAPK_created":False,"device_pixel_render_verified":False}
          (root/"gt-nine-shader-postrestore-summary-safe.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("GT_NINE_SAME_EXPORT_POSTRESTORE_MATERIAL_COUNTS "+json.dumps({
            k:v for k,v in report.items() if k!="postrestoration_remaining_dummy_by_name_digest"
          },sort_keys=True))
          PY_GT_AFTER
