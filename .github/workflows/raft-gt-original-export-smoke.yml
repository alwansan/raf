name: GT full ZIP2 original Raft AssetRipper exporter integration (no APK)

on:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-gt-original-export-smoke.yml
      - scripts/gt_verify_original_mesh_export.py
      - tests/test_gt_verify_original_mesh_export.py
      - scripts/b44_verify_material_colors.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gt-original-zip2-real-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-original-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            config
            android-port/Experiments/ExportLineage
            Raft/Raft_Data/Managed
            tests
      - name: Check disk for full 7.53GB Raft source and actual AssetRipper export
        run: |
          df -h /
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 47185920
      - name: Immutable full Raft graphics ZIP2 checkout, never Git LFS
        uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: .gt-zip2
          filter: blob:none
          lfs: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/**
      - name: Stage exact original managed providers for full AssetRipper import
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check dnfile==0.18.0
          python3 -m scripts.stage_export_managed_providers \
            --source "$GITHUB_WORKSPACE/Raft/Raft_Data/Managed" \
            --destination "$RUNNER_TEMP/gt-input/Raft_Data/Managed"
          test -s "$RUNNER_TEMP/gt-input/Raft_Data/Managed/Assembly-CSharp.dll"
          test ! -e "$RUNNER_TEMP/gt-input/Raft_Data/Managed/PlayFab_o.dll"
      - name: Restore complete 134 SHA-authentic original graphics and scenes to real exporter input
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.gt_zip2_export_resources \
            --zip2-checkout .gt-zip2 \
            --input-root "$RUNNER_TEMP/gt-input/Raft_Data" \
            --profile full \
            --byte-budget 10000000000 \
            --report "$RUNNER_TEMP/gt-export-original-restore.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"gt-export-original-restore.json"
          result=json.loads(p.read_text())
          assert result["original_resources_verified"]==134
          assert result["original_bytes_materialized_or_reused"]==7532909297
          assert result["git_lfs_used"] is False
          assert result["original_payload_sha256_and_size_verified"]
          print("GT_REAL_EXPORT_INPUT_READY originalFiles=134 originalBytes=7532909297 managed=true LFS=false")
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/checkout@v4
        with:
          repository: nowl-it/AssetRipperCLI
          ref: 036098ab525a3f9f693dc101edeb21faad4d32d8
          path: ar-host
          persist-credentials: false
          sparse-checkout: Source
      - name: Instrument and publish exact native-pipeline AssetRipper for same-instance lineage
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.patch_export_lineage \
            --tool-source ar-host \
            --helper android-port/Experiments/ExportLineage/RaftExportLineage.cs --mesh-lineage --native-texture-arrays --compute-lineage
          dotnet publish android-port/Experiments/ExportLineage/ExportLineage.csproj \
            -c Release -p:PublishAot=false -p:PublishTrimmed=false \
            -p:EnableTrimAnalyzer=false -p:EnableAotAnalyzer=false \
            --self-contained false -o "$RUNNER_TEMP/gt-ar" \
            > "$RUNNER_TEMP/gt-public-tool-build.log" 2>&1 || {
              tail -30 "$RUNNER_TEMP/gt-public-tool-build.log"
              exit 1
            }
          dotnet "$RUNNER_TEMP/gt-ar/ExportLineage.dll" --probe-tool \
            > "$RUNNER_TEMP/gt-tool-smoke.log" 2>&1 || {
              tail -30 "$RUNNER_TEMP/gt-tool-smoke.log"
              exit 1
            }
      - name: Run genuine exporter on fully restored Raft scene/texture/mesh streams
        env:
          RAFT_PRIVATE_EXPORT_LINEAGE: ${{ runner.temp }}/gt-private-export-lineage.json
          RAFT_PRIVATE_EXPORT_MESH_LINEAGE: ${{ runner.temp }}/gt-private-mesh-export-lineage.json
          RAFT_PRIVATE_EXPORT_TEXTURE_LINEAGE: '1'
          RAFT_PRIVATE_EXPORT_COMPUTE_LINEAGE: '1'
          DOTNET_PROCESSOR_COUNT: '2'
        shell: bash
        run: |
          set -euo pipefail
          timeout 1200s dotnet "$RUNNER_TEMP/gt-ar/ExportLineage.dll" \
            "$RUNNER_TEMP/gt-input" "$RUNNER_TEMP/gt-project" --full-install \
            > "$RUNNER_TEMP/gt-export-log.private.txt" 2>&1 || {
              python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"gt-export-log.private.txt"
          s=p.read_text(errors="replace")
          d={"export_completed":False,
             "has_missing_assembly":"Could not load file or assembly" in s,
             "loading_started":"Processing loaded assets" in s,
             "export_started":"Starting export" in s,
             "managed_assembly_initialization_failure":"Could not initialize assembly manager" in s,
             "known_exception_types":len(set(re.findall(r'(?:System|AssetRipper)\.[a-zA-Z.]+Exception',s))),
             "log_bytes":len(s.encode())}
          (Path(os.environ["RUNNER_TEMP"])/"gt-export-failure-safe.json").write_text(json.dumps(d,sort_keys=True,indent=2)+"\n")
          print("GT_EXPORTER_FAILED_AGGREGATE "+json.dumps(d,sort_keys=True))
          PY
              exit 1
            }
          test -s "$RUNNER_TEMP/gt-private-export-lineage.json"
          test -d "$RUNNER_TEMP/gt-project/ExportedProject/Assets"
          test -d "$RUNNER_TEMP/gt-project/ExportedProject/ProjectSettings"
          python3 -m scripts.verify_assetripper_script_import \
            --log "$RUNNER_TEMP/gt-export-log.private.txt"
      - name: Compare authenticated original Mesh geometry to the same export
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check UnityPy==1.25.4 PyYAML==6.0.2
          python3 -m unittest discover -s tests -p test_gt_verify_original_mesh_export.py -v
          python3 -m scripts.gt_verify_original_mesh_export \
            --source "$RUNNER_TEMP/gt-input/Raft_Data" \
            --zip2-checkout .gt-zip2 \
            --project "$RUNNER_TEMP/gt-project/ExportedProject" \
            --mesh-trace "$RUNNER_TEMP/gt-private-mesh-export-lineage.json" \
            --export-trace "$RUNNER_TEMP/gt-private-export-lineage.json" \
            --report "$RUNNER_TEMP/gt-real-mesh-export-geometry.json"
      - name: Compare original Material tint RGBA across all 82 owners
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_b44_verify_material_colors.py -v
          python3 -m scripts.b44_verify_material_colors \
            --source "$RUNNER_TEMP/gt-input/Raft_Data" \
            --zip2-manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --private-export-trace "$RUNNER_TEMP/gt-private-export-lineage.json" \
            --project "$RUNNER_TEMP/gt-project/ExportedProject" \
            --out "$RUNNER_TEMP/gt-full-material-colors.json"
      - name: Measure real exported Unity files and source link integrity without game identifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"gt-project/ExportedProject/Assets"
          c=collections.Counter(p.suffix.lower() for p in root.rglob('*') if p.is_file())
          d={"schema":"GT_FULL_ORIGINAL_ASSERIPPER_EXPORT_REAL_V1",
             "exporter_completed":True,
             "scene_yaml_files":c[".unity"],"material_yaml_files":c[".mat"],
             "texture_image_files":sum(c[x] for x in (".png",".tga",".dds",".jpg",".jpeg",".exr",".hdr")),
             "mesh_asset_files":c[".asset"],"unity_meta_files":c[".meta"],
             "managed_originals_present":True,
             "no_git_lfs":True,"android_gpu_render_verified":False}
          (Path(os.environ["RUNNER_TEMP"])/"gt-real-export-aggregate.json").write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")
          print("GT_REAL_FULL_ORIGINAL_EXPORT "+json.dumps(d,sort_keys=True))
          PY
      - name: GT classify all actual exporter texture GUID targets without exposing original identities
        id: gt_export_texture_target_classes
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_gt_diagnose_export_texture_targets.py -v
          python3 -m scripts.gt_diagnose_export_texture_targets \
            --project "$RUNNER_TEMP/gt-project/ExportedProject" \
            --out "$RUNNER_TEMP/gt-export-all-texture-target-categories.json"
      - name: GT correlate nonstandard imported image fileIDs with exact original Cubemap class and TextureImporter shape
        id: gt_original_cubemap_export_lineage
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_gt_diagnose_texture_export_lineage.py -v
          python3 -m scripts.gt_diagnose_texture_export_lineage \
            --project "$RUNNER_TEMP/gt-project/ExportedProject" \
            --trace "$RUNNER_TEMP/gt-private-export-lineage.json" \
            --report "$RUNNER_TEMP/gt-real-cubemap-export-lineage.json"
      - name: Capture original Material-to-Texture export GUID guard results including exact failure code
        id: gt_export_links
        continue-on-error: true
        shell: bash
        run: |
          if python3 -m scripts.verify_exported_material_texture_links \
              --project "$RUNNER_TEMP/gt-project/ExportedProject" \
              > "$RUNNER_TEMP/gt-export-texture-guard.private.txt"; then
            result_code=0
          else
            result_code=$?
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          s=(Path(os.environ["RUNNER_TEMP"])/"gt-export-texture-guard.private.txt").read_text()
          # B46 emits only an aggregate status and safe error code, never game values.
          lines=[x for x in s.splitlines() if x.startswith("RAFT_B46_TEXTURE_LINKS ")]
          if len(lines)!=1:
              raise SystemExit("Missing aggregate Material-to-Texture guard result")
          result=json.loads(lines[0].split(" ",1)[1])
          (Path(os.environ["RUNNER_TEMP"])/"gt-export-texture-guard-safe.json").write_text(
              json.dumps(result,sort_keys=True,indent=2)+"\n")
          print("GT_EXPORTED_MATERIAL_TEXTURE_LINKS "+json.dumps(result,sort_keys=True))
          PY
          exit "$result_code"
      - name: GT inspect exact original-to-export Material texture GUID/UV lineage in one authenticated visible provider
        id: gt_exact_material_texenv
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check UnityPy==1.23.0 PyYAML==6.0.2
          python3 -m unittest discover -s tests -p test_b05_verify_material_texenv_bindings.py -v
          if python3 -m scripts.b05_verify_material_texenv_bindings \
               --original "$RUNNER_TEMP/gt-input" \
               --owner sharedassets6.assets \
               --project "$RUNNER_TEMP/gt-project/ExportedProject" \
               --trace "$RUNNER_TEMP/gt-private-export-lineage.json" \
               --out "$RUNNER_TEMP/gt-b05-actual-original-to-export-texenv.json" \
               > "$RUNNER_TEMP/gt-b05-private.stdout.txt" 2>&1; then
            result_code=0
          else
            result_code=$?
          fi
          if test ! -s "$RUNNER_TEMP/gt-b05-actual-original-to-export-texenv.json"; then
            python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"gt-b05-actual-original-to-export-texenv.json"
          p.write_text(json.dumps({"source_export_guid_lineage_verified":False,
             "status":"INCONCLUSIVE_BEFORE_AGGREGATE_REPORT",
             "original_data_modified":False,"device_render_verified":False},sort_keys=True,indent=2)+"\n")
          PY
          fi
          echo "GT_B05_EXACT_TEXENV_COMPARISON exit_code=$result_code status_report_saved=true"
          exit "$result_code"
      - name: Validate all nine native arrays and 28 material slots in the full export
        run: |
          set -euo pipefail
          python3 -m scripts.gt_write_unity_array_import_contract \
            --original-source "$RUNNER_TEMP/gt-input/Raft_Data" \
            --native-stream-source "$RUNNER_TEMP/gt-input/Raft_Data" \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --trace "$RUNNER_TEMP/gt-private-export-lineage.json" \
            --project "$RUNNER_TEMP/gt-project/ExportedProject" \
            --report "$RUNNER_TEMP/gt-real-original-array-private-Editor-gate-aggregate.json"
      - name: Prove the original water FFT has a same-export native compute asset
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          trace = json.loads((root / "gt-private-export-lineage.json").read_text())
          matches = [row for row in trace["objects"] if row["class_id"] == 72 and
                     row["source"] == {"owner": "sharedassets0.assets", "path_id": 2456}]
          assert len(matches) == 1, "original_fft_export_trace_missing"
          target = matches[0]["export"]
          assert target["file_id"] == 7200000 and target["type"] == 2, "original_fft_export_type"
          assert re.fullmatch(r"[a-f0-9]{32}", target["guid"]), "original_fft_invalid_export_guid"
          assets = root / "gt-project/ExportedProject/Assets"
          pattern = re.compile(r"(?m)^guid: " + target["guid"] + r"$")
          metas = [p for p in assets.rglob("*.asset.meta") if pattern.search(p.read_text(encoding="utf-8-sig"))]
          assert len(metas) == 1, "original_fft_export_meta_missing"
          with metas[0].with_suffix("").open(encoding="utf-8-sig") as source:
              assert any(line.rstrip() == "--- !u!72 &7200000" for line in source), "original_fft_export_class"
          print("GT_FFT_SOURCE_EXPORT_IDENTITY verified=true")
          PY
      - name: GT compare all 1556 original Material texture properties and GUIDs with actual same-instance exported Unity project
        id: gt_all_original_texenvs
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_gt_full_original_export_texenvs.py -v
          if python3 -m scripts.gt_full_original_export_texenvs \
               --source "$RUNNER_TEMP/gt-input/Raft_Data" \
               --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
               --export-project "$RUNNER_TEMP/gt-project/ExportedProject" \
               --trace "$RUNNER_TEMP/gt-private-export-lineage.json" \
               --report "$RUNNER_TEMP/gt-full-real-82-owner-texenv.json" \
               > "$RUNNER_TEMP/gt-full-texenv-private.stdout.txt" 2>&1; then
            result_code=0
          else
            result_code=$?
          fi
          if test ! -s "$RUNNER_TEMP/gt-full-real-82-owner-texenv.json"; then
            python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"gt-full-real-82-owner-texenv.json"
          p.write_text(json.dumps({"source_export_guid_lineage_verified":False,
             "status":"INCONCLUSIVE_BEFORE_AGGREGATE_REPORT",
             "source_original_materials_modified":False,"device_render_verified":False},
             sort_keys=True,indent=2)+"\n")
          PY
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"gt-full-real-82-owner-texenv.json").read_text())
          print("GT_REAL_ALL_82_TEXENV_FIDELITY "+json.dumps({
             k:d.get(k) for k in ("status","original_material_objects",
               "materials_compared","source_texture_slots","slots_compared",
               "exact_internal_targets_compared","wrong_internal_targets",
               "unresolved_internal_targets","external_targets_not_proven",
               "null_to_bound","bound_to_null","uv_transform_value_mismatches",
               "source_slots_faithful_with_resolved_scope")},sort_keys=True))
          PY
          exit "$result_code"
      # Serialized fonts are authenticated but do not export as ordinary
      # loose Material YAML. Safe aggregate receipts reveal true remaining
      # external refs, without dumping private fileID/pathID/GUID on failure.
      - name: GT source-authenticate external Material Texture PPtrs across original ZIP2 owners and same-instance GUIDs
        id: gt_external_original_texture_links
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_gt_external_original_texture_links.py -v
          python3 -m scripts.gt_external_original_texture_links \
            --source "$RUNNER_TEMP/gt-input/Raft_Data" \
            --manifest .gt-zip2/RAFT_FILE_MANIFEST.tsv \
            --project "$RUNNER_TEMP/gt-project/ExportedProject" \
            --trace "$RUNNER_TEMP/gt-private-export-lineage.json" \
            --report "$RUNNER_TEMP/gt-real-external-texture-links.json"
          test -s "$RUNNER_TEMP/gt-real-external-texture-links.json"
          python3 - <<'PYASSERT'
          import json, os
          from pathlib import Path
          d = json.loads((Path(os.environ["RUNNER_TEMP"]) / "gt-real-external-texture-links.json").read_text())
          assert d["authenticated_owner_tables"] == 82
          assert d["original_external_texture_slots"] == 416
          assert d["exact_cross_owner_source_export_texture_links"] == 416
          assert d["all_external_links_verified"] is True
          PYASSERT
      - name: Measure unmodified AssetRipper Material to ShaderLab dummy and pass completeness for T3
        continue-on-error: true
        shell: bash
        run: |
          python3 -m scripts.t3_audit_exported_material_programs \
            --project "$RUNNER_TEMP/gt-project/ExportedProject" \
            --out "$RUNNER_TEMP/gt-raw-export-program-quality.json"
      - name: GT run official authenticated TMP PostFX and volumetric shader recovery in isolated exported Unity project
        id: gt_vendor_shader_restoration
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_gt_compare_shader_restore_quality.py -v
          python3 -m unittest discover -s tests -p test_gt_test_vendor_shader_restoration.py -v
          python3 -m scripts.gt_test_vendor_shader_restoration \
            --project "$RUNNER_TEMP/gt-project/ExportedProject" \
            --raw-quality "$RUNNER_TEMP/gt-raw-export-program-quality.json" \
            --backup-root "$RUNNER_TEMP/gt-shader-original-backup" \
            --report "$RUNNER_TEMP/gt-actual-postrestore-shader-quality.json"
      - name: Publish aggregate evidence only, never original scenes/meshes/export/trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-real-original-export-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gt-export-original-restore.json
            ${{ runner.temp }}/gt-real-export-aggregate.json
            ${{ runner.temp }}/gt-real-mesh-export-geometry.json
            ${{ runner.temp }}/gt-export-failure-safe.json
            ${{ runner.temp }}/gt-export-texture-guard-safe.json
            ${{ runner.temp }}/gt-export-all-texture-target-categories.json
            ${{ runner.temp }}/gt-real-cubemap-export-lineage.json
            ${{ runner.temp }}/gt-real-original-array-private-Editor-gate-aggregate.json
            ${{ runner.temp }}/gt-b05-actual-original-to-export-texenv.json
            ${{ runner.temp }}/gt-full-real-82-owner-texenv.json
            ${{ runner.temp }}/gt-full-material-colors.json
            ${{ runner.temp }}/gt-real-external-texture-links.json
            ${{ runner.temp }}/gt-raw-export-program-quality.json
            ${{ runner.temp }}/gt-actual-postrestore-shader-quality.json
          retention-days: 14
          if-no-files-found: ignore
