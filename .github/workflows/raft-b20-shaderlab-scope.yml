name: B20 WATER-001 ShaderLab authored Pass scope (source-only)

on:
  push:
    branches: [feature/android-native-port]
    paths:
      - 'scripts/b49_shaderlab_pass_contract.py'
      - 'tests/test_b20_shaderlab_scope.py'
      - 'tests/test_b49_shaderlab_pass_contract.py'
      - 'tests/test_verify_water_render_contract.py'
      - '.github/workflows/raft-b20-shaderlab-scope.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b20-water-shaderlab-scope-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  scope-negative-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Strict synthetic tests and upstream source gate regression
        shell: bash
        run: |
          set -euo pipefail
          echo "B20 source SHA: $GITHUB_SHA"
          python3 -m unittest discover -s tests -p 'test_b20_shaderlab_scope.py' -v 2>&1 | tee b20-shaderlab-source.log
          python3 -m unittest discover -s tests -p 'test_b49_shaderlab_pass_contract.py' -v 2>&1 | tee -a b20-shaderlab-source.log
          python3 -m unittest discover -s tests -p 'test_verify_water_render_contract.py' -v 2>&1 | tee -a b20-shaderlab-source.log
          echo 'SOURCE_ONLY: not original shader reconstruction, Unity import, Vulkan/Adreno pixels or phone proof' >> b20-shaderlab-source.log
      - name: Retain safe synthetic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b20-water-shaderlab-scope-${{ github.run_id }}
          path: b20-shaderlab-source.log
          if-no-files-found: ignore
          retention-days: 7
