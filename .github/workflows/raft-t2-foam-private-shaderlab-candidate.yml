name: T2 WATER-001 source-authentic Foam private ShaderLab authored Properties candidate
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/t2_foam_private_shaderlab_candidate.py
      - tests/test_t2_foam_private_shaderlab_candidate.py
      - scripts/t2_foam_candidate_embedded_validation.py
      - tests/test_t2_foam_candidate_embedded_validation.py
      - scripts/t2_foam_embedded_stage_io.py
      - tests/test_t2_foam_embedded_stage_io.py
      - scripts/t2_foam_embedded_descriptor_layout.py
      - tests/test_t2_foam_embedded_descriptor_layout.py
      - scripts/t2_foam_private_descriptor_set_remap.py
      - scripts/t2_foam_private_cb0_member_shape.py
      - tests/test_t2_foam_private_cb0_member_shape.py
      - scripts/t2_foam_private_cb0_index_access.py
      - tests/test_t2_foam_private_cb0_index_access.py
      - tests/test_t2_foam_private_descriptor_set_remap.py
      - .github/workflows/raft-t2-foam-private-shaderlab-candidate.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t2-foam-original-2prop-shaderlab-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  source-original-private-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
      - name: Test no fake properties and 2-pass controls without original
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t2_foam_private_shaderlab_candidate.py
          python3 -m unittest discover -s tests -p 'test_t2_foam_private_shaderlab_candidate.py' -v
          python3 -m py_compile scripts/t2_foam_candidate_embedded_validation.py
          python3 -m unittest discover -s tests -p 'test_t2_foam_candidate_embedded_validation.py' -v
          python3 -m py_compile scripts/t2_foam_embedded_stage_io.py
          python3 -m unittest discover -s tests -p 'test_t2_foam_embedded_stage_io.py' -v
          python3 -m py_compile scripts/t2_foam_embedded_descriptor_layout.py
          python3 -m unittest discover -s tests -p 'test_t2_foam_embedded_descriptor_layout.py' -v
          python3 -m py_compile scripts/t2_foam_private_descriptor_set_remap.py
          python3 -m unittest discover -s tests -p 'test_t2_foam_private_descriptor_set_remap.py' -v
          python3 -m py_compile scripts/t2_foam_private_cb0_member_shape.py
          python3 -m unittest discover -s tests -p 'test_t2_foam_private_cb0_member_shape.py' -v
          python3 -m py_compile scripts/t2_foam_private_cb0_index_access.py
          python3 -m unittest discover -s tests -p 'test_t2_foam_private_cb0_index_access.py' -v
      - name: Check scratch disk
        run: python3 -c 'import shutil; assert shutil.disk_usage(".").free>3*1024**3'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: t2-original-foam-shaderlab-zip2
          lfs: false
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/sharedassets0.assets/*
      - name: SHA-pin original Foam shader owner without LFS
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import ZIP2_SHA,PINS,stage
          source=Path("t2-original-foam-shaderlab-zip2")
          assert subprocess.check_output(["git","-C",str(source),"rev-parse","HEAD"],text=True).strip()==ZIP2_SHA
          out=Path(os.environ["RUNNER_TEMP"])/"t2-auth-original"
          result=stage(source,out,{"Raft_Data/sharedassets0.assets":PINS["Raft_Data/sharedassets0.assets"]})
          assert result["verified_bytes"]==115978112 and result["lfs_used"] is False
          print("T2_ORIGINAL_FOAM_CANDIDATE owner_sha_authenticated=true")
          PY
      - name: Install original reader and translated-stage tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4 -q
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
      - name: Regenerate B20 exact original HLSL stages and two serialized pass states in scratch
        run: |
          set -euo pipefail
          timeout 480s python3 -m scripts.b20_private_foam_packet \
            --source "$RUNNER_TEMP/t2-auth-original" \
            --repo "$GITHUB_WORKSPACE" \
            --private "$RUNNER_TEMP/t2-foam-auth-private" \
            --out "$RUNNER_TEMP/t2-foam-private-manifest.json"
      - name: Assemble actual source-authored Foam Properties with 2 genuine passes privately
        run: |
          set -euo pipefail
          timeout 180s python3 -m scripts.t2_foam_private_shaderlab_candidate \
            --source "$RUNNER_TEMP/t2-auth-original" \
            --packet "$RUNNER_TEMP/t2-foam-auth-private" \
            --manifest "$RUNNER_TEMP/t2-foam-private-manifest.json" \
            --private-dest "$RUNNER_TEMP/t2-authentic-foam-private.shader" \
            --out "$RUNNER_TEMP/t2-foam-candidate-safe.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"t2-foam-candidate-safe.json").read_text())
          assert r["status"]=="original_private_foam_two_pass_shaderlab_structural_candidate"
          assert r["authored_properties"]==2 and r["authored_texture_properties"]==1
          assert r["original_passes"]==2 and r["original_program_stages"]==4
          assert r["authentic_pass_states"]==2 and r["complete_structural_passes"]==2
          assert r["shaderlab_unity_import_verified"] is False
          assert r["original_cb0_name_or_data_upload_verified"] is False
          assert r["original_material_sampler_upload_verified"] is False
          assert r["original_numeric_or_device_pixels_verified"] is False
          assert r["private_shaderlab_published"] is False
          PY
      - name: T2 prove private source-authentic Foam can replace a synthetic exported Shader without mutating GUID
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          from scripts.b24_original_foam_stage_translation import TARGET
          from scripts.t2_foam_private_installer import install
          temp=Path(os.environ["RUNNER_TEMP"])
          candidate=temp/"t2-authentic-foam-private.shader"
          report=json.loads((temp/"t2-foam-candidate-safe.json").read_text())
          scratch=temp/"t2-foam-original-candidate-export-transaction-probe"
          project=scratch/"UnityProject"
          target=project/"Assets"/"SyntheticExport"/"OriginalFoam.shader"
          target.parent.mkdir(parents=True,exist_ok=False)
          original=('Shader "'+TARGET+'" { SubShader { Pass { } } }\n').encode()
          metadata=b'fileFormatVersion: 2\nguid: '+b'a'*32+b'\n'
          target.write_bytes(original)
          Path(str(target)+".meta").write_bytes(metadata)
          try:
              # Original source pin/owner SHA, original pass states and four stage
              # DXBC model hashes are authenticated by the preceding steps.
              content=candidate.read_bytes()
              assert report["private_candidate_bytes"]==len(content)
              actual=install(project,candidate,scratch/"recovery",
                             hashlib.sha256(content).hexdigest(),report)
              assert actual["unique_original_foam_exported_target_installed"]==1
              assert actual["original_export_meta_bytes_unchanged"] is True
              assert actual["external_recovery_backup_complete"] is True
              assert actual["private_shaderlab_published"] is False
              assert actual["Unity_2021_import_verified"] is False
              assert actual["Android_water_pixels_verified"] is False
              assert target.read_bytes()==content
              assert Path(str(target)+".meta").read_bytes()==metadata
              assert (scratch/"recovery"/"original.shader").read_bytes()==original
              safe=dict(actual)
              safe.update(original_private_candidate_used=True,
                          exported_unity_target_was_synthetic=True,
                          original_exported_guid_validated=False,
                          original_Source_Sha_verified_by_prior_staging=True)
              (temp/"t2-foam-install-safe.json").write_text(json.dumps(safe,sort_keys=True)+"\n")
              print("T2_FOAM_PRIVATE_SOURCE_TO_SYNTH_EXPORT_INSTALL "+json.dumps(safe,sort_keys=True))
          finally:
              shutil.rmtree(scratch,ignore_errors=True)
          PY
      - name: Recompile actual HLSLPROGRAM bodies extracted from complete private ShaderLab
        run: |
          set -euo pipefail
          timeout 240s python3 -m scripts.t2_foam_candidate_embedded_validation \
            --candidate "$RUNNER_TEMP/t2-authentic-foam-private.shader" \
            --scratch "$RUNNER_TEMP" \
            --out "$RUNNER_TEMP/t2-foam-embedded-safe.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          data=json.loads((Path(os.environ["RUNNER_TEMP"])/"t2-foam-embedded-safe.json").read_text())
          assert data["status"]=="original_private_candidate_embedded_four_stages_vulkan11_valid"
          assert data["complete_embedded_original_pass_programs"]==2
          assert data["embedded_stage_variants_compiled_and_validated"]==4
          assert data["original_stage_order_preserved"] is True
          assert data["verified_programs_extracted_from_completed_private_ShaderLab"] is True
          assert data["unity_2021_shaderlab_import_verified"] is False
          assert data["runtime_cb0_and_material_texture_sampler_upload_verified"] is False
          assert data["original_gpu_or_android_pixels_verified"] is False
          assert data["private_source_published"] is False
          PY
      - name: Compare authentic per-pass Vulkan Vertex outputs to Fragment inputs from completed private ShaderLab
        run: |
          set -euo pipefail
          timeout 240s python3 -m scripts.t2_foam_embedded_stage_io \
            --candidate "$RUNNER_TEMP/t2-authentic-foam-private.shader" \
            --scratch "$RUNNER_TEMP" \
            --out "$RUNNER_TEMP/t2-foam-io-safe.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"t2-foam-io-safe.json").read_text())
          assert r["status"] in ("source_original_embedded_two_pass_numeric_varyings_compatible",
                                 "source_original_embedded_pass_varying_abi_mismatch")
          assert r["source_derived_embedded_shaders"]==2
          assert r["compiled_stage_variants"]==4
          assert len(r["per_pass_user_varying_counts"])==2
          assert all(type(x["numerical_location_type_interface_compatible"]) is bool
                     for x in r["per_pass_user_varying_counts"])
          assert r["unity_shaderlab_actual_import_verified"] is False
          assert r["runtime_cb0_texture_sampler_or_material_upload_verified"] is False
          assert r["actual_adreno_or_device_pixels_verified"] is False
          assert r["private_source_published"] is False
          # Do not equate a source-backed ABI mismatch with pixel acceptance.
          PY
      - name: Diagnose real original Foam per-pass Vulkan descriptor collisions across embedded VS and FS
        run: |
          set -euo pipefail
          timeout 240s python3 -m scripts.t2_foam_embedded_descriptor_layout \
            --candidate "$RUNNER_TEMP/t2-authentic-foam-private.shader" \
            --scratch "$RUNNER_TEMP" \
            --out "$RUNNER_TEMP/t2-foam-layout-safe.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"t2-foam-layout-safe.json").read_text())
          assert r["status"] in (
            "original_private_foam_vulkan_stage_descriptor_types_compatible",
            "original_private_foam_vulkan_stage_descriptor_layout_conflict"
          )
          assert r["authentic_private_ShaderLab_pass_count"]==2
          assert r["embedded_stages_recompiled_and_spirv_val"]==4
          assert len(r["per_pass_descriptor_set_layout"])==2
          assert all(type(p["shared_descriptor_class_conflict_count"]) is int and
                     p["shared_descriptor_class_conflict_count"]>=0
                     for p in r["per_pass_descriptor_set_layout"])
          assert r["original_Unity_shaderlab_import_or_descriptor_remapping_verified"] is False
          assert r["original_cb0_material_texture_sampler_upload_verified"] is False
          assert r["original_GPU_or_Adreno_frame_verified"] is False
          assert r["private_source_published"] is False
          PY
      - name: Remap private original Fragment DescriptorSet-only words and revalidate Vulkan1.1
        run: |
          set -euo pipefail
          timeout 240s python3 -m scripts.t2_foam_private_descriptor_set_remap \
            --candidate "$RUNNER_TEMP/t2-authentic-foam-private.shader" \
            --scratch "$RUNNER_TEMP" \
            --out "$RUNNER_TEMP/t2-foam-set-remap-safe.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"t2-foam-set-remap-safe.json").read_text())
          assert r["status"]=="source_original_foam_private_decorations_only_remap_valid"
          assert r["source_original_passes"]==2
          assert r["original_compiled_and_validated_stage_variants"]==4
          assert r["privately_relocated_fragment_variants_validated"]==2
          assert r["original_compiled_descriptor_type_conflicts"]>0
          assert r["private_descriptor_type_conflicts_after_relocation"]==0
          assert r["all_original_non_descriptor_SPIRV_words_unchanged"] is True
          assert r["selective_fragment_conflicting_descriptors_only_relocated"]==4
          assert r["selective_remaining_resource_type_conflicts"]==0
          assert r["selective_original_same_type_CB_links_retained"]==2
          assert r["selective_CB_extent_differences_still_unresolved"]==2
          assert r["selective_private_relocated_fragment_variants_validated"]==2
          assert r["real_Unity_ShaderLab_import_or_descriptor_upload_verified"] is False
          assert r["original_CB0_and_material_texture_sampler_delivery_verified"] is False
          assert r["original_Adreno_water_pixels_verified"] is False
          assert r["private_binary_or_original_shader_source_published"] is False
          PY
      - name: Compare original two-pass shared CB0 reflected member geometry privately
        run: |
          set -euo pipefail
          timeout 240s python3 -m scripts.t2_foam_private_cb0_member_shape             --candidate "$RUNNER_TEMP/t2-authentic-foam-private.shader"             --scratch "$RUNNER_TEMP"             --out "$RUNNER_TEMP/t2-foam-cb0-member-shape-safe.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"t2-foam-cb0-member-shape-safe.json").read_text())
          assert r["status"]=="private_two_pass_CB0_member_geometry_observed"
          assert r["pass_count"]==2 and r["compiled_stage_variants"]==4
          checks=r["per_pass_CB0_member_geometry"]
          assert len(checks)==2 and [p["pass_index"] for p in checks]==[0,1]
          assert all(p["shared_uniform_buffer_coordinate_count"]==1 for p in checks)
          # Original 2-pass source-backed byte-extent difference is a regression pin.
          assert all(p["different_reflected_block_byte_extent"] is True for p in checks)
          assert all(p["reflected_member_shape_is_not_Unity_CB0_upload_evidence"] is True for p in checks)
          assert r["original_member_semantics_or_CBuffer_upload_verified"] is False
          assert r["actual_Unity_2021_or_Adreno_verified"] is False
          assert r["private_identifiers_or_spirv_published"] is False
          PY
      - name: Trace authentic four-stage CB0 compiled OpLoad index paths privately
        run: |
          set -euo pipefail
          timeout 240s python3 -m scripts.t2_foam_private_cb0_index_access \
            --candidate "$RUNNER_TEMP/t2-authentic-foam-private.shader" \
            --scratch "$RUNNER_TEMP" \
            --out "$RUNNER_TEMP/t2-foam-cb0-index-safe.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"t2-foam-cb0-index-safe.json").read_text())
          assert r["status"]=="authentic_two_pass_CB0_compiled_load_paths_observed"
          assert r["original_pass_count"]==2 and r["original_compiled_stage_count"]==4
          rows=r["per_pass_relative_loads"]
          assert len(rows)==2 and [x["pass_index"] for x in rows]==[0,1]
          assert all(x["relative_array_capacity"] in ("vertex_larger","fragment_larger")
                     for x in rows)
          assert all(x["same_member_start_type_and_stride"] is True for x in rows)
          for x in rows:
            for stage in ("vertex_compiled_loads","fragment_compiled_loads"):
              counts=x[stage]
              assert counts["observed_load_index_paths_not_runtime_access_proof"] is True
              assert counts["no_trace_means_no_reads_proven"] is False
              assert all(type(v) is int and v>=0
                         for k,v in counts.items() if k.endswith("_count"))
          assert r["active_runtime_branch_reachability_verified"] is False
          assert r["Unity_original_CB0_upload_verified"] is False
          assert r["Android_Adreno_water_verified"] is False
          assert r["private_names_indices_and_spirv_published"] is False
          PY
      - name: Erase original and private ShaderLab/HLSL, even on error
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/t2-auth-original" \
            "$RUNNER_TEMP/t2-foam-auth-private" \
            "$RUNNER_TEMP/t2-foam-private-manifest.json" \
            "$RUNNER_TEMP/t2-authentic-foam-private.shader" \
            "$GITHUB_WORKSPACE/t2-original-foam-shaderlab-zip2"
      - name: Publish ONLY safe category/numeric report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-foam-private-shaderlab-safe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/t2-foam-candidate-safe.json
            ${{ runner.temp }}/t2-foam-install-safe.json
            ${{ runner.temp }}/t2-foam-embedded-safe.json
            ${{ runner.temp }}/t2-foam-io-safe.json
            ${{ runner.temp }}/t2-foam-layout-safe.json
            ${{ runner.temp }}/t2-foam-set-remap-safe.json
            ${{ runner.temp }}/t2-foam-cb0-member-shape-safe.json
            ${{ runner.temp }}/t2-foam-cb0-index-safe.json
          if-no-files-found: ignore
          retention-days: 7
