name: GT G4 original FFT typed array and same-export GUID admission (NO PLAYER)
# Actual original component array and candidate GUID identity, not runtime water proof.
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-gt-fft-same-export.yml
permissions:
  contents: read
concurrency:
  group: raft-gt-fft-same-export-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bounded-original-export-postvendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Checkout only B21 scripts/W1/B02 SHA-locked staging source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            android-port/Experiments/ExportLineage
            scripts
            tests
            config
            tools/gt_fft_same_export
            .github/workflows/raft-gt-fft-same-export.yml
            Raft/Raft_Data/Managed
      - name: Source-free pointer identity and managed provenance controls
        run: |
          set -euo pipefail
          python3 -c "import shutil; assert shutil.disk_usage('.').free > 8 * 1024**3"
          python3 -m pip install --user --disable-pip-version-check PyYAML==6.0.3 UnityPy==1.25.4 dnfile==0.17.0
          python3 -B -m unittest discover -s tools/gt_fft_same_export -p 'test_*.py' -v
          python3 -m unittest discover -s tests -p test_verify_original_fft_array_provenance.py -v
          python3 -m unittest discover -s tests -p test_b21_stage_light_lineage.py -v
          test -f tests/test_gt_stage_indexed_fft_candidate.py
          python3 -m unittest discover -s tests -p test_gt_stage_indexed_fft_candidate.py -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Obtain exact public AssetRipperCLI source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: nowl-it/AssetRipperCLI
          ref: 036098ab525a3f9f693dc101edeb21faad4d32d8
          path: ar-host
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            Source
      - name: Compile SHA-pinned optional W1+B02+B21 exporter in disposable public checkout
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b21"
          python3 -m scripts.b21_stage_light_lineage \
            --base-helper android-port/Experiments/ExportLineage/RaftExportLineage.cs \
            --destination "$RUNNER_TEMP/b21/RaftExportLineage.cs"
          python3 -B -m tools.gt_fft_same_export.audit --patch-helper "$RUNNER_TEMP/b21/RaftExportLineage.cs"
          python3 -m scripts.patch_export_lineage --tool-source ar-host --helper "$RUNNER_TEMP/b21/RaftExportLineage.cs" --compute-lineage
          timeout 780s dotnet publish android-port/Experiments/ExportLineage/ExportLineage.csproj \
            -c Release -p:PublishAot=false -p:PublishTrimmed=false \
            -p:EnableTrimAnalyzer=false -p:EnableAotAnalyzer=false \
            --self-contained false -o "$RUNNER_TEMP/b21-compiled" \
            > "$RUNNER_TEMP/b21-build-public-tool.log" 2>&1 || {
              tail -60 "$RUNNER_TEMP/b21-build-public-tool.log"; exit 1;
            }
          dotnet "$RUNNER_TEMP/b21-compiled/ExportLineage.dll" --probe-tool > /dev/null
      - name: Checkout immutable ZIP2 NINE SMALL original serialized providers (no LFS)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: zip2-original
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/level0
            Raft/Raft_Data/level1
            Raft/Raft_Data/level2
            Raft/Raft_Data/level3
            Raft/Raft_Data/level4
            Raft/Raft_Data/level5
            Raft/Raft_Data/globalgamemanagers
            Raft/Raft_Data/globalgamemanagers.assets
            Raft/Raft_Data/sharedassets6.assets
            Raft/Raft_Data/sharedassets0.assets
            Raft/Raft_Data/resources.assets
      - name: Include exact plain original sharedassets1 provider with safe non-cone patterns
        run: |
          set -euo pipefail
          # sharedassets0 is a ZIP2 multipart directory; sharedassets1 is a
          # real plain asset. Cone sparse selectors cannot select a plain file.
          git -C zip2-original sparse-checkout set --no-cone -- \
            '/RAFT_FILE_MANIFEST.tsv' \
            '/Raft/Raft_Data/level0' '/Raft/Raft_Data/level1' \
            '/Raft/Raft_Data/level2' '/Raft/Raft_Data/level3' \
            '/Raft/Raft_Data/level4' '/Raft/Raft_Data/level5' \
            '/Raft/Raft_Data/globalgamemanagers' \
            '/Raft/Raft_Data/globalgamemanagers.assets' \
            '/Raft/Raft_Data/sharedassets6.assets' \
            '/Raft/Raft_Data/sharedassets0.assets/*' \
            '/Raft/Raft_Data/sharedassets1.assets' \
            '/Raft/Raft_Data/resources.assets/*'
          test -d zip2-original/Raft/Raft_Data/resources.assets
          test -f zip2-original/Raft/Raft_Data/sharedassets1.assets
          test -d zip2-original/Raft/Raft_Data/sharedassets0.assets
      - name: Reconstruct in temporary staging with exact per-file size and SHA256
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,os,json
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import ZIP2_SHA,stage
          from scripts.b21_scene_lightmap_links import PIN
          from scripts.a12_probe_original_blur_passes import SHADER_OWNERS
          from scripts.b04_restore_original_color_settings import ORIGINAL_SIZE,ORIGINAL_SHA256
          zip2=Path('zip2-original')
          assert subprocess.check_output(['git','-C',str(zip2),'rev-parse','HEAD'],text=True).strip()==ZIP2_SHA
          pins={'Raft_Data/'+name:v for name,v in PIN.items()}
          pins.update({
            'Raft_Data/globalgamemanagers':(ORIGINAL_SIZE,ORIGINAL_SHA256),
            'Raft_Data/globalgamemanagers.assets': SHADER_OWNERS['globalgamemanagers.assets'],
            'Raft_Data/sharedassets6.assets':SHADER_OWNERS['sharedassets6.assets'],
            'Raft_Data/sharedassets0.assets':SHADER_OWNERS['sharedassets0.assets'],
            'Raft_Data/sharedassets1.assets':SHADER_OWNERS['sharedassets1.assets'],
            'Raft_Data/resources.assets':SHADER_OWNERS['resources.assets']
          })
          result=stage(zip2,Path(os.environ['RUNNER_TEMP'])/'b21-original',pins)
          assert len(result['owners'])==12 and not result['lfs_used']
          print('RAFT_T3_TWELVE_ORIGINAL_PROVIDERS_AUTHENTICATED=12')
          PY
      - name: Stage authenticated managed providers and recover exact original field declaration
        run: |
          set -euo pipefail
          test "$(git hash-object Raft/Raft_Data/Managed/Assembly-CSharp.dll)" = fc9d4ba920a178fdb89c970d9d772a01051dadc6
          python3 -m scripts.stage_export_managed_providers --source Raft/Raft_Data/Managed --destination "$RUNNER_TEMP/b21-original/Raft_Data/Managed"
          dotnet tool install ilspycmd --version 11.2.0.10050 --tool-path "$RUNNER_TEMP/gt-fft-ilspy"
          mkdir "$RUNNER_TEMP/gt-fft-managed"
          timeout 300s "$RUNNER_TEMP/gt-fft-ilspy/ilspycmd" -p -lv CSharp9_0 -o "$RUNNER_TEMP/gt-fft-managed" Raft/Raft_Data/Managed/Assembly-CSharp.dll > "$RUNNER_TEMP/gt-fft-private-ilspy.log" 2>&1
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
      - name: Run one bounded genuine source export with THREE same-instance private traces via directory discovery
        env:
          DOTNET_PROCESSOR_COUNT: '2'
          RAFT_PRIVATE_EXPORT_LINEAGE: ${{ runner.temp }}/b21-w1-private.json
          RAFT_PRIVATE_EXPORT_TEXTURE_LINEAGE: ${{ runner.temp }}/b21-b02-private.json
          RAFT_PRIVATE_EXPORT_FFT_COMPONENT_LINEAGE: ${{ runner.temp }}/b21-light-private.json
          RAFT_PRIVATE_EXPORT_COMPUTE_LINEAGE: "1"
        run: |
          set -euo pipefail
          set +e
          timeout 540s dotnet "$RUNNER_TEMP/b21-compiled/ExportLineage.dll" \
               "$RUNNER_TEMP/b21-original" "$RUNNER_TEMP/b21-private-export" --full-install \
               > "$RUNNER_TEMP/b21-original-export-private.log" 2>&1
          rc=$?
          set -e
          python3 -B -m tools.gt_fft_same_export.audit \
            --export-status "$rc" --discovery-mode directory \
            --project "$RUNNER_TEMP/b21-private-export/ExportedProject" \
            --w1 "$RAFT_PRIVATE_EXPORT_LINEAGE" \
            --component-trace "$RAFT_PRIVATE_EXPORT_FFT_COMPONENT_LINEAGE" \
            --texture-trace "$RAFT_PRIVATE_EXPORT_TEXTURE_LINEAGE" \
            --export-log "$RUNNER_TEMP/b21-original-export-private.log" \
            --out "$RUNNER_TEMP/gt-fft-same-export-phase-safe.json"
      - name: Verify exact original water component array and same-export diagnostic candidate GUID
        run: |
          set -euo pipefail
          python3 -B -m tools.gt_fft_same_export.audit \
            --source "$RUNNER_TEMP/b21-original/Raft_Data" \
            --managed "$RUNNER_TEMP/gt-fft-managed" \
            --project "$RUNNER_TEMP/b21-private-export/ExportedProject" \
            --w1 "$RUNNER_TEMP/b21-w1-private.json" \
            --component-trace "$RUNNER_TEMP/b21-light-private.json" \
            --out "$RUNNER_TEMP/gt-fft-same-export-safe.json"
      - name: Publish bounded aggregate only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-fft-same-export-safe
          path: |
            ${{ runner.temp }}/gt-fft-same-export-safe.json
            ${{ runner.temp }}/gt-fft-same-export-phase-safe.json
          if-no-files-found: warn
          retention-days: 14
      - name: Clean private original export and traces
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/b21-original" "$RUNNER_TEMP/b21-private-export" "$RUNNER_TEMP/b21-compiled" "$RUNNER_TEMP/b21" "$RUNNER_TEMP/gt-fft-managed" "$RUNNER_TEMP/gt-fft-ilspy" zip2-original
          rm -f "$RUNNER_TEMP/b21-w1-private.json" "$RUNNER_TEMP/b21-b02-private.json" "$RUNNER_TEMP/b21-light-private.json" "$RUNNER_TEMP/b21-original-export-private.log" "$RUNNER_TEMP/gt-fft-private-ilspy.log"
