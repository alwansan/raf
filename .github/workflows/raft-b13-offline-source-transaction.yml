name: B13 LOCAL-005 offline source transaction failure rollback
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/adapt_android_offline_startup.py
      - scripts/adapt_original_save_paths.py
      - tests/test_android_offline_startup.py
      - .github/workflows/raft-b13-offline-source-transaction.yml
      - 'prompt/coordination/B_TEAM/events/B13/**'
permissions:
  contents: read
concurrency:
  group: raft-b13-offline-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fault-injection:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests/test_android_offline_startup.py
      - name: Test original-free transaction failure and existing offline contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/b13-results"
          python3 -m unittest discover -s tests -p test_android_offline_startup.py -v 2>&1 | tee "${{ runner.temp }}/b13-results/synthetic-tests.txt"
          printf 'source_sha=%s\noriginal_game_sources_in_artifact=false\nunity_or_device_tested=false\n' "${{ github.sha }}" > "${{ runner.temp }}/b13-results/scope.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b13-offline-transaction-${{ github.run_id }}
          path: ${{ runner.temp }}/b13-results/
          retention-days: 7

  evidence-summary:
    name: Regenerate B-team summary after B13 source validation
    needs: fault-injection
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/android-native-port
          persist-credentials: true
          lfs: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/refresh_b_team.py
            prompt/coordination/B_TEAM
      - name: Refresh B-team from latest records with fast-forward lease
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'raft-b13-evidence-checkpoint'
          git config user.email 'raft-b13-evidence-checkpoint@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch -q --no-tags origin feature/android-native-port
            git reset --hard -q FETCH_HEAD
            python3 scripts/refresh_b_team.py
            git add -- prompt/coordination/B_TEAM/SUMMARY.md prompt/coordination/B_TEAM/snapshot.json
            if git diff --cached --quiet; then
              echo 'B13_SUMMARY_CHECKPOINT current=true'
              exit 0
            fi
            git commit -q -m 'coord(B13): regenerate B-team summary from current records'
            if git push --quiet origin HEAD:feature/android-native-port; then
              echo 'B13_SUMMARY_CHECKPOINT refreshed=true fast_forward=true'
              exit 0
            fi
            echo 'B13_SUMMARY_CHECKPOINT concurrent update, refresh and retry'
            sleep 1
          done
          echo 'B13_SUMMARY_CHECKPOINT blocked by concurrent updates, no force push' >&2
          exit 1
