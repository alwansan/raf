name: GFX139 complete synthetic 9-case 51-capture batch replay
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths:
      - '.github/workflows/gfxlab-multi139-full-batch-replay.yml'
      - 'gfxlab/tests/test_gfx139_full_batch_replay.py'
      - 'gfxlab/tools/gfx124_batch_pack.py'
      - 'gfxlab/tools/gfx124_batch_zip_audit.py'
      - 'gfxlab/tools/gfx137_deferred_semantic_audit.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfx139-full-batch-replay
  cancel-in-progress: false
jobs:
  full-batch-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-free PNG test dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Exercise real batch packer and owner ZIP audit on synthetic 9-case bundle
        run: python -m unittest -v gfxlab.tests.test_gfx139_full_batch_replay
