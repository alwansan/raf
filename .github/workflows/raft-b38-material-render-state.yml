name: B38 RENDER-002 Material draw-state parity (synthetic)
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/b38_material_render_state.py
      - tests/test_b38_material_render_state.py
      - .github/workflows/raft-b38-material-render-state.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raft-b38-render-state-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  b38-synthetic-render-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/b38_material_render_state.py
            scripts/b44_verify_material_colors.py
            tests/test_b38_material_render_state.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Check source-only render-state equivalence and fail-closed controls
        run: |
          python -m py_compile scripts/b38_material_render_state.py tests/test_b38_material_render_state.py
          python -m unittest discover -s tests -p 'test_b38_material_render_state.py' -v

# No original assets, decompiled sources, GPU, APK, private identity or secrets.
