name: Raft A2 original scene UI layout (CPU no LFS)
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-a2-scene-ui-layout.yml'
      - 'scripts/probe_a2_scene_ui_layout.py'
      - 'tests/test_probe_a2_scene_ui_layout.py'
      - 'scripts/probe_a2_canvas_scaler_monoscript.py'
      - 'tests/test_probe_a2_canvas_scaler_monoscript.py'
permissions:
  contents: read
concurrency:
  group: raft-a2-scene-ui-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  original-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
            Raft/Raft_Data/level0
            Raft/Raft_Data/level1
            Raft/Raft_Data/level2
            Raft/Raft_Data/level3
            Raft/Raft_Data/level4
            Raft/Raft_Data/level5
            Raft/Raft_Data/globalgamemanagers.assets
      - name: Synthetic scope and PPtr/geometry tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_probe_a2_scene_ui_layout.py' -v
          python3 -m py_compile scripts/probe_a2_scene_ui_layout.py
          python3 -m unittest discover -s tests -p 'test_probe_a2_canvas_scaler_monoscript.py' -v
          python3 -m py_compile scripts/probe_a2_canvas_scaler_monoscript.py
      - name: Install bounded original Unity serialized reader
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages --disable-pip-version-check 'UnityPy==1.23.0'
      - name: Verify 6 original Git blobs and native UI object structure
        run: |
          set -euo pipefail
          python3 -m scripts.probe_a2_scene_ui_layout --source Raft/Raft_Data
          python3 -m scripts.probe_a2_canvas_scaler_monoscript --source Raft/Raft_Data
          echo 'RAFT_A2_ORIGINAL_SCENE_ONLY unityRan=false originalLfsHydrated=false nativeBuildRan=false'
