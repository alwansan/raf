name: T3 RENDER-002 stage-local DXBC DCL vs SPIR-V resource-family census (synthetic)
on:
  push:
    branches:
      - feature/android-native-port
    paths:
      - scripts/t3_particle108_dcl_spv_family_census.py
      - tests/test_t3_particle108_dcl_spv_family_census.py
      - .github/workflows/raft-t3-particle108-dcl-spv-family-source-only.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t3-dcl-spv-family-sourcefree-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sourcefree:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
      - name: Compile and run stage-keyed privacy-safe DXBC vs SPV resource-family tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t3_particle108_dcl_spv_family_census.py tests/test_t3_particle108_dcl_spv_family_census.py
          python3 -m unittest discover -s tests -p 'test_t3_particle108_dcl_spv_family_census.py' -v
