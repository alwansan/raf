name: T3 RENDER-002 source-only Particle108 vendor delta contract tests
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-t3-particle108-postvendor-delta-tests.yml'
      - 'tests/test_t3_particle108_postvendor_delta.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t3-particle108-postvendor-contract-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-free-delta-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
      - name: Compile both private-report guards and execute source-free tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t3_particle108_postvendor_delta.py tests/test_t3_particle108_postvendor_delta.py
          python3 -m unittest discover -s tests -p 'test_t3_particle108_postvendor_delta.py' -v
          echo 'T3_PARTICLE108_SOURCE_FREE_DELTA_TESTS=passed;android_pixels=false'
