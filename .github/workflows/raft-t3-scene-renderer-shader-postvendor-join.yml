name: T3 RENDER-002 genuine original scene Shader48 to postvendor GUID Dummy priority
# DISTINCT experiment: original 6 pinned scenes' Renderer material-slot weights
# joined to W1 same-instance source Shader48 -> exact vendor-restored .shader GUID.
# NOT a repeat of vendor Material document counts and NOT phone draw calls.
# The genuine original run 42044249541 already settled this source/export
# question. Keep repeat of the expensive 12-owner export explicit/manual only.
on:
  workflow_dispatch:
  # Owner 2026-11-13 restore-first: run one source/authentic six-scene
  # Renderer priority recovery census; NEVER produce an XAPK in this job.
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-t3-scene-renderer-shader-postvendor-join.yml
      - scripts/gt_restore_first_shader_priority.py
      - scripts/b02_stage_texture_lineage.py
      - scripts/b21_stage_light_lineage.py
      - tests/test_gt_restore_first_shader_priority.py
permissions:
  contents: read
concurrency:
  group: raft-t3-genuine-original-scene-Shader48-postvendor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bounded-original-export-postvendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Checkout only B21 scripts/W1/B02 SHA-locked staging source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            android-port/Experiments/ExportLineage
            scripts
            tests
            config
      - name: Check disk budget and synthetic original/export parity tests
        run: |
          set -euo pipefail
          python3 -c "import shutil; assert shutil.disk_usage('.').free > 8 * 1024**3"
          python3 -m unittest discover -s tests -p 'test_t3_external_texture_lineage.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_external_texture_export.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_material_shader_same_export.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_original_renderer_shader_impact.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_source_renderer_shader_to_postvendor_export.py' -v
          python3 -m unittest discover -s tests -p 'test_gt_restore_first_shader_priority.py' -v
          python3 -m unittest discover -s tests -p 'test_b02_stage_texture_lineage.py' -v
          python3 -m unittest discover -s tests -p 'test_b21_stage_light_lineage.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_audit_exported_material_programs.py' -v
          python3 -m unittest discover -s tests -p 'test_restore_tmp_shaders.py' -v
          python3 -m unittest discover -s tests -p 'test_restore_postfx_shaders.py' -v
          python3 -m unittest discover -s tests -p 'test_restore_volumetric_shaders.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_particle108_postvendor_delta.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_original_material_shader_target.py' -v
          python3 -m unittest discover -s tests -p 'test_a13_exported_material_shader_guids.py' -v
          python3 -m unittest discover -s tests -p 'test_b21_stage_light_lineage.py' -v
          python3 -m unittest discover -s tests -p 'test_b21_compare_export_lights.py' -v
          python3 -m unittest discover -s tests -p 'test_b21_compare_light_owners.py' -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Obtain exact public AssetRipperCLI source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: nowl-it/AssetRipperCLI
          ref: 036098ab525a3f9f693dc101edeb21faad4d32d8
          path: ar-host
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            Source
      - name: Compile SHA-pinned optional W1+B02+B21 exporter in disposable public checkout
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b21"
          python3 -m scripts.b21_stage_light_lineage \
            --base-helper android-port/Experiments/ExportLineage/RaftExportLineage.cs \
            --destination "$RUNNER_TEMP/b21/RaftExportLineage.cs"
          python3 -m scripts.patch_export_lineage --tool-source ar-host --helper "$RUNNER_TEMP/b21/RaftExportLineage.cs"
          timeout 780s dotnet publish android-port/Experiments/ExportLineage/ExportLineage.csproj \
            -c Release -p:PublishAot=false -p:PublishTrimmed=false \
            -p:EnableTrimAnalyzer=false -p:EnableAotAnalyzer=false \
            --self-contained false -o "$RUNNER_TEMP/b21-compiled" \
            > "$RUNNER_TEMP/b21-build-public-tool.log" 2>&1 || {
              tail -60 "$RUNNER_TEMP/b21-build-public-tool.log"; exit 1;
            }
          dotnet "$RUNNER_TEMP/b21-compiled/ExportLineage.dll" --probe-tool > /dev/null
      - name: Checkout immutable ZIP2 NINE SMALL original serialized providers (no LFS)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: zip2-original
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/level0
            Raft/Raft_Data/level1
            Raft/Raft_Data/level2
            Raft/Raft_Data/level3
            Raft/Raft_Data/level4
            Raft/Raft_Data/level5
            Raft/Raft_Data/globalgamemanagers
            Raft/Raft_Data/globalgamemanagers.assets
            Raft/Raft_Data/sharedassets6.assets
            Raft/Raft_Data/sharedassets0.assets
            Raft/Raft_Data/resources.assets
      - name: Include exact plain original sharedassets1 provider with safe non-cone patterns
        run: |
          set -euo pipefail
          # sharedassets0 is a ZIP2 multipart directory; sharedassets1 is a
          # real plain asset. Cone sparse selectors cannot select a plain file.
          git -C zip2-original sparse-checkout set --no-cone -- \
            '/RAFT_FILE_MANIFEST.tsv' \
            '/Raft/Raft_Data/level0' '/Raft/Raft_Data/level1' \
            '/Raft/Raft_Data/level2' '/Raft/Raft_Data/level3' \
            '/Raft/Raft_Data/level4' '/Raft/Raft_Data/level5' \
            '/Raft/Raft_Data/globalgamemanagers' \
            '/Raft/Raft_Data/globalgamemanagers.assets' \
            '/Raft/Raft_Data/sharedassets6.assets' \
            '/Raft/Raft_Data/sharedassets0.assets/*' \
            '/Raft/Raft_Data/sharedassets1.assets' \
            '/Raft/Raft_Data/resources.assets/*'
          test -d zip2-original/Raft/Raft_Data/resources.assets
          test -f zip2-original/Raft/Raft_Data/sharedassets1.assets
          test -d zip2-original/Raft/Raft_Data/sharedassets0.assets
      - name: Reconstruct in temporary staging with exact per-file size and SHA256
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,os,json
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import ZIP2_SHA,stage
          from scripts.b21_scene_lightmap_links import PIN
          from scripts.a12_probe_original_blur_passes import SHADER_OWNERS
          from scripts.b04_restore_original_color_settings import ORIGINAL_SIZE,ORIGINAL_SHA256
          zip2=Path('zip2-original')
          assert subprocess.check_output(['git','-C',str(zip2),'rev-parse','HEAD'],text=True).strip()==ZIP2_SHA
          pins={'Raft_Data/'+name:v for name,v in PIN.items()}
          pins.update({
            'Raft_Data/globalgamemanagers':(ORIGINAL_SIZE,ORIGINAL_SHA256),
            'Raft_Data/globalgamemanagers.assets': SHADER_OWNERS['globalgamemanagers.assets'],
            'Raft_Data/sharedassets6.assets':SHADER_OWNERS['sharedassets6.assets'],
            'Raft_Data/sharedassets0.assets':SHADER_OWNERS['sharedassets0.assets'],
            'Raft_Data/sharedassets1.assets':SHADER_OWNERS['sharedassets1.assets'],
            'Raft_Data/resources.assets':SHADER_OWNERS['resources.assets']
          })
          result=stage(zip2,Path(os.environ['RUNNER_TEMP'])/'b21-original',pins)
          assert len(result['owners'])==12 and not result['lfs_used']
          print('RAFT_T3_TWELVE_ORIGINAL_PROVIDERS_AUTHENTICATED=12')
          PY
      - name: Install pinned original serialized reader and verify source Light population
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.23.0
          python3 - <<'PY'
          import os
          from pathlib import Path
          import UnityPy
          from scripts.b21_compare_export_lights import original_lights
          root=Path(os.environ['RUNNER_TEMP'])/'b21-original/Raft_Data'
          assert len(original_lights(root))==2
          objs=[o for f in ('globalgamemanagers.assets','sharedassets6.assets') for o in UnityPy.load(str(root/f)).objects]
          materials=sum(o.type.name=='Material' for o in objs)
          shaders=sum(o.type.name=='Shader' for o in objs)
          print(f'RAFT_B21_SMALL_EXPORT_GRAPH materials={materials} shaders={shaders} sourceLights=2')
          assert materials>0 and shaders>0, 'Bounded source lacks exporter required graph; do not attempt empty export'
          PY
      - name: Run one bounded genuine source export with THREE same-instance private traces
        env:
          DOTNET_PROCESSOR_COUNT: '2'
          RAFT_PRIVATE_EXPORT_LINEAGE: ${{ runner.temp }}/b21-w1-private.json
          RAFT_PRIVATE_EXPORT_TEXTURE_LINEAGE: ${{ runner.temp }}/b21-b02-private.json
          RAFT_PRIVATE_EXPORT_LIGHT_LINEAGE: ${{ runner.temp }}/b21-light-private.json
        run: |
          set -euo pipefail
          if timeout 540s dotnet "$RUNNER_TEMP/b21-compiled/ExportLineage.dll" \
               "$RUNNER_TEMP/b21-original" "$RUNNER_TEMP/b21-private-export" \
               > "$RUNNER_TEMP/b21-original-export-private.log" 2>&1; then
            test -s "$RAFT_PRIVATE_EXPORT_LINEAGE"
            test -s "$RAFT_PRIVATE_EXPORT_LIGHT_LINEAGE"
            echo 'RAFT_B21_BOUNDED_GAME_EXPORT_COMPLETED=true'
          else
            python3 - <<'PY'
          import os,json,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          raw=(root/'b21-original-export-private.log').read_text(errors='replace')
          report={'actual_export_completed':False,'tool_exception_categories':sorted(set(re.findall(r'\b(?:System|AssetRipper)\.[A-Za-z.]+Exception\b',raw))),
                  'trace_w1_created':(root/'b21-w1-private.json').is_file(),
                  'trace_light_created':(root/'b21-light-private.json').is_file(),
                  'private_log_bytes':len(raw.encode()),'android_render_executed':False}
          (root/'t3-shader-parity-safe.json').write_text(json.dumps(report,sort_keys=True))
          print('RAFT_B21_BOUNDED_EXPORT_INCONCLUSIVE '+json.dumps(report,sort_keys=True))
          PY
            exit 2
          fi
      - name: Prove all selected 41 Material shader source PPtrs, Shader48 trace and real Unity YAML/ShaderLab metadata
        run: |
          set -euo pipefail
          python3 -m scripts.t3_material_shader_same_export \
            --original "$RUNNER_TEMP/b21-original" \
            --project "$RUNNER_TEMP/b21-private-export/ExportedProject" \
            --w1-trace "$RUNNER_TEMP/b21-w1-private.json" \
            --b02-trace "$RUNNER_TEMP/b21-b02-private.json" \
            --out "$RUNNER_TEMP/t3-shader-parity-safe.json"
      - name: Audit actual authenticated bounded export BEFORE any vendor Shader restorers
        run: |
          set -euo pipefail
          python3 -m scripts.t3_audit_exported_material_programs \
            --project "$RUNNER_TEMP/b21-private-export/ExportedProject" \
            --out "$RUNNER_TEMP/t3-bounded-before-safe.json"
      - name: Privately snapshot original serialized Material and ShaderImporter metadata bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'b21-private-export/ExportedProject/Assets'
          snapshot={}
          for p in root.rglob('*'):
              if p.is_symlink():
                  raise RuntimeError('unsafe_original_export_symlink')
              if p.is_file() and (p.suffix=='.mat' or p.name.endswith('.shader.meta')):
                  rel=p.relative_to(root).as_posix()
                  if rel in snapshot:raise RuntimeError('duplicate_export_asset')
                  snapshot[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          if not snapshot or not any(p.endswith('.mat') for p in snapshot) or not any(p.endswith('.shader.meta') for p in snapshot):
              raise RuntimeError('insufficient_original_export_snapshot')
          (Path(os.environ['RUNNER_TEMP'])/'t3-original-export-private-snapshot.json').write_text(json.dumps(snapshot))
          print('T3_ORIGINAL_METADATA_SNAPSHOT_CREATED=true; values_private=true')
          PY
      - name: Classify exact genuine source Particle108 Shader48 before vendor restorers
        run: |
          set -euo pipefail
          python3 -m scripts.t3_particle108_shaderlab_export_quality \
            --original "$RUNNER_TEMP/b21-original" \
            --manifest zip2-original/RAFT_FILE_MANIFEST.tsv \
            --project "$RUNNER_TEMP/b21-private-export/ExportedProject" \
            --w1-trace "$RUNNER_TEMP/b21-w1-private.json" \
            --b02-trace "$RUNNER_TEMP/b21-b02-private.json" \
            --out "$RUNNER_TEMP/t3-particle108-prevendor-safe.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'t3-particle108-prevendor-safe.json').read_text())
          assert d['status']=='T3_ORIGINAL_PARTICLE108_REAL_SAMEEXPORT_SHADERLAB_CLASSIFIED'
          assert d['exported_ShaderLab_source_status']=='ACTUAL_DUMMY_SHADER_TEXT_EXPORTER'
          assert d['source_to_export_Shader48_trace_verified'] is True
          print('T3_SOURCE_PARTICLE108_ACTUAL_PREVENDOR_DUMMY=true')
          PY
      - name: Restore authentic TMP 3.0.6 Shader sources in disposable bounded export
        run: |
          set -euo pipefail
          if timeout 240s python3 -m scripts.restore_tmp_shaders \
             --project "$RUNNER_TEMP/b21-private-export/ExportedProject" \
             --backup "$RUNNER_TEMP/t3-private-tmp-backup" \
             > "$RUNNER_TEMP/t3-tmp-private.log" 2>&1; then
            echo 'T3_TMP_VENDOR_RESTORER=success'
          else
            echo 'T3_TMP_VENDOR_RESTORER=failed_safe; actual_export_postvendor_inconclusive=true'
            exit 2
          fi
      - name: Restore authentic PostFX v1 Shader sources in disposable bounded export
        run: |
          set -euo pipefail
          if timeout 240s python3 -m scripts.restore_postfx_shaders \
             --project "$RUNNER_TEMP/b21-private-export/ExportedProject" \
             --backup "$RUNNER_TEMP/t3-private-postfx-backup" \
             > "$RUNNER_TEMP/t3-postfx-private.log" 2>&1; then
            echo 'T3_POSTFX_VENDOR_RESTORER=success'
          else
            echo 'T3_POSTFX_VENDOR_RESTORER=failed_safe; actual_export_postvendor_inconclusive=true'
            exit 2
          fi
      - name: Restore authentic volumetric Shader sources in disposable bounded export
        run: |
          set -euo pipefail
          if timeout 240s python3 -m scripts.restore_volumetric_shaders \
             --project "$RUNNER_TEMP/b21-private-export/ExportedProject" \
             --backup "$RUNNER_TEMP/t3-private-volumetric-backup" \
             > "$RUNNER_TEMP/t3-volumetric-private.log" 2>&1; then
            echo 'T3_VOLUMETRIC_VENDOR_RESTORER=success'
          else
            echo 'T3_VOLUMETRIC_VENDOR_RESTORER=failed_safe; actual_export_postvendor_inconclusive=true'
            exit 2
          fi
      - name: Audit post-vendor Material-linked ShaderLab quality and exact original metadata preservation
        run: |
          set -euo pipefail
          python3 -m scripts.t3_audit_exported_material_programs \
            --project "$RUNNER_TEMP/b21-private-export/ExportedProject" \
            --out "$RUNNER_TEMP/t3-bounded-after-safe.json"
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])
          root=base/'b21-private-export/ExportedProject/Assets'
          before=json.loads((base/'t3-bounded-before-safe.json').read_text())
          after=json.loads((base/'t3-bounded-after-safe.json').read_text())
          original=json.loads((base/'t3-original-export-private-snapshot.json').read_text())
          all_preserved=all((root/rel).is_file() and not (root/rel).is_symlink() and
                             hashlib.sha256((root/rel).read_bytes()).hexdigest()==digest
                             for rel,digest in original.items())
          a,b=before['counts'],after['counts']
          same_material_contract=all(a[k]==b[k] for k in (
              'material_documents','material_docs_using_local_custom_Shader',
              'material_docs_using_Unity_builtin_Shader','material_docs_with_null_Shader',
              'material_docs_with_unknown_or_broken_Shader'))
          dummy_delta=a['material_docs_using_dummy_Shader']-b['material_docs_using_dummy_Shader']
          summary={
              'schema_version':1,'scope':'authentic_12_zip2_owner_bounded_export_then_TMP_PostFX_volumetric_only',
              'original_export_source_SHA_pinned':True,
              'vendor_restorers_all_success':True,
              'preexisting_material_and_shader_meta_byte_identical':bool(all_preserved),
              'material_reference_counts_unchanged':bool(same_material_contract),
              'pre_vendor_material_linked_dummy':a['material_docs_using_dummy_Shader'],
              'post_vendor_material_linked_dummy':b['material_docs_using_dummy_Shader'],
              'material_dummy_link_reduction':dummy_delta,
              'post_vendor_remaining_distinct_dummy_targets':b['distinct_dummy_Shader_targets_referenced'],
              'post_vendor_partial_subshader_linked_materials':b['material_docs_using_Shader_with_partial_subshader_program_coverage'],
              'post_vendor_shader_files_with_dummy_marker':b['shader_files_with_dummy_exporter_marker'],
              'full_native_post_restorer_executed':False,
              'original_Shader48_programs_authenticated_by_vendor_restore':False,
              'Unity_import_or_Android_Adreno_pixels_verified':False,
              'game_assets_modified':False,
              'status':'SOURCE_BOUNDED_VENDOR_RESTORE_DIAGNOSTIC_ONLY'
          }
          (base/'t3-bounded-delta-safe.json').write_text(json.dumps(summary,sort_keys=True,indent=2)+'\n')
          print('RAFT_T3_BOUNDED_POSTVENDOR_SHADER_COUNTS '+json.dumps(summary,sort_keys=True))
          if not all_preserved or not same_material_contract or dummy_delta<0:
              raise AssertionError('original_export_shader_restorer_contract_changed')
          PY
      - name: Join six true source scenes Renderer Shader48 slot use to same exporter postvendor GUID program
        run: |
          set -euo pipefail
          python3 -m scripts.t3_source_renderer_shader_to_postvendor_export \
            --original "$RUNNER_TEMP/b21-original" \
            --manifest zip2-original/RAFT_FILE_MANIFEST.tsv \
            --project "$RUNNER_TEMP/b21-private-export/ExportedProject" \
            --w1-trace "$RUNNER_TEMP/b21-w1-private.json" \
            --b02-trace "$RUNNER_TEMP/b21-b02-private.json" \
            --out "$RUNNER_TEMP/t3-scene-Shader48-postvendor-aggregate.json"
      - name: GT restoration FIRST - authenticate and privately rank the original high-impact Dummy Shader sources
        run: |
          set -euo pipefail
          # SHA-pinned six source scenes plus all selected original Material
          # and Shader48 owners have already been verified in this exact
          # AssetRipper/W1/B02 export, NOT name-matched from public strings.
          timeout 240s python3 -m scripts.gt_restore_first_shader_priority \
            --original "$RUNNER_TEMP/b21-original" \
            --manifest zip2-original/RAFT_FILE_MANIFEST.tsv \
            --project "$RUNNER_TEMP/b21-private-export/ExportedProject" \
            --w1-trace "$RUNNER_TEMP/b21-w1-private.json" \
            --b02-trace "$RUNNER_TEMP/b21-b02-private.json" \
            --private-queue "$RUNNER_TEMP/gt-921-original-shader-priority-PROPRIETARY.json" \
            --out "$RUNNER_TEMP/gt-restore-first-921-shader-priority-SAFE.json"
          python3 - <<'PY_GT_RESTORE_FIRST_QUEUE'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          safe=json.loads((root/"gt-restore-first-921-shader-priority-SAFE.json").read_text())
          queue=json.loads((root/"gt-921-original-shader-priority-PROPRIETARY.json").read_text())
          assert safe["status"]=="GT_RESTORE_FIRST_AUTHENTIC_SOURCE_RENDERER_SHADER_QUEUE"
          assert safe["same_instance_original_source_count"]==21
          assert safe["original_typed_renderer_material_slots"]==1633
          assert safe["same_instance_original_Shader48_export_trace_verified"] is True
          assert safe["source_original_6_scene_sha_authenticated"] is True
          assert len(queue["priority"])==21
          assert safe["private_source_ids_guids_or_asset_paths_published"] is False
          assert safe["source_original_DXBC_to_complete_ShaderLab_restored_by_queue"] is False
          assert safe["Unity_Editor_Android_or_Adreno_pixels_verified"] is False
          assert safe["highest_priority_dummy_original_renderer_slots"]<=921
          assert safe["full_770_dummy_Material_YAML_docs_not_equated_to_distinct_shaders"] is True
          print("GT_RESTORE_FIRST_REAL_SOURCE_QUEUE_PASSED source6scenes=true originalShader48=21 slots=1633 topDummySlots="+str(safe["highest_priority_dummy_original_renderer_slots"])+" noXAPK=true privateOriginalGUIDsPublished=false")
          PY_GT_RESTORE_FIRST_QUEUE
      - name: Remove private original Shader priority IDs/GUIDs after source census
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/gt-921-original-shader-priority-PROPRIETARY.json"
      - name: Verify same original Particle108 Shader48 after all three vendor restorers
        run: |
          set -euo pipefail
          python3 -m scripts.t3_particle108_shaderlab_export_quality \
            --original "$RUNNER_TEMP/b21-original" \
            --manifest zip2-original/RAFT_FILE_MANIFEST.tsv \
            --project "$RUNNER_TEMP/b21-private-export/ExportedProject" \
            --w1-trace "$RUNNER_TEMP/b21-w1-private.json" \
            --b02-trace "$RUNNER_TEMP/b21-b02-private.json" \
            --out "$RUNNER_TEMP/t3-particle108-postvendor-safe.json"
          python3 -m scripts.t3_particle108_postvendor_delta \
            --before "$RUNNER_TEMP/t3-particle108-prevendor-safe.json" \
            --after "$RUNNER_TEMP/t3-particle108-postvendor-safe.json" \
            --out "$RUNNER_TEMP/t3-particle108-vendor-delta-safe.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'t3-particle108-vendor-delta-safe.json').read_text())
          assert d['status']=='T3_AUTHENTIC_PARTICLE108_POSTVENDOR_DELTA_CLASSIFIED'
          assert d['source_original_particle_renderer_slots']==108
          assert d['same_original_Shader48_selected_from_same_export_W1_B02'] is True
          assert d['Unity_GPU_pixels_or_game_readiness_proven'] is False
          print('T3_PARTICLE108_POSTVENDOR_SOURCE_IDENTITY_DELTA='+d['interpretation'])
          PY
      - name: Publish ONLY safe aggregates, never staged game assets, original metadata, traces or vendor raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-6scene-authentic-Shader48-sameexport-postvendor-${{ github.run_id }}
          path: |
