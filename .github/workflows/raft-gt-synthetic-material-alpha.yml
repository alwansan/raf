name: GT synthetic Unity Vulkan material and alpha pixels (NO APK)

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Authored-only Unity validation to execute
        type: choice
        default: material-alpha
        options:
          - material-alpha
          - next23b-receipt
          - keyword-pixels
          - resource-bindings
          - resource-pixels
          - fft-coordinate
  push:
    branches: [feature/android-native-port]
    paths:
      - tools/synthetic_material_alpha/**
      - scripts/gt_synthetic_material_alpha.py
      - tests/test_gt_synthetic_material_alpha.py
      - .github/workflows/raft-gt-synthetic-material-alpha.yml

permissions:
  contents: read

concurrency:
  group: gt-synthetic-material-alpha-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  synthetic-pixels:
    if: github.ref == 'refs/heads/feature/android-native-port' && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[gt-next23b-receipt]') && !contains(github.event.head_commit.message, '[gt-keyword-pixels]') && !contains(github.event.head_commit.message, '[gt-resource-bindings]') && !contains(github.event.head_commit.message, '[gt-resource-pixels]') && !contains(github.event.head_commit.message, '[gt-fft-coordinate]')) || (github.event_name == 'workflow_dispatch' && inputs.probe == 'material-alpha'))
    runs-on: ubuntu-24.04
    environment: UNITY_LICENSE
    timeout-minutes: 30
    concurrency:
      group: raft-native-engine-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RAFT_ALPHA_IMAGE: raft-synthetic-alpha-unity:local
      RAFT_ALPHA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - name: Checkout only the five authored synthetic test files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/synthetic_material_alpha/
            /scripts/gt_synthetic_material_alpha.py
            /tests/test_gt_synthetic_material_alpha.py
            /.github/workflows/raft-gt-synthetic-material-alpha.yml
      - name: Verify pixel evidence gate and stage a fresh synthetic project
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_gt_synthetic_material_alpha.py -v
          python3 -m scripts.gt_synthetic_material_alpha stage --project synthetic-alpha-project
          mkdir synthetic-alpha-results
          test ! -e Raft
          test ! -e .gt-zip2
      - name: Require existing Unity activation inputs and disk budget
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [ -z "${UNITY_LICENSE:-}" ] && { [ -z "${UNITY_SERIAL:-}" ] || [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; }; then
            echo 'RAFT_SYNTHETIC_ALPHA activation_inputs_missing=true raster_not_run=true'
            exit 1
          fi
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 20971520
      - name: Prepare an ephemeral Unity image with software Vulkan
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/raft-alpha-docker"
          cat > "$RUNNER_TEMP/raft-alpha-docker/Dockerfile" <<'DOCKERFILE'
          FROM unityci/editor:ubuntu-2021.3.45f2-linux-il2cpp-3
          USER root
          RUN apt-get update -qq && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb xauth && \
              rm -rf /var/lib/apt/lists/*
          ENV VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          DOCKERFILE
          docker build --quiet --tag "$RAFT_ALPHA_IMAGE" "$RUNNER_TEMP/raft-alpha-docker"
          docker run --rm --entrypoint /bin/bash "$RAFT_ALPHA_IMAGE" -lc \
            'test -f "$VK_ICD_FILENAMES" && xvfb-run -a vulkaninfo --summary > /tmp/alpha-vulkaninfo.log 2>&1'
      - name: Render only the synthetic scene in Unity Vulkan
        id: render
        continue-on-error: true
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f2
          customImage: raft-synthetic-alpha-unity:local
          projectPath: synthetic-alpha-project
          targetPlatform: StandaloneLinux64
          buildMethod: SyntheticMaterialAlphaValidation.Run
          manualExit: true
          enableGpu: true
          versioning: None
          allowDirtyBuild: true
          dockerMemoryLimit: 6g
          dockerCpuLimit: 2
          customParameters: >-
            -force-vulkan -force-device-index 0 -job-worker-count 2
            -raftSyntheticAlphaRunId ${{ env.RAFT_ALPHA_RUN_ID }}
            -raftSyntheticAlphaReport /github/workspace/synthetic-alpha-results/raw.unity.json
      - name: Independently verify all 120 readback pixels and negative controls
        if: always() && steps.stage.outcome == 'success'
        env:
          RENDER_STEP_OUTCOME: ${{ steps.render.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" synthetic-alpha-results
          RAFT_ALPHA_EXIT=1
          if [ "$RENDER_STEP_OUTCOME" = success ]; then RAFT_ALPHA_EXIT=0; fi
          python3 -m scripts.gt_synthetic_material_alpha verify \
            --receipt synthetic-alpha-results/raw.unity.json \
            --out synthetic-alpha-results/verified.json \
            --run-id "$RAFT_ALPHA_RUN_ID" --exit-code "$RAFT_ALPHA_EXIT"
      - name: Retain only synthetic numeric receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-synthetic-material-alpha-${{ github.run_id }}
          path: synthetic-alpha-results/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only this run's synthetic project and container overlay
        if: always()
        shell: bash
        run: |
          if test -f synthetic-alpha-project/synthetic-alpha-fixture.json; then
            sudo rm -rf synthetic-alpha-project
          fi
          docker image rm "$RAFT_ALPHA_IMAGE" >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/raft-alpha-docker"

  next23b-receipt:
    if: github.ref == 'refs/heads/feature/android-native-port' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[gt-next23b-receipt]')) || (github.event_name == 'workflow_dispatch' && inputs.probe == 'next23b-receipt'))
    runs-on: ubuntu-24.04
    environment: UNITY_LICENSE
    timeout-minutes: 60
    concurrency:
      group: raft-native-engine-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GT_NEXT23B_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - name: Checkout source tools and authored fixture only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/*.py
            /scripts/gt_decode_smolv.cpp
            /tests/test_gt_next23b_route_provenance.py
            /tools/synthetic_material_alpha/next23b_receipt_probe.py
            /android-port/Experiments/GT/Editor/Next23bShaderValidation.cs
            /.github/workflows/raft-gt-synthetic-material-alpha.yml
      - name: Generate 1156 authored routes in a new empty project
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Raft
          test ! -e .gt-zip2
          python3 -B -m unittest discover -s tests -p test_gt_next23b_route_provenance.py -v
          python3 -B tools/synthetic_material_alpha/next23b_receipt_probe.py stage \
            --project synthetic-next23b-project --out synthetic-next23b-results/stage.json
      - name: Require existing activation inputs and disk budget
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "${UNITY_LICENSE:-}" ] && { [ -z "${UNITY_SERIAL:-}" ] || [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; }; then
            echo 'SYNTHETIC_NEXT23B activation_inputs_missing=true editor_not_run=true'
            exit 1
          fi
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 20971520
      - name: Run the published receipt producer in Unity Android Vulkan (AssetBundle only)
        id: compile
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f2
          projectPath: synthetic-next23b-project
          targetPlatform: Android
          buildMethod: RaftGT.Next23bShaderValidation.Validate
          manualExit: true
          versioning: None
          allowDirtyBuild: true
          dockerMemoryLimit: 10g
          dockerCpuLimit: 2
          customParameters: -job-worker-count 2
      - name: Verify actual receipt commitments and decode the authored Android Vulkan bundle
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" synthetic-next23b-project/ProbeResults
          python3 -m venv "$RUNNER_TEMP/gt-receipt-venv"
          "$RUNNER_TEMP/gt-receipt-venv/bin/python" -m pip install --disable-pip-version-check UnityPy==1.23.0 PyYAML==6.0.3
          "$RUNNER_TEMP/gt-receipt-venv/bin/python" -B tools/synthetic_material_alpha/next23b_receipt_probe.py verify \
            --project synthetic-next23b-project --out synthetic-next23b-results/receipt-verified.json \
            --run-id "$GT_NEXT23B_RUN_ID"
      - name: Require actual compiled VS and FS route coverage using the published full gate
        shell: bash
        run: |
          set -euo pipefail
          smolv="$RUNNER_TEMP/gt-synthetic-next23b-smolv"
          mkdir "$smolv"
          upstream=https://raw.githubusercontent.com/aras-p/smol-v/6303e979b59153ee7007fd14e06d3fed8687b64c/source
          curl -fsSL "$upstream/smolv.cpp" -o "$smolv/smolv.cpp"
          curl -fsSL "$upstream/smolv.h" -o "$smolv/smolv.h"
          c++ -std=c++11 -O2 -I"$smolv" scripts/gt_decode_smolv.cpp "$smolv/smolv.cpp" -o "$smolv/decode"
          project=synthetic-next23b-project
          "$RUNNER_TEMP/gt-receipt-venv/bin/python" -B -m scripts.gt_verify_921_shader_bundle \
            --bundle "$project/ProbeResults/Private/gt-next23b" \
            --source "$project/Assets/GTNext23b.shader" \
            --receipt "$project/ProbeResults/gt-next23b-unity-safe.json" \
            --smolv-decoder "$smolv/decode" --next23b \
            --engine-route-manifest "$project/Next23bEngineRoutes.json" \
            --source-variant-manifest "$project/SyntheticSourceManifest.json" \
            --out synthetic-next23b-results/full-verified.json
      - name: Retain only authored fixture, bundle and bounded receipts
        if: always() && steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gt-synthetic-next23b-receipt-${{ github.run_id }}
          path: |
            synthetic-next23b-results/*.json
            synthetic-next23b-project/Assets/GTNext23b.shader
            synthetic-next23b-project/Next23bEngineRoutes.json
            synthetic-next23b-project/SyntheticSourceManifest.json
            synthetic-next23b-project/ProbeResults/gt-next23b-unity-safe.json
            synthetic-next23b-project/ProbeResults/Private/gt-next23b
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only the authored test project
        if: always() && steps.stage.outcome == 'success'
        shell: bash
        run: |
          test -f synthetic-next23b-project/SyntheticSourceManifest.json
          sudo rm -rf synthetic-next23b-project

  keyword-pixels:
    if: github.ref == 'refs/heads/feature/android-native-port' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[gt-keyword-pixels]') && !contains(github.event.head_commit.message, '[gt-next23b-receipt]')) || (github.event_name == 'workflow_dispatch' && inputs.probe == 'keyword-pixels'))
    runs-on: ubuntu-24.04
    environment: UNITY_LICENSE
    timeout-minutes: 30
    concurrency:
      group: raft-native-engine-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GT_KEYWORD_IMAGE: raft-synthetic-keyword-unity:local
      GT_KEYWORD_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - name: Checkout only authored keyword probe and router
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/synthetic_material_alpha/keyword_pixels.py
            /tools/synthetic_material_alpha/SyntheticKeywordPixelValidation.cs
            /scripts/gt_runtime_keyword_contract.py
            /.github/workflows/raft-gt-synthetic-material-alpha.yml
      - name: Verify oracle and stage a new authored keyword project
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Raft
          test ! -e .gt-zip2
          python3 -B tools/synthetic_material_alpha/keyword_pixels.py selftest
          python3 -B tools/synthetic_material_alpha/keyword_pixels.py stage \
            --project synthetic-keyword-project --out synthetic-keyword-results/stage.json
      - name: Require existing activation inputs and disk budget
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "${UNITY_LICENSE:-}" ] && { [ -z "${UNITY_SERIAL:-}" ] || [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; }; then
            echo 'GT_KEYWORD_PIXELS activation_inputs_missing=true raster_not_run=true'
            exit 1
          fi
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 20971520
      - name: Prepare an ephemeral Unity image with software Vulkan
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/raft-keyword-docker"
          cat > "$RUNNER_TEMP/raft-keyword-docker/Dockerfile" <<'DOCKERFILE'
          FROM unityci/editor:ubuntu-2021.3.45f2-linux-il2cpp-3
          USER root
          RUN apt-get update -qq && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb xauth && \
              rm -rf /var/lib/apt/lists/*
          ENV VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          DOCKERFILE
          docker build --quiet --tag "$GT_KEYWORD_IMAGE" "$RUNNER_TEMP/raft-keyword-docker"
          docker run --rm --entrypoint /bin/bash "$GT_KEYWORD_IMAGE" -lc \
            'test -f "$VK_ICD_FILENAMES" && xvfb-run -a vulkaninfo --summary > /tmp/keyword-vulkaninfo.log 2>&1'
      - name: Render actual authored material keyword transitions in Unity Vulkan
        id: render
        continue-on-error: true
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f2
          customImage: raft-synthetic-keyword-unity:local
          projectPath: synthetic-keyword-project
          targetPlatform: StandaloneLinux64
          buildMethod: SyntheticKeywordPixelValidation.Run
          manualExit: true
          enableGpu: true
          versioning: None
          allowDirtyBuild: true
          dockerMemoryLimit: 6g
          dockerCpuLimit: 2
          customParameters: >-
            -force-vulkan -force-device-index 0 -job-worker-count 2
            -gtKeywordRunId ${{ env.GT_KEYWORD_RUN_ID }}
            -gtKeywordReport /github/workspace/synthetic-keyword-results/raw.unity.json
      - name: Independently verify all readback pixels and wrong-route controls
        if: always() && steps.stage.outcome == 'success'
        env:
          RENDER_STEP_OUTCOME: ${{ steps.render.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" synthetic-keyword-results
          test -f synthetic-keyword-results/raw.unity.json
          code=1
          if [ "$RENDER_STEP_OUTCOME" = success ]; then code=0; fi
          python3 -B tools/synthetic_material_alpha/keyword_pixels.py verify \
            --receipt synthetic-keyword-results/raw.unity.json \
            --out synthetic-keyword-results/verified.json \
            --run-id "$GT_KEYWORD_RUN_ID" --exit-code "$code"
      - name: Retain only authored numeric receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-synthetic-keyword-pixels-${{ github.run_id }}
          path: synthetic-keyword-results/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only the authored keyword test project and image
        if: always()
        shell: bash
        run: |
          if test -f synthetic-keyword-project/synthetic-keyword-fixture.json; then
            sudo rm -rf synthetic-keyword-project
          fi
          docker image rm "$GT_KEYWORD_IMAGE" >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/raft-keyword-docker"

  resource-bindings:
    if: github.ref == 'refs/heads/feature/android-native-port' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[gt-resource-bindings]')) || (github.event_name == 'workflow_dispatch' && inputs.probe == 'resource-bindings'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GT_RESOURCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - name: Checkout only source functions and authored resource fixtures
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/gt_resource_register_contract.py
            /scripts/w1_rebind_depth_resources.py
            /scripts/gt_original_921_resource_rebind.py
            /scripts/gt_original_921_all_variants.py
            /scripts/gt_original_921_shaderlab.py
            /scripts/a12_shader_parameter_decode.py
            /scripts/b25_foam_cb_namebridge.py
            /tests/test_gt_resource_register_contract.py
            /tests/test_w1_depth_resource_rebinding.py
            /tools/synthetic_material_alpha/resource_register_probe.py
            /.github/workflows/raft-gt-synthetic-material-alpha.yml
      - name: Run authored declaration and legacy depth regressions
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Raft
          test ! -e .gt-zip2
          mkdir resource-register-results
          python3 -B -m unittest discover -s tests -p test_gt_resource_register_contract.py -v 2>&1 | tee resource-register-results/source-tests.log
          python3 -B -m unittest discover -s tests -p test_w1_depth_resource_rebinding.py -v 2>&1 | tee resource-register-results/depth-tests.log
      - name: Install public HLSL and SPIR-V compiler tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends glslang-tools spirv-tools
      - name: Execute production metadata-to-SPIR-V resource equivalence probe
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/synthetic_material_alpha/resource_register_probe.py \
            --out resource-register-results/compiler.json --run-id "$GT_RESOURCE_RUN_ID"
      - name: Retain only authored resource proof and unit test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-synthetic-resource-bindings-${{ github.run_id }}
          path: resource-register-results/*
          if-no-files-found: warn
          retention-days: 14

  resource-pixels:
    if: github.ref == 'refs/heads/feature/android-native-port' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[gt-resource-pixels]') && !contains(github.event.head_commit.message, '[gt-next23b-receipt]')) || (github.event_name == 'workflow_dispatch' && inputs.probe == 'resource-pixels'))
    runs-on: ubuntu-24.04
    environment: UNITY_LICENSE
    timeout-minutes: 30
    concurrency:
      group: raft-native-engine-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GT_RESOURCE_PIXEL_IMAGE: raft-synthetic-resource-unity:local
      GT_RESOURCE_PIXEL_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - name: Checkout only authored resource probes and source helpers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/synthetic_material_alpha/resource_pixels.py
            /tools/synthetic_material_alpha/SyntheticResourcePixelValidation.cs
            /tools/synthetic_material_alpha/resource_register_probe.py
            /scripts/gt_resource_register_contract.py
            /scripts/w1_rebind_depth_resources.py
            /scripts/gt_original_921_resource_rebind.py
            /scripts/gt_original_921_all_variants.py
            /scripts/gt_original_921_shaderlab.py
            /scripts/a12_shader_parameter_decode.py
            /scripts/b25_foam_cb_namebridge.py
            /tests/test_gt_resource_register_contract.py
            /tests/test_w1_depth_resource_rebinding.py
            /.github/workflows/raft-gt-synthetic-material-alpha.yml
      - name: Install public HLSL and SPIR-V compiler tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends glslang-tools spirv-tools
      - name: Test oracle and generate project from verified resource metadata HLSL
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Raft
          test ! -e .gt-zip2
          python3 -B -m unittest discover -s tests -p test_gt_resource_register_contract.py -v
          python3 -B -m unittest discover -s tests -p test_w1_depth_resource_rebinding.py -v
          python3 -B tools/synthetic_material_alpha/resource_pixels.py selftest
          python3 -B tools/synthetic_material_alpha/resource_pixels.py stage \
            --project synthetic-resource-project --results synthetic-resource-results \
            --run-id "$GT_RESOURCE_PIXEL_RUN_ID"
      - name: Require existing activation inputs and disk budget
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "${UNITY_LICENSE:-}" ] && { [ -z "${UNITY_SERIAL:-}" ] || [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; }; then
            echo 'GT_RESOURCE_PIXEL_PIXELS activation_inputs_missing=true raster_not_run=true'
            exit 1
          fi
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 20971520
      - name: Prepare an ephemeral Unity image with software Vulkan
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/raft-resource-pixel-docker"
          cat > "$RUNNER_TEMP/raft-resource-pixel-docker/Dockerfile" <<'DOCKERFILE'
          FROM unityci/editor:ubuntu-2021.3.45f2-linux-il2cpp-3
          USER root
          RUN apt-get update -qq && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb xauth && \
              rm -rf /var/lib/apt/lists/*
          ENV VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          DOCKERFILE
          docker build --quiet --tag "$GT_RESOURCE_PIXEL_IMAGE" "$RUNNER_TEMP/raft-resource-pixel-docker"
          docker run --rm --entrypoint /bin/bash "$GT_RESOURCE_PIXEL_IMAGE" -lc \
            'test -f "$VK_ICD_FILENAMES" && xvfb-run -a vulkaninfo --summary > /tmp/resource-vulkaninfo.log 2>&1'
      - name: Render actual authored metadata-generated texture and sampler shader in Unity Vulkan
        id: render
        continue-on-error: true
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f2
          customImage: raft-synthetic-resource-unity:local
          projectPath: synthetic-resource-project
          targetPlatform: StandaloneLinux64
          buildMethod: SyntheticResourcePixelValidation.Run
          manualExit: true
          enableGpu: true
          versioning: None
          allowDirtyBuild: true
          dockerMemoryLimit: 6g
          dockerCpuLimit: 2
          customParameters: >-
            -force-vulkan -force-device-index 0 -job-worker-count 2
            -gtResourceRunId ${{ env.GT_RESOURCE_PIXEL_RUN_ID }}
            -gtResourceReport /github/workspace/synthetic-resource-results/raw.unity.json
      - name: Verify compiler byte commitments and every material readback pixel
        if: always() && steps.stage.outcome == 'success'
        env:
          RENDER_STEP_OUTCOME: ${{ steps.render.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" synthetic-resource-results
          test -f synthetic-resource-results/raw.unity.json
          code=1
          if [ "$RENDER_STEP_OUTCOME" = success ]; then code=0; fi
          python3 -B tools/synthetic_material_alpha/resource_pixels.py verify \
            --results synthetic-resource-results \
            --out synthetic-resource-results/verified.json \
            --run-id "$GT_RESOURCE_PIXEL_RUN_ID" --exit-code "$code"
      - name: Retain only authored generated shader and numeric receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-synthetic-resource-pixels-${{ github.run_id }}
          path: synthetic-resource-results/*
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only the authored resource test project and image
        if: always()
        shell: bash
        run: |
          if test -f synthetic-resource-project/synthetic-resource-fixture.json; then
            sudo rm -rf synthetic-resource-project
          fi
          docker image rm "$GT_RESOURCE_PIXEL_IMAGE" >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/raft-resource-pixel-docker"

  fft-coordinate:
    if: github.ref == 'refs/heads/feature/android-native-port' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[gt-fft-coordinate]')) || (github.event_name == 'workflow_dispatch' && inputs.probe == 'fft-coordinate'))
    runs-on: ubuntu-24.04
    environment: UNITY_LICENSE
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [dxc, hlslcc]
    concurrency:
      group: raft-native-engine-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GT_FFT_MODE: ${{ matrix.mode }}
      GT_FFT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ matrix.mode }}
    steps:
      - name: Checkout only authored tools and source-side FFT validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/*.py
            /scripts/gt_decode_smolv.cpp
            /tools/synthetic_material_alpha/fft_coordinate_probe.py
            /android-port/Experiments/GT/Editor/FFTUtilitiesShaderValidation.cs
            /.github/workflows/raft-gt-synthetic-material-alpha.yml
      - name: Install public compilers and bundle inspection dependencies
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Raft
          test ! -e .gt-zip2
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends glslang-tools spirv-tools
          glslangValidator --version
          spirv-val --version
          python3 -m venv "$RUNNER_TEMP/gt-fft-venv"
          "$RUNNER_TEMP/gt-fft-venv/bin/python" -m pip install --disable-pip-version-check UnityPy==1.23.0 PyYAML==6.0.3
          smolv="$RUNNER_TEMP/gt-fft-authored-smolv"
          mkdir "$smolv"
          upstream=https://raw.githubusercontent.com/aras-p/smol-v/6303e979b59153ee7007fd14e06d3fed8687b64c/source
          curl -fsSL "$upstream/smolv.cpp" -o "$smolv/smolv.cpp"
          curl -fsSL "$upstream/smolv.h" -o "$smolv/smolv.h"
          c++ -std=c++11 -O2 -I"$smolv" scripts/gt_decode_smolv.cpp "$smolv/smolv.cpp" -o "$smolv/decode"
      - name: Compile authored sample and fetch cases with deliberate wrong-coordinate controls
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/synthetic_material_alpha/fft_coordinate_probe.py selftest
          python3 -B tools/synthetic_material_alpha/fft_coordinate_probe.py stage \
            --project synthetic-fft-coordinate-project --results synthetic-fft-coordinate-results \
            --mode "$GT_FFT_MODE" --run-id "$GT_FFT_RUN_ID"
          cat synthetic-fft-coordinate-results/cpu.json
      - name: Require existing activation inputs and disk budget
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "${UNITY_LICENSE:-}" ] && { [ -z "${UNITY_SERIAL:-}" ] || [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; }; then
            echo 'GT_FFT_COORDINATE activation_inputs_missing=true editor_not_run=true'
            exit 1
          fi
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 20971520
      - name: Compile seven authored coordinate passes in Unity Android Vulkan AssetBundle only
        id: compile
        continue-on-error: true
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f2
          projectPath: synthetic-fft-coordinate-project
          targetPlatform: Android
          buildMethod: RaftGT.FFTUtilitiesShaderValidation.Validate
          manualExit: true
          versioning: None
          allowDirtyBuild: true
          dockerMemoryLimit: 10g
          dockerCpuLimit: 2
          customParameters: -job-worker-count 2
      - name: Decode actual seven-pass bundle and validate fragment image operation families
        if: always() && steps.stage.outcome == 'success'
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          project=synthetic-fft-coordinate-project
          results=synthetic-fft-coordinate-results
          if test -d "$project/ProbeResults"; then
            sudo chown -R "$(id -u):$(id -g)" "$project/ProbeResults"
          fi
          code=1
          if [ "$COMPILE_OUTCOME" = success ]; then code=0; fi
          set +e
          "$RUNNER_TEMP/gt-fft-venv/bin/python" -B tools/synthetic_material_alpha/fft_coordinate_probe.py verify \
            --project "$project" --results "$results" \
            --decoder "$RUNNER_TEMP/gt-fft-authored-smolv/decode" \
            --mode "$GT_FFT_MODE" --run-id "$GT_FFT_RUN_ID" --exit-code "$code"
          verify_exit=$?
          set -e
          if test ! -f "$results/unity.json" && test -f "$project/ProbeResults/gt-fft-utilities-unity-safe.json"; then
            cp "$project/ProbeResults/gt-fft-utilities-unity-safe.json" "$results/unity.json"
          fi
          if test ! -f "$results/authored.bundle" && test -f "$project/ProbeResults/Private/gt-fft-utilities"; then
            cp "$project/ProbeResults/Private/gt-fft-utilities" "$results/authored.bundle"
          fi
          if test -f "$results/verified.json"; then cat "$results/verified.json"; fi
          exit "$verify_exit"
      - name: Retain only authored diagnostics and bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-authored-fft-coordinate-${{ matrix.mode }}-${{ github.run_id }}
          path: synthetic-fft-coordinate-results/*
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only authored test project
        if: always()
        shell: bash
        run: |
          if test -f synthetic-fft-coordinate-project/CandidateCompiler.txt; then
            sudo rm -rf synthetic-fft-coordinate-project
          fi
