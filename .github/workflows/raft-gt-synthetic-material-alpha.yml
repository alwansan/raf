          assert r['status']=='completed' and r['conclusion']=='failure'
          for mode,ident,digest in [('dxc',15171100631,'eedccb8afa34ca208604c111b232ea42bb7f91c0cab01d409253d7a4e8ee5972'),('hlslcc',15170637402,'95afbce3a5afb5073023caae625aabeda5b2fa7ed74c4c08aa025fc180558d6c')]:
              a=json.loads((root/(mode+'-meta.json')).read_text())
