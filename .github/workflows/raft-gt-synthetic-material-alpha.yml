  submesh-route-pixels:
    if: github.ref == 'refs/heads/feature/android-native-port' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[gt-submesh-route-pixels]')) || (github.event_name == 'workflow_dispatch' && inputs.probe == 'submesh-route-pixels'))
    runs-on: ubuntu-24.04
    environment: UNITY_LICENSE
    timeout-minutes: 30
    concurrency:
      group: raft-native-engine-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RAFT_SUBMESH_ROUTE_IMAGE: raft-submesh-route-unity:local
      RAFT_SUBMESH_ROUTE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - name: Checkout only authored submesh raster probe and oracle
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/synthetic_material_alpha/SyntheticSubmeshRouteValidation.cs
            /tools/synthetic_material_alpha/AuthoredRouteA.shader
            /tools/synthetic_material_alpha/AuthoredRouteB.shader
            /scripts/gt_imported_alpha_pixels.py
            /scripts/gt_synthetic_material_alpha.py
            /scripts/gt_submesh_route_pixels.py
            /tests/test_gt_submesh_route_pixels.py
            /.github/workflows/raft-gt-synthetic-material-alpha.yml
      - name: Verify pixel evidence gate and stage a fresh synthetic project
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir submesh-route-results
          python3 -m unittest discover -s tests -p test_gt_submesh_route_pixels.py -v 2>&1 | tee submesh-route-results/oracle-tests.log
          python3 -m scripts.gt_submesh_route_pixels stage --project submesh-route-project
          touch submesh-route-project/synthetic-alpha-fixture.json
          test ! -e Raft
          test ! -e .gt-zip2
      - name: Require existing Unity activation inputs and disk budget
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [ -z "${UNITY_LICENSE:-}" ] && { [ -z "${UNITY_SERIAL:-}" ] || [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; }; then
            echo 'RAFT_SYNTHETIC_ALPHA activation_inputs_missing=true raster_not_run=true'
            exit 1
          fi
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 20971520
      - name: Prepare an ephemeral Unity image with software Vulkan
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/raft-submesh-route-docker"
          cat > "$RUNNER_TEMP/raft-submesh-route-docker/Dockerfile" <<'DOCKERFILE'
          FROM unityci/editor:ubuntu-2021.3.45f2-linux-il2cpp-3
          USER root
          RUN apt-get update -qq && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb xauth && \
              rm -rf /var/lib/apt/lists/*
          ENV VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          DOCKERFILE
          docker build --quiet --tag "$RAFT_SUBMESH_ROUTE_IMAGE" "$RUNNER_TEMP/raft-submesh-route-docker"
          docker run --rm --entrypoint /bin/bash "$RAFT_SUBMESH_ROUTE_IMAGE" -lc \
            'test -f "$VK_ICD_FILENAMES" && xvfb-run -a vulkaninfo --summary > /tmp/alpha-vulkaninfo.log 2>&1'
      - name: Render only the synthetic scene in Unity Vulkan
        id: render
        continue-on-error: true
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f2
          customImage: raft-submesh-route-unity:local
          projectPath: submesh-route-project
          targetPlatform: StandaloneLinux64
          buildMethod: SyntheticSubmeshRouteValidation.Run
          manualExit: true
          enableGpu: true
          versioning: None
          allowDirtyBuild: true
          dockerMemoryLimit: 6g
          dockerCpuLimit: 2
          customParameters: >-
            -force-vulkan -force-device-index 0 -job-worker-count 2
            -raftSubmeshRouteRunId ${{ env.RAFT_SUBMESH_ROUTE_RUN_ID }}
            -raftSubmeshRouteReport /github/workspace/submesh-route-results/raw.unity.json
      - name: Independently verify 16 imported and 320 Vulkan pixels plus actual route identities
        if: always() && steps.stage.outcome == 'success'
        env:
          RENDER_STEP_OUTCOME: ${{ steps.render.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" submesh-route-results
          RAFT_SUBMESH_ROUTE_EXIT=1
          if [ "$RENDER_STEP_OUTCOME" = success ]; then RAFT_SUBMESH_ROUTE_EXIT=0; fi
          python3 -m scripts.gt_submesh_route_pixels verify \
            --receipt submesh-route-results/raw.unity.json \
            --out submesh-route-results/verified.json \
            --run-id "$RAFT_SUBMESH_ROUTE_RUN_ID" --exit-code "$RAFT_SUBMESH_ROUTE_EXIT"
      - name: Retain only synthetic numeric receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-submesh-route-pixels-${{ github.run_id }}
          path: submesh-route-results/*
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only this run's synthetic project and container overlay
        if: always()
        shell: bash
        run: |
          if test -f submesh-route-project/synthetic-alpha-fixture.json; then
            sudo rm -rf submesh-route-project
          fi
          docker image rm "$RAFT_SUBMESH_ROUTE_IMAGE" >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/raft-submesh-route-docker"


