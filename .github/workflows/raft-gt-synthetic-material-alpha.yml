          printf '%s\n' 'eedccb8afa34ca208604c111b232ea42bb7f91c0cab01d409253d7a4e8ee5972  authored-fft-inputs/dxc.zip' '95afbce3a5afb5073023caae625aabeda5b2fa7ed74c4c08aa025fc180558d6c  authored-fft-inputs/hlslcc.zip' | sha256sum -c -
      - name: Install public bundle and SPIR-V inspection tools
