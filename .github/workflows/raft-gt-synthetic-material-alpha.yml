          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert sorted(z.namelist())==["oracle-tests.log","raw.unity.json","verified.json"]
              raw=z.read("raw.unity.json")
              assert sha256(raw).hexdigest()=="74076d174a9b9e9c41316dcf00688fed29cd5bb32a76ee05ea96eccc80b227b1"
              original=json.loads(z.read("verified.json"))
