          curl -fsSL "$upstream/smolv.cpp" -o "$smolv/smolv.cpp"
          curl -fsSL "$upstream/smolv.h" -o "$smolv/smolv.h"
          c++ -std=c++11 -O2 -I"$smolv" scripts/gt_decode_smolv.cpp "$smolv/smolv.cpp" -o "$smolv/decode"
      - name: Validate every referenced module and inspect actual keyword table without changing original gate
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[gt-fft-bundle-gate]')
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gt-fft-replay-venv/bin/python" -B tools/synthetic_material_alpha/fft_coordinate_artifact_replay.py \
            --decoder "$RUNNER_TEMP/gt-fft-replay-smolv/decode" \
            --run-id-prefix 45935871773-1-5b6f8f21627269d946aa549cd7055384914cdf82 \
            --dxc authored-fft-inputs/dxc.zip --dxc-sha256 eedccb8afa34ca208604c111b232ea42bb7f91c0cab01d409253d7a4e8ee5972 --dxc-job-success 0 \
            --hlslcc authored-fft-inputs/hlslcc.zip --hlslcc-sha256 95afbce3a5afb5073023caae625aabeda5b2fa7ed74c4c08aa025fc180558d6c --hlslcc-job-success 0 \
            --out authored-fft-replay-results/diagnostic.json
      - name: Execute strict authored-only G4 gate and actual binary negative controls
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gt-fft-bundle-gate]')
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gt-fft-replay-venv/bin/python" -B tools/synthetic_material_alpha/fft_bundle_gate_probe.py \
            --decoder "$RUNNER_TEMP/gt-fft-replay-smolv/decode" \
            --dxc authored-fft-inputs/dxc.zip --hlslcc authored-fft-inputs/hlslcc.zip \
            --out authored-fft-replay-results/gate.json
      - name: Retain authored diagnostic report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-authored-fft-coordinate-replay-${{ github.run_id }}
          path: authored-fft-replay-results/*.json
          if-no-files-found: warn
          retention-days: 14


  particle-alpha-provenance:
    if: github.ref == 'refs/heads/feature/android-native-port' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[gt-particle-alpha-provenance]')) || (github.event_name == 'workflow_dispatch' && inputs.probe == 'particle-alpha-provenance'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout source-only diagnostics and authored tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/*.py
            /tests/test_gt_particle108_export_alpha_diagnostic.py
            /tests/test_gt_particle108_alpha_provenance.py
            /tests/test_b05_verify_material_texenv_bindings.py
            /tests/test_verify_exported_material_texture_links.py
            /.github/workflows/raft-gt-synthetic-material-alpha.yml
      - name: Install public YAML and image decoders
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Raft
          test ! -e .gt-zip2
          python3 -m venv "$RUNNER_TEMP/gt-alpha-provenance"
          "$RUNNER_TEMP/gt-alpha-provenance/bin/python" -m pip install --disable-pip-version-check Pillow==11.3.0 PyYAML==6.0.3
      - name: Execute authored YAML PNG pointer and alpha regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir alpha-provenance-results
          py="$RUNNER_TEMP/gt-alpha-provenance/bin/python"
          for test_file in test_gt_particle108_export_alpha_diagnostic.py test_gt_particle108_alpha_provenance.py test_b05_verify_material_texenv_bindings.py test_verify_exported_material_texture_links.py; do
            test -f "tests/$test_file"
            "$py" -B -m unittest discover -s tests -p "$test_file" -v 2>&1 | tee "alpha-provenance-results/$test_file.log"
          done
          "$py" -B - <<'PY'
          import json,os,re
          from pathlib import Path
          root=Path('alpha-provenance-results')
          counts={}
          for p in sorted(root.glob('*.log')):
              data=p.read_text()
              m=re.search(r'^Ran (\d+) tests? in ', data, re.M)
              assert m and int(m[1])>0 and re.search(r'^OK$',data,re.M)
              counts[p.name]=int(m[1])
          assert len(counts)==4
          result=dict(status="PASS_AUTHORED_PARTICLE108_ALPHA_POINTER_PROVENANCE",
              run_id=os.environ["GITHUB_RUN_ID"],head=os.environ["GITHUB_SHA"],
              test_counts=counts,total_tests=sum(counts.values()),
              actual_authored_Material_YAML_and_PNG_decoded=True,
              original_source_readers_mocked_in_integration_tests=True,
              original_assets_read=False,original_alpha_loss_proven=False,
              Unity_or_Android_pixels_verified=False,original_game_fire_repaired=False,
              XAPK_requested=False)
          (root/'report.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print(json.dumps(result,sort_keys=True))
          PY
      - name: Retain only authored test logs and aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-particle-alpha-provenance-${{ github.run_id }}
          path: alpha-provenance-results/*
          if-no-files-found: warn
          retention-days: 14

  imported-alpha-pixels:
    if: github.ref == 'refs/heads/feature/android-native-port' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[gt-imported-alpha-pixels]')) || (github.event_name == 'workflow_dispatch' && inputs.probe == 'imported-alpha-pixels'))
    runs-on: ubuntu-24.04
    environment: UNITY_LICENSE
    timeout-minutes: 30
    concurrency:
      group: raft-native-engine-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RAFT_IMPORTED_ALPHA_IMAGE: raft-imported-alpha-unity:local
      RAFT_IMPORTED_ALPHA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - name: Checkout only authored PNG import probe and oracle
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/synthetic_material_alpha/SyntheticImportedAlphaValidation.cs
            /tools/synthetic_material_alpha/SyntheticMaterialAlpha.shader
            /scripts/gt_synthetic_material_alpha.py
            /scripts/gt_imported_alpha_pixels.py
            /tests/test_gt_imported_alpha_pixels.py
            /.github/workflows/raft-gt-synthetic-material-alpha.yml
      - name: Verify pixel evidence gate and stage a fresh synthetic project
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir imported-alpha-results
          python3 -m unittest discover -s tests -p test_gt_imported_alpha_pixels.py -v 2>&1 | tee imported-alpha-results/oracle-tests.log
          python3 -m scripts.gt_imported_alpha_pixels stage --project imported-alpha-project
          test ! -e Raft
          test ! -e .gt-zip2
      - name: Require existing Unity activation inputs and disk budget
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [ -z "${UNITY_LICENSE:-}" ] && { [ -z "${UNITY_SERIAL:-}" ] || [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; }; then
            echo 'RAFT_SYNTHETIC_ALPHA activation_inputs_missing=true raster_not_run=true'
            exit 1
          fi
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 20971520
      - name: Prepare an ephemeral Unity image with software Vulkan
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/raft-imported-alpha-docker"
          cat > "$RUNNER_TEMP/raft-imported-alpha-docker/Dockerfile" <<'DOCKERFILE'
          FROM unityci/editor:ubuntu-2021.3.45f2-linux-il2cpp-3
          USER root
          RUN apt-get update -qq && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb xauth && \
              rm -rf /var/lib/apt/lists/*
          ENV VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          DOCKERFILE
          docker build --quiet --tag "$RAFT_IMPORTED_ALPHA_IMAGE" "$RUNNER_TEMP/raft-imported-alpha-docker"
          docker run --rm --entrypoint /bin/bash "$RAFT_IMPORTED_ALPHA_IMAGE" -lc \
            'test -f "$VK_ICD_FILENAMES" && xvfb-run -a vulkaninfo --summary > /tmp/alpha-vulkaninfo.log 2>&1'
      - name: Render only the synthetic scene in Unity Vulkan
        id: render
        continue-on-error: true
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f2
          customImage: raft-imported-alpha-unity:local
          projectPath: imported-alpha-project
          targetPlatform: StandaloneLinux64
          buildMethod: SyntheticImportedAlphaValidation.Run
          manualExit: true
          enableGpu: true
          versioning: None
          allowDirtyBuild: true
          dockerMemoryLimit: 6g
          dockerCpuLimit: 2
          customParameters: >-
            -force-vulkan -force-device-index 0 -job-worker-count 2
            -raftImportedAlphaRunId ${{ env.RAFT_IMPORTED_ALPHA_RUN_ID }}
            -raftImportedAlphaReport /github/workspace/imported-alpha-results/raw.unity.json
      - name: Independently verify all 192 imported and 192 rendered RGBA pixels
        if: always() && steps.stage.outcome == 'success'
        env:
          RENDER_STEP_OUTCOME: ${{ steps.render.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" imported-alpha-results
          RAFT_IMPORTED_ALPHA_EXIT=1
          if [ "$RENDER_STEP_OUTCOME" = success ]; then RAFT_IMPORTED_ALPHA_EXIT=0; fi
          python3 -m scripts.gt_imported_alpha_pixels verify \
            --receipt imported-alpha-results/raw.unity.json \
            --out imported-alpha-results/verified.json \
            --run-id "$RAFT_IMPORTED_ALPHA_RUN_ID" --exit-code "$RAFT_IMPORTED_ALPHA_EXIT"
      - name: Retain only synthetic numeric receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-imported-alpha-pixels-${{ github.run_id }}
          path: imported-alpha-results/*
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only this run's synthetic project and container overlay
        if: always()
        shell: bash
        run: |
          if test -f imported-alpha-project/synthetic-alpha-fixture.json; then
            sudo rm -rf imported-alpha-project
          fi
          docker image rm "$RAFT_IMPORTED_ALPHA_IMAGE" >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/raft-imported-alpha-docker"


