          assert j["baseline"]["counts"]["material_valid_keyword_entries_matched"]==8
          assert j["baseline"]["counts"]["material_invalid_keyword_entries_matched"]==4
          assert j["baseline"]["counts"]["material_disabled_pass_entries_matched"]==4
          assert sum(c.get("V3_material_value_gate_passed",False) for c in j["counterfactuals"].values())==6
          assert j["baseline"]["selected_same_route_material_values_verified"] is True
          assert j["baseline"]["counts"]["complete_material_value_bound_renderer_routes"]==2
          assert j["baseline"]["counts"]["complete_material_value_bound_submesh_routes"]==4
          assert all(j["baseline"]["counts"]["material_"+kind+"_slots_matched"]==8 for kind in ("color","float","int"))
          assert sum(c.get("V2_vertex_identity_gate_passed",False) for c in j["counterfactuals"].values())==5
          assert j["baseline"]["selected_same_route_vertex_and_UV_bytes_verified"] is True
          assert j["baseline"]["counts"]["complete_vertex_byte_bound_renderer_routes"]==2
          assert j["baseline"]["counts"]["complete_vertex_byte_bound_submesh_routes"]==4
          assert j["original_assets_read"] is False
          tests={}
          for p in sorted(root.glob("test_*.log")):
              s=p.read_text()
              m=re.search(r"^Ran (\d+) tests? in ",s,re.M)
              assert m and int(m[1])>0 and re.search(r"^OK$",s,re.M)
              tests[p.name]=int(m[1])
          assert len(tests)==7
          report=dict(status="PASS_AUTHORED_ACTUAL_EXPORT_TEXTURE_PAYLOAD_ROUTE_GATE",
              run_id=os.environ["GITHUB_RUN_ID"],head=os.environ["GITHUB_SHA"],
              test_counts=tests,total_regression_tests=sum(tests.values()),
              actual_exported_documents=j["actual_exported_documents"],
              actual_native_scene_files=j["actual_native_scene_files"],
              complete_submesh_routes=j["baseline"]["counts"]["complete_submesh_material_identity_routes"],
              counterfactual_count=j["counterfactual_count"],
              same_route_vertex_bytes_verified=True,UV_decoded_values_or_GPU_verified=False,
              same_route_material_values_verified=True,shader_property_runtime_semantics_verified=False,
              same_route_material_keyword_pass_state_verified=True,active_shader_variant_or_runtime_keyword_scope_verified=False,
              native_inline_RGBA32_texture_payload_bytes_verified=True,texture_sampler_import_colorspace_or_GPU_verified=False,
              complete_texture_bound_renderers=j["baseline"]["counts"]["complete_texture_payload_bound_renderer_routes"],
              complete_texture_bound_submeshes=j["baseline"]["counts"]["complete_texture_payload_bound_submesh_routes"],
              texture_payload_slots=j["baseline"]["counts"]["texture_payload_slots_matched"],
              texture_payload_bytes_per_route=j["baseline"]["counts"]["texture_payload_bytes_matched_per_route"],
              texture_mip_levels_per_route=j["baseline"]["counts"]["texture_mip_levels_matched_per_route"],
              V4_pass_V5_reject_controls=7,
              complete_keyword_bound_renderers=j["baseline"]["counts"]["complete_material_keyword_bound_renderer_routes"],
              complete_keyword_bound_submeshes=j["baseline"]["counts"]["complete_material_keyword_bound_submesh_routes"],
              keyword_pass_entries={kind:j["baseline"]["counts"]["material_"+kind+"_entries_matched"] for kind in ("valid_keyword","invalid_keyword","disabled_pass")},
              V3_pass_V4_reject_controls=6,
              complete_value_bound_renderers=j["baseline"]["counts"]["complete_material_value_bound_renderer_routes"],
              complete_value_bound_submeshes=j["baseline"]["counts"]["complete_material_value_bound_submesh_routes"],
              material_value_slots={kind:j["baseline"]["counts"]["material_"+kind+"_slots_matched"] for kind in ("color","float","int")},
              V2_pass_V3_reject_controls=5,
              complete_byte_bound_renderers=j["baseline"]["counts"]["complete_vertex_byte_bound_renderer_routes"],
              complete_byte_bound_submeshes=j["baseline"]["counts"]["complete_vertex_byte_bound_submesh_routes"],
              original_assets_read=False,original_serialized_source_verified=False,
              Unity_render_executed=False,XAPK=False)
          (root/"report.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print(json.dumps(report,sort_keys=True))
          PY
      - name: Retain only public-tool build and aggregate route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-authored-texture-payload-route-join-${{ github.run_id }}
          path: authored-scene-results/*
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only authored fixture tree
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/gt-authored-scene-fixture"
