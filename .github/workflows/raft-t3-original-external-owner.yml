name: T3 RENDER-002 original SHA-pinned external Texture dependency resolution
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-t3-original-external-owner.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t3-original-external-provider-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-provider-resolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
      - name: Run synthetic original fileID dependency mismatch controls
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t3_external_texture_lineage.py' -v
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: zip2-original
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/sharedassets6.assets
      - name: Stage exact original one-owner byte SHA from ZIP2
        run: |
          set -euo pipefail
          test "$(git -C zip2-original rev-parse HEAD)" = 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import stage
          from scripts.b05_verify_material_texenv_bindings import B05_SMALL_OWNER_PINS
          pins={"Raft_Data/sharedassets6.assets":B05_SMALL_OWNER_PINS["sharedassets6.assets"]}
          report=stage(Path("zip2-original"),Path(os.environ["RUNNER_TEMP"])/"t3-selected-original",pins)
          assert len(report["owners"])==1 and report["verified_bytes"]==6607272 and not report["lfs_used"]
          print("RAFT_T3_SOURCE_BYTE_SHA_AUTHENTICATED=1")
          PY
      - name: Authenticate original external-owner dependency mapping for 25 links
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.23.0
          python3 -m scripts.t3_external_texture_lineage \
            --source "$RUNNER_TEMP/t3-selected-original" \
            --manifest zip2-original/RAFT_FILE_MANIFEST.tsv \
            --out "$RUNNER_TEMP/t3-external-provider-counts.json"
      - name: Save only safe aggregate public dependency counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-external-provider-index-${{ github.run_id }}
          path: ${{ runner.temp }}/t3-external-provider-counts.json
          retention-days: 7
          if-no-files-found: ignore
