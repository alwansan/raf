name: T1 WATER-001 Unity 2021 Mesa Vulkan ICD image discriminator (source-free)

on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-t1-sourcefree-mesa-vulkan-overlay.yml

permissions:
  contents: read

concurrency:
  group: t1-unity-mesa-vulkan-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sourcefree-lavapipe-editor:
    runs-on: ubuntu-24.04
    environment: UNITY_LICENSE
    timeout-minutes: 40
    concurrency:
      group: raft-native-engine-${{ github.ref }}
      cancel-in-progress: false
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      DEBIAN_FRONTEND: noninteractive
      CLI_SHA256: 1de550a620ee92e05e920b6db7d431621440b60b2577f04b4a997dc92a58cb0a
      T1_BASE_IMAGE: unityci/editor:ubuntu-2021.3.45f2-linux-il2cpp-3
      T1_DERIVED_IMAGE: t1-fft-unity2021-lavapipe:local
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Verify activation input exists without disclosing secret value
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [ -z "${UNITY_LICENSE:-}" ] && {
             [ -z "${UNITY_SERIAL:-}" ] || [ -z "${UNITY_EMAIL:-}" ] ||
             [ -z "${UNITY_PASSWORD:-}" ]; }; then
            echo 'RAFT_T1_MESA_VULKAN_INPUT activation_inputs_missing=true original_data_acquired=false'
            exit 1
          fi
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 20971520
          echo 'RAFT_T1_MESA_VULKAN_INPUT synthetic_only=true original_game_assets=false'
      - name: Checkout only source-free authored test source and static fixtures
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
            android-port/Experiments/T1
      - name: Validate synthetic fixture and exact NUnit verdict controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_t1_vulkan_editor_smoke_gate.py -v
          python3 -m unittest discover -s tests -p test_t1_unity_vulkan_cli_failure_classifier.py -v
          python3 -m unittest discover -s tests -p test_t1_sourcefree_unity_fixture.py -v
          python3 -m scripts.t1_sourcefree_unity_fixture --project t1-vulkan-mesa-sourcefree
          # Separate 2-test license control: no Vulkan assertion or custom
          # parameters. This distinguishes image activation from graphics API.
          python3 -m scripts.t1_sourcefree_unity_fixture --project t1-mesa-license-control
          # Orthogonal ABI control: same image, only ICD env injection.
          python3 -m scripts.t1_sourcefree_unity_fixture --project t1-mesa-envonly-control
          cp android-port/Experiments/T1/T1SourceFreeVulkanBackendTests.cs \
            t1-vulkan-mesa-sourcefree/Assets/Tests/Editor/T1SourceFreeVulkanBackendTests.cs
          test "$(find t1-vulkan-mesa-sourcefree -name '*.compute' -type f | wc -l)" = 1
          test "$(find t1-vulkan-mesa-sourcefree -name '*.cs' -type f | wc -l)" = 2
          test ! -e t1-vulkan-mesa-sourcefree/Assets/T1OriginalDerived
      - name: Authenticate exact GameCI CLI v0.1.72 release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t1-mesa-cli"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/game-ci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz" \
            --output "$RUNNER_TEMP/t1-mesa-cli.tar.gz"
          echo "$CLI_SHA256  $RUNNER_TEMP/t1-mesa-cli.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/t1-mesa-cli.tar.gz" -C "$RUNNER_TEMP/t1-mesa-cli"
          find "$RUNNER_TEMP/t1-mesa-cli" -type f -name game-ci -print -quit > "$RUNNER_TEMP/t1-mesa-cli-exe.txt"
          test -s "$RUNNER_TEMP/t1-mesa-cli-exe.txt"
          chmod +x "$(cat "$RUNNER_TEMP/t1-mesa-cli-exe.txt")"
          echo 'RAFT_T1_MESA_VULKAN_CLI pinned_v0_1_72_sha_verified=true'
      - name: Inspect original Unity2021 container Vulkan loader and Mesa ICD (no license or Raft)
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$T1_BASE_IMAGE" > "$RUNNER_TEMP/t1-base-docker-pull.log" 2>&1 || {
            echo 'RAFT_T1_MESA_VULKAN_IMAGE base_image_pull_failed=true'
            exit 1
          }
          docker run --rm --entrypoint /bin/bash "$T1_BASE_IMAGE" -lc '
            if ldconfig -p 2>/dev/null | grep -q "libvulkan.so.1"; then
              echo "RAFT_T1_MESA_VULKAN_IMAGE baseline_vulkan_loader=true"
            else
              echo "RAFT_T1_MESA_VULKAN_IMAGE baseline_vulkan_loader=false"
            fi
            if test -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json; then
              echo "RAFT_T1_MESA_VULKAN_IMAGE baseline_mesa_lavapipe_icd=true"
            else
              echo "RAFT_T1_MESA_VULKAN_IMAGE baseline_mesa_lavapipe_icd=false"
            fi
          '
      - name: Build disposable Unity2021 container overlay with software Vulkan ICD
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/t1-vulkan-overlay.Dockerfile" <<'DOCKERFILE'
          FROM unityci/editor:ubuntu-2021.3.45f2-linux-il2cpp-3
          USER root
          RUN apt-get update -qq && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                libvulkan1 mesa-vulkan-drivers vulkan-tools && \
              rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          if ! docker build --quiet \
            --file "$RUNNER_TEMP/t1-vulkan-overlay.Dockerfile" \
            --tag "$T1_DERIVED_IMAGE" "$RUNNER_TEMP" \
            > "$RUNNER_TEMP/t1-vulkan-image-build.log" 2>&1; then
            echo 'RAFT_T1_MESA_VULKAN_IMAGE ephemeral_software_icd_build_failed=true'
            exit 1
          fi
          echo 'RAFT_T1_MESA_VULKAN_IMAGE overlay_build=true original_raft_data=false'
      - name: Require a real Mesa lavapipe physical Vulkan device in the derived image
        shell: bash
        run: |
          set -euo pipefail
          if ! docker run --rm --entrypoint /bin/bash \
              --env VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
              "$T1_DERIVED_IMAGE" -lc '
                 set -e
                 test -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
                 vulkaninfo --summary > /tmp/t1-vulkaninfo-private.log 2>&1
               ' > "$RUNNER_TEMP/t1-image-vulkaninfo.log" 2>&1; then
            echo 'RAFT_T1_MESA_VULKAN_IMAGE lavapipe_icd_or_vulkan_enumeration_failed=true'
            exit 1
          fi
          echo 'RAFT_T1_MESA_VULKAN_IMAGE sourcefree_vulkan_loader_enumerated=true'
      - name: First prove derived image can activate Unity without any Vulkan flags
        shell: bash
        run: |
          set -euo pipefail
          set +x
          cli="$(cat "$RUNNER_TEMP/t1-mesa-cli-exe.txt")"
          set +e
          timeout 800s "$cli" test --docker --dockerShmSize=1025m --engine=unity \
            t1-mesa-license-control --testPlatforms=editmode --engineVersion=2021.3.45f2 \
            --customImage="$T1_DERIVED_IMAGE" \
            --artifactsPath=t1-mesa-license-control-results \
            > "$RUNNER_TEMP/t1-mesa-license-control-private.log" 2>&1
          rc=$?
          set -e
          python3 -m scripts.t1_unity_vulkan_cli_failure_classifier \
            --log "$RUNNER_TEMP/t1-mesa-license-control-private.log" --process-exit "$rc"
          sudo chown -R "$(id -u):$(id -g)" \
            t1-mesa-license-control t1-mesa-license-control-results || true
          python3 -m scripts.t1_gameci_private_result_gate \
            --stage synthetic --exit-code "$rc" \
            --result t1-mesa-license-control-results/editmode-results.xml
          echo 'RAFT_T1_MESA_VULKAN_LICENSE_CONTROL derived_image_Unity2021_2of2=true forced_vulkan=false original_data=false'
          sudo rm -rf t1-mesa-license-control t1-mesa-license-control-results
          rm -f "$RUNNER_TEMP/t1-mesa-license-control-private.log"
      - name: Verify ICD environment injection alone does not break licensed Unity
        shell: bash
        run: |
          set -euo pipefail
          set +x
          cli="$(cat "$RUNNER_TEMP/t1-mesa-cli-exe.txt")"
          set +e
          timeout 800s "$cli" test --docker --dockerShmSize=1025m --engine=unity \
            t1-mesa-envonly-control --testPlatforms=editmode --engineVersion=2021.3.45f2 \
            --customImage="$T1_DERIVED_IMAGE" \
            --dockerEnv="VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" \
            --artifactsPath=t1-mesa-envonly-control-results \
            > "$RUNNER_TEMP/t1-mesa-envonly-control-private.log" 2>&1
          rc=$?
          set -e
          python3 -m scripts.t1_unity_vulkan_cli_failure_classifier \
            --log "$RUNNER_TEMP/t1-mesa-envonly-control-private.log" --process-exit "$rc"
          sudo chown -R "$(id -u):$(id -g)" \
            t1-mesa-envonly-control t1-mesa-envonly-control-results || true
          python3 -m scripts.t1_gameci_private_result_gate \
            --stage synthetic --exit-code "$rc" \
            --result t1-mesa-envonly-control-results/editmode-results.xml
          echo 'RAFT_T1_MESA_VULKAN_ENVONLY license_2of2=true icd_env_injected=true force_flag=false original_data=false'
          sudo rm -rf t1-mesa-envonly-control t1-mesa-envonly-control-results
          rm -f "$RUNNER_TEMP/t1-mesa-envonly-control-private.log"
      - name: Verify forced Vulkan alone supports exact synthetic GPU math

        shell: bash
        run: |
          set -euo pipefail
          set +x
          cli="$(cat "$RUNNER_TEMP/t1-mesa-cli-exe.txt")"
          set +e
          timeout 1100s "$cli" test --docker --dockerShmSize=1025m --engine=unity \
            t1-vulkan-mesa-sourcefree --testPlatforms=editmode --engineVersion=2021.3.45f2 \
            --customImage="$T1_DERIVED_IMAGE" \
            --customParameters=-force-vulkan \
            --artifactsPath=t1-mesa-sourcefree-test-results \
            > "$RUNNER_TEMP/t1-mesa-vulkan-unity-private.log" 2>&1
          rc=$?
          set -e
          # Inspect the CLI's private stdout/stderr BEFORE always-cleanup.
          # Emit only approved categorical flags and exit status, never log text.
          python3 -m scripts.t1_unity_vulkan_cli_failure_classifier \
            --log "$RUNNER_TEMP/t1-mesa-vulkan-unity-private.log" --process-exit "$rc"
          sudo chown -R "$(id -u):$(id -g)" \
            t1-vulkan-mesa-sourcefree t1-mesa-sourcefree-test-results || true
          python3 -m scripts.t1_vulkan_editor_smoke_gate \
            --xml t1-mesa-sourcefree-test-results/editmode-results.xml --editor-exit "$rc"
      - name: Erase temporary Docker layers, Unity source-free project and local logs
        if: always()
        shell: bash
        run: |
          sudo rm -rf t1-vulkan-mesa-sourcefree t1-mesa-sourcefree-test-results \
            t1-mesa-license-control t1-mesa-license-control-results \
            t1-mesa-envonly-control t1-mesa-envonly-control-results
          docker image rm "$T1_DERIVED_IMAGE" >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/t1-mesa-cli" "$RUNNER_TEMP/t1-mesa-cli.tar.gz" \
             "$RUNNER_TEMP/t1-mesa-cli-exe.txt" "$RUNNER_TEMP/t1-vulkan-overlay.Dockerfile" \
             "$RUNNER_TEMP/t1-image-vulkaninfo.log" "$RUNNER_TEMP/t1-vulkan-image-build.log" \
             "$RUNNER_TEMP/t1-base-docker-pull.log" "$RUNNER_TEMP/t1-mesa-vulkan-unity-private.log" \
             "$RUNNER_TEMP/t1-mesa-license-control-private.log" \
             "$RUNNER_TEMP/t1-mesa-envonly-control-private.log"
