name: Raft A15 in-run ShaderLab diagnostic lexical audit (CPU only)

on:
  push:
    branches:
      - feature/android-native-port
    paths:
      - scripts/audit_render_input_contracts.py
      - tests/test_a15_render_contract_lexical.py
      - .github/workflows/raft-a15-render-lexical-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raft-a15-render-lexical-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  lexical:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: A15 synthetic actual-auditor regression cases
        run: python3 -m unittest discover -s tests -p 'test_a15_render_contract_lexical.py' -v
      - name: Earlier ShaderLab identity contract controls
        run: python3 -m unittest discover -s tests -p 'test_a9_builtin_shader_identity.py' -v
