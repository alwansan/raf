name: GT actual authored external PNG and keyword state (NO original assets)
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-gt-authored-external-png-keywords.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-external-png-keywords:
    if: github.ref == 'refs/heads/feature/android-native-port'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_PROCESSOR_COUNT: '2'
    steps:
      - name: Checkout authored-only code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/*.py
            /tools/gt_authored_mesh_binary/witness.py
            /tools/gt_authored_mesh_actual_export/witness.py
            /tools/gt_authored_serialized_renderer_route/witness.py
            /tools/gt_authored_external_pptr_route/
            /tools/gt_authored_external_png_keywords/
            /clients/GT/sessions/20261127-authored-external-pptr-route/actual-evidence-46018334469.zip
            /tests/test_gt_material_route_keyword_state.py
            /tests/test_gt_imported_png_route_pixels.py
            /tests/test_gt_texture_route_payload.py
            /android-port/Experiments/ExportLineage/
            /tests/test_gt_original_mesh_source_storage.py
            /tests/test_gt_mesh_document_stream_identity.py
            /tests/test_gt_mesh_yaml_unique_mapping.py
            /tests/test_compare_exported_mesh_geometry.py
            /tests/test_gt_verify_original_mesh_export.py
            /tests/test_gt_mesh_vertex_payload.py
            /tests/test_gt_renderer_submesh_routes.py
            /tests/test_gt_material_route_values.py
            /.github/workflows/raft-gt-authored-external-png-keywords.yml
      - name: Replay retained actual export and prepare distinct nonempty keyword and texture bytes
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = alwansan/raf
          test ! -e Raft
          test ! -e .gt-zip2
          mkdir png-keyword-evidence
          python3 -m venv "$RUNNER_TEMP/gt-png-keyword-python"
          py="$RUNNER_TEMP/gt-png-keyword-python/bin/python"
          "$py" -m pip install --disable-pip-version-check UnityPy==1.23.0 PyYAML==6.0.3 Pillow==11.3.0
          "$py" -m pip freeze | tee png-keyword-evidence/tools.log
          PYTHONPATH="$PWD" "$py" -B -W error tools/gt_authored_external_png_keywords/witness.py replay --archive clients/GT/sessions/20261127-authored-external-pptr-route/actual-evidence-46018334469.zip --out png-keyword-evidence/replay 2>&1 | tee png-keyword-evidence/replay.log
          PYTHONPATH="$PWD" "$py" -B -W error tools/gt_authored_external_png_keywords/witness.py prepare --out png-keyword-evidence/case 2>&1 | tee png-keyword-evidence/prepare.log
      - name: Earlier geometry, material, keyword and PNG route regressions
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/gt-png-keyword-python/bin/python"
          for f in test_gt_original_mesh_source_storage.py test_gt_mesh_document_stream_identity.py test_gt_mesh_yaml_unique_mapping.py test_compare_exported_mesh_geometry.py test_gt_verify_original_mesh_export.py test_gt_mesh_vertex_payload.py test_gt_renderer_submesh_routes.py test_gt_material_route_values.py test_gt_material_route_keyword_state.py test_gt_imported_png_route_pixels.py; do
            test -f "tests/$f"
            "$py" -B -W error -m unittest discover -s tests -p "$f" -v 2>&1 | tee "png-keyword-evidence/$f.log"
          done
          "$py" -B - <<'PY'
          import json,re
          from pathlib import Path
          root=Path("png-keyword-evidence")
          tests={}
          for p in sorted(root.glob("test_*.py.log")):
              log=p.read_text()
              count=re.search(r"^Ran (\d+) tests? in ",log,re.M)
              assert count and int(count[1])>0 and re.search(r"^OK$",log,re.M),p.name
              tests[p.name]=int(count[1])
          assert len(tests)==10 and sum(v for k,v in tests.items() if k not in ("test_gt_material_route_keyword_state.py.log","test_gt_imported_png_route_pixels.py.log"))==95
          (root/"regressions.json").write_text(json.dumps(tests,indent=2)+"\n")
          print("GT_PRIOR_REGRESSIONS_PASS",sum(tests.values()))
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Checkout pinned public exporter source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: nowl-it/AssetRipperCLI
          ref: 036098ab525a3f9f693dc101edeb21faad4d32d8
          path: ar-host
          persist-credentials: false
          lfs: false
          sparse-checkout: Source
      - name: Build actual exporter with isolated same-reference trace
        run: |
          set -euo pipefail
          test ! -e Raft
          test ! -e .gt-zip2
          test "$(git -C ar-host rev-parse HEAD)" = 036098ab525a3f9f693dc101edeb21faad4d32d8
          git -C ar-host rev-parse HEAD > png-keyword-evidence/public-exporter-head.txt
          py="$RUNNER_TEMP/gt-png-keyword-python/bin/python"
          "$py" -m scripts.patch_export_lineage --tool-source ar-host --helper android-port/Experiments/ExportLineage/RaftExportLineage.cs --mesh-lineage --renderer-lineage
          PYTHONPATH="$PWD" "$py" -B tools/gt_authored_external_pptr_route/witness.py patch-host --root "$PWD" --cs "$PWD/tools/gt_authored_external_pptr_route/RaftAuthoredExternalPPtrRoute.cs"
          sha256sum ar-host/Source/AssetRipper.Export.UnityProjects/{RaftExportLineage,RaftAuthoredExternalPPtrRoute,ProjectExporter}.cs android-port/Experiments/ExportLineage/Program.cs > png-keyword-evidence/host-sha256.txt
          dotnet --info > png-keyword-evidence/dotnet.log
          dotnet publish android-port/Experiments/ExportLineage/ExportLineage.csproj -c Release -p:PublishAot=false -p:PublishTrimmed=false -p:EnableTrimAnalyzer=false -p:EnableAotAnalyzer=false --self-contained false -o "$RUNNER_TEMP/gt-png-keyword-host" > png-keyword-evidence/build.log 2>&1 || { tail -100 png-keyword-evidence/build.log; exit 1; }
      - name: Load actual multi-owner binaries and export prefabs
        run: |
          set -euo pipefail
          root="$PWD/png-keyword-evidence/case"
          RAFT_PRIVATE_EXPORT_LINEAGE="$root/export-trace.json" RAFT_PRIVATE_EXPORT_MESH_LINEAGE="$root/mesh-trace.json" RAFT_PRIVATE_EXPORT_RENDERER_LINEAGE="$root/renderer-trace.json" RAFT_PRIVATE_EXPORT_TEXTURE_LINEAGE=1 timeout 120s dotnet "$RUNNER_TEMP/gt-png-keyword-host/ExportLineage.dll" "$root/source" "$RUNNER_TEMP/gt-png-keyword-output" "$root" 2>&1 | tee "$root/export.log"
      - name: Retain actual authored documents and run unchanged V4 and V8 consumers
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/gt-png-keyword-python/bin/python"
          PYTHONPATH="$PWD" "$py" -B -W error tools/gt_authored_external_png_keywords/witness.py verify --out png-keyword-evidence/case --project "$RUNNER_TEMP/gt-png-keyword-output/ExportedProject" 2>&1 | tee png-keyword-evidence/verify.log
      - name: Preserve bounded authored evidence on success or failure
        if: always()
        run: |
          python3 - <<'PY'
          import base64,hashlib,zipfile
          from pathlib import Path
          root=Path("png-keyword-evidence"); root.mkdir(exist_ok=True)
          selected=[p for p in root.glob("case/**/*") if p.is_file()]
          selected += [p for p in root.glob("replay/**/*") if p.is_file()]
          selected+= [p for p in root.glob("*.log") if p.name!="build.log"]
          selected+= [p for p in (root/"regressions.json",root/"public-exporter-head.txt",root/"host-sha256.txt") if p.is_file()]
          assert len(selected)<=150 and sum(p.stat().st_size for p in selected)<=1024*1024
          dest=root/"permanent-authored-evidence.zip"
          with zipfile.ZipFile(dest,"w",compression=zipfile.ZIP_DEFLATED) as z:
              for p in sorted(set(selected)):
                  assert not p.is_symlink()
                  z.write(p,p.relative_to(root).as_posix())
          data=dest.read_bytes()
          assert len(data)<=128*1024
          print("GT_PERMANENT_EVIDENCE_SHA",len(data),hashlib.sha256(data).hexdigest())
          b64=base64.b64encode(data).decode("ascii")
          for i in range(0,len(b64),2048):
              print("GT_PERMANENT_EVIDENCE_B64",i//2048,b64[i:i+2048])
          PY
      - name: Upload exact authored inputs and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gt-external-png-keywords-${{ github.run_id }}
          path: png-keyword-evidence/
          if-no-files-found: warn
          retention-days: 14
