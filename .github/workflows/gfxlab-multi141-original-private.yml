name: GFX141 original 9-case private Android APK build
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths:
      - '.github/workflows/gfxlab-multi141-original-private.yml'
      - 'gfxlab/tools/gfx141_stage_original.py'
      - 'gfxlab/tools/gfx141_compose_original.py'
      - 'gfxlab/tools/gfx141_compile_shell.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfx141-original-private-build
  cancel-in-progress: false
jobs:
  original-source-private:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: source-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/resources.assets/*
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/sharedassets6.assets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned original shader toolchain and Mesa
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgles2 libgl1-mesa-dri
          tool_root="$RUNNER_TEMP/gfx141-tools"
          mkdir -p "$tool_root"
          while read -r path sha; do
            file="$tool_root/$(basename "$path")"
            curl -fsSL --max-time 60 --retry 2 "https://deb.debian.org/debian/$path" -o "$file"
            printf '%s  %s\n' "$sha" "$file" | sha256sum --check
            dpkg-deb -x "$file" "$tool_root/root"
          done < gfxlab/toolchains/debian13-shader-tools-amd64.sha256
          printf '%s\n' "$tool_root/root/usr/bin" >> "$GITHUB_PATH"
          printf 'LD_LIBRARY_PATH=%s\n' "$tool_root/root/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check UnityPy==1.25.4 Pillow==11.3.0 numpy==2.3.5
          test "$(git -C source-zip2 rev-parse HEAD)" = '15964ea8f246b6e076ce26b60931ee2e1a9a2385'
      - name: Build the actual source-free Android runner shell
        run: bash gfxlab/tools/gfx141_compile_shell.sh
      - name: Reconstruct original Shader48 models textures and 51 Mesa references privately
        run: python -m gfxlab.tools.gfx141_stage_original --zip2 source-zip2 --private "$RUNNER_TEMP/gfx141-private"
      - name: Sign original private APK and attest integrity (no public APK)
        shell: bash
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          python -m gfxlab.tools.gfx141_compose_original --private "$RUNNER_TEMP/gfx141-private" --shell out/GFX124-unsigned-shell.apk --tools "$tools" --safe out/gfx141-safe.json
      - uses: actions/upload-artifact@v4
        with:
          name: GFX141-private-original-safe-attestation-NO-APK
          path: out/gfx141-safe.json
          if-no-files-found: error
          retention-days: 7
      - name: Purge original source and fixtures from runner
        if: always()
        run: rm -rf -- source-zip2 "$RUNNER_TEMP/gfx141-private" "$RUNNER_TEMP/gfx141-tools" out/classes out/dex out/GFX124-unsigned-shell.apk
