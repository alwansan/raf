name: B24 LOCAL-005 original callback managed-compile parity
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - 'scripts/verify_android_offline_candidate.py'
      - 'tests/test_b24_offline_candidate_trace_parity.py'
      - '.github/workflows/raft-b24-world-compile-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raft-b24-world-trace-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests/test_b24_offline_candidate_trace_parity.py
            config/runtime-operation-traces.json
      - name: Prove SHA-pinned trace-only selection and write safety
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_b24_offline_candidate_trace_parity.py -v
          python3 -m py_compile scripts/verify_android_offline_candidate.py
          echo "B24 no raw game source, no Unity, no APK, original GameManager managed compilation covered by existing offline CI"
