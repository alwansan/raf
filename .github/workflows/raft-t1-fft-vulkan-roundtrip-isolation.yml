name: T1 WATER-001 same-Vulkan FFT translation isolation

on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-t1-fft-vulkan-roundtrip-isolation.yml

permissions:
  contents: read

concurrency:
  group: t1-fft-vulkan-roundtrip-isolation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      DEBIAN_FRONTEND: noninteractive
      ZIP2_SHA: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - name: Check scratch budget and comparator tests
        run: |
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2{print $4}')" -gt 1048576
          python3 -m unittest discover -s tests -p test_t1_fft_readback_parity.py -v
          python3 -m unittest discover -s tests -p test_t1_fft_source_integer_coordinates.py -v
          python3 -m unittest discover -s tests -p test_t1_fft_empty_capture_guard.py -v
          python3 -m unittest discover -s tests -p test_t1_fft_pass0_trace_variant.py -v
          python3 -m unittest discover -s tests -p test_t1_fft_spirv_read_provenance.py -v
          python3 -m unittest discover -s tests -p test_t1_fft_local_store_writers.py -v
          python3 -m unittest discover -s tests -p test_t1_fft_spirv_reaching_stores.py -v
          python3 -m unittest discover -s tests -p test_t1_fft_spirv_alias_origins.py -v
          python3 -m unittest discover -s tests -p test_t1_fft_spirv_lane_alias_effect.py -v
          python3 -m unittest discover -s tests -p test_t1_fft_spirv_scalar_writer_carrier.py -v
          python3 -m unittest discover -s tests -p test_t1_fft_site1_y_branch_paths.py -v
          python3 -m unittest discover -s tests -p test_t1_fft_site1_y_inequal_source.py -v
          python3 -m unittest discover -s tests -p test_t1_fft_site1_x_writer_lineage.py -v
          python3 -m unittest discover -s tests -p test_t1_fft_coordinate_probe_compare.py -v
          # disjoint-synthetic-bitcarrier-fixture-20261106: verify checked-out corrected SPIR-V result IDs
          python3 -m unittest discover -s tests -p test_t1_fft_pass0_load_inventory.py -v
          python3 -m unittest discover -s tests -p test_t1_fft_sourcefree_bitcarrier_contract.py -v
      - name: Install Vulkan and DXBC translation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools python3-venv g++ libvulkan-dev mesa-vulkan-drivers
          python3 -m venv "$RUNNER_TEMP/t1-python-venv"
          "$RUNNER_TEMP/t1-python-venv/bin/python" -m pip install \
            --disable-pip-version-check UnityPy==1.25.4 -q
      - name: Recover exact SHA-verified original FFT object from immutable ZIP2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t1-private-zip2"
          git -C "$RUNNER_TEMP/t1-private-zip2" init -q
          git -C "$RUNNER_TEMP/t1-private-zip2" remote add origin https://github.com/alwansan/raf.git
          git -C "$RUNNER_TEMP/t1-private-zip2" -c protocol.version=2 fetch -q --depth=1 --filter=blob:none origin zip2
          test "$(git -C "$RUNNER_TEMP/t1-private-zip2" rev-parse FETCH_HEAD)" = "$ZIP2_SHA"
          git -C "$RUNNER_TEMP/t1-private-zip2" sparse-checkout init --no-cone
          printf '%s\n' '/RAFT_FILE_MANIFEST.tsv' '/Raft/Raft_Data/sharedassets0.assets/' |
            git -C "$RUNNER_TEMP/t1-private-zip2" sparse-checkout set --no-cone --stdin
          git -C "$RUNNER_TEMP/t1-private-zip2" checkout -q --detach FETCH_HEAD
          python3 -m scripts.stage_zip2_fft_owner \
            --zip2-checkout "$RUNNER_TEMP/t1-private-zip2" \
            --destination "$RUNNER_TEMP/t1-original-verified/Raft_Data/sharedassets0.assets"
      - name: Audit scalar or vector texture helper bodies and compare both passes on the same Vulkan device
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP/t1-roundtrip-scratch"
          mkdir -m 700 "$TMPDIR"
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name '*lvp*.json' -print -quit)"
          test -f "$VK_DRIVER_FILES"
          "$RUNNER_TEMP/t1-python-venv/bin/python" -m scripts.t1_stage_original_fft_compute_candidates \
            --original-data "$RUNNER_TEMP/t1-original-verified/Raft_Data" \
            --project "$TMPDIR/candidates" --keep-first-pair-spirv
          python3 -m scripts.t1_fft_pass0_load_inventory --project "$TMPDIR/candidates"
          echo "RAFT_T1_COORDINATE_PROFILE original_slot0 typed_bitcasts=true"
          python3 -m scripts.t1_fft_spirv_read_provenance --coordinates "$TMPDIR/candidates/_private_vulkan/slot0.spv"
          python3 -m scripts.t1_fft_local_store_writers "$TMPDIR/candidates/_private_vulkan/slot0.spv"
          # Re-run original slot0 with typed, fail-closed alias-path reason categories.
          python3 -m scripts.t1_fft_spirv_reaching_stores "$TMPDIR/candidates/_private_vulkan/slot0.spv"
          python3 -m scripts.t1_fft_spirv_alias_origins "$TMPDIR/candidates/_private_vulkan/slot0.spv"
          python3 -m scripts.t1_fft_spirv_lane_alias_effect "$TMPDIR/candidates/_private_vulkan/slot0.spv"
          python3 -m scripts.t1_fft_spirv_scalar_writer_carrier "$TMPDIR/candidates/_private_vulkan/slot0.spv"
          # report-unguarded-empty-array-20261106: verified test fixture expects explicit empty guard list
          python3 -m scripts.t1_fft_site1_y_branch_paths "$TMPDIR/candidates/_private_vulkan/slot0.spv"
          # reject-nonfinal-terminator-20261106: fail closed on malformed CFG branches
          python3 -m scripts.t1_fft_site1_y_inequal_source "$TMPDIR/candidates/_private_vulkan/slot0.spv"
          python3 -m scripts.t1_fft_site1_x_writer_lineage "$TMPDIR/candidates/_private_vulkan/slot0.spv"
          tail -n +2 "$TMPDIR/candidates/Assets/T1OriginalDerived/FFT_Candidate_00.compute" > "$TMPDIR/coordinate.hlsl"
          glslangValidator -V -D -S comp -e main -o "$TMPDIR/coordinate.spv" "$TMPDIR/coordinate.hlsl" > "$TMPDIR/coordinate-compile.log" 2>&1
          spirv-val --target-env vulkan1.1 "$TMPDIR/coordinate.spv" > "$TMPDIR/coordinate-validation.log" 2>&1
          spirv-opt --target-env=vulkan1.1 --convert-local-access-chains \
            --eliminate-local-single-block --eliminate-local-single-store --ssa-rewrite \
            "$TMPDIR/candidates/_private_vulkan/slot0.spv" -o "$TMPDIR/coordinate-ssa.spv" \
            > "$TMPDIR/coordinate-ssa.log" 2>&1
          spirv-val --target-env vulkan1.1 "$TMPDIR/coordinate-ssa.spv" > "$TMPDIR/coordinate-ssa-validation.log" 2>&1
          echo "RAFT_T1_COORDINATE_PROFILE original_slot0_promoted_ssa lane_sensitive=true"
          python3 -m scripts.t1_fft_spirv_read_provenance --coordinates --coordinate-depth 12 "$TMPDIR/coordinate-ssa.spv"
          echo "RAFT_T1_COORDINATE_PROFILE hlsl_roundtrip_slot0"
          # HLSL-X-STOP-TYPE: emit only allowlisted unresolved-lane opcode and numeric-kind metadata.
          python3 -m scripts.t1_fft_spirv_read_provenance --coordinates --coordinate-depth 12 "$TMPDIR/coordinate.spv"
          python3 -m scripts.t1_fft_pass0_trace_variant "$TMPDIR/candidates/Assets/T1OriginalDerived/FFT_Candidate_00.compute"
          python3 -m scripts.t1_fft_vulkan_roundtrip_isolation --project "$TMPDIR/candidates"
          # The trace runner validates capacity for the observed 384 reads.
          python3 -m scripts.t1_fft_pass0_vulkan_trace --project "$TMPDIR/candidates" \
            --export-private-trace "$TMPDIR/vulkan-trace.bin"
          # Verify the actual private binary export is accepted by the paired comparator.
          python3 -m scripts.t1_fft_trace_compare "$TMPDIR/vulkan-trace.bin" "$TMPDIR/vulkan-trace.bin"
          spirv-dis --raw-id "$TMPDIR/coordinate-ssa.spv" -o "$TMPDIR/source-coordinate.spvasm"
          python3 -m scripts.t1_fft_source_integer_coordinates "$TMPDIR/source-coordinate.spvasm" "$TMPDIR/source-integer.spvasm"
          spirv-as --target-env vulkan1.1 "$TMPDIR/source-integer.spvasm" -o "$TMPDIR/source-integer.spv" > "$TMPDIR/source-as.log" 2>&1
          spirv-val --target-env vulkan1.1 "$TMPDIR/source-integer.spv" > "$TMPDIR/source-val.log" 2>&1
          spirv-cross "$TMPDIR/source-integer.spv" --hlsl --shader-model 50 --output "$TMPDIR/source-integer.hlsl" > "$TMPDIR/source-cross.log" 2>&1
          { printf '#pragma kernel main\n'; cat "$TMPDIR/source-integer.hlsl"; } > "$TMPDIR/candidates/Assets/T1OriginalDerived/FFT_Candidate_00.compute"
          echo "RAFT_T1_SOURCE_INTEGER_COORDINATES validating_rewrite=true"
          python3 -m scripts.t1_fft_vulkan_roundtrip_isolation --project "$TMPDIR/candidates"
      - name: Remove all private inputs and scratch data
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/t1-private-zip2" "$RUNNER_TEMP/t1-original-verified" \
            "$RUNNER_TEMP/t1-roundtrip-scratch" "$RUNNER_TEMP/t1-python-venv"
