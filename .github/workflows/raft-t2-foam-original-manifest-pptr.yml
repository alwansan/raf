name: T2 WATER-001 source-original Shader PPtr 366-manifest
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/t2_foam_original_manifest_pptr.py
      - tests/test_t2_foam_original_manifest_pptr.py
      - .github/workflows/raft-t2-foam-original-manifest-pptr.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t2-original-manifest-pptr-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  authenticate-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
      - name: Run independent synthetic controls
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t2_foam_original_manifest_pptr.py
          python3 -m unittest discover -s tests -p 'test_t2_foam_original_manifest_pptr.py' -v
          python3 -m unittest discover -s tests -p 'test_t2_external_pptr_manifest_resolver.py' -v
          python3 - <<'PY'
          import shutil
          assert shutil.disk_usage('.').free>3*1024**3
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: t2-foam-original-manifest-zip2
          lfs: false
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/sharedassets0.assets/*
      - name: Reconstruct and verify original owner bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import PINS,ZIP2_SHA,stage
          from scripts.t2_foam_original_manifest_pptr import parse_original_manifest
          root=Path('t2-foam-original-manifest-zip2')
          assert subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()==ZIP2_SHA
          assert len(parse_original_manifest(root/'RAFT_FILE_MANIFEST.tsv'))==366
          target=Path(os.environ['RUNNER_TEMP'])/'t2-foam-manifest-owner'
          staged=stage(root,target,{'Raft_Data/sharedassets0.assets':PINS['Raft_Data/sharedassets0.assets']})
          assert staged['verified_bytes']==115978112 and staged['lfs_used'] is False
          print('T2_FOAM_SOURCE_SAFE '+json.dumps({'owner_SHA_authenticated':True,'bytes':staged['verified_bytes'],'manifest_366_metadata_validated':True}))
          PY
      - name: Original external target verification in private runner
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4 -q
          timeout 540s python3 -m scripts.t2_foam_original_manifest_pptr \
            --zip2 "$GITHUB_WORKSPACE/t2-foam-original-manifest-zip2" \
            --source "$RUNNER_TEMP/t2-foam-manifest-owner" \
            --destination "$RUNNER_TEMP/t2-foam-target-staging" \
            --out "$RUNNER_TEMP/t2-foam-manifest-pptr-safe.json"
      - name: Assert real original result and strict evidence scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          raw=(Path(os.environ['RUNNER_TEMP'])/'t2-foam-manifest-pptr-safe.json').read_text()
          r=json.loads(raw)
          assert r['status']=='source_original_external_PPtr_manifest_verified'
          assert r['original_zip2_commit_authenticated'] is True
          assert r['original_sharedassets0_SHA_authenticated'] is True
          assert r['original_Foam_Shader_object_SHA_authenticated'] is True
          assert (r['original_material_count'],r['total_external'],r['known_four_owner'],r['unmapped'])==(351,7,5,2)
          assert sum(r[k] for k in ('unique_manifest_candidate','no_manifest_candidate','ambiguous_manifest_candidate'))==2
          assert r['basename_candidate_is_verified_Unity_GUID'] is False
          assert r['verified_typed_target_is_proven_runtime_material'] is False
          assert r['Android_Adreno_water_pixels_verified'] is False
          assert r['private_path_GUID_shader_or_raw_published'] is False
          assert all(type(v) in (int,bool,str) for v in r.values())
          assert not any(x in raw for x in ('original_external_paths','private_shader_name','private_guid','source_raw','m_PathID','m_FileID'))
          print('T2_ORIGINAL_MANIFEST_PPTR_SAFE_ASSERTIONS pass')
          PY
      - name: Delete staged original private files
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/t2-foam-manifest-owner" \
            "$RUNNER_TEMP/t2-foam-target-staging" \
            "$GITHUB_WORKSPACE/t2-foam-original-manifest-zip2"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: t2-original-manifest-pptr-safe-${{ github.run_id }}
          path: ${{ runner.temp }}/t2-foam-manifest-pptr-safe.json
          if-no-files-found: error
          retention-days: 7
