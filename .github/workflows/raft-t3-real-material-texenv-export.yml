name: T3 RENDER-002 genuine original Material and TexEnv same-export trial
# T3 bounded diagnostic revision: first authenticated export 41938229887 succeeded,
# but B05 comparator returned an unclassified ValueError. This one recheck
# records the safe failing stage/aggregate counts, never private asset IDs.
# Follow-up from 41938711186: all 41 original Materials/227 slots parsed,
# but actual exported Material YAML reader rejects a document. Keep exact
# SHA-pinned export and classify its static parser reason without exposing IDs.
# Genuine run 41939065539 proved exported m_TexEnvs mapping container;
# B05 parser now supports exported YAML dictionary + original array remains strict
# (production verifier 77d312f5, negative controls 2f1807bd). Verify authentic
# 41/227 source-vs-same-process-export relations, not just syntax repair.
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-t3-real-material-texenv-export.yml'
permissions:
  contents: read
concurrency:
  group: raft-t3-original-material-texenv-export-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bounded-actual-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Checkout only B21 scripts/W1/B02 SHA-locked staging source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            android-port/Experiments/ExportLineage
            scripts
            tests
      - name: Check disk budget and synthetic original/export parity tests
        run: |
          set -euo pipefail
          python3 -c "import shutil; assert shutil.disk_usage('.').free > 8 * 1024**3"
          python3 -m unittest discover -s tests -p 'test_t3_same_export_material_texenv.py' -v
          python3 -m unittest discover -s tests -p 'test_b21_stage_light_lineage.py' -v
          python3 -m unittest discover -s tests -p 'test_b21_compare_export_lights.py' -v
          python3 -m unittest discover -s tests -p 'test_b21_compare_light_owners.py' -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Obtain exact public AssetRipperCLI source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: nowl-it/AssetRipperCLI
          ref: 036098ab525a3f9f693dc101edeb21faad4d32d8
          path: ar-host
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            Source
      - name: Compile SHA-pinned optional W1+B02+B21 exporter in disposable public checkout
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b21"
          python3 -m scripts.b21_stage_light_lineage \
            --base-helper android-port/Experiments/ExportLineage/RaftExportLineage.cs \
            --destination "$RUNNER_TEMP/b21/RaftExportLineage.cs"
          python3 -m scripts.patch_export_lineage --tool-source ar-host --helper "$RUNNER_TEMP/b21/RaftExportLineage.cs"
          timeout 780s dotnet publish android-port/Experiments/ExportLineage/ExportLineage.csproj \
            -c Release -p:PublishAot=false -p:PublishTrimmed=false \
            -p:EnableTrimAnalyzer=false -p:EnableAotAnalyzer=false \
            --self-contained false -o "$RUNNER_TEMP/b21-compiled" \
            > "$RUNNER_TEMP/b21-build-public-tool.log" 2>&1 || {
              tail -60 "$RUNNER_TEMP/b21-build-public-tool.log"; exit 1;
            }
          dotnet "$RUNNER_TEMP/b21-compiled/ExportLineage.dll" --probe-tool > /dev/null
      - name: Checkout immutable ZIP2 NINE SMALL original serialized providers (no LFS)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: zip2-original
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/level0
            Raft/Raft_Data/level1
            Raft/Raft_Data/level2
            Raft/Raft_Data/level3
            Raft/Raft_Data/level4
            Raft/Raft_Data/level5
            Raft/Raft_Data/globalgamemanagers
            Raft/Raft_Data/globalgamemanagers.assets
            Raft/Raft_Data/sharedassets6.assets
      - name: Reconstruct in temporary staging with exact per-file size and SHA256
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,os,json
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import ZIP2_SHA,stage
          from scripts.b21_scene_lightmap_links import PIN
          from scripts.a12_probe_original_blur_passes import SHADER_OWNERS
          from scripts.b04_restore_original_color_settings import ORIGINAL_SIZE,ORIGINAL_SHA256
          zip2=Path('zip2-original')
          assert subprocess.check_output(['git','-C',str(zip2),'rev-parse','HEAD'],text=True).strip()==ZIP2_SHA
          pins={'Raft_Data/'+name:v for name,v in PIN.items()}
          pins.update({
            'Raft_Data/globalgamemanagers':(ORIGINAL_SIZE,ORIGINAL_SHA256),
            'Raft_Data/globalgamemanagers.assets': SHADER_OWNERS['globalgamemanagers.assets'],
            'Raft_Data/sharedassets6.assets':SHADER_OWNERS['sharedassets6.assets']
          })
          result=stage(zip2,Path(os.environ['RUNNER_TEMP'])/'b21-original',pins)
          assert len(result['owners'])==9 and not result['lfs_used']
          print('RAFT_B21_NINE_ORIGINAL_PROVIDERS_AUTHENTICATED=9')
          PY
      - name: Install pinned original serialized reader and verify source Light population
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.23.0 PyYAML==6.0.3
          python3 - <<'PY'
          import os
          from pathlib import Path
          import UnityPy
          from scripts.b21_compare_export_lights import original_lights
          root=Path(os.environ['RUNNER_TEMP'])/'b21-original/Raft_Data'
          assert len(original_lights(root))==2
          objs=[o for f in ('globalgamemanagers.assets','sharedassets6.assets') for o in UnityPy.load(str(root/f)).objects]
          materials=sum(o.type.name=='Material' for o in objs)
          shaders=sum(o.type.name=='Shader' for o in objs)
          print(f'RAFT_B21_SMALL_EXPORT_GRAPH materials={materials} shaders={shaders} sourceLights=2')
          assert materials>0 and shaders>0, 'Bounded source lacks exporter required graph; do not attempt empty export'
          PY
      - name: Run one bounded genuine source export with THREE same-instance private traces
        env:
          DOTNET_PROCESSOR_COUNT: '2'
          RAFT_PRIVATE_EXPORT_LINEAGE: ${{ runner.temp }}/b21-w1-private.json
          RAFT_PRIVATE_EXPORT_TEXTURE_LINEAGE: ${{ runner.temp }}/b21-b02-private.json
          RAFT_PRIVATE_EXPORT_LIGHT_LINEAGE: ${{ runner.temp }}/b21-light-private.json
        run: |
          set -euo pipefail
          if timeout 540s dotnet "$RUNNER_TEMP/b21-compiled/ExportLineage.dll" \
               "$RUNNER_TEMP/b21-original" "$RUNNER_TEMP/b21-private-export" \
               > "$RUNNER_TEMP/b21-original-export-private.log" 2>&1; then
            test -s "$RAFT_PRIVATE_EXPORT_LINEAGE"
            test -s "$RAFT_PRIVATE_EXPORT_TEXTURE_LINEAGE"
            test -s "$RAFT_PRIVATE_EXPORT_LIGHT_LINEAGE"
            echo 'RAFT_B21_BOUNDED_GAME_EXPORT_COMPLETED=true'
          else
            python3 - <<'PY'
          import os,json,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          raw=(root/'b21-original-export-private.log').read_text(errors='replace')
          report={'actual_export_completed':False,'tool_exception_categories':sorted(set(re.findall(r'\b(?:System|AssetRipper)\.[A-Za-z.]+Exception\b',raw))),
                  'trace_w1_created':(root/'b21-w1-private.json').is_file(),
                  'trace_light_created':(root/'b21-light-private.json').is_file(),
                  'private_log_bytes':len(raw.encode()),'android_render_executed':False}
          (root/'t3-safe-result.json').write_text(json.dumps(report,sort_keys=True))
          print('RAFT_B21_BOUNDED_EXPORT_INCONCLUSIVE '+json.dumps(report,sort_keys=True))
          PY
            exit 2
          fi
      - name: Compare authenticated original Material/TexEnv against exact same export
        run: |
          set -euo pipefail
          python3 -m scripts.t3_same_export_material_texenv \
            --original "$RUNNER_TEMP/b21-original" \
            --project "$RUNNER_TEMP/b21-private-export/ExportedProject" \
            --w1-trace "$RUNNER_TEMP/b21-w1-private.json" \
            --b02-trace "$RUNNER_TEMP/b21-b02-private.json" \
            --out "$RUNNER_TEMP/t3-safe-result.json"
      - name: Publish ONLY safe aggregate, never game assets or private traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-authentic-material-texenv-export-${{ github.run_id }}
          path: ${{ runner.temp }}/t3-safe-result.json
          retention-days: 7
          if-no-files-found: ignore
