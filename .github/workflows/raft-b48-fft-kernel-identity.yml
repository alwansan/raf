name: B48 WATER-001 authentic FFT selector/compiled candidate contract

on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-b48-fft-kernel-identity.yml'
      - 'scripts/probe_b48_fft_selector_program_compat.py'
      - 'tests/test_probe_b48_fft_selector_program_compat.py'

permissions:
  contents: read

concurrency:
  group: raft-b48-fft-identity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sha-pinned-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      ZIP2_SOURCE_SHA: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
    steps:
      - name: Checkout safe B48 source/test and exact original managed DLL
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
            Raft/Raft_Data/Managed
      - name: Exercise positive and strict negative FFT source-model controls
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_probe_b48_fft_selector_program_compat.py -v
          python3 -m unittest discover -s tests -p test_probe_original_fft_inherited_seed.py -v
          python3 -m unittest discover -s tests -p test_probe_fft_variant_table.py -v
      - name: Acquire only authenticated original FFT source from pinned ZIP2
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          mkdir -p "$RUNNER_TEMP/b48/zip2"
          git -C "$RUNNER_TEMP/b48/zip2" init -q
          git -C "$RUNNER_TEMP/b48/zip2" remote add origin https://github.com/alwansan/raf.git
          git -C "$RUNNER_TEMP/b48/zip2" -c protocol.version=2 fetch -q --depth=1 --filter=blob:none origin zip2
          test "$(git -C "$RUNNER_TEMP/b48/zip2" rev-parse FETCH_HEAD)" = "$ZIP2_SOURCE_SHA"
          git -C "$RUNNER_TEMP/b48/zip2" sparse-checkout init --no-cone
          printf '%s\n' '/RAFT_FILE_MANIFEST.tsv' '/Raft/Raft_Data/sharedassets0.assets/' |
            git -C "$RUNNER_TEMP/b48/zip2" sparse-checkout set --no-cone --stdin
          git -C "$RUNNER_TEMP/b48/zip2" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/b48/zip2" rev-parse HEAD)" = "$ZIP2_SOURCE_SHA"
          python3 -m scripts.stage_zip2_fft_owner \
            --zip2-checkout "$RUNNER_TEMP/b48/zip2" \
            --destination "$RUNNER_TEMP/b48/original/Raft_Data/sharedassets0.assets"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Extract original CSharp9 privately with exact managed DLL
        run: |
          set -euo pipefail
          dotnet tool install ilspycmd --version 11.2.0.10050 --tool-path "$RUNNER_TEMP/b48/ilspy"
          mkdir -p "$RUNNER_TEMP/b48/decompiled-private"
          timeout 330s "$RUNNER_TEMP/b48/ilspy/ilspycmd" -p -lv CSharp9_0 \
            -o "$RUNNER_TEMP/b48/decompiled-private" \
            Raft/Raft_Data/Managed/Assembly-CSharp.dll \
            > "$RUNNER_TEMP/b48/ilspy-private.log" 2>&1
      - name: Verify real original selector × SHA-proven 20 compiled positions
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4 -q
          timeout 180s python3 -m scripts.probe_b48_fft_selector_program_compat \
            --source "$RUNNER_TEMP/b48/original/Raft_Data" \
            --managed "$RUNNER_TEMP/b48/decompiled-private"
          echo 'RAFT_B48_BOUNDARY runtime_unity_kernel_identity_unproven=true android_gpu_unproven=true'
          # All proprietary source, bytecode, ILSpy log and output remain only
          # under runner temp. Nothing is uploaded as an artifact or release.
