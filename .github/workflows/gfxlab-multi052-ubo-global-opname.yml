name: GFX-MULTI-052 original DXBC CB b slot provenance on SPIRV actual Uniform global OpName
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths:
      - '.github/workflows/gfxlab-multi052-ubo-global-opname.yml'
      - 'gfxlab/tools/multi_shader_original_cb_global_opname.py'
      - 'gfxlab/tests/test_multi_shader_original_cb_global_opname.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfxlab-multi052-original-source-private-CB-global-symbol
  cancel-in-progress: false
jobs:
  original-CB-source-global-symbol:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            gfxlab/tools
            gfxlab/tests
            gfxlab/unity/Assets/Shaders
            gfxlab/unity/Assets/Scripts
            gfxlab/unity/Assets/Editor
            gfxlab/unity/Assets/Plugins/Android
      - name: Run all source-free negative and synthetic tests
        run: |
          set -euo pipefail
          python3 -m py_compile gfxlab/tools/multi_shader_original_cb_global_opname.py
          python3 -m unittest discover -s gfxlab/tests -p 'test_*.py' -v
          echo GFX052_SOURCE_FREE_TESTS_PASS=true
      - uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: source-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/resources.assets/*
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/sharedassets6.assets
      - name: Install private offline original source DXBC SPIRV tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
      - name: Independently compare original source CB with real SPIRV Uniform global labels
        run: |
          set -euo pipefail
          python3 -m gfxlab.tools.multi_shader_original_cb_global_opname \
            --zip2 source-zip2 --stage "$RUNNER_TEMP/gfxlab-multi052-private" \
            --out gfxlab-multi052-safe-original-CB-global-name-counts.json
          python3 - <<'PY'
          import json
          d=json.load(open("gfxlab-multi052-safe-original-CB-global-name-counts.json"))
          assert d["experiment"]=="GFX-MULTI-052"
          assert d["original_zip2_sha"]=="15964ea8f246b6e076ce26b60931ee2e1a9a2385"
          assert d["original_shader48_passes"]==7
          assert d["source_stages"]==14
          assert len(d["per_pass"])==7
          c=d["global_safe_counts"]
          assert c["source_stages_compared"]==14
          assert c["original_dxbc_CB_declarations"]==66
          assert c["translated_spv_reflected_ubos"]==66
          assert c["actual_global_name_source_b_binding_and_block_bytes_match"]<=66
          for row in d["per_pass"]:
            for x in row["stage_safe_UBO_global_symbol_counts"].values():
              assert not x["original_Material_property_or_member_byte_layout_verified"]
              assert not x["private_CB_register_ID_or_original_program_data_exported"]
          for field in ("all_524_original_variants_translated",
                        "source_to_Material_property_register_mapping_proven",
                        "original_CB_member_byte_offsets_proven",
                        "original_android_shader48_GPU_runtime_proven",
                        "PC_to_Adreno_original_pixel_parity_proven",
                        "originalShaderRestored",
                        "private_shader_names_code_b_registers_CB_offsets_exported",
                        "phase_closed"):
            assert d[field] is False,field
          print("GFX052_SOURCE_PRIVATE_CB_GLOBAL_PROVENANCE_CPU_ONLY=true")
          PY
      - name: Upload only safe aggregate original CB global counts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gfxlab-multi052-safe-original-CB-global-opname-counters
          path: gfxlab-multi052-safe-original-CB-global-name-counts.json
          retention-days: 7
          if-no-files-found: error
      - name: Purge private ZIP2 and all generated original and translated shader files
        if: always()
        run: |
          sudo rm -rf source-zip2 "$RUNNER_TEMP/gfxlab-multi052-private"
          echo GFX052_ALL_PRIVATE_ORIGINAL_SOURCE_PURGED=true
