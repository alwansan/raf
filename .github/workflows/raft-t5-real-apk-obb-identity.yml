name: T5 INTEGRATION-001 real signed APK OBB aapt audit
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths: [.github/workflows/raft-t5-real-apk-obb-identity.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: t5-real-apk-obb-42058825739
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[t5-real-signed-pair-42058825739]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: '42058825739'
      SOURCE_SHA: e9c358eda01785b65e4eb14f18723da426635628
      VERSION_CODE: '89'
      ARTIFACT_ID: '13454900880'
      OUTER_SIZE: '5948243834'
      OUTER_SHA: 41bf01f9991521fac876c591b75adc19b493ad47882687846e5aae1c2af6a3ef
      INNER_SIZE: '5948243524'
      INNER_SHA: 29d967c5f1868a10aa0f8f3b9f0306e828c1d32ef3cda2909f7482b5d111eef6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - name: Synthetic original APK OBB extraction and pair controls
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_t5_extract_actual_signed_pair.py -v
          python3 -m unittest discover -s tests -p test_t5_verify_apk_obb_pair.py -v
      - name: Check immutable native source, artifact ID and storage budget
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/art.json"
          python3 - <<'PY'
          import json,os,shutil
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          r=json.loads((root/"run.json").read_text())
          a=json.loads((root/"art.json").read_text())
          assert r["id"]==int(os.environ["RUN_ID"]) and r["head_sha"]==os.environ["SOURCE_SHA"]
          assert r["run_number"]==int(os.environ["VERSION_CODE"]) and r["status"]=="completed"
          assert a["id"]==int(os.environ["ARTIFACT_ID"]) and not a["expired"]
          assert a["name"]=="t5-retained-native-delivery-42058825739"
          assert a["size_in_bytes"]==int(os.environ["OUTER_SIZE"]) and a["digest"]=="sha256:"+os.environ["OUTER_SHA"]
          available=shutil.disk_usage(root).free
          required=int(os.environ["OUTER_SIZE"])+int(os.environ["INNER_SIZE"])+4*1024**3
          if available<required:raise SystemExit("Insufficient disk for actual APK OBB pair extraction; no download attempted")
          print("T5_PINNED_REAL_PAIR_PREFLIGHT passed=true")
          PY
      - name: Download original archive in nested ZIP and verify both SHA256
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/t5-outer.zip"
          python3 - <<'PY'
          import os,hashlib,zipfile
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])
          outer=d/"t5-outer.zip"
          h=hashlib.sha256()
          with outer.open("rb") as f:
              for buf in iter(lambda:f.read(4*1024*1024),b""):h.update(buf)
          if outer.stat().st_size!=int(os.environ["OUTER_SIZE"]) or h.hexdigest()!=os.environ["OUTER_SHA"]:
              raise SystemExit("Retained outer archive SHA mismatch")
          with zipfile.ZipFile(outer) as z:
              info=z.infolist()
              if len(info)!=1 or info[0].filename!="raft-native-verified-delivery-original.zip" or info[0].file_size!=int(os.environ["INNER_SIZE"]):
                  raise SystemExit("Retained outer ZIP does not contain original immutable archive")
              inner=d/"t5-original.zip"
              h=hashlib.sha256()
              with z.open(info[0]) as stream,inner.open("xb") as out:
                  for buf in iter(lambda:stream.read(4*1024*1024),b""):
                      out.write(buf)
                      h.update(buf)
              if inner.stat().st_size!=int(os.environ["INNER_SIZE"]) or h.hexdigest()!=os.environ["INNER_SHA"]:
                  raise SystemExit("Original native signed delivery SHA mismatch")
          outer.unlink()
          print("T5_RETAINED_NATIVE_ORIGINAL nested_sha_verified=true")
          PY
      - name: Stream exact native APK and OBB into private no-clobber staging
        run: |
          set -euo pipefail
          python3 scripts/t5_extract_actual_signed_pair.py \
            --source-zip "$RUNNER_TEMP/t5-original.zip" \
            --output "$RUNNER_TEMP/t5-authentic-pair" \
            --expected-archive-bytes "$INNER_SIZE" \
            --expected-archive-sha "$INNER_SHA" --version-code "$VERSION_CODE"
          rm -f "$RUNNER_TEMP/t5-original.zip"
      - name: Verify actual aapt package version, OBB ZIP and APK signing
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/build-tools"
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          test -n "$AAPT" && test -x "$AAPT"
          APKSIGNER="$(dirname "$AAPT")/apksigner"
          test -x "$APKSIGNER"
          echo "T5_ANDROID_BUILD_TOOLS aapt=$("$AAPT" version 2>&1 | head -1) apksigner=$("$APKSIGNER" version)"
          APK="$RUNNER_TEMP/t5-authentic-pair/Raft-Android-Test.apk"
          OBB="$RUNNER_TEMP/t5-authentic-pair/main.89.com.alwansan.raft.androidtest.obb"
          python3 scripts/t5_verify_apk_obb_pair.py \
            --delivery "$RUNNER_TEMP/t5-authentic-pair/delivery.json" \
            --apk "$APK" --obb "$OBB" --aapt "$AAPT"
          "$APKSIGNER" verify --verbose "$APK" > "$RUNNER_TEMP/t5-apk-signature-report.txt"
          grep -q '^Verifies$' "$RUNNER_TEMP/t5-apk-signature-report.txt"
          echo "T5_REAL_SIGNED_APK_OBB aapt_identity_verified=true actual_obb_sha_and_zip_verified=true apk_signature_verified=true unity_internal_guid=unverified android_device_mount=unverified"
          echo "T5 actual source-pinned APK identity, complete OBB and APK signing verified; no device or Unity GUID claim." >> "$GITHUB_STEP_SUMMARY"
