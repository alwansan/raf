name: A1 FFT software Vulkan numeric differential - CPU only

on:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-a1-fft-software-vulkan.yml'
      - 'scripts/a1_fft_vulkan_cpu.cpp'
      - 'scripts/probe_original_fft_software_vulkan.py'
      - 'tests/test_probe_original_fft_software_vulkan.py'
      - 'scripts/stage_zip2_fft_owner.py'
      - 'tests/test_stage_zip2_fft_owner.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raft-a1-fft-lavapipe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-vulkan-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout diagnostic code without Git LFS
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - name: Install CPU-only software Vulkan prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends g++ libvulkan-dev mesa-vulkan-drivers glslang-tools spirv-tools
      - name: Verify private Vulkan result schema with independent CPU tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_probe_original_fft_software_vulkan.py' -v
          python3 -m unittest discover -s tests -p 'test_stage_zip2_fft_owner.py' -v
      - name: Compile A1 Vulkan numeric executor
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra scripts/a1_fft_vulkan_cpu.cpp -lvulkan -o /tmp/a1-fft-vk
      - name: Execute known synthetic sum and mismatched operation controls on CPU only
        shell: bash
        run: |
          set -euo pipefail
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name '*lvp*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          cat >/tmp/a1-base.comp <<'EOF'
          #version 450
          #extension GL_EXT_samplerless_texture_functions : require
          layout(local_size_x=8,local_size_y=1,local_size_z=1) in;
          layout(set=0,binding=0) uniform texture2D src0;
          layout(set=0,binding=1) uniform texture2D src1;
          layout(set=0,binding=2,rgba32f) uniform writeonly image2D outputImage;
          void main() {
            ivec2 xy=ivec2(gl_GlobalInvocationID.xy);
            vec4 a=texelFetch(src0,xy,0);
            vec4 b=texelFetch(src1,xy,0);
            imageStore(outputImage,xy,a+b);
          }
          EOF
          sed 's/imageStore(outputImage,xy,a+b);/imageStore(outputImage,xy,a-b);/' \
            /tmp/a1-base.comp >/tmp/a1-negative.comp
          glslangValidator -V -S comp -o /tmp/a1-base.spv /tmp/a1-base.comp
          glslangValidator -V -S comp -o /tmp/a1-negative.spv /tmp/a1-negative.comp
          spirv-val --target-env vulkan1.1 /tmp/a1-base.spv
          spirv-val --target-env vulkan1.1 /tmp/a1-negative.spv
          timeout 30s /tmp/a1-fft-vk /tmp/a1-base.spv /tmp/a1-base.spv 8 1 --canary | tee /tmp/a1-canary.jsonlog
          grep -q '"synthetic_canary_verified":true' /tmp/a1-canary.jsonlog
          grep -q '"within_selected_tolerance":true' /tmp/a1-canary.jsonlog
          timeout 30s /tmp/a1-fft-vk /tmp/a1-base.spv /tmp/a1-negative.spv 8 1 | tee /tmp/a1-negative.jsonlog
          grep -q '"within_selected_tolerance":false' /tmp/a1-negative.jsonlog

  authenticated-original-fft-on-software-vulkan:
    needs: synthetic-vulkan-canary
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    env:
      DEBIAN_FRONTEND: noninteractive
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Checkout A1 diagnostic scripts only - no original Raft data
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - name: Fetch only three original ZIP2 FFT chunks from immutable source
        env:
          ZIP2_COMMIT: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
        run: |
          set -euo pipefail
          mkdir -p zip2-source
          git -C zip2-source init -q
          git -C zip2-source remote add origin https://github.com/alwansan/raf.git
          git -C zip2-source -c protocol.version=2 fetch -q --depth=1 --filter=blob:none origin zip2
          test "$(git -C zip2-source rev-parse FETCH_HEAD)" = "$ZIP2_COMMIT"
          git -C zip2-source sparse-checkout init --no-cone
          printf '%s\n' '/RAFT_FILE_MANIFEST.tsv' '/Raft/Raft_Data/sharedassets0.assets/' \
            | git -C zip2-source sparse-checkout set --no-cone --stdin
          git -C zip2-source checkout -q --detach FETCH_HEAD
          test "$(git -C zip2-source rev-parse HEAD)" = "$ZIP2_COMMIT"
          test -f zip2-source/RAFT_FILE_MANIFEST.tsv
          test -f zip2-source/Raft/Raft_Data/sharedassets0.assets/part-00000
          test -f zip2-source/Raft/Raft_Data/sharedassets0.assets/part-00001
          test -f zip2-source/Raft/Raft_Data/sharedassets0.assets/part-00002
          test ! -e zip2-source/Raft/Raft_Data/sharedassets0.assets.resS
          echo "RAFT_A1_ZIP2_PIN source_verified=true commit=$ZIP2_COMMIT original_git_lfs_used=false"
      - name: Reassemble exact source SHA and verify original FFT owner - no LFS
        run: |
          set -euo pipefail
          python3 -m scripts.stage_zip2_fft_owner \
            --zip2-checkout zip2-source \
            --destination "$RUNNER_TEMP/raft-a1-fft-zip2/Raft_Data/sharedassets0.assets"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.verify_targeted_lfs_compute_sources import verify_sources, EXPECTED
          root = Path(os.environ["RUNNER_TEMP"]) / "raft-a1-fft-zip2" / "Raft_Data"
          verified = verify_sources(root, expected={"sharedassets0.assets": EXPECTED["sharedassets0.assets"]})
          assert verified["authenticated_owners"] == 1
          assert verified["expected_total_payload_bytes"] == 115978112
          print("RAFT_A1_ZIP2_FFT_ORIGINAL_SHA verified=true bytes=115978112 provider=zip2_no_lfs")
          PY
      - name: Install CPU Vulkan, shader translators and Unity serialization reader
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends g++ libvulkan-dev mesa-vulkan-drivers glslang-tools spirv-tools spirv-cross vkd3d-compiler
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
      - name: Compile and execute original FFT SPIR-V pairs on software CPU Vulkan
        run: |
          set -euo pipefail
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name '*lvp*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          g++ -std=c++17 -O2 -w scripts/a1_fft_vulkan_cpu.cpp -lvulkan -o /tmp/a1-fft-vk
          python3 -m unittest discover -s tests -p 'test_probe_original_fft_software_vulkan.py' -v
          python3 -m unittest discover -s tests -p 'test_stage_zip2_fft_owner.py' -v
          timeout 720s python3 -m scripts.probe_original_fft_software_vulkan \
            --source "$RUNNER_TEMP/raft-a1-fft-zip2/Raft_Data" --runner /tmp/a1-fft-vk
          # Source shaders are ephemeral; no upload, Unity Editor or Android run.
