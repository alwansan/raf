name: B13 WATER-001 original water shader metadata GUID identity guard
on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/verify_water_render_contract.py
      - scripts/b49_shaderlab_pass_contract.py
      - scripts/b47_compute_kernel_contract.py
      - tests/test_verify_water_render_contract.py
      - .github/workflows/raft-b13-water-meta-guid.yml
permissions:
  contents: read
concurrency:
  group: raft-b13-water-meta-${{ github.ref }}
  cancel-in-progress: false
jobs:
  metadata-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests/test_verify_water_render_contract.py
      - name: Test water GUID negative controls and existing ShaderLab/FFT structural policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_verify_water_render_contract.py -v
          echo 'B13_WATER_GUID source_only=true game_assets_uploaded=false authentic_shader_restored=false unity_device_tested=false'
