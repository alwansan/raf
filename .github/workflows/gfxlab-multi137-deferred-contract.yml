name: GFX137 source-free Deferred MRT contract regression
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths:
      - 'gfxlab/tools/gfx137_deferred_semantic_audit.py'
      - 'gfxlab/tests/test_gfx137_deferred_semantic_audit.py'
      - 'gfxlab/tools/gfx124_batch_zip_audit.py'
      - '.github/workflows/gfxlab-multi137-deferred-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfx137-deferred-contract
  cancel-in-progress: false
jobs:
  synthetic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-free PNG decoder dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Validate source-free Deferred MRT controls, hashes and batch integration
        run: python -m unittest -v gfxlab.tests.test_gfx137_deferred_semantic_audit
