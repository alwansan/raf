name: T3 RENDER-002 original DXT5 Gamma NormalmapDXT5nm source usage
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-t3-normalmap-dxt5-source-only.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raft-t3-original-normalmap-dxt5-source-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-typed-stream-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - name: Source-free original m_StreamData guard controls
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_t3_original_texture_stream_dependencies.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_original_normalmap_dxt5_usage.py' -v
          python3 -m unittest discover -s tests -p 'test_t3_external_texture_lineage.py' -v
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: zip2-original
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            RAFT_FILE_MANIFEST.tsv
            Raft/Raft_Data/sharedassets6.assets
            Raft/Raft_Data/sharedassets0.assets
      - name: Include exact plain sharedassets1 original without cone file-path error
        run: |
          set -euo pipefail
          git -C zip2-original sparse-checkout set --no-cone -- \
            '/RAFT_FILE_MANIFEST.tsv' \
            '/Raft/Raft_Data/sharedassets0.assets/*' \
            '/Raft/Raft_Data/sharedassets1.assets' \
            '/Raft/Raft_Data/sharedassets6.assets'
          test "$(git -C zip2-original rev-parse HEAD)" = 15964ea8f246b6e076ce26b60931ee2e1a9a2385
      - name: Stage only three exact original serialized Texture2D owner files (no .resS bytes)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.w1_stage_zip2_owners import stage
          from scripts.a12_probe_original_blur_passes import SHADER_OWNERS
          names=('sharedassets0.assets','sharedassets1.assets','sharedassets6.assets')
          pins={'Raft_Data/'+name:SHADER_OWNERS[name] for name in names}
          result=stage(Path('zip2-original'),Path(os.environ['RUNNER_TEMP'])/'t3-source-owners',pins)
          assert len(result['owners'])==3 and not result['lfs_used']
          print('RAFT_T3_THREE_SHA_PINNED_ORIGINAL_TEXTURE_OWNERS_VERIFIED=true')
          PY
      - name: Source-authenticated original 106 Texture2D typed m_LightmapFormat usage classification
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.23.0
          python3 -m scripts.t3_original_normalmap_dxt5_usage \
            --original "$RUNNER_TEMP/t3-source-owners" \
            --manifest zip2-original/RAFT_FILE_MANIFEST.tsv \
            --out "$RUNNER_TEMP/t3-normalmap-source-aggregate.json"
      - name: Retain only safe stream-provider counts, no original pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-authentic-original-Texture2D-DXT5nm-usage-${{ github.run_id }}
          path: ${{ runner.temp }}/t3-normalmap-source-aggregate.json
          if-no-files-found: ignore
          retention-days: 7
