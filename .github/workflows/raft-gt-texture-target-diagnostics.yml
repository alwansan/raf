name: GT exported texture target classification controls

on:
  push:
    branches: [feature/android-native-port]
    paths:
      - scripts/gt_diagnose_export_texture_targets.py
      - tests/test_gt_diagnose_export_texture_targets.py
      - scripts/gt_full_original_export_texenvs.py
      - tests/test_gt_full_original_export_texenvs.py
      - scripts/gt_compare_shader_restore_quality.py
      - tests/test_gt_compare_shader_restore_quality.py
      - scripts/gt_test_vendor_shader_restoration.py
      - tests/test_gt_test_vendor_shader_restoration.py
      - scripts/gt_diagnose_texture_export_lineage.py
      - tests/test_gt_diagnose_texture_export_lineage.py
      - scripts/gt_verify_original_array_export.py
      - tests/test_gt_verify_original_array_export.py
      - scripts/gt_recover_original_array_layers.py
      - tests/test_gt_recover_original_array_layers.py
      - scripts/gt_bc3_array_layout.py
      - tests/test_gt_bc3_array_layout.py
      - scripts/gt_validate_texture2darray_flipbook.py
      - tests/test_gt_validate_texture2darray_flipbook.py
      - scripts/gt_compare_original_bc3_to_flipbook_pixels.py
      - tests/test_gt_compare_original_bc3_to_flipbook_pixels.py
      - scripts/gt_repair_array_flipbook_importers.py
      - tests/test_gt_repair_array_flipbook_importers.py
      - .github/workflows/raft-gt-texture-target-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gt-exported-texture-target-synthetic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-fidelity:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - name: Verify safe aggregate target root causes and full original trace phase classification
        run: |
          python3 -m py_compile scripts/gt_diagnose_export_texture_targets.py scripts/gt_full_original_export_texenvs.py
          python3 -m unittest discover -s tests -p test_gt_diagnose_export_texture_targets.py -v
          python3 -m unittest discover -s tests -p test_gt_full_original_export_texenvs.py -v
          python3 -m unittest discover -s tests -p test_verify_exported_material_texture_links.py -v
          python3 -m unittest discover -s tests -p test_gt_compare_shader_restore_quality.py -v
          python3 -m unittest discover -s tests -p test_gt_test_vendor_shader_restoration.py -v
          python3 -m unittest discover -s tests -p test_gt_diagnose_texture_export_lineage.py -v
          python3 -m unittest discover -s tests -p test_gt_verify_original_array_export.py -v
          python3 -m unittest discover -s tests -p test_gt_recover_original_array_layers.py -v
          python3 -m unittest discover -s tests -p test_gt_bc3_array_layout.py -v
          python3 -m unittest discover -s tests -p test_gt_validate_texture2darray_flipbook.py -v
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 -m unittest discover -s tests -p test_gt_compare_original_bc3_to_flipbook_pixels.py -v
          python3 -m unittest discover -s tests -p test_gt_repair_array_flipbook_importers.py -v
