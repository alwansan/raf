name: Raft A11 shader-export scope integrity (CPU only)
on:
  push:
    branches:
      - feature/android-native-port
    paths:
      - scripts/probe_a11_shader_export_scope.py
      - tests/test_a11_shader_export_scope.py
      - .github/workflows/raft-a11-shader-export-scope.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raft-a11-shader-export-scope-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-scope-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Synthetic snapshot/provenance regression suite (no original shader data)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_a11_shader_export_scope.py -v 2>&1 | tee a11-shader-scope-test-report.txt
      - name: Retain aggregate-only A11 test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11-shader-export-scope-${{ github.run_id }}
          path: a11-shader-scope-test-report.txt
          if-no-files-found: ignore
          retention-days: 7
