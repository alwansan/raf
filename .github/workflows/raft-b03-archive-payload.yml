name: B03 archive transport original-SHA gate (synthetic only)
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - 'scripts/b03_verify_archive_payload.py'
      - 'tests/test_b03_verify_archive_payload.py'
      - '.github/workflows/raft-b03-archive-payload.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raft-b03-archive-transport-${{ github.ref }}
  cancel-in-progress: false
jobs:
  b03-synthetic-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and 15 positive/negative transport cases
        run: |
          python3 -m py_compile scripts/b03_verify_archive_payload.py
          python3 -m unittest discover -s tests -p test_b03_verify_archive_payload.py -v
      - name: Safe synthetic-only result
        if: always()
        run: |
          printf 'B03 original payload intake: synthetic tests only; private archive NOT byte-verified.\n' > "\$RUNNER_TEMP/b03-summary.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b03-archive-transport-${{ github.run_id }}
          path: ${{ runner.temp }}/b03-summary.txt
          retention-days: 7
          if-no-files-found: ignore
