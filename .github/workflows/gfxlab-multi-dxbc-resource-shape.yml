name: GFX-MULTI-014 original DXBC RDEF resource census / no APK
on:
  push:
    branches: [experiment/android-graphics-rootcause]
    paths: ['.github/workflows/gfxlab-multi-dxbc-resource-shape.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfxlab-multi014-authentic-source-rdef
  cancel-in-progress: false
jobs:
  source-resource-shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            gfxlab/tools
            gfxlab/tests
      - name: Pure guards and RDEF negative controls
        run: |
          set -euo pipefail
          python3 -m py_compile gfxlab/tools/multi_shader_dxbc_rdef_shape.py
          python3 -m unittest discover -s gfxlab/tests -p 'test_*.py' -v
      - uses: actions/checkout@v4
        with:
          repository: alwansan/raf
          ref: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
          path: source-zip2
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /RAFT_FILE_MANIFEST.tsv
            /Raft/Raft_Data/resources.assets/*
            /Raft/Raft_Data/sharedassets0.assets/*
            /Raft/Raft_Data/sharedassets6.assets
      - name: Install CPU DXBC and SPIRV structural analysis tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross
      - name: Compare original RDEF resource counts to SPIRV reflection privately
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
          python3 -m gfxlab.tools.multi_shader_dxbc_rdef_shape --zip2 source-zip2 --stage "$RUNNER_TEMP/gfxlab-multi014-private" --out gfxlab-multi014-safe-summary.json
          python3 - <<'PY'
          import json
          d=json.load(open("gfxlab-multi014-safe-summary.json"))
          assert d["original_dxbc_vulkan11_pair_validated"]
          assert not d["actual_original_cb_register_offsets_mapped_to_spirv"]
          assert not d["original_unity_android_shader_restored"]
          assert not d["private_gpu_program_bytes_exported"] and not d["phase_closed"]
          print("GFX_MULTI014_RDEF_SOURCE_COUNTS_ONLY_NO_BINDING_PARITY_CLAIM")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gfxlab-multi014-safe-source-rdef-census
          path: gfxlab-multi014-safe-summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Purge private original source and compiled program stages
        if: always()
        run: |
          sudo rm -rf source-zip2 "$RUNNER_TEMP/gfxlab-multi014-private"
          echo GFX_MULTI014_PRIVATE_ORIGINAL_PROGRAMS_PURGED=true
