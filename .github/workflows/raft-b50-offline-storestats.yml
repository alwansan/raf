name: B50 LOCAL-005 offline SaveGame Steam stats boundary
on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-native-port
    paths:
      - scripts/instrument_android_runtime_operations.py
      - tests/test_runtime_operation_traces.py
      - tests/test_android_offline_startup.py
      - tests/test_adapt_original_save_paths.py
      - .github/workflows/raft-b50-offline-storestats.yml

permissions:
  contents: read

concurrency:
  group: raft-b50-offline-storestats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-regression:
    name: B50 / offline StoreStats synthetic contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - name: Run targeted offline/save regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b50"
          {
            echo "B50 session: 20261104T2039Z-B50-d7a3"
            echo "Source SHA: $GITHUB_SHA"
            python3 --version
            python3 -m unittest discover -s tests -p test_runtime_operation_traces.py -v
            python3 -m unittest discover -s tests -p test_android_offline_startup.py -v
            python3 -m unittest discover -s tests -p test_adapt_original_save_paths.py -v
          } 2>&1 | tee "$RUNNER_TEMP/b50/b50-local005-testlog.txt"
      - name: Keep safe bounded test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b50-local005-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/b50/b50-local005-testlog.txt
          if-no-files-found: ignore
          retention-days: 7
