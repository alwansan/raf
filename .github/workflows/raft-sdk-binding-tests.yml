name: Raft SDK MonoScript binding metadata and reference safety
on:
  push:
    branches: [feature/android-native-port]
    paths:
      - 'android-port/Editor/SdkScriptBindingCore.cs'
      - 'android-port/Editor/SdkScriptBindingResolver.cs'
      - 'android-port/Tests/SdkBindings/**'
      - 'scripts/isolate_sdk_source_assemblies.py'
      - 'tests/test_isolate_sdk_source_assemblies.py'
      - 'scripts/resolve_managed_closure.py'
      - 'tests/test_resolve_managed_closure.py'
      - 'scripts/build_sdk_script_manifest.py'
      - 'tests/test_build_sdk_script_manifest.py'
      - '.github/workflows/raft-sdk-binding-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raft-sdk-binding-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 1
      - name: Validate metadata-only SDK identity extraction
        run: python3 -m unittest discover -s tests -p test_build_sdk_script_manifest.py -v
      - name: Test generated SDK source isolation without altering gameplay
        run: python3 -m unittest discover -s tests -p test_isolate_sdk_source_assemblies.py -v
      - name: Test reference closure safety without executing DLLs
        run: python3 -m unittest discover -s tests -p test_resolve_managed_closure.py -v
      - name: Inspect actual original SDK transitive references (no LFS)
        run: |
          python3 -m pip install --user --disable-pip-version-check dnfile==0.18.0
          python3 -m scripts.resolve_managed_closure --managed Raft/Raft_Data/Managed --out "$RUNNER_TEMP/sdk-closure.json"
      - name: Audit physical ownership of legacy serialization configuration types
        run: |
          python3 - <<'PY'
          import dnfile
          from pathlib import Path
          found=[]
          for path in sorted(Path("Raft/Raft_Data/Managed").glob("*.dll")):
              if path.name.startswith(("System.","UnityEngine.")) or path.name in {"mscorlib.dll","netstandard.dll","PlayFab_o.dll"}: continue
              pe=dnfile.dnPE(str(path))
              try:
                  if pe.net is None: continue
                  asm=str(pe.net.mdtables.Assembly.rows[0].Name)
                  for row in pe.net.mdtables.TypeDef.rows:
                      name=str(row.TypeName); namespace=str(row.TypeNamespace)
                      if ("GlobalSerializationConfig" in name or
                          ("Sirenix" in namespace and "Config" in name)):
                          found.append({"file":path.name,"assembly":asm,"namespace":namespace,"type":name})
              finally:
                  pe.close()
          print("Legacy serialization configuration physical providers:",found)
          PY
      - name: Inspect original legacy Sirenix script registry and retained object metadata (no LFS)
        run: |
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4
          python3 - <<'PY'
          import UnityPy,json
          from pathlib import Path
          root=Path("Raft/Raft_Data")
          scripts=[]
          for path in sorted(root.iterdir()):
              if not path.is_file() or not (path.name=="globalgamemanagers" or path.name.startswith("level") or path.name.endswith(".assets")): continue
              with path.open("rb") as f:
                  if f.read(48).startswith(b"version https://git-lfs.github.com/spec/v1"): continue
              try: env=UnityPy.load(str(path))
              except Exception as e:
                  print("Skipped unsupported file:",path.name,type(e).__name__);continue
              for obj in env.objects:
                  if obj.type.name!="MonoScript": continue
                  data=obj.read()
                  asm=str(data.m_AssemblyName)
                  if "Sirenix" in asm:
                      scripts.append({"file":path.name,"path_id":obj.path_id,"assembly":asm,"namespace":str(data.m_Namespace),"class":str(data.m_ClassName)})
          print("Original retained Sirenix script registry:",json.dumps(scripts))
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate signed DLL script IDs and preservation of unrelated references
        run: dotnet run --project android-port/Tests/SdkBindings/RaftAndroid.SdkBindings.Tests.csproj --configuration Release --nologo
