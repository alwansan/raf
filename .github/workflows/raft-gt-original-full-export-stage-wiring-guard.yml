name: GT original Shader48 full-export stage wiring and provenance gate (NO APK)

on:
  push:
    branches: [feature/android-native-port]
    paths:
      - .github/workflows/raft-gt-original-full-export-stage-wiring-guard.yml
      - .github/workflows/raft-gt-next15-original-full-export.yml
      - .github/workflows/raft-gt-next11-original-full-export.yml
      - .github/workflows/raft-gt-next10p33-original-full-export.yml
      - .github/workflows/raft-gt-next10p31-original-full-export.yml
      - .github/workflows/raft-gt-next7p11-original-full-export.yml
      - .github/workflows/raft-gt-next7p33-original-full-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-real-source-wiring:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
      - name: Fail closed if final original-source translator does not match its Shader48 GUID installer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_GT_WIRING'
          from pathlib import Path
          configs = [
              ("15","17","158","143","628","643","43","42","33","58","[8,13,8,4]","12"),
              ("11","18","143","132","643","654","42","41","33","58","[8,13,8,4]","0"),
              ("10p33","19","132","122","654","664","41","40","33","58","[8,13,8,4]","6"),
              ("10p31","20","122","112","664","674","40","39","31","55","[8,13,8,2]","0"),
              ("7p11","21","112","105","674","681","39","38","11","22","[4,5,2]","4"),
              ("7p33","22","105","98","681","688","38","37","33","58","[8,13,8,4]","0"),
          ]
          quality_names={"17":"seventeen","18":"eighteen","19":"nineteen","20":"twenty","21":"twentyone","22":"twentytwo","23":"twentythree"}
          for shader, prior_stage, before, after, before_non_dummy, after_non_dummy, prior_targets, after_targets, routes, source_stages, route_table, range_properties in configs:
              workflow=Path(".github/workflows/raft-gt-next"+shader+"-original-full-export.yml")
              all_text=workflow.read_text(encoding="utf-8")
              anchor="      - name: Check genuine post"+prior_stage+" original-guid material coverage and NEXT"+shader.upper()+" source-free safety"
              tail_anchor="      - name: Publish aggregate evidence only, never original scenes/meshes/export/trace"
              assert all_text.count(anchor)==1, "original_final_stage_anchor_"+shader
              start=all_text.index(anchor)
              stop=all_text.find(tail_anchor,start)
              assert stop>start, "missing_aggregate_only_stage_"+shader
              section=all_text[start:stop]
              checks=[
                  "python3 -m scripts.gt_translate_next_remaining_"+shader+"_shader48",
                  "scripts/gt_translate_next_remaining_"+shader+"_shader48.py",
                  "test_gt_translate_next_remaining_"+shader+"_shader48.py",
                  "python3 -m scripts.gt_install_next"+shader+"_original_shader48",
                  'assert c["material_docs_using_dummy_Shader"]=='+before,
                  'assert c["material_docs_using_non_dummy_Shader"]=='+before_non_dummy,
                  'assert c["distinct_dummy_Shader_targets_referenced"]=='+prior_targets,
                  'assert q["original_program_stages_roundtrip_Vulkan11_valid"]=='+source_stages,
                  'assert q["source_original_keyword_permutation_route_counts_per_pass"]=='+route_table,
                  'assert q["source_original_Range_property_count"]=='+range_properties,
                  'unity["registeredRoutes"]=='+routes,
                  'assert c["material_docs_using_dummy_Shader"]=='+after,
                  'assert c["material_docs_using_non_dummy_Shader"]=='+after_non_dummy,
                  'assert c["distinct_dummy_Shader_targets_referenced"]=='+after_targets,
                  'assert sha==before,',
                  'gt-fourteen-shader-postrestore-quality.json',
                  'prior=json.loads((root/"gt-'+quality_names[prior_stage]+'-shader-postrestore-quality.json").read_text())',
                  'q=json.loads((root/"gt-'+quality_names[str(int(prior_stage)+1)]+'-shader-postrestore-quality.json").read_text())',
              ]
              if shader=="10p31":
                  checks.extend(['--next30', 'assert list(weights.values()).count(10)==1'])
              if shader=="10p33":
                  checks.append('assert list(weights.values()).count(10)==2')
              if shader=="7p11":
                  checks.extend(['--next7p11', 'assert list(weights.values()).count(7)==2'])
              if shader=="7p33":
                  checks.append('assert list(weights.values()).count(7)==1')
              for token in checks:
                  assert token in section, shader+" missing required provenance: "+token
              expected="scripts.gt_translate_next_remaining_"+shader+"_shader48"
              for line in section.splitlines():
                  if "python3 -m scripts.gt_translate_next_remaining_" in line:
                      assert expected in line,shader+" source translator points to wrong Shader48"
              assert all_text.count("  workflow_dispatch:")==1
              assert "cancel-in-progress: false" in all_text
              print("GT_AUTHENTIC_FULL_EXPORT_STAGE_WIRING_OK "+shader+" prior="+before+"/"+prior_targets+" post="+after+"/"+after_targets)
          # The LAST stage alone can be correct while its preceding NEXT15
          # source translator is wrong. This checks every earlier SOURCE stage
          # in all six independent full-export workflows, not just the suffix.
          import re
          lineage = (
              ("15", 58, 33, 12),
              ("11", 58, 33, 0),
              ("10p33", 58, 33, 6),
              ("10p31", 55, 31, 0),
              ("7p11", 22, 11, 4),
              ("7p33", 58, 33, 0),
          )
          for terminal_index, (terminal, _, _, _) in enumerate(lineage):
              path=Path(".github/workflows/raft-gt-next"+terminal+"-original-full-export.yml")
              workflow=path.read_text(encoding="utf-8")
              for stage_index in range(terminal_index+1):
                  name, original_d3d11, routes, source_ranges = lineage[stage_index]
                  post_stage=17+stage_index
                  start_anchor=("      - name: Check genuine post"+str(post_stage)
                      +" original-guid material coverage and NEXT"+name.upper()
                      +" source-free safety")
                  if stage_index == terminal_index:
                      end_anchor="      - name: Publish aggregate evidence only"
                  else:
                      next_name=lineage[stage_index+1][0]
                      end_anchor=("      - name: Check genuine post"+str(post_stage+1)
                          +" original-guid material coverage and NEXT"+next_name.upper()
                          +" source-free safety")
                  assert workflow.count(start_anchor)==1, terminal+" missing stage "+name
                  first=workflow.index(start_anchor)
                  last=workflow.find(end_anchor,first)
                  assert last>first, terminal+" stage boundary "+name
                  section=workflow[first:last]
                  required=(
                      "      - name: Recover NEXT"+name.upper()+" "+str(original_d3d11)+" original D3D11 programs",
                      "python3 -m scripts.gt_translate_next_remaining_"+name+"_shader48",
                      "test_gt_translate_next_remaining_"+name+"_shader48.py",
                      "GT_SHA_ORIGINAL_REMAINING_"+name.upper()+"_MATERIAL_SHADER48_D3D11_PRIVATE_STAGES_TRANSLATED",
                      'q["original_program_stages_roundtrip_Vulkan11_valid"]=='+str(original_d3d11),
                      'q["source_original_Range_property_count"]=='+str(source_ranges),
                      'unity["registeredRoutes"]=='+str(routes),
                      'gt-fourteen-shader-postrestore-quality.json',
                  )
                  for token in required:
                      assert token in section, terminal+" inherited stage "+name+" missing: "+token
                  dispatches=re.findall(r'python3 -m (scripts\.gt_translate_next_remaining_[a-z0-9]+_shader48)',section)
                  assert dispatches==["scripts.gt_translate_next_remaining_"+name+"_shader48"],(
                      terminal+" inherited wrong SOURCE translator in "+name+": "+repr(dispatches))
                  print("GT_ORIGINAL_FULL_EXPORT_STAGE_LINEAGE_OK terminal="+terminal
                      +" source="+name+" original_d3d11="+str(original_d3d11))
          PY_GT_WIRING
