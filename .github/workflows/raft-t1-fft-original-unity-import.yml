name: T1 WATER-001 private genuine FFT Unity 2021 Editor import boundary

on:
  workflow_dispatch:
  push:
    branches: [feature/android-native-port]
    paths:
      - android-port/Experiments/T1/T1PrivateOriginalDerivedImport.cs
      - .github/workflows/raft-t1-fft-original-unity-import.yml

permissions:
  contents: read

# The native Editor mutex is reused, but no game's native build request is made.
# No other running job is cancelled, and unrelated T projects are not modified.
concurrency:
  group: t1-fft-real-editor-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unity-private-compute-import:
    runs-on: ubuntu-24.04
    environment: UNITY_LICENSE
    concurrency:
      group: raft-native-engine-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 65
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      DEBIAN_FRONTEND: noninteractive
      ZIP2_SHA: 15964ea8f246b6e076ce26b60931ee2e1a9a2385
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Require explicit Unity activation without revealing its contents
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [ -z "${UNITY_LICENSE:-}" ] && { [ -z "${UNITY_SERIAL:-}" ] || [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; }; then
            echo 'RAFT_T1_UNITY_LICENSE available=false no_game_data_acquired=true'
            exit 1
          fi
          echo 'RAFT_T1_UNITY_LICENSE credentials_supplied=true private_values_not_logged=true'
      - name: Free-space budget before private original data or Docker image
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 20971520
      - name: Checkout only public probe code and scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
            android-port/Experiments/T1
      - name: Run source-free guards and install original translation tools
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_t1_stage_original_fft_compute_candidates.py -v
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends vkd3d-compiler spirv-tools spirv-cross glslang-tools
          python3 -m pip install --user --disable-pip-version-check UnityPy==1.25.4 -q
      - name: Recover and independently verify the pinned original FFT owner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t1unityzip"
          git -C "$RUNNER_TEMP/t1unityzip" init -q
          git -C "$RUNNER_TEMP/t1unityzip" remote add origin https://github.com/alwansan/raf.git
          git -C "$RUNNER_TEMP/t1unityzip" -c protocol.version=2 fetch -q --depth=1 --filter=blob:none origin zip2
          test "$(git -C "$RUNNER_TEMP/t1unityzip" rev-parse FETCH_HEAD)" = "$ZIP2_SHA"
          git -C "$RUNNER_TEMP/t1unityzip" sparse-checkout init --no-cone
          printf '%s\n' '/RAFT_FILE_MANIFEST.tsv' '/Raft/Raft_Data/sharedassets0.assets/' |
            git -C "$RUNNER_TEMP/t1unityzip" sparse-checkout set --no-cone --stdin
          git -C "$RUNNER_TEMP/t1unityzip" checkout -q --detach FETCH_HEAD
          python3 -m scripts.stage_zip2_fft_owner \
            --zip2-checkout "$RUNNER_TEMP/t1unityzip" \
            --destination "$RUNNER_TEMP/t1original/Raft_Data/sharedassets0.assets"
      - name: Stage real twenty compiled-program-derived compute candidates in private project
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.t1_stage_original_fft_compute_candidates \
            --original-data "$RUNNER_TEMP/t1original/Raft_Data" \
            --project "$GITHUB_WORKSPACE/t1-private-fft-unity"
          mkdir -p "$GITHUB_WORKSPACE/t1-private-fft-unity/Assets/Editor"
          cp android-port/Experiments/T1/T1PrivateOriginalDerivedImport.cs \
            "$GITHUB_WORKSPACE/t1-private-fft-unity/Assets/Editor/T1PrivateOriginalDerivedImport.cs"
      - name: Invoke isolated Unity 2021 Editor; keep all compiler logs private
        id: private_unity
        shell: bash
        run: |
          set -euo pipefail
          set +x
          # Never stream raw Unity compiler output: it may quote private shader
          # source identifiers. The only observable output is a fixed schema
          # generated by T1PrivateOriginalDerivedImport.Run.
          image='unityci/editor:ubuntu-2021.3.45f2-base-3'
          docker pull "$image" > "$RUNNER_TEMP/t1-private-docker-pull.log" 2>&1
          set +e
          timeout 2100s docker run --rm \
            --memory=11g --cpus=3 --shm-size=1g \
            --env UNITY_LICENSE --env UNITY_SERIAL --env UNITY_EMAIL --env UNITY_PASSWORD \
            -v "$GITHUB_WORKSPACE/t1-private-fft-unity:/workspace:rw" \
            "$image" /bin/bash -c '
              set +x
              set -euo pipefail
              umask 077
              mkdir -p /root/.local/share/unity3d/Unity
              if [ -n "${UNITY_LICENSE:-}" ]; then
                printf "%s" "$UNITY_LICENSE" | tr -d "\r" > /root/.local/share/unity3d/Unity/Unity_lic.ulf
                /opt/unity/Editor/Unity -quit -batchmode -nographics \
                  -manualLicenseFile /root/.local/share/unity3d/Unity/Unity_lic.ulf \
                  -logFile /workspace/t1-private-activation.log > /workspace/t1-private-activation-stdout.log 2>&1 || true
              elif [ -n "${UNITY_SERIAL:-}" ] && [ -n "${UNITY_EMAIL:-}" ] && [ -n "${UNITY_PASSWORD:-}" ]; then
                /opt/unity/Editor/Unity -quit -batchmode -nographics \
                  -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -serial "$UNITY_SERIAL" \
                  -logFile /workspace/t1-private-activation.log > /workspace/t1-private-activation-stdout.log 2>&1 || true
              fi
              /opt/unity/Editor/Unity -batchmode -nographics -quit \
                -projectPath /workspace -executeMethod T1PrivateOriginalDerivedImport.Run \
                -logFile /workspace/t1-private-unity.log > /workspace/t1-private-unity-stdout.log 2>&1
            ' > "$RUNNER_TEMP/t1-private-docker-console.log" 2>&1
          rc=$?
          set -e
          echo "unity_process_exit=$rc" >> "$GITHUB_OUTPUT"
          echo 'RAFT_T1_UNITY_EDITOR_INVOKED process_exit_recorded=true raw_logs_private=true'
      - name: Report only guarded aggregate actual Unity import observations
        shell: bash
        env:
          UNITY_EXIT_CODE: ${{ steps.private_unity.outputs.unity_process_exit }}
        run: |
          set -euo pipefail
          # The private Docker container writes root-owned mode 0600 logs.
          # Reassign only to this ephemeral runner account; NEVER print logs.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/t1-private-fft-unity"
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          project=Path("t1-private-fft-unity")
          marker=project/"t1-private-import-result.json"
          if not marker.is_file():
              log=(project/"t1-private-unity.log").read_text(errors="replace") if (project/"t1-private-unity.log").is_file() else ""
              print("RAFT_T1_UNITY_IMPORT_INCONCLUSIVE "+json.dumps({
                  "unity_result_file_present":False,
                  "private_unity_log_present":bool(log),
                  "unity_process_exit_code":int(__import__("os").environ.get("UNITY_EXIT_CODE","-1")),
                  "licensing_message_category":bool(re.search(r"licen[cs]|activat",log,re.I)),
                  "licensing_failure_category":bool(re.search(
                      r"(?:licen[cs]|entitlement|serial)[^\\n]{0,100}(?:invalid|fail|expired|denied|not activat|missing)|(?:invalid|fail|expired|denied|no valid)[^\\n]{0,100}(?:licen[cs]|entitlement|serial)",log,re.I)),
                  "execute_method_lookup_failure":bool(re.search(
                      r"(?:executemethod|execute method)[^\\n]{0,120}(?:not found|not execute|could not|failed)|(?:could not find|cannot find)[^\\n]{0,80}(?:method|class)",log,re.I)),
                  "script_compilation_error_category":bool(re.search(r"error CS[0-9]+",log)),
                  "shader_compilation_error_category":bool(re.search(r"compute shader.*error|shader error",log,re.I)),
                  "original_runtime_kernel_mapping_proven":False,
                  "android_device_proven":False},sort_keys=True))
              raise SystemExit("Unity original-derived FFT import did not produce authenticated aggregate result")
          record=json.loads(marker.read_text(encoding="utf-8-sig"))
          expected={"editor_invoked","editor_supports_compute","candidate_assets_imported",
                    "candidate_main_kernels_resolved","expected_threadgroups_matched",
                    "observed_errors","original_authored_compute_restored",
                    "original_runtime_kernel_mapping_proven","android_gpu_or_pixels_verified"}
          if set(record)!=expected or any(record[k] is not False for k in (
                  "original_authored_compute_restored","original_runtime_kernel_mapping_proven",
                  "android_gpu_or_pixels_verified")) or any(type(record[k]) is not int or not 0<=record[k]<=10000
                  for k in ("candidate_assets_imported","candidate_main_kernels_resolved",
                            "expected_threadgroups_matched","observed_errors")):
              raise SystemExit("Unexpected private Unity result schema: no content disclosed")
          print("RAFT_T1_UNITY_ORIGINAL_DERIVED_IMPORT "+json.dumps(record,sort_keys=True))
          if record["observed_errors"] or record["candidate_assets_imported"]!=20:
              raise SystemExit("Unity 2021 original-derived FFT compute asset import not proven")
          if not record["editor_supports_compute"]:
              print("RAFT_T1_UNITY limitation=headless_editor_no_compute_runtime")
          PY
      - name: Remove proprietary source, Unity logs, license material and original assets
        if: always()
        shell: bash
        run: |
          sudo rm -rf "$GITHUB_WORKSPACE/t1-private-fft-unity" "$RUNNER_TEMP/t1original" "$RUNNER_TEMP/t1unityzip"
          rm -f "$RUNNER_TEMP/t1-private-docker-pull.log" "$RUNNER_TEMP/t1-private-docker-console.log"
