name: Raft original managed FFT caller source contracts - no Unity or LFS

on:
  push:
    branches: [feature/android-native-port]
    paths:
      - '.github/workflows/raft-original-fft-managed-links.yml'
      - 'scripts/probe_fft_managed_asset_links.py'
      - 'tests/test_probe_fft_managed_asset_links.py'
      - 'scripts/probe_fft_monoscript_field.py'
      - 'tests/test_probe_fft_monoscript_field.py'
      - 'scripts/probe_original_fft_kernel_callsites.py'
      - 'tests/test_probe_original_fft_kernel_callsites.py'
      - 'scripts/probe_original_fft_caller_graph.py'
      - 'tests/test_probe_original_fft_caller_graph.py'
      - 'scripts/probe_original_fft_index_derivation.py'
      - 'tests/test_probe_original_fft_index_derivation.py'
      - 'scripts/probe_original_fft_target_formats.py'
      - 'tests/test_probe_original_fft_target_formats.py'
      - 'scripts/probe_original_fft_inherited_seed.py'
      - 'scripts/verify_original_butterfly_numeric.py'
      - 'tests/test_verify_original_butterfly_numeric.py'
      - 'tests/test_probe_original_fft_inherited_seed.py'
      - 'scripts/probe_original_fft_size_argument.py'
      - 'tests/test_probe_original_fft_size_argument.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raft-original-fft-managed-links-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-fft-managed-link-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
            Raft/Raft_Data/Managed
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run managed FFT analysis on synthetic source contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_probe_fft_managed_asset_links.py -v
          python3 -m unittest discover -s tests -p test_probe_fft_monoscript_field.py -v
          python3 -m unittest discover -s tests -p test_probe_original_fft_kernel_callsites.py -v
          python3 -m unittest discover -s tests -p test_probe_original_fft_caller_graph.py -v
          python3 -m unittest discover -s tests -p test_probe_original_fft_index_derivation.py -v
          python3 -m unittest discover -s tests -p test_probe_original_fft_target_formats.py -v
          python3 -m unittest discover -s tests -p test_probe_original_fft_inherited_seed.py -v
          python3 -m unittest discover -s tests -p test_verify_original_butterfly_numeric.py -v
          python3 -m unittest discover -s tests -p test_probe_original_fft_size_argument.py -v
      - name: Recover private exact CSharp9 original callers
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install ilspycmd --version 11.2.0.10050 --tool-path "$RUNNER_TEMP/ilspy"
          mkdir -p "$RUNNER_TEMP/private-fft-original"
          timeout 300s "$RUNNER_TEMP/ilspy/ilspycmd" -p -lv CSharp9_0 -o "$RUNNER_TEMP/private-fft-original" \
            Raft/Raft_Data/Managed/Assembly-CSharp.dll \
            > "$RUNNER_TEMP/ilspy-private.log" 2>&1
      - name: Compare original source caller use to authenticated serialized FFT name hash
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.probe_fft_managed_asset_links --source "$RUNNER_TEMP/private-fft-original"
          python3 -m scripts.probe_fft_monoscript_field --source "$RUNNER_TEMP/private-fft-original"
          python3 -m scripts.probe_original_fft_kernel_callsites --source "$RUNNER_TEMP/private-fft-original"
          python3 -m scripts.probe_original_fft_caller_graph --source "$RUNNER_TEMP/private-fft-original"
          python3 -m scripts.probe_original_fft_index_derivation --source "$RUNNER_TEMP/private-fft-original"
          python3 -m scripts.probe_original_fft_target_formats --source "$RUNNER_TEMP/private-fft-original"\n          python3 -m scripts.probe_original_fft_inherited_seed --source "$RUNNER_TEMP/private-fft-original"
          python3 -m scripts.probe_original_fft_size_argument --source "$RUNNER_TEMP/private-fft-original"
          # Do not publish original decompiled code or ILSpy logs.
          # CI is CPU-only source-level evidence; no Unity/game build.
      - name: Execute original butterfly tables and CPU FFT against independent DFT
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.verify_original_butterfly_numeric --source "$RUNNER_TEMP/private-fft-original" --output "$RUNNER_TEMP/butterfly-numeric-private"
          set +e
          timeout 180s dotnet run --project "$RUNNER_TEMP/butterfly-numeric-private/Numeric.csproj" --configuration Release --nologo > "$RUNNER_TEMP/butterfly-numeric-private.log" 2>&1
          code=$?
          set -e
          export NUMERIC_EXIT="$code"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=(Path(os.environ['RUNNER_TEMP'])/'butterfly-numeric-private.log').read_text(errors='replace')
          lines=[line for line in text.splitlines() if line.startswith('RAFT_ORIGINAL_BUTTERFLY_NUMERIC ')]
          for line in lines:print(line)
          print('RAFT_BUTTERFLY_NUMERIC_EXECUTION exit='+os.environ['NUMERIC_EXIT']+' errorCodes='+str(sorted(set(re.findall(r'error ([A-Z]+[0-9]+):',text)))))
          if int(os.environ['NUMERIC_EXIT']) or len(lines)!=1:raise SystemExit('Private original numeric experiment failed; source/log not published')
          PY
