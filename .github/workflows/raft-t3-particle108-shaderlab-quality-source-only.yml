name: T3 RENDER-002 source-only Particle108 multi-SubShader pass contract
on:
  push:
    branches:
      - feature/android-native-port
    paths:
      - scripts/t3_particle108_shaderlab_export_quality.py
      - tests/test_t3_particle108_shaderlab_export_quality.py
      - .github/workflows/raft-t3-particle108-shaderlab-quality-source-only.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t3-particle108-subshader-pass-source-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  shaderlab-source-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts
            tests
      - name: Test exact source to exported ShaderLab one-Pass-per-SubShader contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/t3_particle108_shaderlab_export_quality.py tests/test_t3_particle108_shaderlab_export_quality.py
          python3 -m unittest discover -s tests -p 'test_t3_particle108_shaderlab_export_quality.py' -v
