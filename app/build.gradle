plugins { id 'com.android.application' }
android {
    namespace 'com.alwansan.lograf'
    compileSdk 35
    defaultConfig {
        applicationId 'com.alwansan.lograf'
        minSdk 29
        targetSdk 35
        // The workflow run number increases automatically for each new APK.
        versionCode 1000 + (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
        versionName '0.5.' + (System.getenv('GITHUB_RUN_NUMBER') ?: 'local')
    }
    buildFeatures { aidl true; buildConfig true }
    signingConfigs {
        stable {
            // Public TEST key, generated once and committed by GitHub Actions.
            // Never rotate this file or existing installs cannot be upgraded.
            storeFile file('../signing/lograf-public-test.p12')
            storeType 'pkcs12'
            storePassword 'LogRaftOpenSource2026'
            keyAlias 'lograf-public'
            keyPassword 'LogRaftOpenSource2026'
        }
    }
    buildTypes {
        debug { }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
