plugins { id 'com.android.application' }
android {
    namespace 'com.alwansan.lograf'
    compileSdk 35
    defaultConfig {
        applicationId 'com.alwansan.lograf'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }
    buildFeatures { aidl true }
    signingConfigs {
        if (System.getenv('LOGRAF_SIGNING_STORE')) {
            stable {
                storeFile file(System.getenv('LOGRAF_SIGNING_STORE'))
                storeType 'pkcs12'
                storePassword System.getenv('LOGRAF_SIGNING_PASSWORD')
                keyAlias 'lograf-update'
                keyPassword System.getenv('LOGRAF_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { }
        release {
            minifyEnabled false
            if (System.getenv('LOGRAF_SIGNING_STORE')) {
                signingConfig signingConfigs.stable
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
