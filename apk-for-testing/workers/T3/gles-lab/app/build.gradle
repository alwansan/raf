plugins { id 'com.android.application' }
def sourceSha = (project.findProperty('sourceSha') ?: 'unverified').toString()
android {
    namespace 'com.alwansan.raft.t3lab'
    compileSdk 35
    defaultConfig {
        applicationId 'com.alwansan.raft.lab.t3.gles'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-t3-gles'
        buildConfigField 'String', 'SOURCE_SHA', '"' + sourceSha + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
